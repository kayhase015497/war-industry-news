<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 美國期中選舉｜即時開票結果</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script>
/* 主題／字體：網址參數優先（?theme=dark、?font=b|c），其次記憶的偏好，預設亮色 */
(function(){
  var d=document.documentElement,q=new URLSearchParams(location.search),t=q.get('theme'),f=q.get('font');
  if(t!=='light'&&t!=='dark'){try{t=localStorage.getItem('ue-theme')}catch(e){t=null}}
  d.setAttribute('data-theme',t==='dark'?'dark':'light');
  var extra={b:'LXGW+WenKai+TC:wght@400;700',c:'Chiron+GoRound+TC:wght@400;500;700;900'};
  if(f&&extra[f]){
    d.setAttribute('data-font',f);
    var l=document.createElement('link');l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family='+extra[f]+'&display=swap';
    document.head.appendChild(l);
  }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
/* ── Reset & Root ── */
*,.ue-wrap *,.ue-wrap *::before,.ue-wrap *::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* 亮色（預設） */
  --c-bg:#f5f2ec;--c-card:#ffffff;--c-border:#ddd6c8;
  --c-rep:#dc2626;--c-rep-dim:#fca5a5;--c-rep-glow:rgba(220,38,38,.10);
  --c-dem:#2563eb;--c-dem-dim:#93c5fd;--c-dem-glow:rgba(37,99,235,.10);
  --c-ind:#7c3aed;--c-unc:#d4d0c6;
  --c-text:#1f2430;--c-muted:#5f6675;--c-accent:#a16207;--c-accent-line:#e0a800;
  --c-accent-bg:rgba(224,168,0,.14);--c-accent-bd:rgba(161,98,7,.35);
  --c-head-bg:linear-gradient(135deg,#ffffff 0%,#f3eee3 100%);--c-head-text:#1f2430;
  --c-pop:#ffffff;--c-hover:rgba(31,36,48,.04);--c-badge:rgba(31,36,48,.07);
  --c-stroke:#ffffff;--c-lean-r:#f2a3a3;--c-lean-d:#9dbcf4;--c-live:#16a34a;
  --c-scroll-track:#ece7dc;--c-scroll-thumb:#b8b0a0;
  --c-shadow:0 8px 24px rgba(31,36,48,.18);--c-shadow-lg:0 20px 60px rgba(31,36,48,.28);
  /* 字體：標題／內文／標籤與數字 */
  --ff-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --ff-display:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --ff-label:'Barlow Condensed','Noto Sans TC','PingFang TC',sans-serif;
  --r:6px;
  /* 字型比例：所有尺寸以此為基準 */
  --fs-xs:13px;   /* 輔助標籤、角標 */
  --fs-sm:14px;   /* 次要標籤、badge */
  --fs-base:18px; /* 正文、候選人名 */
  --fs-md:16px;   /* 次要正文 */
  --fs-mono:14px; /* 標籤、數字（Barlow Condensed） */
}
:root[data-theme="dark"]{
  --c-bg:#0b0f1a;--c-card:#131929;--c-border:#1e2a3d;
  --c-rep:#ef4444;--c-rep-dim:#7f1d1d;--c-rep-glow:rgba(239,68,68,.18);
  --c-dem:#3b82f6;--c-dem-dim:#1e3a8a;--c-dem-glow:rgba(59,130,246,.18);
  --c-ind:#a855f7;--c-unc:#374151;
  --c-text:#e2e8f0;--c-muted:#7c8aa0;--c-accent:#f0b400;--c-accent-line:#f0b400;
  --c-accent-bg:rgba(240,180,0,.12);--c-accent-bd:rgba(240,180,0,.3);
  --c-head-bg:linear-gradient(135deg,#080d18 0%,#0f1d3a 60%,#1a0a0a 100%);--c-head-text:#ffffff;
  --c-pop:#1e293b;--c-hover:rgba(255,255,255,.03);--c-badge:rgba(255,255,255,.08);
  --c-stroke:#0b0f1a;--c-lean-r:#9f1515;--c-lean-d:#1a4a9f;--c-live:#4ade80;
  --c-scroll-track:#131b2b;--c-scroll-thumb:#4a5a78;
  --c-shadow:0 8px 24px rgba(0,0,0,.5);--c-shadow-lg:0 20px 60px rgba(0,0,0,.7);
}
html[data-font="b"]{--ff-display:'LXGW WenKai TC','Noto Sans TC',serif;}
html[data-font="c"]{
  --ff-display:'Chiron GoRound TC','Noto Sans TC',sans-serif;
  --ff-body:'Chiron GoRound TC','Noto Sans TC',sans-serif;
}

/* ── Wrapper ── */
.ue-wrap{
  font-family:var(--ff-body);font-size:var(--fs-base);
  background:var(--c-bg);color:var(--c-text);
  min-height:100vh;padding:0;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ── Header ── */
.ue-head{
  background:var(--c-head-bg);
  padding:24px 24px 20px;
  border-bottom:3px solid var(--c-accent-line);
  position:relative;overflow:hidden;
}
.ue-head::before{
  content:'';position:absolute;top:-60px;right:-60px;
  width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(239,68,68,.08) 0%,transparent 70%);
  pointer-events:none;
}
.ue-head::after{
  content:'';position:absolute;bottom:-40px;left:20%;
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(59,130,246,.06) 0%,transparent 70%);
  pointer-events:none;
}
.ue-kicker{
  font-family:var(--ff-label);font-size:var(--fs-mono);letter-spacing:3px;
  color:var(--c-accent);text-transform:uppercase;margin-bottom:10px;
  padding-right:104px;
}
.ue-title{
  font-size:clamp(22px,3.5vw,34px);font-weight:900;line-height:1.2;
  color:var(--c-head-text);margin-bottom:8px;
  font-family:var(--ff-display);
}
.ue-head-meta{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:10px;
}
.ue-live-dot{
  display:flex;align-items:center;gap:7px;
  font-family:var(--ff-label);font-size:var(--fs-mono);color:var(--c-live);
}
.ue-live-dot::before{
  content:'';width:8px;height:8px;border-radius:50%;
  background:var(--c-live);box-shadow:0 0 8px var(--c-live);
  animation:ue-pulse 2s infinite;
}
@keyframes ue-pulse{0%,100%{opacity:1}50%{opacity:.4}}
.ue-updated{
  font-family:var(--ff-label);font-size:var(--fs-mono);color:var(--c-muted);
}
.ue-reporting-tag{
  font-family:var(--ff-label);font-size:var(--fs-mono);
  background:var(--c-accent-bg);border:1px solid var(--c-accent-bd);
  color:var(--c-accent);padding:3px 10px;
}

/* ── Scoreboards ── */
.ue-boards{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:14px;padding:18px 18px 0;
}
.ue-board{
  background:var(--c-card);border:1px solid var(--c-border);
  border-radius:var(--r);overflow:hidden;
}
.ue-board-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 10px;border-bottom:1px solid var(--c-border);
}
.ue-board-title{
  font-family:var(--ff-label);font-size:var(--fs-mono);letter-spacing:2px;
  text-transform:uppercase;color:var(--c-muted);
}
.ue-board-ctrl{
  font-family:var(--ff-label);font-size:var(--fs-mono);
  padding:3px 10px;border-radius:3px;font-weight:700;
}
.ctrl-R{background:var(--c-rep-glow);color:var(--c-rep);border:1px solid rgba(239,68,68,.3);}
.ctrl-D{background:var(--c-dem-glow);color:var(--c-dem);border:1px solid rgba(59,130,246,.3);}
.ctrl-?{background:rgba(100,116,139,.1);color:var(--c-muted);border:1px solid rgba(100,116,139,.2);}

.ue-counts{
  display:flex;align-items:stretch;justify-content:space-between;
  padding:14px 16px 10px;gap:8px;
}
.ue-count{text-align:center;flex:1;}
.ue-count-n{
  font-family:var(--ff-display);
  font-size:clamp(32px,5vw,52px);font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;
}
.ue-count-n.dem{color:var(--c-dem);}
.ue-count-n.rep{color:var(--c-rep);}
.ue-count-n.unc{color:var(--c-muted);font-size:clamp(22px,3.5vw,36px);}
.ue-count-lbl{
  font-family:var(--ff-label);font-size:var(--fs-mono);color:var(--c-muted);
  margin-top:5px;letter-spacing:1px;
}
.ue-count-net{
  font-family:var(--ff-label);font-size:var(--fs-mono);margin-top:3px;
}
.net-pos{color:#4ade80;} .net-neg{color:#f87171;} .net-zero{color:var(--c-muted);}
.ue-count-sep{width:1px;background:var(--c-border);align-self:stretch;margin:0 4px;}

.ue-bar-wrap{padding:10px 16px 16px;}
.ue-bar-labels{
  display:flex;justify-content:space-between;
  font-family:var(--ff-label);font-size:var(--fs-mono);color:var(--c-muted);
  margin-bottom:5px;
}
.ue-bar{
  height:18px;display:flex;border-radius:4px;overflow:hidden;
  background:var(--c-unc);position:relative;
}
.ue-bar-d{background:var(--c-dem);transition:width .6s ease;}
.ue-bar-r{background:var(--c-rep);transition:width .6s ease;}
.ue-bar-i{background:var(--c-ind);transition:width .6s ease;}
.ue-threshold{
  position:absolute;top:-4px;bottom:-4px;width:2px;
  background:var(--c-accent);z-index:2;
}
.ue-threshold-lbl{
  position:absolute;top:-20px;
  font-family:var(--ff-label);font-size:12px;color:var(--c-accent);
  white-space:nowrap;transform:translateX(-50%);
}

/* ── Main Layout ── */
.ue-main{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  grid-template-areas:"map" "stories" "race";
  gap:14px;padding:14px 18px 18px;
}
.ue-map-panel{grid-area:map;}
.ue-race-panel{grid-area:race;}
.ue-stories{grid-area:stories;}
@media(min-width:900px){
  .ue-main{grid-template-columns:minmax(0,1fr) 440px;grid-template-areas:"map race" "stories stories";}
}
@media(min-width:1200px){
  .ue-main{grid-template-columns:minmax(0,1fr) 480px;}
}

/* ── Map Panel ── */
.ue-map-panel{
  background:var(--c-card);border:1px solid var(--c-border);
  border-radius:var(--r);overflow:hidden;
}
.ue-panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--c-border);
  flex-wrap:wrap;gap:8px;
}
.ue-panel-title{
  font-family:var(--ff-label);font-size:var(--fs-mono);letter-spacing:2px;
  text-transform:uppercase;color:var(--c-muted);
}
.ue-map-legend{
  display:flex;gap:14px;flex-wrap:wrap;
}
.ue-leg-item{
  display:flex;align-items:center;gap:6px;
  font-family:var(--ff-label);font-size:var(--fs-mono);color:var(--c-muted);
}
.ue-leg-swatch{width:12px;height:12px;border-radius:2px;}
#ue-map-svg{width:100%;height:auto;display:block;cursor:pointer;}
.ue-map-note{
  padding:10px 16px;font-family:var(--ff-label);font-size:var(--fs-mono);
  color:var(--c-muted);border-top:1px solid var(--c-border);
  text-align:center;
}

/* ── State Hover/Click Styles ── */
.ue-state{stroke:var(--c-stroke);stroke-width:.5;transition:opacity .15s;}
.ue-state:hover{opacity:.75;stroke:var(--c-accent);stroke-width:1.5;}
.ue-state.winner-R{fill:var(--c-rep);}
.ue-state.winner-D{fill:var(--c-dem);}
.ue-state.winner-I{fill:var(--c-ind);}
.ue-state.winner-null{fill:var(--c-unc);}
.ue-state.lean-R{fill:var(--c-lean-r);opacity:.85;}
.ue-state.lean-D{fill:var(--c-lean-d);opacity:.85;}

/* ── Tooltip ── */
.ue-tooltip{
  position:fixed;background:var(--c-pop);border:1px solid var(--c-border);
  border-radius:var(--r);padding:12px 16px;
  font-family:var(--ff-body);font-size:var(--fs-md);
  box-shadow:var(--c-shadow);
  pointer-events:none;z-index:1000;
  opacity:0;transition:opacity .15s;max-width:240px;
  transform:translate(-50%,-110%);
}
.ue-tooltip.visible{opacity:1;}
.ue-tt-state{
  font-family:var(--ff-label);font-size:var(--fs-mono);letter-spacing:1px;
  color:var(--c-accent);margin-bottom:7px;text-transform:uppercase;
}
.ue-tt-winner{font-family:var(--ff-display);font-weight:700;font-size:var(--fs-base);margin-bottom:5px;}
.ue-tt-winner.R{color:var(--c-rep);}
.ue-tt-winner.D{color:var(--c-dem);}
.ue-tt-winner.unc{color:var(--c-muted);}
.ue-tt-pct{font-family:var(--ff-label);font-size:var(--fs-sm);color:var(--c-muted);}

/* ── Stories (圖文說明區塊) ── */
.ue-stories{display:flex;flex-direction:column;gap:14px;min-width:0;}
.ue-stories[hidden]{display:none;}
.ue-story{
  background:var(--c-card);border:1px solid var(--c-border);
  border-radius:var(--r);overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);
}
.ue-story-media{background:#05080f;display:flex;align-items:center;justify-content:center;min-width:0;}
.ue-story-media img,.ue-story-media video{display:block;width:100%;height:auto;}
.ue-story-embed{position:relative;width:100%;aspect-ratio:16/9;}
.ue-story-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.ue-story-body{padding:18px 20px;display:flex;flex-direction:column;justify-content:center;}
.ue-story-title{font-family:var(--ff-display);font-size:clamp(20px,2.4vw,24px);font-weight:900;line-height:1.35;margin-bottom:10px;}
.ue-story-text{font-size:var(--fs-base);line-height:1.8;color:var(--c-text);white-space:pre-line;}
.ue-story-links{list-style:none;margin-top:14px;display:flex;flex-direction:column;gap:8px;}
.ue-story-links-lbl{font-family:var(--ff-label);font-size:var(--fs-mono);letter-spacing:1px;color:var(--c-muted);margin-top:14px;}
.ue-story-links-lbl + .ue-story-links{margin-top:6px;}
.ue-story-links a{
  font-size:var(--fs-md);line-height:1.6;color:var(--c-text);font-weight:500;
  text-decoration:underline;text-decoration-color:var(--c-accent-line);text-underline-offset:4px;
  text-decoration-thickness:2px;word-break:break-word;
}
.ue-story-links a::before{content:'↗';color:var(--c-accent);text-decoration:none;display:inline-block;margin-right:6px;}
.ue-story-links a:hover{color:var(--c-accent);}
@media(min-width:900px){
  .ue-story.has-media.has-body{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);}
  .ue-story.flip .ue-story-media{order:2;}
}

/* ── Race Panel ── */
.ue-race-panel{
  background:var(--c-card);border:1px solid var(--c-border);
  border-radius:var(--r);overflow:hidden;
  display:flex;flex-direction:column;
}
.ue-tabs{
  display:flex;border-bottom:1px solid var(--c-border);
}
.ue-tab{
  flex:1;padding:13px 8px;text-align:center;cursor:pointer;
  font-family:var(--ff-label);font-size:var(--fs-sm);letter-spacing:1px;
  text-transform:uppercase;color:var(--c-muted);
  border-bottom:2px solid transparent;transition:all .2s;
  user-select:none;
}
.ue-tab:hover{color:var(--c-text);}
.ue-tab.active{color:var(--c-accent);border-bottom-color:var(--c-accent);}

.ue-filter-row{
  display:flex;gap:8px;padding:12px 14px;
  border-bottom:1px solid var(--c-border);flex-wrap:wrap;
}
.ue-filter-btn{
  font-family:var(--ff-label);font-size:var(--fs-mono);letter-spacing:1px;
  text-transform:uppercase;padding:5px 12px;border-radius:3px;
  border:1px solid var(--c-border);background:transparent;
  color:var(--c-muted);cursor:pointer;transition:all .15s;
}
.ue-filter-btn:hover,.ue-filter-btn.active{
  border-color:var(--c-accent);color:var(--c-accent);
  background:var(--c-accent-bg);
}

.ue-race-list{
  overflow-y:auto;flex:1;
  scrollbar-width:thin;scrollbar-color:var(--c-border) transparent;
}
.ue-race-list{scrollbar-width:auto;scrollbar-color:var(--c-scroll-thumb) var(--c-scroll-track);flex:none;}
.ue-race-list::-webkit-scrollbar{width:10px;}
.ue-race-list::-webkit-scrollbar-track{background:var(--c-scroll-track);}
.ue-race-list::-webkit-scrollbar-thumb{background:var(--c-scroll-thumb);border-radius:5px;border:2px solid var(--c-scroll-track);}
.ue-race-more{
  padding:8px 14px;text-align:center;border-top:1px solid var(--c-border);
  font-family:var(--ff-label);font-size:var(--fs-mono);color:var(--c-muted);
}

.ue-race-item{
  padding:15px 18px;border-bottom:1px solid var(--c-border);
  cursor:pointer;transition:background .15s;
}
.ue-race-item:hover{background:var(--c-hover);}
.ue-race-item:last-child{border-bottom:none;}

.ue-race-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;gap:8px;
}
.ue-race-label{
  display:flex;align-items:center;gap:10px;flex:1;min-width:0;
}
.ue-state-badge{
  font-family:var(--ff-label);font-size:var(--fs-sm);font-weight:700;
  color:var(--c-text);background:var(--c-badge);
  padding:4px 8px;border-radius:3px;letter-spacing:.5px;flex-shrink:0;
}
.ue-race-office{
  font-family:var(--ff-label);font-size:var(--fs-mono);color:var(--c-muted);
  letter-spacing:1px;text-transform:uppercase;
}
.ue-race-status{
  display:flex;align-items:center;gap:6px;flex-shrink:0;
}
.ue-called-badge{
  font-family:var(--ff-label);font-size:var(--fs-mono);padding:4px 9px;
  border-radius:3px;letter-spacing:.5px;white-space:nowrap;
}
.called-R{background:var(--c-rep-glow);color:var(--c-rep);border:1px solid rgba(239,68,68,.3);}
.called-D{background:var(--c-dem-glow);color:var(--c-dem);border:1px solid rgba(59,130,246,.3);}
.called-null{background:rgba(100,116,139,.1);color:var(--c-muted);border:1px solid rgba(100,116,139,.2);}
.ue-pct-reporting{
  font-family:var(--ff-label);font-size:var(--fs-mono);color:var(--c-muted);
  margin-top:8px;
}

.ue-candidates{display:flex;flex-direction:column;gap:7px;}
.ue-candidate{display:flex;align-items:center;gap:10px;}
.ue-cand-party{
  width:15px;height:15px;border-radius:3px;flex-shrink:0;
}
.party-D{background:var(--c-dem);}
.party-R{background:var(--c-rep);}
.ue-cand-name{
  font-size:var(--fs-base);flex:1;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.ue-cand-name.winner{font-weight:700;}
.ue-winner-mark{
  font-size:var(--fs-sm);color:var(--c-accent);margin-left:3px;
}
.ue-cand-pct{
  font-family:var(--ff-label);font-size:var(--fs-md);font-weight:700;
  min-width:46px;text-align:right;
}
.pct-D{color:var(--c-dem);}
.pct-R{color:var(--c-rep);}
.ue-cand-bar-wrap{
  width:100%;margin-top:3px;
}
.ue-cand-bar{
  height:5px;border-radius:3px;background:var(--c-border);
  overflow:hidden;
}
.ue-cand-bar-fill{height:100%;transition:width .5s ease;}
.fill-D{background:var(--c-dem);}
.fill-R{background:var(--c-rep);}

/* ── State Detail Modal ── */
.ue-modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  z-index:900;display:none;align-items:center;justify-content:center;
  padding:20px;
}
.ue-modal-bg.open{display:flex;}
.ue-modal{
  background:var(--c-pop);border:1px solid var(--c-border);
  border-radius:var(--r);max-width:520px;width:100%;
  max-height:88vh;overflow-y:auto;
  box-shadow:var(--c-shadow-lg);
}
.ue-modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--c-border);
  position:sticky;top:0;background:var(--c-pop);z-index:1;
}
.ue-modal-close{
  background:none;border:none;color:var(--c-muted);
  font-size:24px;cursor:pointer;padding:4px;line-height:1;
}
.ue-modal-close:hover{color:var(--c-text);}
.ue-modal-body{padding:20px;font-size:var(--fs-base);}

/* ── Footer ── */
.ue-foot{
  padding:14px 18px;border-top:1px solid var(--c-border);
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:8px;
}
.ue-foot-note{font-family:var(--ff-label);font-size:var(--fs-mono);color:var(--c-muted);}
.ue-refresh-btn{
  font-family:var(--ff-label);font-size:var(--fs-mono);letter-spacing:1px;
  text-transform:uppercase;padding:6px 14px;
  border:1px solid var(--c-border);border-radius:3px;
  background:transparent;color:var(--c-muted);cursor:pointer;
  transition:all .2s;
}
.ue-refresh-btn:hover{border-color:var(--c-accent);color:var(--c-accent);}
.ue-refresh-btn.loading{animation:ue-spin 1s linear infinite;}
@keyframes ue-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}


.ue-theme-btn{
  position:absolute;top:16px;right:16px;z-index:2;
  font-family:var(--ff-label);font-size:var(--fs-mono);letter-spacing:1px;
  padding:6px 12px;border:1px solid var(--c-border);border-radius:999px;
  background:var(--c-card);color:var(--c-text);cursor:pointer;transition:all .2s;
}
.ue-theme-btn:hover{border-color:var(--c-accent-line);color:var(--c-accent);}

@media(max-width:480px){
  .ue-head{padding:16px 16px 14px;}
  .ue-boards{padding:12px 12px 0;gap:10px;}
  .ue-main{padding:10px 12px 14px;gap:10px;}
}
</style>
</head>
<body>
<div class="ue-wrap" id="ue-root">

  <!-- Header -->
  <div class="ue-head">
    <button class="ue-theme-btn" id="ue-theme-btn" onclick="toggleTheme()" aria-label="切換亮色或暗色"></button>
    <div class="ue-kicker">🇺🇸 Breaking · 2026 Midterms</div>
    <div class="ue-title">2026 美國期中選舉<br>即時開票結果</div>
    <div class="ue-head-meta">
      <span class="ue-live-dot">直播開票中</span>
      <span class="ue-updated" id="ue-updated">更新中…</span>
      <span class="ue-reporting-tag" id="ue-reporting">載入中</span>
    </div>
  </div>

  <!-- Scoreboards -->
  <div class="ue-boards" id="ue-boards">
    <!-- Rendered by JS -->
  </div>

  <!-- Main: Map + Race List -->
  <div class="ue-main">

    <!-- Map Panel -->
    <div class="ue-map-panel">
      <div class="ue-panel-head">
        <span class="ue-panel-title">各州選情地圖</span>
        <div class="ue-map-legend">
          <div class="ue-leg-item"><div class="ue-leg-swatch" style="background:var(--c-dem)"></div>民主黨勝</div>
          <div class="ue-leg-item"><div class="ue-leg-swatch" style="background:var(--c-rep)"></div>共和黨勝</div>
          <div class="ue-leg-item"><div class="ue-leg-swatch" style="background:var(--c-unc)"></div>未決定</div>
        </div>
      </div>
      <svg id="ue-map-svg" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="ue-map-note">點擊各州查看詳細選情 · 深色為選情膠著</div>
    </div>

    <!-- Race Panel -->
    <div class="ue-race-panel">
      <div class="ue-tabs">
        <div class="ue-tab active" data-tab="senate" onclick="switchTab('senate')">參議院</div>
        <div class="ue-tab" data-tab="house" onclick="switchTab('house')">眾議院</div>
      </div>
      <div class="ue-filter-row">
        <button class="ue-filter-btn active" data-filter="all" onclick="setFilter('all',this)">全部</button>
        <button class="ue-filter-btn" data-filter="competitive" onclick="setFilter('competitive',this)">競爭選區</button>
        <button class="ue-filter-btn" data-filter="called" onclick="setFilter('called',this)">已確定</button>
        <button class="ue-filter-btn" data-filter="uncalled" onclick="setFilter('uncalled',this)">未確定</button>
      </div>
      <div class="ue-race-list" id="ue-race-list">
        <!-- Rendered by JS -->
      </div>
      <div class="ue-race-more" id="ue-race-more" hidden></div>
    </div>

    <!-- Stories (hidden when empty) -->
    <div class="ue-stories" id="ue-stories" hidden></div>

  </div>

  <!-- Footer -->
  <div class="ue-foot">
    <span class="ue-foot-note" id="ue-foot-note">來源：美聯社、各州選務委員會 · 數據每60秒自動更新</span>
    <button class="ue-refresh-btn" id="ue-refresh-btn" onclick="manualRefresh()">↻ 立即更新</button>
  </div>

</div>

<!-- Tooltip -->
<div class="ue-tooltip" id="ue-tooltip"></div>

<!-- State Detail Modal -->
<div class="ue-modal-bg" id="ue-modal-bg" onclick="closeModal(event)">
  <div class="ue-modal">
    <div class="ue-modal-head">
      <span id="ue-modal-title" style="font-family:var(--ff-display);font-weight:700;font-size:20px;"></span>
      <button class="ue-modal-close" onclick="closeModalDirect()">×</button>
    </div>
    <div class="ue-modal-body" id="ue-modal-body"></div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════ */
const DATA_URL = './us-election-2026-data.json';
const REFRESH_INTERVAL = 60000; // 60s

/* ══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
let electionData = null;
let currentTab = 'senate';
let currentFilter = 'all';
let refreshTimer = null;
let topoLoaded = false;
let usGeo = null;

/* ══════════════════════════════════════════════
   FIPS → State Abbr map
═══════════════════════════════════════════════ */
const FIPS = {
  '01':'AL','02':'AK','04':'AZ','05':'AR','06':'CA','08':'CO','09':'CT',
  '10':'DE','11':'DC','12':'FL','13':'GA','15':'HI','16':'ID','17':'IL',
  '18':'IN','19':'IA','20':'KS','21':'KY','22':'LA','23':'ME','24':'MD',
  '25':'MA','26':'MI','27':'MN','28':'MS','29':'MO','30':'MT','31':'NE',
  '32':'NV','33':'NH','34':'NJ','35':'NM','36':'NY','37':'NC','38':'ND',
  '39':'OH','40':'OK','41':'OR','42':'PA','44':'RI','45':'SC','46':'SD',
  '47':'TN','48':'TX','49':'UT','50':'VT','51':'VA','53':'WA','54':'WV',
  '55':'WI','56':'WY'
};

const STATE_NAMES = {
  AL:'阿拉巴馬州',AK:'阿拉斯加州',AZ:'亞利桑那州',AR:'阿肯色州',
  CA:'加利福尼亞州',CO:'科羅拉多州',CT:'康乃狄克州',DE:'德拉瓦州',
  FL:'佛羅里達州',GA:'喬治亞州',HI:'夏威夷州',ID:'愛達荷州',
  IL:'伊利諾州',IN:'印第安納州',IA:'愛荷華州',KS:'堪薩斯州',
  KY:'肯塔基州',LA:'路易斯安那州',ME:'緬因州',MD:'馬里蘭州',
  MA:'麻薩諸塞州',MI:'密西根州',MN:'明尼蘇達州',MS:'密西西比州',
  MO:'密蘇里州',MT:'蒙大拿州',NE:'內布拉斯加州',NV:'內華達州',
  NH:'新罕布夏州',NJ:'紐澤西州',NM:'新墨西哥州',NY:'紐約州',
  NC:'北卡羅來納州',ND:'北達科他州',OH:'俄亥俄州',OK:'奧克拉荷馬州',
  OR:'奧勒岡州',PA:'賓夕法尼亞州',RI:'羅德島州',SC:'南卡羅來納州',
  SD:'南達科他州',TN:'田納西州',TX:'德克薩斯州',UT:'猶他州',
  VT:'佛蒙特州',VA:'維吉尼亞州',WA:'華盛頓州',WV:'西維吉尼亞州',
  WI:'威斯康辛州',WY:'懷俄明州'
};

/* ══════════════════════════════════════════════
   DATA LOADING
═══════════════════════════════════════════════ */
async function loadData() {
  try {
    const res = await fetch(DATA_URL + '?_=' + Date.now());
    electionData = await res.json();
  } catch(e) {
    console.warn('Could not load data file, using fallback.');
    electionData = getFallbackData();
  }
  renderAll();
  scheduleRefresh();
}

function scheduleRefresh() {
  if (refreshTimer) clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async () => {
    await loadData();
  }, REFRESH_INTERVAL);
}

async function manualRefresh() {
  const btn = document.getElementById('ue-refresh-btn');
  btn.classList.add('loading');
  btn.textContent = '↻ 更新中';
  await loadData();
  btn.classList.remove('loading');
  btn.textContent = '↻ 立即更新';
}

/* ══════════════════════════════════════════════
   THEME TOGGLE
═══════════════════════════════════════════════ */
function paintThemeBtn() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.getElementById('ue-theme-btn').textContent = dark ? '☀ 亮色' : '☾ 暗色';
}
function toggleTheme() {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('ue-theme', next); } catch (e) {}
  paintThemeBtn();
}
paintThemeBtn();

/* ══════════════════════════════════════════════
   STORIES (圖文說明區塊)
═══════════════════════════════════════════════ */
let storiesSig = '';
function embedURL(src) {
  let m = src.match(/(?:youtube\.com\/watch\?(?:.*&)?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([\w-]{11})/);
  if (m) return 'https://www.youtube-nocookie.com/embed/' + m[1];
  m = src.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (m) return 'https://player.vimeo.com/video/' + m[1];
  return null;
}
function mediaKind(src) {
  if (embedURL(src)) return 'embed';
  if (/\.(mp4|webm|mov)(\?|#|$)/i.test(src)) return 'video';
  return 'image';
}
function resolveMedia(src) {
  return /^https?:\/\//i.test(src) ? src : '../' + src.replace(/^\.?\/+/, '');
}
function safeUrl(u) {
  u = String(u || '').trim();
  return /^https?:\/\//i.test(u) ? u : '';
}
function hostOf(u) {
  try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; }
}
function storyHTML(st, i) {
  const src = (st.src || '').trim();
  const title = (st.title || '').trim();
  const text = (st.text || '').trim();
  let media = '';
  if (src) {
    const kind = mediaKind(src);
    if (kind === 'embed') {
      media = `<div class="ue-story-embed"><iframe src="${esc(embedURL(src))}" loading="lazy" allowfullscreen></iframe></div>`;
    } else if (kind === 'video') {
      media = `<video src="${esc(resolveMedia(src))}" autoplay muted loop playsinline controls preload="metadata"></video>`;
    } else {
      media = `<img src="${esc(resolveMedia(src))}" alt="${esc(title)}" loading="lazy">`;
    }
  }
  const links = (st.links || []).map(l => ({ url: safeUrl(l && l.url), title: ((l && l.title) || '').trim() })).filter(l => l.url);
  const linkHTML = links.length
    ? `<div class="ue-story-links-lbl">相關報導</div><ul class="ue-story-links">${links.map(l => `<li><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.title || hostOf(l.url))}</a></li>`).join('')}</ul>`
    : '';
  const body = (title || text || linkHTML)
    ? `<div class="ue-story-body">${title ? `<div class="ue-story-title">${esc(title)}</div>` : ''}${text ? `<div class="ue-story-text">${esc(text)}</div>` : ''}${linkHTML}</div>`
    : '';
  return `<div class="ue-story${media ? ' has-media' : ''}${body ? ' has-body' : ''}${i % 2 ? ' flip' : ''}">${media ? `<div class="ue-story-media">${media}</div>` : ''}${body}</div>`;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderStories() {
  const wrap = document.getElementById('ue-stories');
  const list = (electionData.stories || []).filter(s => s && (s.title || s.text || s.src || (s.links || []).some(l => l && safeUrl(l.url))));
  const sig = JSON.stringify(list);
  if (sig === storiesSig) return;
  storiesSig = sig;
  wrap.hidden = list.length === 0;
  wrap.innerHTML = list.map(storyHTML).join('');
}

/* ══════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════ */
function renderAll() {
  if (!electionData) return;
  renderHeader();
  renderBoards();
  renderMap();
  renderRaceList();
  renderStories();
}

function renderHeader() {
  const d = electionData.meta;
  const ts = new Date(d.lastUpdated);
  const fmt = ts.toLocaleString('zh-TW',{
    month:'numeric',day:'numeric',
    hour:'2-digit',minute:'2-digit',timeZoneName:'short'
  });
  document.getElementById('ue-updated').textContent = '最後更新：' + fmt;
  document.getElementById('ue-reporting').textContent = d.reporting;
}

function renderBoards() {
  const d = electionData;
  const wrap = document.getElementById('ue-boards');
  wrap.innerHTML = [
    boardHTML('參議院 Senate', d.senate, 'senate'),
    boardHTML('眾議院 House', d.house, 'house'),
  ].join('');
}

function boardHTML(title, data, type) {
  const total = data.total;
  const threshold = data.threshold || Math.ceil(total/2);
  const dSeats = data.dem.seats;
  const rSeats = data.rep.seats;
  const iSeats = (data.ind || {}).seats || 0;
  const ctrl = data.currentControl;
  const ctrlLabel = ctrl === 'R' ? '共和黨控制' : ctrl === 'D' ? '民主黨控制' : '懸峙議會';
  const ctrlClass = ctrl ? `ctrl-${ctrl}` : 'ctrl-?';

  const dW = (dSeats / total * 100).toFixed(1);
  const rW = (rSeats / total * 100).toFixed(1);
  const iW = (iSeats / total * 100).toFixed(1);
  const threshPct = (threshold / total * 100).toFixed(2);

  return `
  <div class="ue-board">
    <div class="ue-board-head">
      <span class="ue-board-title">${title}</span>
      <span class="ue-board-ctrl ${ctrlClass}">${ctrlLabel}</span>
    </div>
    <div class="ue-counts">
      <div class="ue-count">
        <div class="ue-count-n dem">${dSeats}</div>
        <div class="ue-count-lbl">民主黨</div>
      </div>
      <div class="ue-count-sep"></div>
      <div class="ue-count" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div style="font-family:var(--ff-label);font-size:13px;color:var(--c-muted);">門檻</div>
        <div style="font-family:var(--ff-label);font-size:22px;font-weight:700;color:var(--c-accent);">${threshold}</div>
      </div>
      <div class="ue-count-sep"></div>
      <div class="ue-count">
        <div class="ue-count-n rep">${rSeats}</div>
        <div class="ue-count-lbl">共和黨</div>
      </div>
    </div>
    <div class="ue-bar-wrap">
      <div class="ue-bar-labels">
        <span style="color:var(--c-dem)">民主黨 ${dSeats}</span>
        <span style="color:var(--c-rep)">共和黨 ${rSeats}</span>
      </div>
      <div class="ue-bar">
        <div class="ue-bar-d" style="width:${dW}%"></div>
        ${iSeats > 0 ? `<div class="ue-bar-i" style="width:${iW}%"></div>` : ''}
        <div class="ue-bar-r" style="width:${rW}%;margin-left:auto"></div>
        <div class="ue-threshold" style="left:${threshPct}%">
          <span class="ue-threshold-lbl">${threshold}</span>
        </div>
      </div>
    </div>
  </div>`;
}

function netClass(n) {
  if (n > 0) return 'net-pos';
  if (n < 0) return 'net-neg';
  return 'net-zero';
}
function netStr(n) {
  if (n > 0) return `▲ +${n}`;
  if (n < 0) return `▼ ${n}`;
  return '─ 持平';
}

/* ══════════════════════════════════════════════
   MAP
═══════════════════════════════════════════════ */
function renderMap() {
  if (!electionData) return;
  if (!usGeo) {
    loadTopoJSON();
  } else {
    drawMap();
  }
}

function loadTopoJSON() {
  d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')
    .then(us => {
      usGeo = us;
      drawMap();
    })
    .catch(err => {
      console.error('Map load failed:', err);
      document.getElementById('ue-map-svg').innerHTML =
        '<text x="480" y="300" fill="#64748b" text-anchor="middle" font-family="monospace" font-size="14">地圖載入失敗（需要網路連線）</text>';
    });
}

function drawMap() {
  const svg = d3.select('#ue-map-svg');
  svg.selectAll('*').remove();

  const projection = d3.geoAlbersUsa().scale(1280).translate([487.5, 305]);
  const path = d3.geoPath().projection(projection);
  const states = topojson.feature(usGeo, usGeo.objects.states);
  const mesh = topojson.mesh(usGeo, usGeo.objects.states, (a,b) => a !== b);

  const tooltip = document.getElementById('ue-tooltip');

  svg.selectAll('.ue-state')
    .data(states.features)
    .join('path')
    .attr('class', d => {
      const abbr = FIPS[String(d.id).padStart(2,'0')];
      if (!abbr) return 'ue-state winner-null';
      const st = electionData.states[abbr];
      if (!st) return 'ue-state winner-null';
      const w = st.called ? (st.winner || 'null') : 'null';
      const isClose = st.called && st.margin !== null && st.margin < 4;
      return `ue-state winner-${w}${isClose ? ' is-close' : ''}`;
    })
    .attr('d', path)
    .style('opacity', d => {
      const abbr = FIPS[String(d.id).padStart(2,'0')];
      if (!abbr || !electionData.states[abbr]) return 0.5;
      const st = electionData.states[abbr];
      if (!st.called) return 0.6;
      if (st.margin !== null && st.margin < 4) return 0.8;
      return 1;
    })
    .on('mousemove', function(event, d) {
      const abbr = FIPS[String(d.id).padStart(2,'0')];
      if (!abbr) return;
      const st = electionData.states[abbr];
      showTooltip(event, abbr, st);
    })
    .on('mouseleave', () => {
      tooltip.classList.remove('visible');
    })
    .on('click', (event, d) => {
      const abbr = FIPS[String(d.id).padStart(2,'0')];
      if (abbr) showStateModal(abbr);
    });

  // State borders
  svg.append('path')
    .datum(mesh)
    .attr('fill','none')
    .style('stroke','var(--c-stroke)')
    .attr('stroke-width',1)
    .attr('d', path);
}

function showTooltip(event, abbr, st) {
  const tooltip = document.getElementById('ue-tooltip');
  const name = STATE_NAMES[abbr] || abbr;
  let winnerText = '未確定';
  let winnerClass = 'unc';
  if (st && st.called && st.winner) {
    winnerText = st.winner === 'D' ? '民主黨勝出' : st.winner === 'R' ? '共和黨勝出' : '獨立人士勝出';
    winnerClass = st.winner;
  }
  const marginText = st && st.called && st.margin ? `差距 ${st.margin.toFixed(1)}%` : '';

  tooltip.innerHTML = `
    <div class="ue-tt-state">${abbr} · ${name}</div>
    <div class="ue-tt-winner ${winnerClass}">${winnerText}</div>
    ${marginText ? `<div class="ue-tt-pct">${marginText}</div>` : ''}
    <div class="ue-tt-pct" style="margin-top:4px;">點擊查看詳細</div>
  `;
  tooltip.style.left = event.clientX + 'px';
  tooltip.style.top = event.clientY + 'px';
  tooltip.classList.add('visible');
}

/* ══════════════════════════════════════════════
   RACE LIST
═══════════════════════════════════════════════ */
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.ue-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  renderRaceList();
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.ue-filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === filter);
  });
  renderRaceList();
}

function renderRaceList() {
  if (!electionData) return;
  const list = document.getElementById('ue-race-list');
  let races = electionData.keyRaces || [];

  // Filter by tab
  const officeMap = { senate:'Senate', house:'House' };
  const office = officeMap[currentTab];
  races = races.filter(r => r.office === office);

  // Filter by status
  if (currentFilter === 'competitive') races = races.filter(r => r.competitive);
  if (currentFilter === 'called') races = races.filter(r => r.called);
  if (currentFilter === 'uncalled') races = races.filter(r => !r.called);

  if (races.length === 0) {
    list.innerHTML = `<div style="padding:32px;text-align:center;font-family:var(--ff-label);font-size:14px;color:var(--c-muted);">此分類目前無資料</div>`;
    list.style.maxHeight = '';
    document.getElementById('ue-race-more').hidden = true;
    return;
  }

  list.innerHTML = races.map(r => raceItemHTML(r)).join('');
  fitRaceList(races.length);
}

const RACE_VISIBLE = 4;
function fitRaceList(total) {
  const list = document.getElementById('ue-race-list');
  const more = document.getElementById('ue-race-more');
  const items = list.querySelectorAll('.ue-race-item');
  if (total <= RACE_VISIBLE) {
    list.style.maxHeight = '';
    more.hidden = true;
    return;
  }
  let h = 0;
  for (let i = 0; i < RACE_VISIBLE; i++) h += items[i].offsetHeight;
  list.style.maxHeight = h + 'px';
  list.scrollTop = 0;
  more.textContent = `共 ${total} 場，往下滑動查看更多 ↓`;
  more.hidden = false;
}
window.addEventListener('resize', () => {
  if (electionData) renderRaceList();
});

function raceItemHTML(r) {
  const dPct = r.dem ? r.dem.pct : 0;
  const rPct = r.rep ? r.rep.pct : 0;
  const total = dPct + rPct;
  const dBar = total > 0 ? ((dPct / total) * 100).toFixed(1) : 50;
  const rBar = total > 0 ? ((rPct / total) * 100).toFixed(1) : 50;

  let statusBadge;
  if (r.called) {
    const cl = r.winner === 'D' ? 'called-D' : r.winner === 'R' ? 'called-R' : 'called-null';
    const lbl = r.winner === 'D' ? '民主黨勝' : r.winner === 'R' ? '共和黨勝' : '確定';
    statusBadge = `<span class="ue-called-badge ${cl}">${lbl}</span>`;
  } else {
    statusBadge = `<span class="ue-called-badge called-null">計票中</span>`;
  }

  const dLabel = dPct > 0 ? `民主 ${dPct.toFixed(1)}%` : '民主';
  const rLabel = rPct > 0 ? `共和 ${rPct.toFixed(1)}%` : '共和';

  return `
  <div class="ue-race-item" onclick="showStateModal('${r.state}')">
    <div class="ue-race-top">
      <div class="ue-race-label">
        <span class="ue-state-badge">${r.state}</span>
        <div>
          <div style="font-family:var(--ff-display);font-size:18px;font-weight:700;line-height:1.2;">${r.stateName}</div>
        </div>
      </div>
      <div class="ue-race-status">
        ${statusBadge}
      </div>
    </div>
    <div style="margin-top:6px;">
      <div style="display:flex;justify-content:space-between;font-family:var(--ff-label);font-size:13px;margin-bottom:5px;">
        <span style="color:var(--c-dem)">${dLabel}</span>
        <span style="color:var(--c-rep)">${rLabel}</span>
      </div>
      <div class="ue-bar" style="height:10px;">
        <div class="ue-bar-d" style="width:${dBar}%"></div>
        <div class="ue-bar-r" style="width:${rBar}%;margin-left:auto"></div>
      </div>
    </div>
    ${r.reporting ? `<div class="ue-pct-reporting">${r.reporting}% 選區已開出</div>` : ''}
  </div>`;
}

/* ══════════════════════════════════════════════
   MODALS
═══════════════════════════════════════════════ */
function showStateModal(abbr) {
  const name = STATE_NAMES[abbr] || abbr;
  const st = electionData.states[abbr];
  const races = (electionData.keyRaces || []).filter(r => r.state === abbr);

  document.getElementById('ue-modal-title').textContent = `${abbr} · ${name}`;

  let bodyHTML = '';

  if (st) {
    const wText = !st.called ? '計票中' : st.winner === 'D' ? '民主黨勝出' : st.winner === 'R' ? '共和黨勝出' : '未確定';
    const wColor = st.winner === 'D' ? 'var(--c-dem)' : st.winner === 'R' ? 'var(--c-rep)' : 'var(--c-muted)';
    bodyHTML += `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <div>
          <div style="font-family:var(--ff-label);font-size:13px;color:var(--c-muted);margin-bottom:6px;">選舉結果</div>
          <div style="font-size:20px;font-weight:700;color:${wColor}">${wText}</div>
        </div>
        ${st.margin ? `<div style="text-align:right;"><div style="font-family:var(--ff-label);font-size:13px;color:var(--c-muted);margin-bottom:6px;">領先差距</div><div style="font-family:var(--ff-label);font-size:24px;font-weight:700;color:${wColor}">${st.margin.toFixed(1)}%</div></div>` : ''}
      </div>`;
  }

  if (races.length > 0) {
    bodyHTML += `<div style="font-family:var(--ff-label);font-size:13px;color:var(--c-muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;">競選資訊</div>`;
    bodyHTML += races.map(r => `
      <div style="background:var(--c-hover);border:1px solid var(--c-border);border-radius:4px;padding:12px;margin-bottom:8px;">
        ${raceItemHTML(r)}
      </div>`
    ).join('');
  } else {
    bodyHTML += `<div style="font-family:var(--ff-label);font-size:14px;color:var(--c-muted);text-align:center;padding:20px 0;">此州詳細選情資料尚未收錄</div>`;
  }

  document.getElementById('ue-modal-body').innerHTML = bodyHTML;
  document.getElementById('ue-modal-bg').classList.add('open');
}

function showRaceModal(id) {
  const race = (electionData.keyRaces || []).find(r => r.id === id);
  if (!race) return;
  showStateModal(race.state);
}

function closeModal(e) {
  if (e.target === document.getElementById('ue-modal-bg')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('ue-modal-bg').classList.remove('open');
}


/* ══════════════════════════════════════════════
   FALLBACK DATA
═══════════════════════════════════════════════ */
function getFallbackData() {
  return {
    meta:{lastUpdated:'2026-11-03T21:00:00-05:00',reporting:'資料載入中',source:''},
    senate:{dem:{seats:44,net:-2},rep:{seats:50,net:2},ind:{seats:2,net:0},uncalled:4,total:100,threshold:51,currentControl:'R'},
    house:{dem:{seats:195,net:-8},rep:{seats:222,net:8},ind:{seats:0,net:0},uncalled:18,total:435,threshold:218,currentControl:'R'},
    governor:{dem:{seats:19,net:-1},rep:{seats:27,net:1},ind:{seats:0,net:0},uncalled:4,total:50,racing:36,currentControl:'?'},
    states:{},keyRaces:[]
  };
}

/* ══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  loadData();
});

// ESC to close modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModalDirect();
});
</script>
