<title>美國對外媒體與「不實資訊」相關支出</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--pad:clamp(14px,3vw,32px);--bg:#0b0f1a;--bg2:#121a2b;--border:#2a3550;--text:#e8ecf5;--mute:#9aa5bd;--blue:#3987e5;--gold:#eda100;--violet:#9085e9;--gray:#5b6784;--green:#1baf7a}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body.usd-body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;font-size:18px;line-height:1.5;padding:var(--pad);max-width:900px;margin:0 auto}
.usd-kicker{font-family:'Space Mono',monospace;font-size:18px;color:var(--mute);margin-bottom:4px}
.usd-title{font-size:clamp(26px,5vw,34px);font-weight:900;line-height:1.25;color:#fff}
.usd-sub{font-size:18px;color:var(--mute);margin-top:4px}

/* sticky currency bar */
.usd-bar{position:sticky;top:0;z-index:20;background:var(--bg);margin:12px calc(-1*var(--pad)) 0;padding:8px var(--pad);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.usd-seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:12px;overflow:hidden;min-width:220px}
.usd-seg button{font:inherit;font-size:18px;font-weight:700;min-height:44px;border:0;background:var(--bg2);color:var(--mute);cursor:pointer;padding:0 14px}
.usd-seg button.on{background:#fff;color:#0b0f1a}
.usd-rate{font-size:18px;color:var(--mute)}

.usd-sec{font-family:'Space Mono',monospace;font-size:18px;color:var(--mute);margin:26px 0 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.usd-sec em{font-style:normal;font-family:'Noto Sans TC',sans-serif;font-weight:700;color:#fff}
.usd-sec::after{content:'';flex:1;height:1px;background:var(--border);min-width:20px}
.usd-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px}

/* hero */
.usd-hero{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center}
.usd-donut{position:relative;width:200px;aspect-ratio:1;justify-self:center}
.usd-donut svg{display:block;width:100%;height:100%}
.usd-donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.usd-donut .c b{font-family:'Space Mono',monospace;font-size:34px;color:#fff}
.usd-donut .c span{font-size:18px;color:var(--mute)}
.usd-big{font-family:'Space Mono',monospace;font-size:clamp(32px,8vw,46px);font-weight:700;color:#fff;line-height:1.1}
.usd-big small{display:block;font-family:'Noto Sans TC',sans-serif;font-size:18px;font-weight:400;color:var(--text);margin-top:4px}
.usd-lg{display:grid;gap:6px;margin-top:10px}
.usd-lg div{display:flex;align-items:center;gap:10px}
.usd-lg i{width:16px;height:16px;border-radius:4px;background:var(--c);flex-shrink:0}
.usd-lg b{margin-left:auto;font-family:'Space Mono',monospace}

/* tiles */
.usd-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.usd-tile{background:var(--bg);border:1px solid var(--border);border-top:4px solid var(--c,var(--gold));border-radius:10px;padding:10px 12px}
.usd-tile .n{font-family:'Space Mono',monospace;font-size:26px;font-weight:700;line-height:1.15;color:var(--c,var(--gold))}
.usd-tile .t{font-size:18px}
.usd-tile .s{font-size:18px;color:var(--mute)}

/* rows */
.usd-row{padding:8px 0;border-top:1px solid rgba(42,53,80,.7)}
.usd-row:first-child{border-top:0}
.usd-row .top{display:flex;align-items:baseline;gap:10px}
.usd-row .no{font-family:'Space Mono',monospace;color:var(--mute);min-width:2.2em;flex-shrink:0}
.usd-row .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.usd-row .am{font-family:'Space Mono',monospace;font-weight:700;white-space:nowrap;flex-shrink:0;color:#fff}
.usd-bar2{height:12px;border-radius:6px;background:var(--bg);border:1px solid var(--border);overflow:hidden;margin-top:5px}
.usd-bar2 i{display:block;height:100%;background:var(--blue)}
.usd-row.ua .usd-bar2 i{background:var(--gold)}
.usd-row.ua .tx{color:#fff}
.usd-prop .usd-bar2 i{background:var(--violet)}
.usd-key{display:flex;flex-wrap:wrap;gap:4px 16px;margin-bottom:6px}
.usd-key span::before{content:'';display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;background:var(--c);vertical-align:-1px}
.usd-more{margin-top:10px;width:100%;min-height:48px;font:inherit;font-size:18px;font-weight:700;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:#fff;cursor:pointer}
.usd-note{font-size:18px;color:var(--mute);margin-top:10px}
.usd-warn{margin-top:12px;background:rgba(237,161,0,.1);border:1px solid rgba(237,161,0,.45);border-radius:12px;padding:10px 14px;color:var(--text)}
.usd-warn b{color:var(--gold)}
.usd-tag{display:inline-block;font-family:'Space Mono',monospace;font-size:18px;color:var(--violet);border:1px solid var(--violet);border-radius:6px;padding:0 8px;margin-left:6px}
.usd-foot{margin-top:24px;padding-top:12px;border-top:1px solid var(--border);color:var(--mute)}
.usd-by{margin-top:8px;font-family:'Space Mono',monospace;color:var(--mute);text-align:right}
.usd-top{position:fixed;right:12px;bottom:12px;z-index:30;display:flex;align-items:center;gap:6px;min-height:48px;padding:0 16px;border-radius:999px;border:0;background:#fff;color:#0b0f1a;font:inherit;font-size:18px;font-weight:700;box-shadow:0 2px 12px rgba(0,0,0,.5);cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s}
.usd-top.on{opacity:1;pointer-events:auto;transform:none}
.usd-top b{font-size:22px;line-height:1}

@media(max-width:640px){
  :root{--pad:12px}
  .usd-hero{grid-template-columns:1fr;gap:12px}
  .usd-donut{width:min(100%,220px)}
  .usd-seg{flex:1}
}
</style>
</head>

    D.items.slice(0,n).forEach(function(x,i){list+=row(i+1,x.t,fmt(x.u),x.u/max*100,x.c==='烏克蘭'?'ua':'')});
    $('usd-list').innerHTML=list;
    $('usd-more').textContent=expanded?'收合清單 ▲':'展開全部 '+D.items.length+' 項 ▼';
    var pm=D.prop[0].hi,p='';
    D.prop.forEach(function(x,i){p+=row('',x.t,x.lo===x.hi?fmt(x.hi):fmtRange(x.lo,x.hi),x.hi/pm*100,'')});
    $('usd-prop').innerHTML=p;
    report();
  }
  document.querySelectorAll('.usd-seg button').forEach(function(b){b.addEventListener('click',function(){
    cur=b.dataset.c;document.querySelectorAll('.usd-seg button').forEach(function(x){x.classList.toggle('on',x===b)});render();});});
  $('usd-more').addEventListener('click',function(){expanded=!expanded;render();});
  var top=$('usd-top');
  function onScroll(){top.classList.toggle('on',(window.pageYOffset||document.documentElement.scrollTop)>300)}
  window.addEventListener('scroll',onScroll,{passive:true});
  top.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});try{parent.postMessage({type:'usd-top'},'*');}catch(e){}});
  window.addEventListener('load',report);window.addEventListener('resize',report);
  render();onScroll();
})();
</script>
</body>
</html>
