nation.com/article/archive/secret-us-military-documents-reveal-a-constellation-of-american-military-bases-across-africa/"],[-2.1608,40.889,"United States","Kenya","Lamu/Manda Bay","Manda","Army","Co-base","2006","","","","The Manda Bay facility is a Kenya Defense Forces military base reluctantly exploited by the U.S. armed forces, begrudgingly used for training and ostensibly safeguarding U.S. interests in the region.","https://africa.businessinsider.com/local/leaders/5-african-countries-with-us-military-bases/1n7xsm2"],[-2.1528,40.9062,"United States","Kenya","Camp Simba","Lamu County","Navy","Co-base","None","","","","Camp Simba, located adjacent to Magogoni Airfield, is a U.S. military installation that supports counterterrorism operations in the region. It serves as a base for U.S. and Kenyan forces conducting operations against al-Shabaab militants. The Manda Bay CSL also includes the Kenya Naval Base and the Magagoni Airfield, which is about a mile south of Camp Simba.","https://www.af.mil/News/Article-Display/Article/4137524/us-kenya-partnership-fortified-through-joint-engineering-efforts-at-camp-simba/"],[1.73,40.09,"United States","Kenya","Wajir Airport","Wajir","Air Force","Unknown","2012","","","","Wajir Airport is an international airport in Wajir County, Kenya. In 2012, US Navy Seabees built a new tarmac runway that can take heavy aircraft. According to secret documents revealed in 2017, some of AFRICOM’s CL inventory, including Wajir in Kenya, has been disclosed. Since then, there have been no updates regarding the funding and usage of this site.","https://www.thenation.com/article/archive/secret-us-military-documents-reveal-a-constellation-of-american-military-bases-across-africa/"],[28.9349,47.792,"United States","Kuwait","Ahmed Al Jaber Air Base","Al Ahmadi ","Air Force","Co-base","2003","","","","Ahmad al-Jaber Air Base is a Kuwait Air Force base that is home to 3 Kuwait Air Force F/A-18 C/D squadrons: 9 Squadron, 25 Squadron, and 61 Squadron. The base also has an area designated for operations by the U.S. Air Force and its allies.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[29.2375,47.9739,"United States","Kuwait","Al Mubarak AB/ Kuwait International Airport","Kuwait City","Air Force","Co-base","1996","","","","Al-Mubarak Air Base is part of the Kuwait International Airport complex. The air base near Kuwait City is the headquarters for the Kuwait Air Force and also serves the U.S. government and affiliated aircraft.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[29.3467,47.5206,"United States","Kuwait","Ali Al Salem Air Base","Al Jahra","Army","Co-base","2014","","","Drone Base","Ali Al Salem Air Base is a military air base owned by the Government of Kuwait. The USAF continuing to maintain a presence alongside their Kuwait Air Force. The principal USAF unit on base is the 386th Air Expeditionary Wing (386 AEW).","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[28.878,48.1579,"United States","Kuwait","Camp Arifjan","Al Ahmadi ","Army","Operator Only","1991","","","","Camp Arifjan is a United States Army installation that accommodates elements of the US Air Force, US Navy, US Marine Corps, and US Coast Guard. This base hosts other militaries from Australia, Canada, and UK. Camp Arifjan is divided into 7 zones. Camp Arifjan is a US military installation used as a forward logistics base, Aviation Classification and Repair Activity Depot, helicopter ground support base, and as a motor pool for armored and unarmored vehicles.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[29.6978,47.4264,"United States","Kuwait","Camp Buehring","Udairi","Army","Co-base","2003","","","","Camp Buehring is a US military base in Kuwait that has been used since 2003 to stage troops heading north into Iraq. This camp is formerly known as Camp Udairi. This base is owned and operated by the United States Army.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[29.7378,47.1988,"United States","Kuwait","Udairi Range","Udairi","Army","Co-base","2003","","","","The Udairi Range is a largely uninhabited area in northwestern Kuwait. The area is part of the Udairi Range Complex, which also includes Camp Buehring and Camp New York.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[28.8678,48.2774,"United States","Kuwait","Camp Patriot / Mohammed Al-Ahmad Kuwait Naval Base","Kuwait City","Navy","Co-base","1991","","","","Camp Patriot is one of the latest camps established in Kuwait and run by the US Army. It is located on the eastern coast of the country. This camp supports and hosts the only Amphibious Seabees group, part of the US Navy.","https://almashareq.com/en_GB/articles/cnmi_am/features/2023/05/08/feature-01#:~:text=Camp%20Spearhead%20is%20situated%20in,soldiers%20recover%20after%20severe%20injuries."],[29.0373,48.1247,"United States","Kuwait","Camp Spearhead","Shuaiba","Army","Co-base","1967","","","","Camp Spearhead was established by the US. The camp is located in Shuaiba near Shuaiba Port, and in the immediate proximity of Camp Patriot. The primary mission of Camp Spearhead was to support all the operations in the area. The center's primary mission is the movement of heavy equipment to and from the theater of operations. Combat equipment, including tanks, armored vehicles, and helicopters, is received, stored, and transported there for deployment.","https://almashareq.com/en_GB/articles/cnmi_am/features/2023/05/08/feature-01#:~:text=Camp%20Spearhead%20is%20situated%20in,soldiers%20recover%20after%20severe%20injuries."],[42.3657,21.2483,"United States","Kosovo","Camp Bondsteel","Ferizaj","Army","Co-base","1999","","","","Camp Bondsteel is controlled by the US, and it is the operation headquarters of the Kosovo Force (KFOR) in Kosovo. It is the Regional Command-East headed by the United States Army (U.S. Army) and it is supported by troops from Greece, Italy, Finland, Hungary, Poland, Slovenia, Switzerland and Turkiye.","https://www.army-technology.com/projects/campbondsteel/?cf-view"],[4.6334,28.2546,"United States","South Sudan","Nzara","Nzara","Unknown","Unknown","2010","","","","According to secret documents revealed in 2017, some of AFRICOM’s CL inventory, including Nzara in South Sudan, has been disclosed. Since then, there have been no updates regarding the funding and usage of this site.","https://www.thenation.com/article/archive/secret-us-military-documents-reveal-a-constellation-of-american-military-bases-across-africa/"],[37.7357,127.0693,"United States","South Korea","USAG Red Cloud and Area I","Uijeongbu","Army","Operator Only","None","","","","USAG Red Cloud is a United States Army Garrison that was located in Uijeongbu, South Korea. It was the headquarters for the 2nd Infantry Division, which is responsible for defending South Korea from North Korea.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.0176,126.9903,"United States","South Korea","Pyeongtaek","Pyeongtaek","Army","Operator Only","None","","","","The current usage of this base by the US is not yet clear.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[36.6519,127.8833,"United States","South Korea","Bayonet Training Area","Tong Du Chon","Army","Training Base","1951","","","","The Bayonet Training Area was a US Army training range near Tong Du Chon consisting of 248 acres of land. The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[36.4306,127.4496,"United States","South Korea","Camp Ames"," Daejeon ","Army","Operator Only","1992","","","","Camp Ames is a US nuclear weapons storage site in South Korea that was active in the 1970s and closed after 1992. The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.996,128.416,"United States","South Korea","Camp Carroll"," Waegwan ","Army","Co-base","1959","","","","Camp Carroll is a 546-acre Army base in South Korea. It is part of the U.S. Army Garrison Daegu (USAG Daegu).","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.9938,128.4218,"United States","South Korea","Camp Carroll Forward Operating Site"," Unknown ","Army","Operator Only","1960","","","","Camp Carroll Forward Operating Site is located in the Seongju area of South Korea. The site is part of the Army Active, and in 2023, it had a site size of 112,291 square feet.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.9219,127.0856,"United States","South Korea","Camp Casey"," Tongdu-ch'on ","Army","Operator Only","1952","","","","Camp Casey is a U.S. military base situated in Dongducheon, approximately 40 miles north of Seoul. Established in 1952, it has been home to various units of the 2nd Infantry Division. The base spans 3,500 acres and supports a population of military personnel and civilians. While there have been plans to relocate some units to Camp Humphreys, Camp Casey continues to operate as a military installation.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.9342,127.0564,"United States","South Korea","Camp Castle"," Tongdu-ch'on ","Army","Operator Only","1960","","","","Camp Castle is a United States Army military installation in South Korea and home to elements of the U.S. 2nd Infantry Division. It is adjacent but not connected to the larger Camp Casey.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.8525,128.6017,"United States","South Korea","Camp Henry"," Taegu ","Army","Operator Only","1960","","","","Camp Henry is a U.S. military base in Daegu, South Korea. This base consists primarily of administrative buildings and community support facilities. The U.S. Army Garrison - Daegu, headquartered at Camp Henry in Daegu, manages the installation.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.5313,126.9854,"United States","South Korea","Camp Henry - Brooklyn Hill","Yongsan","Army","Operator Only","1960","","","","Camp Henry - Brooklyn Hill is an active army base in Yongsan, South Korea. The base is part of the Daegu enclave, which also includes Camp Walker.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.1036,129.0435,"United States","South Korea","Camp Henry (Pier 8)/ Pusan (Busan) Pier 8"," Pusan ","Army","Operator Only","1960","","","","Pier 8 is controlled by the US Military Sealift Command, however, and was frequently used by US Navy vessels. Pier 8 was large enough to handle very large ships, with Forrestal class aircraft carriers being accommodated in the past. According to the DoD report 2023, it is an Army base, not a navy base.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.905,127.0842,"United States","South Korea","Camp Hovey"," Camp Hovey ","Army","Operator Only","1960","","","","This camp is not independent; It is mostly a complementary camp for the more advanced Camp Casey. The units that currently live in the camp are the 1-15th Field Artillery and the 4-7th Cavalry.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[36.9667,127.0333,"United States","South Korea","Camp Humphreys"," Pyeongtaek ","Army","Operator Only","1919","","","","Camp Humphreys is one of the small bases. It hosts the Desiderio airport, one of the most active airfields in the area. Although the base is run by the US Army, it also hosts units from the Air Force. It is controlled with the authority and regulations from South Korea. It is also known as United States Army Garrison-Humphreys (USAG-H).","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.4205,127.5159,"United States","South Korea","Camp Humphreys (High Point)","Gyeonggi-do","Army","Operator Only","1919","","","","The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[36.9511,127.027,"United States","South Korea","Camp Humphreys (Richmond)"," Daejeon ","Army","Operator Only","1919","","","","The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.6981,127.0439,"United States","South Korea","Camp Jackson","Uijeongbu","Army","Operator Only","1945","","","","Camp Jackson is a United States Army camp in South Korea. This camp was was handed back over to the South Korean government as part of the USFK transformation plan by 2016. However, the current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.8076,127.0481,"United States","South Korea","Camp Kwangsa Ri"," Yongju ","Army","Operator Only","1971","","","","Camp Kwangsari was turned over to the Republic of Korea between 2005 and the end of 2006 with the end of the War Reserves Stocks for Allies - Korea (WRSA-K) program. However, management of all ammunition in US Forces Korea Area I continue to be done at Camp Kwangsari by the 17th Ordnance Company, 6th Ordnance Battalion after the transfer.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.4947,126.7119,"United States","South Korea","Camp Market"," Inchon ","Army","Operator Only","1945","","","","Camp Market is a small base in the larger USAG Yongsan Installation. The base is home to the Marketing Office, the Defense Reutilization and the Army and Air Force Exchange services. This camp was closed and it is soil is heavily contaminated. The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.5497,126.9919,"United States","South Korea","Camp Morse","Seoul","Army","Operator Only","1950","","","","Camp Morse is a small communications facility on Namsan Mountain, near Seoul, South Korea. It's a two-acre installation with a radio tower that receives and retransmits an American Forces Network signal.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.9598,129.4259,"United States","South Korea","Camp Mu Juk"," Pohang ","Marine Corps","Operator Only","1980","","","","Camp Mujuk is the only United States Marine Corps Installation in South Korea. The installation is currently home to the Camp Mujuk Headquarters from MCIPAC.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.7519,127.0278,"United States","South Korea","Camp Red Cloud","Uijeongbu","Army","Operator Only","1957","","","","Camp Red Cloud is a United States Army camp located in the city of Uijeongbu, between Seoul and the Korean Demilitarized Zone (DMZ). The tenant units moved to Camp Humphreys in South Korea during 2018. The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.7506,127.0261,"United States","South Korea","Camp Red Cloud (Bullseye 01)"," Yongchon ","Army","Operator Only","1957","","","","Bullseye 01 is a small facility associated with Camp Red Cloud, a 2,204-acre military base in South Korea.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.7549,127.0239,"United States","South Korea","Camp Red Cloud - Bullseye 02"," Paju ","Army","Operator Only","1957","","","","Bullseye 02 is a small facility associated with Camp Red Cloud","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.7208,127.0967,"United States","South Korea","Camp Stanley","Uijeongbu","Army","Operator Only","1955","","","","Camp Stanley is a U.S. Army military camp located just east of the city of Uijeongbu, South Korea. The camp is part of the Red Cloud Garrison which is composed of Army installations near the Korean Demilitarized Zone (DMZ).","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.8364,128.5903,"United States","South Korea","Camp Walker"," Taegu ","Army","Operator Only","1950","","","","Camp Walker is a U.S. military base in Daegu, South Korea. Camp Walker spans 94 acres (0.38 km2) and contains military family housing for about 100 military and civilian families. Also on Camp Walker are Daegu Middle High School.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.2205,127.2226,"United States","South Korea","Camp Yongin"," Yongin ","Army","Operator Only","1960","","","","Camp Yongin was closed in 2004 and returned to the Republic of Korea. The facility became the headquarters for the Third Republic of Korea Army, with CSCT-3 remaining as a tenant unit. The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.013,127.8951,"United States","South Korea","Chong Ju Support Annex","Chungju","Army","Operator Only","1960","","","","The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[36.1228,128.099,"United States","South Korea","DRMO APO"," Kimchon ","Army","Operator Only","1960","","","","DRMO APO is an Army Active base in South Korea. The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[36.9663,127.0312,"United States","South Korea","Far East Dist Engr"," Seoul ","Army","Operator Only","1960","","","","The Far East District (FED) is an engineering and construction agency of the U.S. Army Corps of Engineers in Korea.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.15,128.6667,"United States","South Korea","Fleet Activities Chinhae"," Chinhae ","Navy","Operator Only","1972","","","","The United States Navy fully operates fleet Activities Chinhae. It is located near Busan and is one of two U.S. naval bases in mainland South Korea along with Busan Naval Base.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.9142,127.0717,"United States","South Korea","Gun Training Area"," Tong Du Chon ","Army","Operator Only","1950","","","","The Gimbols Gun Training Area is a US Army training range, consisting of 195 acres of land. The facility was listed in the 2023 report simply as \"Gun Training Area.\"","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.0503,126.6881,"United States","South Korea","H220 Heliport"," Tongdu-ch'on ","Army","Operator Only","1950","","","","The H220 Heliport is a United States Army installation in South Korea that was turned over to the ROK in May 2022. The heliport was attached to Camp Mobile. The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[36.966,127.0374,"United States","South Korea","Icheon Sockor","Ichon","Army","Operator Only","1952","","","","Special Operations Command Korea (SOCKOR) is located in Icheon, Gyeonggi Province, South Korea. SOCKOR is responsible for the command and control of U.S. Special Operations Forces (SOF) in Korea. SOCKOR's headquarters are located at Camp Humphreys in Pyeongtaek.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.4458,127.1139,"United States","South Korea","K-16 Air Base","Songnam","Army","Co-base","1951","","","","K-16 Air Base, also known as Seoul Air Base. The base is operated by the Korean Air Force and is home to the 52nd Aviation Regiment and the 1st Battalion of the United States Army. Other occupants include the 501st Corps support group and the 595th Maintenance company.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.9424,126.9702,"United States","South Korea","Kamaksan ASA","ong Du Chon","Army","Operator Only","1950","","","","The Kamaksan ASA facility was a small radio relay facility on top of Mount Kamaksan near Tong Du Chon, consisting of 5 buildings on 48 acres. The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.19,128.93,"United States","South Korea","Kimhae Storage Annex","Kimhae","Air Force","Operator Only","1950","","","","The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.5417,126.6939,"United States","South Korea","Koryosan ASA","Inchon","Army","Operator Only","1950","","","","Koryosan ASA is a remote site in a mountainous area surrounded by forests. It is located in Inchon, South Korea. Koryosan ASA is listed in a Department of Defense Hazardous Waste Site Remediation document. The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.9036,126.6158,"United States","South Korea","Kunsan Air Base","Kimhae","Air Force","Operator Only","1950","","","","Kunsan Air Base falls under the command of the United States Air Force. This base is the home of the 8th Fighter Wing, \"The Wolf Pack,\" assigned to the Pacific Air Forces Seventh Air Force and the 38th Fighter Group of the Republic of Korea Air Force.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.9288,126.5881,"United States","South Korea","Kunsan POL Terminal Site","Kunsan","Army","Operator Only","1950","","","","The Kunsan POL Terminal Site is a United States Army installation in South Korea. This site is used by the United States Army to work with 8th Logistics Readiness Squadron petroleum, oil, and lubricants flight (POL) technicians.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.1768,126.7719,"United States","South Korea","Kwang-Ju Air Base","Kwangju","Air Force","Operator Only","1968","","","","This base was an active-duty US Air Force base until the ownership of it was turned over to the Republic of Korea in 1991. The US Air Force continued to maintain nearly 250 acres of the base. Kawngju Air Base was not included in the original 2002 agreement or the 2004 amendments, but continued to be a US Air Force-maintained facility. In 2023, the 8th Fighter Wing F-16s and the U.S. Air Force 25th Fighter Squadron conducted flight operations at the base.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.4875,126.5146,"United States","South Korea","Madison Site","Inchon","Army","Operator Only","1950","","","","Madison Site consists of a lower base camp with a dining facility and barracks and an upper site with antennas and microwave relays.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.2252,128.6311,"United States","South Korea","Masan Ammunition Depot","Masan","Army","Operator Only","None","","","","The Masan Ammunition Depot is a United States Army installation in South Korea. It's located in Area IV, about 35 miles west of Pusan. This base is used by a combined US-ROK Air Force training squadron.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.0906,127.0297,"United States","South Korea","Osan Air Force Base","Gyeonggi-do","Air Force","Operator Only","1953","","","","The 51st Fighter Wing is the main unit hosted on site at Osan Air Base. It has four groups and more than 20 squadrons. The base also hosts the 7th Air Force and around 10 associate units and base agencies.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.1035,129.0395,"United States","South Korea","Osan Ni Ammunition Storage Annex","Gyeonggi-do","Air Force","Operator Only","None","","","","The Osan Ni Ammunition Storage Annex is an active US Air Force ammunition storage facility located at Pier #8, Kanman-Tong.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.1958,127.0571,"United States","South Korea","Osan Site 2","Gyeonggi-do","Air Force","Operator Only","1951","","","","The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.1669,127.0389,"United States","South Korea","Osan Site 3","Gyeonggi-do","Air Force","Operator Only","1951","","","","The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.8551,127.4849,"United States","South Korea","Pil-Sung Air Range","Gyeonggi-do","Air Force","Operator Only","None","","","","Pil-Sung Air Range is a bombing range in the Republic of Korea that is operated jointly by the South Korean and U.S. Air Forces.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[36.03,129.37,"United States","South Korea","Pohang","Pohang","Navy","Operator Only","None","","","","The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.1875,129.098,"United States","South Korea","Pusan","Pusan","Navy","Operator Only","None","","","","The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.1324,129.0625,"United States","South Korea","Pusan Storage Facility","Pusan","Army","Operator Only","None","","","","The Busan Storage Center, previously the Pusan Storage Facility. The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[36.98,127.1,"United States","South Korea","Pyongtaek Cpx Area","Pyong Taek","Army","Operator Only","None","","","","The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.6269,129.443,"United States","South Korea","ROK Navy Base","Chinhae","Navy","Operator Only","None","","","","The Republic of Korea Navy has several naval bases in South Korea, including Busan Naval Base, Jinhae, Jeju Island, etc. However, it is not clearly stated which navy base on the Bases Structure Report 2023","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.8956,126.6487,"United States","South Korea","Shinbuk Relay","Camp Casey","Army","Operator Only","None","","","","Shinbuk Relay is a small radio relay station near Pochon. It consists of two buildings on 13 acres. The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.44,127.15,"United States","South Korea","Sungnam Golf Course","Songnam","Army","Operator Only","None","","","","Sung Nam Golf Club is a 230-acre, 18-hole championship golf course in Sung Nam, Korea. It serves the US Army.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.2356,127.0094,"United States","South Korea","Suwon Air Base","Suwon","Air Force","Co-base","None","","","","This base is a Republic of Korea Air Force base and is used by United States Air Force units.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.9002,128.6498,"United States","South Korea","Taegu Air Base","Taegu","Air Force","Operator Only","None","","","","Taegu Air Base is referred to as K-2. This base shared space with the commercial Taegu City Airport.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.9078,128.4643,"United States","South Korea","Taegu Storage Area","Taegu","Army","Operator Only","None","","","","The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.44,127.15,"United States","South Korea","Tango","Songnam","Army","Operator Only","None","","","","The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[36.2535,127.4849,"United States","South Korea","Watkins Range","Tong Du Chon","Army","Operator Only","None","","","","Watkins Range is a US base in South Korea that is located about 2 kilometers northwest of Uncheon Base Camp. The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[36.6319,128.355,"United States","South Korea","Yechon (Yecheon) Air Base","Yechon","Navy","Operator Only","1981","","","","Yechon Air Base, also referred to as K-58. Yechon Air Base, though primarily a Republic of Korea Air Force facility, also hosts US Marine Corps squadrons as part of their WESTPAC rotation. Units rotating through often patricipate in various exercises during their stay. Yechon also served as the storage point for USMC aircraft War Reserve Munitions, which would provide prepositioned stockpiles in the event of a conflict on the peninsula.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[36.6292,128.3687,"United States","South Korea","Yechon Site","Yechon","Marine Corps","Operator Only","None","","","","The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.56,126.99,"United States","South Korea","Yongsan Garrison, Army","Seoul","Army","Operator Only","None","","","","Yongsan Garrison is a U.S. Army base in the heart of Seoul, South Korea.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.0884,129.0662,"United States","South Korea","Busan Naval Base","Busan","Navy","Co-base","2007","","","","Busan Naval Base serves as a key port for both the Republic of Korea Navy and visiting U.S. naval vessels. It can accommodate up to 30 ships, including large vessels like the Sejong the Great-class destroyers. In March 2025, the U.S. aircraft carrier USS Carl Vinson made a port visit to Busan.","https://news.usni.org/2025/03/03/uss-carl-vinson-makes-south-korea-port-visit?"],[35.1794,128.9383,"United States","South Korea","Gimhae Air Base","Gimhae","Army","Co-base","None","","","","Gimhae Air Base, adjacent to Gimhae International Airport, is operated by the Republic of Korea Air Force (ROKAF). It supports both military and civilian aviation activities. In June 2024, U.S. Air Force and ROKAF personnel conducted joint airdrop training exercises at the base.","https://www.hill.af.mil/News/Article-Display/Article/3825564/us-rokaf-conduct-training-to-enhance-tactical-airlift-capabilities/"],[37.5318,126.9816,"United States","South Korea","Dragon Hill Lodge","Seoul","Army","Operator Only","1990","","","","Dragon Hill Lodge (DHL) is a resort-style hotel in Seoul, South Korea. It's one of four Armed Forces Recreation Centers (AFRCs) around the world. The lodge is part of the US Army Garrison Yongsan and is used by members of the U.S. military community.","https://www.dragonhilllodge.com/#:~:text=Getting%20Here,access%20to%20enter%20USAG%20Yongsan."],[35.8488,128.594,"United States","South Korea","Camp George","Daegu","Army","Operator Only","None","","","","Camp George is located in the US Army Garrison Daegu, which is one of the largest military facilities in South Korea. The base is home to four other camps: Camp Walker, Camp Henry, and Camp Carroll.","https://www.militarytimes.com/news/your-military/2018/06/20/why-women-were-told-dont-get-pregnant-at-george-air-force-base/"],[37.4781,126.4068,"United States","South Korea","Incheon Joint Military Mail Terminal","Inchon","Army","Co-base","None","","","","The Joint Military Mail Terminal at Incheon International Airport is a facility that handles mail for U.S. military personnel stationed in South Korea. Opened to improve mail delivery efficiency, it replaced an older facility at Gimpo Airport.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.9587,126.6802,"United States","South Korea","Swiss And Swed Camp Mac Hq","Munsan","Army","Co-base","None","","","","The Swiss and Swedish Camp near Panmunjom houses members of the Neutral Nations Supervisory Commission (NNSC). Established after the Korean War, the NNSC monitors the armistice agreement between North and South Korea. Swiss and Swedish officers are stationed south of the Demarcation Line in Panmunjeom, maintaining a channel of communication between the two Koreas.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.1375,129.0405,"United States","South Korea","Busan Storage Center","Pusan","Army","Operator Only","None","","","","The Busan Storage Center is a logistics facility operated by the U.S. Army Materiel Support Command-Korea. It provides storage and distribution services for military equipment and supplies. In October 2024, a fire broke out in a warehouse under renovation at the center. The blaze was extinguished after 13 hours, and no injuries were reported.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.9703,126.6641,"United States","South Korea","Panmunjom Jsa Mac Hq","Paju","Army","Co-base","None","","","","The Joint Security Area (JSA) at Panmunjom is the only portion of the Korean Demilitarized Zone where North and South Korean forces stand face-to-face. It is used for diplomatic engagements and was previously the site of military negotiations between North Korea and the United Nations Command. The Military Armistice Commission (MAC) Headquarters is located within the JSA, overseeing the implementation of the armistice agreement.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[36.1561,128.2575,"United States","South Korea","Kimchon Disposition Center","Kimchon","Army","Operator Only","None","","","","The Gimcheon Disposition Center is managed by the Defense Logistics Agency (DLA) Disposition Services. It handles the disposal of excess and obsolete military property, including hazardous materials.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.1302,129.0363,"United States","South Korea","Daegu Storage Area","Taegu","Army","Operator Only","None","","","","The Daegu Storage Area is part of USAG Daegu's logistics operations, providing storage and distribution support for military units in the region.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[33.228,126.484,"United States","South Korea","Jeju Naval Base","Jeju Island","Navy","Co-base","None","","","","Under the guise of a South Korean installation, the Jeju Naval Base is in fact a U.S.-backed military project enabled by the U.S.–South Korea Status of Forces Agreement (SOFA), which allows the U.S. to control South Korean facilities when needed. This arrangement obscures direct U.S. responsibility while embedding its military presence in Asia’s strategic zones. The adjacent “cruise ship” dock—unused for tourism—was likely built to secretly accommodate U.S. aircraft carriers, exemplifying how local autonomy and environmental heritage were sacrificed for U.S. militaristic expansion.","https://www.koreanquarterly.org/tag/naval-base-in-jeju/"],[37.1229,128.9485,"United States","South Korea","Pil-Sung Air Range","Gangwon","Army","Co-base","None","","","","This is a joint U.S. Air Force / Republic of Korea Air Force (ROKAF) live-fire / training range located in Gangwon Province, South Korea. It is used for munitions delivery, close air support, and combined U.S.–Korea air exercises.","https://www.globalsecurity.org/military/facility/pilsung.htm?"],[37.0906,127.0297,"United States","South Korea","Osan Air Base","Pyeongtaek","Air Force","Co-base","None","","","","Osan Air Base is a joint Air Force facility located near Songtan. Osan is the first permanently forward-based U.S. wing in the region (i.e. it has continuous fighter presence), with aircraft such as F-16s and A-10s historically assigned.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[6.3215,-10.8153,"United States","Liberia","Monrovia","Monrovia","Army","Co-base","None","","","","The United States has established bases in Liberia at the request of the Liberian government. In 2003, U.S. Secretary of Defense Donald Rumsfeld approved the deployment of U.S. forces.","https://www.thenation.com/article/archive/secret-us-military-documents-reveal-a-constellation-of-american-military-bases-across-africa/"],[56.7696,24.8482,"United States","Latvia","Fire Station at Lielvarde Air Base","Vidzeme","Air Force","Co-base","None","","","","In 2022, the US and Latvian governments unveiled a new fire station at the base that was funded by the US.","https://www.army.mil/article/42974/u_s_army_corps_of_engineers_to_improve_fire_stations_in_latvia"],[56.7783,24.8533,"United States","Latvia","Lielvarde Air Base","Vidzeme","Air Force","Co-base","2018","","NATO","","Lielvārde Air Base, situated in Rembate Parish, Ogre Municipality, is Latvia's primary military airfield. Originally constructed in 1969 for Soviet air operations, it was transferred to Latvian control in 1994. Subsequent modernization efforts have transformed it into a key NATO facility in the Baltic region. In March 2024, Lielvārde was designated as the third NATO base to host Allied fighter detachments for the Baltic Air Policing mission.","https://www.mod.gov.lv/en/news/secretary-united-states-air-force-visits-air-force-base-lielvarde"],[57.0958,24.3623,"United States","Latvia","Adazi military base","Adazi","Air Force","Co-base","None","","NATO","","Ādaži Military Base, located near Riga, serves as the headquarters for NATO's Enhanced Forward Presence (eFP) battlegroup in Latvia. Led by Canada, this multinational unit includes contributions from several NATO allies, including the United States .","https://www.reuters.com/article/business/aerospace-defense/40-us-troops-arrive-in-latvia-with-more-to-come-idUSS8N2L804O/"],[55.8939,23.3947,"United States","Lithuania","Siauliai Air Base","Unknown","Air Force","Co-base","None","","NATO","","Šiauliai Air Base is a key Lithuanian Air Force installation that also hosts NATO's Baltic Air Policing mission. The U.S. and other NATO allies regularly deploy aircraft and personnel to the base to ensure the security of Baltic airspace. Recent deployments include NATO AWACS aircraft to support.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.544,5.9187,"United States","Luxembourg","Warehouse Service Agency","Sanem","Air Force","Co-base","2018","","NATO","","The Warehouses Service Agency (WSA), established in 1979 in Sanem, Luxembourg, is a pivotal logistics hub supporting U.S. and NATO military operations. It provides warehousing, maintenance, and logistical services for military equipment under bilateral agreements. In 2023, a $100 million expansion was initiated to enhance its capacity, reinforcing NATO's collective defense posture.","https://www.army.mil/article/270962/u_s_and_luxembourg_officials_break_ground_on_100m_deployable_air_base_system_support_and_storage_facilities_project"],[9.2868,167.5378,"United States","Marshall Islands","Gagan Island","Kwajalein Atoll","Army","Operator Only","1944","","","","Gagan Island is a launch site for ballistic missile tests at the Ronald Reagan Ballistic Missile Defense Test Site. The test site is located at the U.S. Army Garrison-Kwajalein Atoll in the Republic of the Marshall Islands.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[9.0858,167.4731,"United States","Marshall Islands","Illeginni Island","Kwajalein Atoll","Army","Operator Only","1944","","","","Illeginni was the site of a Sprint missile launcher during the 1960s, part of the Nike-X anti-ballistic missile program. A number of automated tracking cameras were installed as part of the Safeguard program, and one of these remains in use today to support overall operations of the Ronald Reagan Ballistic Missile Defense Test Site.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[9.1219,167.6021,"United States","Marshall Islands","Legan Island","Kwajalein Atoll","Army","Operator Only","1944","","","","The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[9.0016,167.7266,"United States","Marshall Islands","Meck Island","Kwajalein Atoll","Army","Operator Only","1944","","","","Meck is part of the Ronald Reagan Ballistic Missile Defense Test Site, and a launch site for anti-ballistic missiles and launch vehicles is based there.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[9.3961,167.4758,"United States","Marshall Islands","Roi-Namur Island","Kwajalein Atoll","Army","Operator Only","1944","","","","The island of Roi-Namur in the Marshall Islands is home to a US military base. Today it is a major part of the Ronald Reagan Ballistic Missile Defense Test Site, hosting several radar systems used for tracking and characterizing missile reentry vehicles (RV) and their penetration aids (penaids).","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[8.7167,167.7333,"United States","Marshall Islands","US Army Kwajalein Atoll","Kwajalein Atoll","Army","Operator Only","1944","","","","The U.S. Army Garrison–Kwajalein Atoll (USAG-KA) is a community of military personnel, government civilians, contractors, and their families. The USAG-KA is home to the Ronald Reagan Ballistic Missile Defense Test Site.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[8.72,167.7317,"United States","Marshall Islands","Bucholz Army Airfield","Kwajalein Atoll","Army","Operator Only","1944","","","","Bucholz Army Airfield is situated on Kwajalein Island within the Kwajalein Atoll, Marshall Islands. Today, it serves both military and limited civilian operations, functioning as a critical node for missile testing and space operations under the U.S. Army Garrison-Kwajalein Atoll. It is used for refueling during trans-Pacific flights, and the airport is available to civilians through Air Marshall Islands and United Airlines.","https://www.angelfire.com/hi2/kwa/0avi_kwa.html"],[9.3969,167.4708,"United States","Marshall Islands","Dyess Army Airfield","Kwajalein Atoll","Army","Operator Only","1944","","","","Dyess Army Airfield is located on Roi-Namur Island, at the northern tip of the Kwajalein Atoll. The airfield features a single paved runway and supports operations related to the Ronald Reagan Ballistic Missile Defense Test Site. Approximately 60 U.S. personnel are stationed on Roi-Namur, with additional staff commuting from Kwajalein Island.","https://www.dyess.af.mil/"],[9.0479,167.743,"United States","Marshall Islands","Omelek Island","Kwajalein Atoll","Army","Operator Only","1944","","","","Omelek Island is part of the Kwajalein Atoll in the Republic of the Marshall Islands. It is controlled by the United States military under a long-term lease (along with ten other islands in the atoll) and is part of the Ronald Reagan Ballistic Missile Defense Test Site.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[8.7985,167.6179,"United States","Marshall Islands","Ennylabegan Island","Kwajalein Atoll","Army","Operator Only","1944","","","","Ennylabegan Island, also known as Carlos by the U.S. military, hosted a tracking and telemetry station for the U.S. Army's anti-ballistic missile test facility at Kwajalein.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[9.1004,167.7272,"United States","Marshall Islands","Gellinam Island","Kwajalein Atoll","Army","Operator Only","1944","","","","Gellinam Island is part of the U.S.-leased Kwajalein Atoll in the Marshall Islands. It functions as a telemetry and radar site within the Ronald Reagan Ballistic Missile Defense Test Site, supporting missile tracking and space operations.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[11.5438,162.3515,"United States","Marshall Islands","Eniwetak Island","Kwajalein Atoll","Army","Operator Only","1944","","","","Enewetak Island, located in Enewetak Atoll, was a major U.S. nuclear test site from 1948 to 1958, hosting 43 nuclear tests, including the first hydrogen bomb test, \"Ivy Mike,\" in 1952. The extensive testing led to significant radioactive contamination. A cleanup operation from 1977 to 1980 involved constructing the Runit Dome to contain radioactive debris. Despite these efforts, concerns about residual contamination persist. This base is listed in the DoD report of 2025.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.9489,5.9722,"United States","Netherlands","Brunssum Support Site","Brunssum","Army","Operator Only","1967","","NATO","","The Brunssum Support Site, officially known as U.S. Army Garrison (USAG) Benelux-Brunssum, provides base operations support to U.S. and NATO personnel in the region. It offers services such as housing, logistics, and community programs. The garrison supports joint and inter-agency communities.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.9,6.05,"United States","Netherlands","Eygelshoven Army Depot","Eygelshoven","Army","Operator Only","2016","","","","The Eygelshoven Army Depot is an Army Prepositioned Stock (APS) depot of the U.S. Army Europe. The depot is located in Eygelshoven, the Netherlands. The U.S. Army acquired the depot in 2016 and turned it into an APS-2 site and the headquarters for the AFSBn-Benelux.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.9389,5.9669,"United States","Netherlands","Hendrik Mine","Brunssum","Army","Co-base","1967","","NATO","","The former Hendrik coal mine in Brunssum was repurposed in 1967 to house NATO's Allied Forces Central Europe (AFCENT) headquarters. Now known as Camp Hendrik, it serves as the main base area for Allied Joint Force Command (JFC) Brunssum. The site includes various facilities such as a tax-free shop, theater, and sports amenities.","https://www.nato.int/cps/en/natohq/declassified_162354.htm"],[50.95,5.8833,"United States","Netherlands","Schinnen Emma Mine","Schinnen","Army","Co-base","1969","","","","The Emma Mine Complex in Schinnen was utilized by the U.S. Army starting in 1969, establishing a presence on Shaft IV of the former coal mine. USAG Schinnen provided support services to U.S. military personnel in the region. In 2012, the garrison was integrated into USAG Benelux, and operations were gradually transitioned to the Brunssum site.","https://brill.com/view/journals/hcm/7/1/article-p653_31.pdf"],[51.6572,5.6908,"United States","Netherlands","Volkel Air Base","Volkel","Air Force","Co-base","1940","Nuclear weapons","","","Volkel Air Base is a military airbase used by the Royal Netherlands Air Force. It is believed that since the early 1960s, USAF nuclear weapons have been stored at Volkel Air Base, to be used by the host nation's aircraft. Formerly, storage took place in a weapon storage area on the north side of the base.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.9384,5.9787,"United States","Netherlands","Brunssum JFC","Brunssum","Army","Co-base","None","","","","Allied Joint Force Command (JFC) Brunssum is one of NATO's three operational-level commands, responsible for planning and executing military operations to deter and defend against threats in northern Europe. The headquarters is situated at Camp Hendrik in Brunssum.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[15.1833,145.75,"United States","N. Mariana Islands","9th RRC - Saipan","Saipan Island","Army Reserve","Operator Only","1944","","","","The 9th Mission Support Command (9th MSC) is a United States Army Reserve unit that provides trained and ready forces to overseas contingency operations.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[15.2165,145.7195,"United States","N. Mariana Islands","American Memorial Park","Saipan Island","Navy","Operator Only","1995","","","","The American Memorial Park is a memorial park on the island of Saipan in the Northern Mariana Islands. It was established on August 18, 1978, and is managed by the National Park Service.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[14.9992,145.6194,"United States","N. Mariana Islands","Tinian International Airport","Tinian","Air Force","Operator Only","2023","","","","Tinian International Airport, also known as West Field, is a public airport located on Tinian Island. In 2019, the Commonwealth of the Northern Mariana Islands and the U.S. DoD signed an agreement to operate a divert airfield at the airport, providing an alternative landing site in case Andersen Air Force Base on Guam is unavailable. In March 2023, U.S. Air Force F-22 Raptors deployed to Tinian for the first time as part of exercise Agile Reaper 21-1.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[15.0539,145.6043,"United States","N. Mariana Islands","Area B","Tinian","Navy","Operator Only","None","","","","Area B is a military base in Tinian, according to the FY 2025 Baseline Data.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[15.0317,145.6476,"United States","N. Mariana Islands","Area D","Tinian","Navy","Operator Only","None","","","","Area D is a military base in Tinian that is active and operated by the Navy. Area D includes buildings 1335, 1337, 1339, and 1341.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[14.9578,145.6503,"United States","N. Mariana Islands","Area F","Tinian","Navy","Operator Only","None","","","","Area F is a military base in Tinian, according to the FY 2025 Baseline Data.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[14.9727,145.6257,"United States","N. Mariana Islands","Area TC","Tinian","Navy","Training Base","None","","","","Area TC is a Navy Active military base in Tinian, according to the 2025 baseline data report. A base camp near the Tinian Airport supports training in an urban area.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[16.0172,146.0586,"United States","N. Mariana Islands","Farrallon De Medinilla","Saipan Island","Navy","Operator Only","1977","","","","Farallon de Medinilla (FDM) is a bombing range and military exercise site for the U.S. Navy.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[15.2178,145.7278,"United States","N. Mariana Islands","NAVBASE Guam Saipan","Saipan Island","Navy","Operator Only","1944","","","","The US Naval Advanced Base Saipan is located on the island of Saipan, which is 12 miles long and 5 miles wide. While the original base was decommissioned in 1962, the U.S. Navy maintains a presence on Saipan, providing support for regional operations. This includes coordination with local authorities and participation in joint exercises.","https://jrm.cnic.navy.mil/Installations/NAVBASE-Guam/"],[15.0,145.6333,"United States","N. Mariana Islands","NAVBASE Guam Tinian","Tinian","Navy","Operator Only","1944","","","","The Tinian Naval Base and Naval Air Facility Tinian (NAF Tinian) is a major United States Navy base on Tinian Island.","https://www.eurasiantimes.com/why-is-the-us-developing-a-new-airbase-right-next-to-its-biggest-military-base-in-the-indo-pacific/#:~:text=With%20its%20eyes%20on%20China,about%20200%20km%20from%20Guam.&text=Tinian%20is%20one%20of%20the,disaster%20responses%20in%20the%20region.%E2%80%9D"],[14.1536,145.2031,"United States","N. Mariana Islands","Naval Station Rota","Rota","Navy","Co-base","1945","","","","There is a US Naval Base on Rota Island in the Northern Mariana Islands. The Northern Mariana Islands is a self-governing commonwealth in association with the United States. Rota is the southernmost island in the Northern Mariana Islands.","https://cnreurafcent.cnic.navy.mil/Installations/NAVSTA-Rota/"],[58.9066,5.7238,"United States","Norway","Stavanger Admin Office","Stavanger","Air Force","Co-base","1991","","NATO","","This base is located in Stavanger, the Jåttå Military Compound houses the 426th Air Base Squadron, serving as the U.S. National Support Element for NATO's Joint Warfare Centre. This facility provides base-level support to approximately 260 U.S. military and civilian personnel and their dependents.","https://www.501csw.usafe.af.mil/Pathfinder-Portal/Stavanger-AB/"],[58.9052,5.7223,"United States","Norway","Stavanger Air Base","Stavanger","Air Force","Co-base","1994","","NATO","","Stavanger Air Base in Norway is home to the 426th Air Base Squadron (ABS). The 426th ABS is the U.S. National Support Element for the NATO Joint Warfare Centre (JWC). The 426th ABS provides base-level support to approximately 260 U.S. military and civilian personnel and dependents.","https://www.501csw.usafe.af.mil/Units/423d-ABG/426th-ABS/"],[59.3789,10.7856,"United States","Norway","Rygge Air Force Base","Viken","Air Force","Co-base","2018","","NATO","","This base is operating by the Royal Norwegian Air Force. In 2021, Norway and the United States (US) signed the Supplementary Defence Cooperation Agreement, which lays down details on rules governing the American military’s activities in Norway. The deal allows U.S. authorities to build military infrastructure at Rygge air base for fighter jets. It supports NATO operations in the region.","https://thedefensepost.com/2024/06/21/us-european-deterrence-initiative-construction-norway/"],[58.8767,5.6378,"United States","Norway","Sola Air Base","Stavanger","Air Force","Co-base","1994","","","","This base is a base for the Royal Norwegian Air Force. In 2021, Norway and the United States (US) signed the Supplementary Defence Cooperation Agreement, which lays down details on rules governing the American military’s activities in Norway. The deal allows the US to use Sola base for in-flight refuelling.","https://peoplesdispatch.org/2022/06/07/progressives-slam-us-norway-additional-agreement-on-military-bases/"],[68.4889,16.6783,"United States","Norway","Evenes Air Station","Evenes","Air Force","Co-base","2021","","NATO","","This base is a military airbase of the Royal Norwegian Air Force. The US gained the right to unimpeded access to and use of four \"agreed areas\" (military bases) in Norway, two of which are located in the north: Evenes Air Station and Ramsund Naval Base. Evenes also serves as a hub for NATO operations and joint exercises in the Arctic region.","https://www.highnorthnews.com/en/new-agreement-gives-us-access-four-new-military-areas-north"],[68.4936,16.5103,"United States","Norway","Ramsund naval station","Ramsund","Navy","Co-base","2023","","","","The US has an agreement that gives it unimpeded access to four military bases on Norwegian soil, including Ramsund and Evenes. In March 2023, the Navy Seabees partnered with the Norwegian Defense Estates Agency at Ramsund Naval Base.","https://www.highnorthnews.com/en/new-agreement-gives-us-access-four-new-military-areas-north"],[63.4575,10.9242,"United States","Norway","Værnes Air Station","Stjørdal ","Air Force","Co-base","1991","","","","Værnes Air Station is a storage base for the United States armed forces. It's part of the Marine Corps Prepositioning Program-Norway, an agreement between Norway and the US that has been in place since the Cold War. The base stores equipment and has barracks that can house up to 1,200 people.","https://www.highnorthnews.com/en/new-agreement-gives-us-access-four-new-military-areas-north"],[63.6989,9.604,"United States","Norway","Ørland Main Air Station","Ørland","Air Force","Co-base","2021","","NATO","","Ørland Main Air Station is a remote air base located on the west coast of Norway. It's operated by the Royal Norwegian Air Force and is a key base for both Norway and NATO. The base is home to F-35A Lightning II and F-16 Fighting Falcon fighter jets, Westland Sea King search and rescue helicopters, and E-3A Sentry AWACS.","https://www.highnorthnews.com/en/new-agreement-gives-us-access-four-new-military-areas-north"],[69.5309,19.0125,"United States","Norway","Olavsvern Naval Base","Tromsø.","Navy","Co-base","1991","","","","Olavsvern Naval Base, near Tromsø, was decommissioned in 2009 but has since been repurposed for military and civilian use. It is a former Royal Norwegian Navy base in northern Norway that the US Navy may use to house submarines. The base is located under a hill next to the Norwegian Sea and has a large entrance that can accommodate ships and submarines.","https://www.bbc.com/future/article/20250328-why-norway-is-restoring-its-cold-war-military-bunkers"],[69.2925,16.1442,"United States","Norway","Andøya Air Station","Andøya ","Air Force","Co-base","2024","","","","Andøya Air Station was previously home to the Royal Norwegian Air Force's 333 Squadron, operating P-3 Orion maritime patrol aircraft. In 2016, a decision was made to close the base; however, this was reversed in 2024, and the station is now being reconstituted as a base for long-range drones and allied reception. The air station is also included in the updated U.S.-Norway Supplementary Defense Cooperation Agreement (SDCA), allowing U.S. access to the facility.","https://www.highnorthnews.com/en/new-agreement-gives-us-access-four-new-military-areas-north"],[68.8797,18.3729,"United States","Norway","Setermoen Garrison (including firing range and exercise area)","","Navy","Co-base","2024","","","","Setermoen Garrison, located in Bardu Municipality, is Norway’s largest army base and a central site for Arctic warfare training. The U.S. Marine Corps regularly conducts cold-weather exercises here, collaborating with Norwegian forces. Exercises such as Joint Viking 25 have involved thousands of U.S. and NATO troops, focusing on operations in extreme Arctic conditions.","https://www.highnorthnews.com/en/new-agreement-gives-us-access-four-new-military-areas-north"],[68.493,16.6843,"United States","Norway","Osmarka Mountain Facility (near Evenes Air Station)","Evenes","Navy","Co-base","2024","","","","The Osmarka Mountain Facility, located near Evenes Air Station in Nordland county, was originally constructed as a mobile hospital using NATO infrastructure funds. In 1991, the facility was moved to Kuwait by the U.S. Navy prior to the Gulf War. As of 2024, the facility is included in the U.S.-Norway SDCA, allowing U.S. access for military purposes.","https://www.highnorthnews.com/en/new-agreement-gives-us-access-four-new-military-areas-north"],[60.3381,5.2228,"United States","Norway","Haakonsvern Naval Station"," Nordic","Navy","Co-base","2024","","","","Haakonsvern Naval Station serves as Norway’s principal naval base and is the largest in the Nordic region. Under the SDCA, the United States has been granted access to this facility, allowing for participation in joint maritime operations. The base includes extensive repair and maintenance facilities, including an underground dock capable of accommodating frigates. Recent infrastructure developments have been undertaken to support advanced submarine programs, such as the German-Norwegian 212CD class.","https://www.highnorthnews.com/en/new-agreement-gives-us-access-four-new-military-areas-north"],[-43.4861,172.5389,"United States","New Zealand","Christchurch International Airport","","Air Force","Co-base","1955","","","","The United States maintains an ongoing military foothold at Christchurch International Airport, using it as a logistics hub for U.S. Air Force operations beyond its own territory. The facility enables the rotation of U.S. military personnel, aircraft, and strategic cargo, embedding foreign military infrastructure within New Zealand. Although framed as support for Antarctic missions, the site strengthens U.S. global military mobility and projection capabilities.","https://www.converge.org.nz/abc/press_release_files/press-release-2017-04-24.html"],[-41.576,173.739,"United States","New Zealand","Waihopai Station","","Unknown","Co-base","2010","","","","The Waihopai base hosted the NSA’s APPARITION system, a U.S.-owned and controlled surveillance capability used for “Directed Target Development.” It intercepted VSAT satellite communications and combined ground station data with overhead spy satellites to geolocate targets with high precision. According to internal NSA reports, the system supported capture-kill operations involving drones, bombs, and special forces raids. Tasking requests were scheduled through U.S. mission planning channels, indicating the base functioned as part of a broader U.S. global targeting network.","https://www.converge.org.nz/watchdog/66/11.html"],[-40.315,175.2498,"United States","New Zealand","Tangimoana Station","","Unknown","Co-base","None","","","","Tangimoana Station is a signals-intelligence (SIGINT) facility operated by New Zealand’s Government Communications Security Bureau. It operates within the Five Eyes intelligence alliance, led by the U.S. National Security Agency (NSA). Intelligence collected at the station is shared through the Five Eyes network and can be accessed and used by the NSA to support U.S. intelligence assessments and operational planning.","https://www.theguardian.com/us-news/2015/mar/05/new-zealand-spying-on-pacific-allies-for-five-eyes-and-nsa-snowden-files-show?utm_source=chatgpt.com"],[18.1357,-15.924,"United States","Mauritania","Nema","Nema","Unknown","Co-base","None","","","","According to secret documents revealed in 2017, some of AFRICOM’s CL inventory, including Nema in Mauritania, has been disclosed. Since then, there have been no updates regarding the funding and usage of this site.","https://www.thenation.com/article/archive/secret-us-military-documents-reveal-a-constellation-of-american-military-bases-across-africa/"],[17.8794,-13.1598,"United States","Mauritania","Ouassane","Ouassane","Unknown","Co-base","None","","","","According to secret documents revealed in 2017, some of AFRICOM’s CL inventory, including Ouassa in Mauritania, has been disclosed. Since then, there have been no updates regarding the funding and usage of this site.","https://www.thenation.com/article/archive/secret-us-military-documents-reveal-a-constellation-of-american-military-bases-across-africa/"],[12.6185,-7.9935,"United States","Mali","Bamako","Bamako","Unknown","Co-base","2013","","","","According to secret documents revealed in 2017, some of AFRICOM’s CL inventory, including Bamako in Mali, has been disclosed. Since then, there have been no updates regarding the funding and usage of this site.","https://www.thenation.com/article/archive/secret-us-military-documents-reveal-a-constellation-of-american-military-bases-across-africa/"],[16.2588,-0.0222,"United States","Mali","Gao","Gao","Unknown","Co-base","None","","","","According to secret documents revealed in 2017, some of AFRICOM’s CL inventory, including Gao in Mali, has been disclosed. Since then, there have been no updates regarding the funding and usage of this site.","https://www.thenation.com/article/archive/secret-us-military-documents-reveal-a-constellation-of-american-military-bases-across-africa/"],[16.9516,8.0153,"United States","Niger","CSL Agadez","Agadez","Air Force","Co-base","None","","","","As of 2025, Air Base 201 in Agadez, Niger, is no longer an active U.S. military installation. The United States completed its withdrawal from the base on August 5, 2024, following a directive from Niger's ruling junta, which came into power after a coup in 2023. However, this base is listed in the DoD report as an active US bases in Niger.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[64.4972,11.149,"United States","Norway","Namsen Fuel Terminal, Statland","Statland","Navy","Co-base","2024","","","","Located in Trøndelag county, the Namsen Fuel Terminal has been evaluated for its capacity to support maritime refueling operations in the High North. In March 2023, the U.S. Navy's Military Sealift Command conducted a proof-of-concept operation at the terminal, validating its viability for logistics support. The terminal's inclusion in the SDCA allows for expanded U.S. access to Norwegian logistical infrastructure.","https://www.highnorthnews.com/en/new-agreement-gives-us-access-four-new-military-areas-north"],[18.3246,56.1962,"United States","Oman","Masirah Island Mpt Site 1","Muscat","Air Force","Operator Only","1981","","","","The island base is located 15 miles off the coast of Oman. It originally belonged to the Royal Air Force before it was taken over by the United States in 1980 in an agreement with Oman. The U.S. Air Force built up the facilities, and the base became crucial during Operation Desert Shield in 1990.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[23.6414,57.4903,"United States","Oman","Al-Musannah Air Base","","Air Force","Co-base","2005","","","","U.S. Presence in Oman is based on the \"Mutual Access\" agreement, allowing U.S. forces to use Omani airports and ports for logistics and refuelling. Al-Musannah Air Base is a military site in Oman utilised by U.S. forces under bilateral defence cooperation agreements.","https://worldbeyondwar.org/hosting-a-u-s-military-base-near-iran-is-bad-for-your-health-and-your-government/"],[17.6669,54.0328,"United States","Oman","Thumrait MAP","Muscat","Air Force","Co-base","1981","","","","Thumrait Air Base is situated in southern Oman, Thumrait Air Base is operated by the Royal Air Force of Oman and has been used by U.S. forces for joint exercises and operations. The base has supported various military activities, including training exercises with allied nations.","https://www.pbs.org/newshour/world/us-troops-will-leave-some-bases-in-iraq-under-deal-to-end-mission-fighting-islamic-state"],[19.65,57.7,"United States","Oman","port of Duqm","Duqm","Navy","Co-base","2019","","","","This port has been developed to accommodate both commercial and military vessels. The U.S. has access to the port for logistical support and as a strategic location for operations in the region.","https://www.americansecurityproject.org/wp-content/uploads/2018/07/Ref-0213-US-Military-Bases-and-Facilities-Middle-East.pdf"],[16.9481,54.0089,"United States","Oman","Port of Salalah","Salalah","Navy","Co-base","1981","","","","The Defense Logistics Agency operated a recently opened material processing center there. This facility provides “material aggregation, transshipment, short-term storage and delivery functions for visiting U.S. Navy vessels and other U.S. customers in the U.S. Central Command AOR.","https://www.americansecurityproject.org/wp-content/uploads/2018/07/Ref-0213-US-Military-Bases-and-Facilities-Middle-East.pdf"],[23.6414,57.4903,"United States","Oman","Al Mussanah Air Base","Al Hazm","Air Force","Co-base","2009","","","","This base has war reserve material stored at this location. The US has also deployed AH64 Apaches to RAFO Musannah as part of Ex PINION OMAN 21.","https://www.americansecurityproject.org/wp-content/uploads/2018/07/Ref-0213-US-Military-Bases-and-Facilities-Middle-East.pdf"],[23.6003,58.2558,"United States","Oman","SEEB MPT Site 1","Seeb","Air Force","Co-base","1981","","","","The base operates at Muscat International Airport in Oman and features two runways that have been extended to 13,123 feet. Military equipment is stored at that location. The base was part of the access agreement between the United States and Oman for use of one of several military sites in Oman that support equipment and material needs for U.S.military personnel.","https://www.americansecurityproject.org/wp-content/uploads/2018/07/Ref-0213-US-Military-Bases-and-Facilities-Middle-East.pdf"],[8.9196,-79.5985,"United States","Panama","Panamá Pacífico International Airport / Base Aérea Teniente Octavio Rodríguez","","Air Force","Co-base","2025","","","","Under the April 2025 MoU, the United States gained access to Panamá Pacífico International Airport, formerly Howard Air Force Base. Although presented as a site for joint training and humanitarian missions, this move effectively reactivates a historically U.S. military hub, raising concerns about the creeping re-militarization of Panama’s sovereign infrastructure under the language of cooperation.","https://armyrecognition.com/news/army-news/2025/breaking-news-panama-authorizes-us-armed-forces-to-operate-from-three-key-air-and-naval-facilities"],[8.951,-79.5744,"United States","Panama","Vasco Núñez De Balboa Naval Base","","Navy","Co-base","2025","","","","Under the April 2025 MoU, the United States gained access to the Vasco Núñez de Balboa Naval Base, formerly known as Rodman Naval Station, during decades of U.S. control. Strategically positioned at the Pacific entrance to the Panama Canal, the base’s inclusion in the agreement signals Washington’s renewed ambition to project naval power in the region. While Panama maintains nominal control, the arrangement risks subordinating national maritime priorities to U.S. strategic objectives","https://armyrecognition.com/news/army-news/2025/breaking-news-panama-authorizes-us-armed-forces-to-operate-from-three-key-air-and-naval-facilities"],[9.366,-79.9491,"United States","Panama","Cristóbal Colón Naval Air Base","","Navy","Co-base","2025","","","","The Cristóbal Colón Naval Air Base, situated on the Atlantic side near Colón, is the third facility covered by the April 2025 MoU between US and Panama. The reintroduction of U.S. forces under a rotational pretext suggests not neutrality, but the gradual normalization of foreign military activity in a zone long reclaimed through national struggle—threatening Panama’s declared sovereignty and regional independence.","https://armyrecognition.com/news/army-news/2025/breaking-news-panama-authorizes-us-armed-forces-to-operate-from-three-key-air-and-naval-facilities"],[7.3728,134.5372,"United States","Palau","Camp Katuu","Airai","Army","Co-base","1969","","","","Camp Katuu is a military installation in the State of Airai, Palau. It is home to the US Civic Action Team (CAT), a tri-service rotation between the US Navy, Army, and Air Force.","https://www.pacom.mil/Media/News/Article/2718441/pacific-air-forces-commander-visits-palau/"],[6.9079,134.1476,"United States","Palau","Radar Site- Transmitter","Angaur island","Air Force","Co-base","2018","","","","The United States is building a Tactical Mobile Over-the-Horizon Radar (TACMOR) station in Palau. The station will be one-quarter the size of a conventional OTHR and is expected to be operational in 2026. The radar project has two sites, one for a transmitter and one for a receiver. The transmitter is located on Angaur island in the south of Palau, and the receiver is located in Ngaraard in the north of the archipelago.","https://ipdefenseforum.com/2023/01/u-s-plans-over-the-horizon-radar-facility-in-palau/#:~:text=Palau%2C%20located%20between%20the%20Philippines,Harding%2C%20a%20former%20Pentagon%20official."],[7.6299,134.6293,"United States","Palau","Radar Site-Receiver","Ngaraard","Air Force","Co-base","2018","","","","The United States is building a Tactical Mobile Over-the-Horizon Radar (TACMOR) station in Palau. The station will be one-quarter the size of a conventional OTHR and is expected to be operational in 2026. The radar project has two sites, one for a transmitter and one for a receiver. The transmitter is located on Angaur island in the south of Palau, and the receiver is located in Ngaraard in the north of the archipelago.","https://ipdefenseforum.com/2023/01/u-s-plans-over-the-horizon-radar-facility-in-palau/#:~:text=Palau%2C%20located%20between%20the%20Philippines,Harding%2C%20a%20former%20Pentagon%20official."],[-3.7321,-73.2417,"United States","Peru","U.S. Naval Medical Research Unit - 6","Lima","Navy","Operator Only","1983","","","","Naval Medical Research Unit SOUTH , formerly known as Naval Medical Research Unit Six, is a biomedical research laboratory of the U.S. Navy located in Lima, Peru. It is the only U.S. military command located in South America.","https://www.med.navy.mil/Naval-Medical-Research-Command/R-D-Commands/Naval-Medical-Research-Unit-SOUTH/About-Us/"],[-12.1597,-77.0,"United States","Peru","Las Palmas Air Base","Lima","Air Force","Co-base","2023","","","","Las Palmas Air Base is a military airport in Santiago de Surco District. The United States Air Force began operations there on June 1, 2023.","https://www.afsouth.af.mil/News/Article-Display/Article/3800661/peru-brazil-us-collaborate-on-tccc-training/"],[-2.0403,147.3719,"United States","Papua New Guinea","Lombrum Naval Base","Manus Island","Navy","Co-base","2023","","","","The US secured \"unimpeded access\" to Lombrum Naval Base through the 15‑year Agreement (DCA), which replaced the previous Status of Forces Agreement, explicitly permitting training, staging, vessel docking, and infrastructure development. This access became formal once the agreement was signed on May 22, 2023, and subsequently tabled in Papua New Guinea’s Parliament for ratification.","https://thedefensepost.com/2023/06/15/us-military-papua-new-guinea-bases/"],[-9.4789,147.1494,"United States","Papua New Guinea","Port Moresby Seaport","Moresby","Navy","Co-base","2023","","","","Access to the Port Moresby Seaport was granted when the DCA listed it among the six sites with “unimpeded access,” enabling U.S. vessels to dock, refuel, and pre-position materials. This access became formal once the agreement was signed on May 22, 2023, and subsequently tabled in Papua New Guinea’s Parliament for ratification. The agreement also grants the U.S. the right to upgrade port infrastructure.","https://thedefensepost.com/2023/06/15/us-military-papua-new-guinea-bases/"],[-9.4433,147.22,"United States","Papua New Guinea","Port Moresby Airport","Moresby","Air Force","Co-base","2023","","","","The DCA designates Port Moresby Airport as a U.S.-accessible airfield for mutually agreed activities such as aircraft transit, maintenance, and refueling. This access became formal once the agreement was signed on May 22, 2023, and subsequently tabled in Papua New Guinea’s Parliament for ratification. The agreement also grants the U.S. the right to upgrade airport infrastructure.","https://www.rnz.co.nz/international/pacific-news/489999/concerns-in-papua-new-guinea-over-framing-of-us-security-pact"],[-6.7167,146.9667,"United States","Papua New Guinea","Lae Seaport","Lae ","Navy","Co-base","2023","","","","The Port of Lae was designated as one of the six sites for U.S. access, allowing American ships to dock and refuel as part of \"mutually agreed activities.\" This access became formal once the agreement was signed on May 22, 2023, and subsequently tabled in Papua New Guinea’s Parliament for ratification. The agreement also grants the U.S. the right to upgrade port infrastructure.","https://www.rnz.co.nz/international/pacific-news/489999/concerns-in-papua-new-guinea-over-framing-of-us-security-pact"],[-2.0619,147.4242,"United States","Papua New Guinea","Momote Airport","Momote Manus","Air Force","Co-base","2023","","","","Momote Airport, located adjacent to Lombrum on Los Negros Island, was explicitly included in the DCA as a designated airfield for U.S. use. This access became formal once the agreement was signed on May 22, 2023, and subsequently tabled in Papua New Guinea’s Parliament for ratification.","https://www.rnz.co.nz/international/pacific-news/489999/concerns-in-papua-new-guinea-over-framing-of-us-security-pact"],[-6.5697,146.7261,"United States","Papua New Guinea","Lae Nadzab Airport","Lae ","Air Force","Co-base","2023","","","","Lae Nadzab Airport was explicitly named in the DCA among the Papua New Guinea airfields to which the U.S. would have \"unimpeded access.\" This arrangement was ratified when the treaty was signed and tabled in Parliament, confirming U.S. rights to use the airport for flights related to logistics, surveillance and reconnaissance. The agreement permits infrastructure enhancements at Nadzab. This access became formal upon the signing of the agreement on May 22, 2023.","https://www.rnz.co.nz/international/pacific-news/489999/concerns-in-papua-new-guinea-over-framing-of-us-security-pact"],[8.4156,124.6111,"United States","Philippines","Lumbia Air Base","Mindanao","Air Force","Co-base","2014","","","","The Lumbia Air Base in Cagayan de Oro is a major airfield that was given to the US to use. The US military has selected the airport for building its facilities under the Enhanced Defense Cooperation Agreement. It has been designated as one of the EDCA sites, allowing U.S. forces access for rotational deployments and joint training exercises. Recent developments have focused on infrastructure improvements to support these activities","https://news.usni.org/2023/03/20/u-s-begins-air-base-rehab-in-philippines-as-part-of-basing-agreement"],[15.4339,121.0872,"United States","Philippines","Fort Magsaysay","Nueva Ecija","Army","Training Base","2014","","","","Fort Magsaysay is a military base in the Philippines that the United States uses as a staging area and command and control facility for training exercises. Under EDCA, it has opened it to U.S. forces for joint training and exercises. The base features extensive training facilities, including firing ranges and an airfield, supporting various military activities.","https://news.usni.org/2023/03/20/u-s-begins-air-base-rehab-in-philippines-as-part-of-basing-agreement"],[14.8083,120.2917,"United States","Philippines","Naval Station Subic Bay","Zambales","Navy","Co-base","2014","","","","This base belongs to the Philippine Air Force, which was used by the U.S. military from 1945 to 1992, and other countries as well before 1945. In late 2022, plans to reopen the base under the Enhanced Defense Cooperation Agreement emerged after the Philippine Navy reoccupied a portion of the base and a U.S. investment firm purchased the remainder of the port.","https://news.usni.org/2025/03/17/u-s-marines-to-stage-equipment-at-subic-bay-under-new-prepositioning-plan"],[15.1867,120.5584,"United States","Philippines","Clark Air Base"," Luzon Island","Air Force","Co-base","2013","","","","Formerly a major U.S. Air Force base, Clark is now a Philippine Air Force base and a commercial aviation hub. Under EDCA, it has been made available for U.S. forces for rotational presence and joint activities.","https://news.usni.org/2023/03/20/u-s-begins-air-base-rehab-in-philippines-as-part-of-basing-agreement"],[9.7442,118.7589,"United States","Philippines","Antonio Bautista Air Base","Palawan","Air Force","Co-base","2016","","","","Antonio Bautista Air Base is a military airbase of the Philippine Air Force. On 18 March 2016, the United States and the Philippines signed a deal to allow US forces to use five bases in the country as a counter to the Chinese deployments in the Spratly Islands.","https://news.usni.org/2023/03/20/u-s-begins-air-base-rehab-in-philippines-as-part-of-basing-agreement"],[14.9833,120.4833,"United States","Philippines","Basa Air Base","Pampanga","Air Force","Co-base","2016","","","","Cesar Basa Air Base, or simply Basa Air Base, is an airbase currently operated by the Philippine Air Force. There is a US military presence in this base for secret operations. On 18 March 2016, the United States and the Philippines signed a deal to allow US forces to use five bases in the country as a counter to the Chinese deployments in the Spratly Islands.","https://news.usni.org/2023/03/20/u-s-begins-air-base-rehab-in-philippines-as-part-of-basing-agreement"],[9.31,123.9817,"United States","Philippines","Benito Ebuen Air Base","Cebu","Air Force","Co-base","2016","","","","Mactan–Benito Ebuen Air Base is an active military airbase of the Philippine Air Force. On 18 March 2016, the United States and the Philippines signed a deal to allow US forces to use five bases in the country as a counter to the Chinese deployments in the Spratly Islands.","https://news.usni.org/2023/03/20/u-s-begins-air-base-rehab-in-philippines-as-part-of-basing-agreement"],[18.5072,122.1491,"United States","Philippines","Camilo Osias Naval Base","Cagayan","Navy","Co-base","2023","","","","Since Aprial 2023, the U.S. has access to Philippine bases, including Camilo Osias Naval Base for joint training, pre-positioning of equipment and building of facilities such as runways, fuel storage and military housing, but it is not a permanent presence.","https://www.reuters.com/world/asia-pacific/philippines-reveals-locations-4-new-strategic-sites-us-military-pact-2023-04-03/"],[17.0721,121.8651,"United States","Philippines","Camp Melchor Dela Cruz","Isabela","Army","Co-base","2023","","","","Camp Melchor F. dela Cruz is a military camp in the Philippines that is
