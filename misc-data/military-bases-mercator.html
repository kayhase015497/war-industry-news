t and American soldiers.","https://www.thearabweekly.com/us-agrees-troop-exit-iraq-2026-does-not-rule-out-adjustments"],[36.5297,44.3445,"United States","Iraq","Harir Air Base","Erbil","Air Force","Co-base","2019","","","","Harir Air Base is a military base in the Erbil Governorate, Kurdistan Region, Iraq. This base is used by the US and it was attacked in 2023.","https://www.pbs.org/newshour/world/us-troops-will-leave-some-bases-in-iraq-under-deal-to-end-mission-fighting-islamic-state"],[33.5294,44.2775,"United States","Iraq","Camp Taji","Baqubah","Army","Co-base","2014","","","","Camp Taj, also known as Camp Cooke, is a military installation used by the Iraqi and the US militaries near Taji, Baghdad Governorate, Iraq.","https://shafaq.com/en/Iraq/US-military-convoy-heads-toward-Iraq-s-Qayyarah-Air-Base"],[36.2375,43.9631,"United States","Iraq","Erbil Air Base","Erbil ","Air Force","Co-base","None","","","","Erbil Airbase is located in northern Iraq, Erbil Airbase serves as a strategic hub for U.S. forces, especially following the relocation of troops from other bases. It facilitates operations against ISIS and supports coordination with Kurdish Peshmerga forces.","https://www.pbs.org/newshour/world/us-troops-will-leave-some-bases-in-iraq-under-deal-to-end-mission-fighting-islamic-state"],[52.7019,-8.9247,"United States","Ireland","Shannon Airport","County Clare","Air Force","Co-base","2002","","","","Shannon Airport, located in County Clare, Ireland, is not a U.S. military base. However, it has been used extensively by the United States military for transit purposes since the early 2000s. This usage has been a point of contention within Ireland, given the country's official stance of military neutrality. Since 2002, Shannon Airport has served as a significant transit point for U.S. military personnel and equipment en route to various destinations, including the Middle East.","https://www.irishexaminer.com/news/munster/arid-41467891.html"],[31.0667,35.0333,"United States","Israel","Dimona Radar Facility","Dimona","Air Force","Co-base","2008","","","","The Dimona Radar facility has two 400-meter (1,300 feet) tall radar towers. This facility houses a U.S.-operated AN/TPY-2 radar system designed to detect and track ballistic missiles, particularly from Iran. The radar towers are among the tallest structures in Israel.","https://www.presstv.ir/Detail/2025/03/22/744853/trumps-gamble-which-us-bases-are-potential-targets-of-iranian-retaliatory-strikes"],[30.9964,34.4943,"United States","Israel","Negev Desert Radar Site (Site 512)","Mount Har Qeren","Air Force","Co-base","None","","","","This base is situated atop Mount Har Qeren in the Negev, Site 512 is a U.S. DoD radar installation operated by the U.S. Army's 1st Space Brigade. It serves as an early-warning system against ballistic missile launches from Iran and its proxies. In 2023, the site underwent a $35.8 million expansion to accommodate up to 1,000 personnel.","https://www.pbs.org/newshour/world/us-troops-will-leave-some-bases-in-iraq-under-deal-to-end-mission-fighting-islamic-state"],[30.981,34.7644,"United States","Israel","Mashabim Air Base","Tlalim","Air Force","Co-base","2017","","","","In 2017, the U.S. established its first permanent military base in Israel within the Israeli Air Force's Mashabim Air Base, located west of Dimona. This facility hosts U.S. Air Force personnel and focuses on air defense operations. This base, also known as Bisl'a Aerial Defense School, to detect possible incoming ballistic missiles. The base is run by EUCOM.32.","https://www.middleeastmonitor.com/20170920-us-builds-permanent-military-base-in-israel/"],[30.779,35.1293,"United States","Israel","Site 53","Unknown","Unknown","Co-base","1990","","","","This site stores heavy equipment, ammunition, and armored vehicles. Positioned for rapid deployment to regional U.S. operations, potentially within 72 hours of a contingency.","https://www.google.co.in/books/edition/Code_Names/KXLfAAAAMAAJ?hl=en"],[31.1607,34.519,"United States","Israel","Site 61","Unknown","Air Force","Co-base","None","","","","Hatzor Airbase includes a Combined Operations Center established in collaboration with the U.S. military. This center enhances coordination between U.S. and Israeli forces, particularly in missile defense operations.","https://www.google.co.in/books/edition/Code_Names/KXLfAAAAMAAJ?hl=en"],[32.8201,35.0045,"United States","Israel","Port of Haifa","Haifa","Navy","Co-base","1979","","","","The Port of Haifa serves as a logistical hub for the U.S. Navy's Sixth Fleet, facilitating joint naval exercises and resupply missions. However, the involvement of a Chinese company in port operations has raised security concerns regarding potential espionage risks. The Port maintains facilities for the United States Sixth Fleet, which often docks naval vessels.","https://www.jpost.com/israel-news/us-navy-may-stop-docking-in-haifa-after-chinese-take-over-port-574414"],[30.7724,34.9778,"United States","Israel","Site 51","Unknown","Navy","Co-base","1990","","","","This site is designed for secure storage and rapid deployment. Its subterranean facilities likely protect sensitive or volatile munitions, intended for U.S. and potentially Israeli forces during wartime operations in the Middle East.","https://www.google.co.in/books/edition/Code_Names/KXLfAAAAMAAJ?hl=en"],[31.2927,34.7681,"United States","Israel","Site 54","Unknown","Unknown","Co-base","1990","","","","This site is built for use by U.S. Marines and Special Forces. Can handle mass casualties or serve as a forward medical post during a Middle Eastern military operation. It is an emergency field hospital with 500 beds.","https://www.google.co.in/books/edition/Code_Names/KXLfAAAAMAAJ?hl=en"],[30.8025,34.8225,"United States","Israel","Site 56","Unknown","Unknown","Co-base","None","","","","The location is not publicly confirmed, but possibly co-located with Site 55 or in the southern desert (Negev). It functions as an additional ammunition and logistics depot. It supports logistical sustainment operations. Likely includes both munitions and fuel or other high-demand wartime supplies.","https://www.google.co.in/books/edition/Code_Names/KXLfAAAAMAAJ?hl=en"],[32.0186,34.872,"United States","Israel","Site 55","Unknown","Unknown","Co-base","None","","","","The location is undisclosed, but likely near key military transit hubs such as Ben Gurion Airport. It stores military-grade ordnance for rapid distribution to U.S. forces operating in the region.","https://www.google.co.in/books/edition/Code_Names/KXLfAAAAMAAJ?hl=en"],[37.22,15.23,"United States","Italy","Augusta Bay","Catania","Navy","Operator Only","1957","","","","The Augusta Bay Port Facility is a US Navy installation that supports the US Navy's Sixth Fleet. The facility provides fuel, ammunition, and supplies to combat and logistics support ships. The Sixth Fleet operates in Europe and Northern Africa. The facility is part of Naval Air Station Sigonella, which supports a rotation of squadrons and multi-service, multi-national transient aircraft.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[46.0314,12.5969,"United States","Italy","Aviano Air Base","Aviano","Air Force","Co-base","1955","Nuclear weapons","NATO","","The Italian Air Force is the owner of this base and maintains administrative as well as military responsibility over it. It is reported to house nuclear weapons, and is home to the 31st Fighter Wing of the United States Air Force. This base is a NATO base.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[46.0373,12.6116,"United States","Italy","Aviano Administration Annex Group HQ","Aviano","Air Force","Co-base","1955","","","","Inside the Aviano air base, there are numerous buildings which are listed separately in the DoD reports. This annex serves as the administrative headquarters for base operations, housing key command and control offices that coordinate the activities of the 31st Fighter Wing and its subordinate units.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[46.0286,12.6133,"United States","Italy","Aviano Ammunition Storage Annex","Aviano","Air Force","Co-base","1955","","","","Inside the Aviano air base, there are numerous buildings that are listed separately in the DoD reports. It is managed by the 31st Munitions Squadron, This facility maintains combat-ready stockpiles of munitions to support U.S. and NATO taskings. In 2021, new earth-covered storage modules were unveiled to enhance munitions storage capabilities","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[46.0704,12.5909,"United States","Italy","Aviano Bachelor Housing Annex 1 and","Aviano","Air Force","Operator Only","1955","","","","Inside the Aviano air base, there are numerous buildings that are listed separately in the DoD reports. This annexe provides unaccompanied housing for military personnel, offering modern dormitory accommodations with private bedrooms and shared living spaces.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[46.0269,12.6042,"United States","Italy","Aviano Bachelor Housing Annex 2","Aviano","Air Force","Operator Only","1955","","","","Inside the Aviano air base, there are numerous buildings that are listed separately in the DoD reports. This annexe provides unaccompanied housing for military personnel, offering modern dormitory accommodations with private bedrooms and shared living spaces.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[46.0338,12.5917,"United States","Italy","Aviano family housing Annex no 5","Aviano","Air Force","Operator Only","1955","","","","Inside the Aviano air base, there are numerous buildings that are listed separately in the DoD reports. This annex offers family housing units for accompanied service members. As traditional government housing is limited, the base utilizes leased units in nearby communities to accommodate families.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[46.0433,12.6067,"United States","Italy","Aviano Maintenance Annex","Aviano","Air Force","Operator Only","1955","","","","Inside the Aviano air base, there are numerous buildings that are listed separately in the DoD reports. This facility supports maintenance operations for aircraft and equipment, ensuring the readiness of F-16 aircraft and other assets through inspections, repairs, and specialized maintenance activities.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[46.0701,12.5902,"United States","Italy","Aviano Storage Annex","Aviano","Air Force","Operator Only","1955","","","","Inside the Aviano air base, there are numerous buildings that are listed separately in the DoD reports. This facility is used for the storage of equipment and supplies necessary for base operations. This annexe ensures that logistical and operational materials are readily available for the mission of the 31st Fighter Wing.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[43.6333,10.3167,"United States","Italy","Darby Military Community","Tirrenia","Army","Co-base","1952","","","","The Darby Military is located between Pisa and Livorno in Tuscany. The Darby Military Community serves as a logistics and support hub for U.S. forces in Italy. Established in 1952, it houses the 405th Army Field Support Battalion-Africa, the 839th Transportation Battalion, and the 731st Munitions Squadron. In 2012, it was realigned as a satellite installation of USAG Vicenza at Caserma Ederle.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[45.5424,11.5785,"United States","Italy","Caserma Ederle","Vicenza","Army","Co-base","1955","","","","Caserma Ederle is a U.S. Army installation in Italy. It serves as the headquarters for U.S. Army Garrison Italy, U.S. Army Southern European Task Force, Africa (SETAF-AF), and the 173rd Airborne Brigade. The base offers various amenities, including housing, medical facilities, and recreational services. It is under Italian military control and can be managed by Italian authorities at any time.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[40.852,14.107,"United States","Italy","Carney Park","Naples","Navy","Operator Only","1966","","","","Carney Park is a United States military recreational facility. Carney Park is a 93-acre recreational facility operated by the U.S. Navy. Established in 1966, it offers a golf course, swimming pool, sports fields, picnic areas, and lodging facilities. Access is limited to U.S. military personnel, DOD civilians, and their dependents.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[45.572,11.5275,"United States","Italy","Caserma Del Din","Vicenza","Army","Operator Only","2013","","","","Caserma Del Din is a United States Army base in northern Italy. The base is the headquarters of the 173rd Airborne Brigade Combat Team, which is part of the US Army Africa. Caserma Del Din was built on the former Dal Molin site, which was vacated by the Italian Air Force in 2008.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[41.2136,13.5768,"United States","Italy","U. S. Naval Support Activity Gaeta","Gaeta","Navy","Co-base","1967","","","","Located in the coastal town of Gaeta, approximately halfway between Rome and Naples, this facility supports the U.S. Sixth Fleet's flagship, USS Mount Whitney. It provides logistical and administrative support to U.S. Navy operations in the Mediterranean. The base is operated by the US Army, but under the relegations of Italy. It was established in 1967.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[45.4149,10.2708,"United States","Italy","Ghedi Radio Relay Site","Brescia","Air Force","Co-base","1963","","","","In 1994, the base's mission was withdrawn; however, it reopened later that decade. In 2000, the facility was once again closed. In 2003, the base reverted to Italian government ownership. The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2025.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[40.9304,14.0467,"United States","Italy","Allied Joint Force Command Naples","Naples","Navy","Co-base","2004","","NATO","","The Allied Joint Force Command Naples (JFC Naples) is a NATO military command located in Lago Patria, Italy. The base is a co-base operated by the US Army, but under the regulations of the Italian government.","https://en.money.it/NATO-and-US-bases-in-Italy-here-s-where-they-are-located"],[41.831,13.1477,"United States","Italy","Livorno Training Area","Livorno","Army","Co-base","1952","","","","Formerly known as \"USAG Livorno,\" the DMC project areas are consisting of the four following separate facilities: Camp Darby, Livorno Training Area, Ammunition Storage Area, and Leghorn Army Depot. (P2)","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[43.5883,10.3332,"United States","Italy","Livorno Supply and Maint Area","Livorno","Army","Operator Only","1952","","","","This facility is integral to U.S. Army logistics in Europe. It is also known as the Leghorn Army Depot. It manages the storage and maintenance of prepositioned stocks. The depot supports various units and has been operational for several decades.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[45.4803,11.6005,"United States","Italy","Longare Communications Site","Vicenza","Army","Operator Only","1954","","","","The Longare Communications Site is located in Longare, Italy. It is managed by the United States Army. The site is home to the 2500th Digital Liaison Detachment (USAR) and Company A, 457th Civil Affairs Battalion (USAR).","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.4639,14.9594,"United States","Italy","NAS 1 Support Area","Catania","Navy","Operator Only","1957","","","","Part of Naval Air Station Sigonella in Sicily, NAS 1 serves as the original site of the U.S. base. Currently, it functions as a support facility housing administrative offices, the Navy Exchange, Commissary, schools, and housing for senior officers","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.5,15.08,"United States","Italy","NAS Sigonella IT (NATO Magazine Area)","Sigonella","Navy","Co-base","1959","","NATO","","The NATO Magazine Area is located west of NAS II at Naval Air Station (NAS) Sigonella. This area contains ammunition storage facilities. The U.S. has had a permanent presence at the base since 1959.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.5,15.08,"United States","Italy","NAS Sigonella Belpasso Hsg","Catania","Navy","Operator Only","1957","","","","The Belpasso Housing complex, also known as the Marinai Housing Complex, provides family housing for service members stationed at NAS Sigonella. It comprises 526 townhouse-style units with amenities suitable for families.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.4665,14.961,"United States","Italy","NATO Ordnance Facility","d","Navy","Co-base","1957","","NATO","","This facility is integrated within the NAS Sigonella complex, offering storage and handling of ordnance to support NATO missions. It includes various storage units and disposal areas for munitions .","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[40.8816,14.2925,"United States","Italy","Naval Support Activity Naples","Naples","Navy","Co-base","1951","","","","Naval Support Activity Naples (NSA Naples) is a US Navy military complex in Capodichino, Naples, Italy. It's located next to Naples International Airport and is under Italian military control. It is home to U.S. Naval Forces Europe and the U.S. Sixth Fleet.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[40.9747,14.2324,"United States","Italy","NSA Naples Support Site","Naples","Navy","Co-base","1951","","","","The Naval Support Activity Naples (NSA Naples) Support Site is a residential and support complex for NSA Naples. It offers housing, schools, medical facilities, and recreational amenities for service members and their families.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[43.6381,10.3495,"United States","Italy","Pisa Ammo Storage Area","Pisa","Army","Operator Only","1952","","","","The Pisa Ammunition Storage Area (PASA) is located within the Darby Military Community near Pisa, PASA serves as a logistics hub for U.S. Army Europe and Africa. In 2022, a $42 million infrastructure upgrade was completed, enhancing rail and canal access to support ammunition transport across Europe and Africa.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[40.6461,17.8403,"United States","Italy","San Vito Dei Normanni AS","San Vito Normanni","Air Force","Operator Only","1961","","","","San Vito dei Normanni Air Station (AS) is a United States Air Forces in Europe (USAFE) base located near San Vito dei Normanni, Italy. The base began in 1960 as an off-base installation of Aviano AB and has been a primary installation since 1961.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[45.5421,11.5783,"United States","Italy","Vicenza Military Community","Vicenza","Army","Operator Only","1959","","","","US Army Garrison Vicenza is mainly located on the Italian base Caserma Ederle in Vicenza, Italy. The Vicenza Military Community consists of several installations in the area including Caserma Ederle, Caserma Del Din, Villaggio housing, Longare reserve site, Torri di Quartesolo, Lerino and Marolo.","https://cepa.org/article/going-going-the-us-base-network-in-europe/"],[45.5083,11.5397,"United States","Italy","Vicenza Basic Load Storage Area","Vicenza","Army","Operator Only","1955","","","","The Vicenza Basic Load Storage Area is located in Tormeno, Italy. It is owned and managed by the United States Army. The Vicenza Basic Load Storage Area was formerly known as Supply Point #7.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[45.5498,11.5399,"United States","Italy","Vicenza Family Housing","Vicenza","Army","Operator Only","1952","","","","The U.S. Army is investing in a housing project in Vicenza, aiming to provide 478 new homes for military families by 2028. This development includes apartments, townhouses, and single-family homes, enhancing the quality of life for service members and their dependents.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[45.5483,11.5778,"United States","Italy","US Army Health Clinic Vicenza","Vicenza","Army","Operator Only","2017","","","","The U.S. Army Health Clinic Vicenza is a military medical facility that provides care to active-duty soldiers, retirees, and their dependents. The clinic is located on Caserma Ederle in Vicenza, Italy.","https://mhs-europe.tricare.mil/Clinics/Vicenza-Army-Health-Clinic/Primary-Care-Clinic"],[40.9934,14.2536,"United States","Italy","U.S Naval Hospital Naples","Naples","Navy","Operator Only","1967","","","","Naval Hospital Naples was established at Agnano in 1967, and moved to Gricignano di Aversa in April 2003. In 2005 the United States Naval Forces Europe headquarters moved from London to Naples.",""],[45.4322,10.2678,"United States","Italy","Ghedi Air Base","Ghedi","Air Force","Co-base","1962","Nuclear weapons","NATO","","The US does not have a permanent Air Force installation at Ghedi Air Base in Italy. The Italian Air Force uses the base, and the US Army does not support it. The Italian Air Force maintains the property occupied by US Air Force personnel. The base does not have personnel support facilities or billeting for US forces. The Italian Air Force is assigned approximately 35 B61 nuclear bombs at Ghedi Air Base. Italy is one of five NATO members to host US nuclear weapons on its territory as part of a nuclear-sharing agreement.","https://en.money.it/NATO-and-US-bases-in-Italy-here-s-where-they-are-located"],[37.4017,14.9222,"United States","Italy","Naval Air Station Sigonella","Sigonella Sicily","Navy","Operator Only","1957","","NATO","Drone Base","Naval Air Station Sigonella is an Italian Air Force base with a U.S. Navy installation in Sicily, Italy. NAS Sigonella serves as a critical logistics and operational hub for U.S. and NATO forces in the Mediterranean. It is one of the most frequently used stops for U.S. airlift aircraft bound from the continental United States to Southwest Asia and the Indian Ocean.","https://www.dvidshub.net/video/959781/installation-highlight-nas-sigonella"],[45.5733,11.5297,"United States","Italy","Dal Molin Airfield","Vicenza","Air Force","Co-base","2008","","","","The U.S. military uses the former Dal Molin Airport in Vicenza, Italy. In 2004, the U.S. military announced plans to build a base annex on the site, which was vacated by the Italian Air Force in 2008. The new base, Caserma Del Din, supports the consolidation of most of the 173rd Infantry Brigade Combat Team (Airborne) in Vicenza.","https://www.army.mil/article/106769/new_installation_opens_in_italy"],[37.1172,14.44,"United States","Italy","Naval Radio Transmitter Facility Niscemi","Sicily","Navy","Operator Only","1991","","","","This base is located in Niscemi, Sicily, NRTF Niscemi is a U.S. Navy transmission facility established in 1991. It houses low and high-frequency transmitter systems and supports the Mobile User Objective System (MUOS), a global communications network. The facility has faced local opposition due to environmental and health concerns related to electromagnetic emissions.","https://www.globalsecurity.org/military/facility/niscemi.htm"],[37.1174,14.4401,"United States","Italy","Naval Computer and Telecommunications Station, Naples","Sicily","Navy","Operator Only","1963","","","","NCTS Naples, established in 1963, provides secure voice, video, and data services to U.S. Navy, joint, allied, and coalition customers. It operates two manned sites: the C4I facility at Capodichino and the SATCOM site at Lago Patria. The station supports various commands, including the U.S. Sixth Fleet and U.S. Naval Forces Europe.","https://militarybases.com/overseas/italy/"],[45.516,11.6083,"United States","Italy","The Logistics Readiness Center","Vicenza","Army","Co-base","1943","","","","The Logistics Readiness Center-Italy (LRC-Italy) is located at Building 6VASERNA Caserma Ederle in Vicenza, Italy. The LRC-Italy is part of the 405th Army Field Support Brigade. The LRC-Italy manages installation supply, maintenance, and transportation, including food service and central issue facility.","https://www.dvidshub.net/news/495493/lrc-italy-s-1-who-built-career-service-before-self-proud-part-armys-250th"],[38.882,8.6447,"United States","Italy","Capo Teulada range","Sardinia","Army","Co-base","1956","","NATO","","Capo Teulada is an Italian-controlled military range used for live-fire training. While not a U.S.-owned installation, it has hosted joint U.S.-Italian and NATO exercises. The use of this site by foreign militaries has been controversial due to environmental damage and safety concerns, especially from local Sardinian activists.","https://theaviationist.com/2011/02/14/capo-teulada"],[46.0353,12.6113,"United States","Italy","Aviano Hospital School Annex","Aviano","Air Force","Operator Only","1994","","","","Aviano Hospital School Annex is located within Aviano Air Base, the Aviano Hospital School Annex is part of the 31st Medical Group facilities. It provides medical services to U.S. military personnel and their families stationed at the base. The annex supports various healthcare programs.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[46.0348,12.6139,"United States","Italy","Aviano Recreational Area","Aviano","Air Force","Operator Only","None","","","","The Aviano Recreational Area, managed by the 31st Force Support Squadron, offers a variety of outdoor activities and equipment rentals for service members and their families. Facilities include picnic areas, sports fields, and rental services for camping and recreational gear.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[45.9895,12.6543,"United States","Italy","La Comina Storage Site Site 1","Unknown","Air Force","Operator Only","None","","","","La Comina, near Pordenone, has been undergoing modernization to accommodate the 132nd Armored Brigade \"Ariete.\" The project includes the adaptation of existing facilities and the construction of new command, logistics, and accommodation areas to support military operations.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[40.9282,14.0362,"United States","Italy","Lago Patria","Naples","Navy","Operator Only","None","","NATO","","Lago Patria, located near Naples, hosts the Allied Joint Force Command Naples, a NATO operational headquarters. The facility supports NATO missions and includes various support services for military personnel.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[41.0451,13.939,"United States","Italy","Transmitter Site","Sigonella","Navy","Operator Only","None","","","","Italy hosts several transmitter sites used for military communications. These sites are integral to the communication infrastructure supporting U.S. and NATO operations in the region. Specific details about this transmitter site are limited.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[40.8306,14.0517,"United States","Italy","Old Mill Inn Gaeta","Gaeta","Navy","Operator Only","None","","","","The Old Mill Inn Park in Gaeta serves as a recreational facility for U.S. Navy personnel and their families. Amenities include picnic areas, sports fields, and pavilions for gatherings. The park is managed by Navy Morale, Welfare, and Recreation (MWR) Naples.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[16.7286,-169.5342,"United States","Johnston Atoll","Johnston Atoll Airfield Site 1","Unknown","Air Force","Co-base","None","","","","As of 2025, Johnston Atoll Airfield, once decommissioned in 2005, is undergoing reactivation for military use. The U.S. Air Force has selected the atoll as the primary site for its Rocket Cargo Vanguard program, aiming to test rapid global delivery of military cargo via reusable rockets. Plans include constructing two rocket landing pads to support up to ten landings annually over a four-year period.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[32.0233,36.1287,"United States","Jordan","Joint Training Center - JTC","Al-Zarqa","Army","Training Base","2003","","","","This base belongs to the Jordanian army and is used by the US as a training site to coordinate emergency response training events every six months.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[31.8342,36.7872,"United States","Jordan","Muwaffaq Salti Air Base","Al-Zarqa","Air Force","Training Base","1918","","","","This base is a Royal Jordanian Air Force air base. Beginning in November 2021, the United States began upgrading the airbase to turn it into a more permanent base when the US Army Corps of Engineers released the solicitation to find a contractor to build a new air traffic control tower.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[33.3143,38.7009,"United States","Jordan","Tower 22","Rwaished","Army","Training Base","2021","","","","Building 15 border towers between Syria and Iraq to serve as small barracks.","https://www.ustranscom.mil/dtr/part-v/dtr_part_v_512.pdf"],[29.7929,35.2871,"United States","Jordan","Training Base, Al-Quwayrah","Al-Quwayrah","Army","Training Base","None","","","","The U.S. does have a presence in the country. This base is used as a training Base.","https://www.ustranscom.mil/dtr/part-v/dtr_part_v_512.pdf"],[32.5389,38.1958,"United States","Jordan","H-4 Air Base","Rwaished","Air Force","Training Base","2014","","","","Between November 2014 and January 2015, the United States began positioning MQ-9 Reaper UAVs at the base.","https://www.ustranscom.mil/dtr/part-v/dtr_part_v_512.pdf"],[32.0065,36.2193,"United States","Jordan","King Abdullah II Air Base","Amman","Air Force","Training Base","2021","","","","King Abdullah II Air Base is an airbase of the Royal Jordanian Air Force. Jordan does not host American bases, but the U.S. does have a presence in the country. This base is used as a training Base.","https://www.ustranscom.mil/dtr/part-v/dtr_part_v_512.pdf"],[29.3946,34.9658,"United States","Jordan","Royal Jordanian Navy Forces","Aqaba","Navy","Training Base","2021","","","","The Royal Jordanian Navy is a branch of the Jordanian Armed Forces, along with the land and air forces. Jordan does not host American bases, but the U.S. does have a presence in the country. This base is used as a training Base.","https://www.ustranscom.mil/dtr/part-v/dtr_part_v_512.pdf"],[32.0264,35.9781,"United States","Jordan","The King Abdullah II Special Operations Training Center","Amman","Army","Training Base","2021","","","","This base specializes in counter-terrorism, special operations and irregular warfare tactics, techniques and procedures. The base was built by a U.S. construction firm on land donated by the King of Jordan and paid for by the U.S. Defense Department Foreign Military Sales program. This base is used as a training Base.","https://www.ustranscom.mil/dtr/part-v/dtr_part_v_512.pdf"],[32.1622,37.1506,"United States","Jordan","Prince Hussein Air Base","Safawi","Air Force","Training Base","2021","","","","Jordan does not host American bases, but the U.S. does have a presence in the country. This base is used as a training Base.","https://www.ustranscom.mil/dtr/part-v/dtr_part_v_512.pdf"],[30.3375,36.1459,"United States","Jordan","King Faisal Air Base","Al-Jafr ","Air Force","Training Base","2021","","","","Jordan does not host American bases, but the U.S. does have a presence in the country. This base is used as a training Base.","https://www.ustranscom.mil/dtr/part-v/dtr_part_v_512.pdf"],[29.357,35.0472,"United States","Jordan","Titin Training Camp","Aqaba","Army","Training Base","2021","","","","Jordan does not host American bases, but the U.S. does have a presence in the country. This base is used as a training Base.","https://www.ustranscom.mil/dtr/part-v/dtr_part_v_512.pdf"],[34.158,132.1864,"United States","Japan","Atago Sports Cultural","Iwakuni","Marine Corps","Operator Only","1945","","","","The Atago Sports Complex is a joint-use facility between Marine Corps Air Station (MCAS) Iwakuni and Iwakuni City. It features various sports amenities, including tennis courts, volleyball courts, baseball and softball fields, and the Kizuna Baseball Stadium. The complex also includes the Lotus Cultural Center.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.6633,139.7256,"United States","Japan","Akasaka Press Center","Tokyo","Army","Operator Only","1945","","","","The Akasaka Press Center is a United States Army facility in the Roppongi area of Minato, Tokyo. It's also known as Hardy Barracks and is home to the Tokyo Recreational Lodging (TRL). The base also houses a helipad and gasoline pump.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[33.1168,129.6654,"United States","Japan","Akasaki POL Dep","Sasebo","Navy","Operator Only","1945","","","","Akasaki is a POL Depot facility in Japan that is 193 acres in size. It is one of three POL Depot facilities operated by a major tenant Fleet, along with Iroizaki and Yokose.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[34.2404,132.493,"United States","Japan","Akizuki Ammunition Depot","Akizuki","Army","Operator Only","1950","","","","The Akizuki Ammunition Depot, originally a Japanese naval ordnance center, came under U.S. control in 1949. It has since served as a storage and distribution point for U.S. Army munitions in the region. The facility has undergone various organizational changes and continues to support ammunition logistics.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[34.1428,132.2249,"United States","Japan","Atago Hills","Iwakuni","Marine Corps","Operator Only","1962","","","","Atago Hills is part of the Marine Corps Air Station (MCAS) Iwakuni in Japan. The base is over 1,300 acres and was officially designated in 1962. Its mission is to support the operations, maintenance, and supply of tenant units and ships.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.3627,127.7836,"United States","Japan","Naval Radio Transmitter Facility Awase","Kadena Air Base","Navy","Operator Only","1966","","","","Inside Kadena Air Base is a Naval Communications Detachment whose mission is to support the Seventh Fleet and supporting units, U.S. Naval Forces Japan and U.S. Naval Forces Korea. The detachment has four work centers, including the Naval Radio Transmitter Facility (NRTF) Awase provides HF transmitter support to the fleet and area commanders and LF transmitter support for submarines operating in the Pacific and Indian Oceans","https://www.globalsecurity.org/military/facility/awase.htm"],[35.301,139.6495,"United States","Japan","Azuma Storage Area","Yokosuka","Navy","Operator Only","1945","","","","The Azuma Storage Area is a U.S. Naval facility situated within the Yokosuka Naval Base. It serves as a storage site for various materials and equipment essential to naval operations. The facility is part of the logistics infrastructure supporting the U.S. Seventh Fleet.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.3919,127.8594,"United States","Japan","Camp Courtney","Camp Courtney Okinawa","Marine Corps","Operator Only","1955","","","","Camp Courtney is a U.S. Marine base in Uruma City, Okinawa, Japan. It is part of the larger Marine Corps Base Camp Smedley D. Butler. The base is home to the III Marine Expeditionary Force, 3rd Marine Division, and 3d MEB Headquarters.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.3014,127.7797,"United States","Japan","Camp Foster","Camp Foster Okinawa","Marine Corps","Operator Only","1955","","","","Camp Foster is a United States Marine Corps base in Ginowan City, Japan. It also extends into Okinawa City, Chatan town, and Kitanakagusuku village. The base was previously known as Camp Zukeran. According to The New York Times, a portion of Camp Foster has been returned to Japan. The rest remains operational.","https://www.nytimes.com/2025/02/18/world/asia/us-marines-japan-okinawa.html"],[35.3206,138.8687,"United States","Japan","Camp Fuji ","Camp Fuji","Marine Corps","Operator Only","1945","","","","Camp Fuji, officially known as the Combined Arms Training Center (CATC) Camp Fuji, is a U.S. Marine Corps installation located near the base of Mount Fuji. It provides training facilities for U.S. forces and supports joint training exercises with the Japan Ground Self-Defense Force. The camp has a long history of military training activities dating back to the early 20th century.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.689,128.2292,"United States","Japan","Camp Gonsalves","Henoko Okinawa","Marine Corps","Operator Only","1958","","","","Camp Gonsalves, established in 1958, is a U.S. Marine Corps jungle warfare training area located in northern Okinawa, Japan. It spans 30.2 square miles within the Yanbaru forest, a protected area home to numerous endangered species. The camp has been a focal point of environmental concerns, particularly regarding the construction of new helipads in 2016. It serves as the Jungle Warfare Training Center, providing specialized training for U.S. and allied forces.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.4605,127.9151,"United States","Japan","Camp Hansen/ MCB Camp S D Butler Okinawa JA","Onna Okinawa","Marine Corps","Operator Only","1955","","","","Camp Hansen is a U.S. Marine Corps base completed in 1965. It houses approximately 6,000 Marines and includes facilities such as a brig, firing ranges, and training areas. The camp has been involved in various military exercises and has faced local opposition due to its impact on the surrounding community.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.2525,127.6974,"United States","Japan","Camp Kinser Air Force","Makiminato Okinawa","Marine Corps","Operator Only","1945","","","","Camp Kinser, situated in Urasoe City, Okinawa, is a major logistics base for the U.S. Marine Corps. Established in 1949, it supports the 3rd Marine Logistics Group and includes facilities such as warehouses, maintenance shops, and housing. The base has been associated with environmental concerns, including reports of chemical contamination.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.3167,127.7667,"United States","Japan","Camp Lester, MCB Camp S D Butler Okinawa JA","Chatan","Marine Corps","Operator Only","1945","","","","Camp Lester is a United States military installation in Chatan, Okinawa, Japan. The camp was previously the site of the US Naval Hospital, which is now located on Camp Foster. he base is also referred to as Camp Kuwea.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.36,127.87,"United States","Japan","Camp McTureous FH Annex","Tengan","Marine Corps","Operator Only","1955","","","","Camp McTureous is located in Uruma City, Okinawa, and is part of Marine Corps Base Camp Smedley D. Butler. It provides family housing and community facilities, including an elementary school and recreational areas. The camp has been involved in discussions about the U.S. military presence on Okinawa and its effects on local communities.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.5246,128.0443,"United States","Japan","Camp Schwab / or/ MCB Camp S D Butler Okinawa JA (Camp Schwab-6009)","Henoko Okinawa","Marine Corps","Operator Only","1955","","","","Camp Schwab is a U.S. Marine Corps base located in Nago City, Okinawa. Established in 1959, it houses units such as the 4th Marine Regiment and the 3rd Reconnaissance Battalion. The base has been at the center of controversy due to plans for the relocation of Marine Corps Air Station Futenma to a site adjacent to Camp Schwab, facing significant local opposition.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.3681,127.8021,"United States","Japan","Camp Shields","Camp Shields Okinawa","Navy","Operator Only","1945","","","","Camp Shields is situated in Okinawa City and serves as a support base for the U.S. Navy's Naval Mobile Construction Battalion. It includes facilities for equipment repair, resource storage, and housing. The camp is located near Kadena Air Base and has been part of discussions regarding the U.S. military footprint on the island.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.3647,127.7953,"United States","Japan","Camp Shields Family Housing Annex","Camp Shields Okinawa","Air Force","Operator Only","1989","","","","Camp Shields Family Housing Annex is a base that includes barracks, residential housing, and recreational facilities. It's located behind Kadena Air Base and the Kadena Ammunition Storage Area.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.5138,139.3937,"United States","Japan","Camp Zama","Sagamihara","Army","Operator Only","1945","","","","Camp Zama is home to the U.S. Army Japan (USARJ), I Corps (Forward), U.S. Army Aviation Battalion Japan Ninjas, 311th Military Intelligence Battalion, Japan Engineer District (U.S. Army Corps of Engineers), 78th Signal Battalion and the Bilateral Coordination Department and 4th Engineer Group of the Japan Ground Self-Defense Force. The base has been involved in joint U.S.-Japan military activities and has faced scrutiny over its presence in a densely populated area.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[42.83,141.64,"United States","Japan","Chitose Administration Annex","Chitose","Air Force","Operator Only","1945","","","","The Chitose Administration Annex is located in Chitose, Hokkaido, and is also known as Camp Chitose or Chitose III. It was previously used by the U.S. Air Force until 1957. It is adjacent to Chitose Air Base, which is now operated by the Japan Air Self-Defense Force. The annex has been part of discussions about the historical U.S. military presence in northern Japan.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[33.1628,129.7114,"United States","Japan","COMFLEACT Sasebo","Sasebo","Navy","Operator Only","1945","","","","This base provides facilities for the logistic support of forward-deployed units and visiting operating forces of the United States Pacific Fleet and designated tenant activities.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.2932,139.6713,"United States","Japan","COMFLEACT Yokosuka","Yokosuka","Navy","Operator Only","1945","","","","This base is a United States Navy base in Yokosuka, Japan. Its mission is to maintain and operate base facilities for the logistic, recreational, administrative support and service of the U.S. Naval Forces Japan, Seventh Fleet and other operating forces assigned in the Western Pacific. CFAY is the largest strategically important U.S. naval installation in the western Pacific.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[40.7152,141.3558,"United States","Japan","Draughon Training Range","Misawa Air Force Base","Air Force","Training Base","1946","","","","This base is located near Misawa Air Base in Aomori Prefecture, Draughon Range is the only air-to-ground range on mainland Japan. It supports training for the 35th Fighter Wing and other units, focusing on missions such as Suppression of Enemy Air Defenses (SEAD), munition employment, and combat search and rescue.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[33.1216,129.6634,"United States","Japan","Drydock Area 5030","Sasebo","Navy","Operator Only","1945","","","","The United States Navy uses dry docks for repairs and maintenance. The Navy has four public shipyards with 18 dry docks to maintain its nuclear-powered fleet.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[40.52,141.53,"United States","Japan","Hachinohe POL Dep","Hachinohe","Navy","Operator Only","1945","","","","Hachinohe POL Depot is a United States Forces Japan facility located in Hachinohe, Aomori. The Navy Region Japan maintains security at the facility and its 17-mile pipeline.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[33.1917,129.6789,"United States","Japan","Hario Housing Area","Sasebo","Navy","Operator Only","1945","","","","Situated in Sasebo, Nagasaki Prefecture, the Hario Housing Area provides military family housing for U.S. service members and their families. It includes various amenities and support services to accommodate accompanied tours in the region.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[33.1209,129.7641,"United States","Japan","Hario Shima Ammo","Sasebo","Navy","Operator Only","1945","","","","The Hario Shima facility is one of the largest ordnance storage areas in the Western Pacific. It stores and maintains a significant amount of Navy and Marine Corps munitions.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[36.012,137.0098,"United States","Japan","Hiro Ammunition Depot","Kure","Army","Operator Only","1950","","","","The Ammunition Depot, 10th Support Group (Regional) operates the only DoD Explosives Safety Board licensed and approved burn site in Japan. The Ammunition Peculiar Equipment (APE) 1236 M1 Deactivation Furnace demilitarizes small caliber rounds and components. The APE 1408 Safety Certification Unit certifies fired range brass.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.3858,127.1026,"United States","Japan","Idesuna Jima Air Range","Okinawa Island","Air Force","Operator Only","1945","","","","Idesuna Jima Range is approximately 4 km from Tonaki Jima and the entire uninhabited island of Idesuna Jima Range is used for training. All branches of the U.S. Forces conduct live firing exercises from the air onto the island.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.7231,127.778,"United States","Japan","Ie Jima Aux Airfield /or/ MCB Camp S D Butler Okinawa JA (Ie Jima Aux Airfield)","Henoko Okinawa","Marine Corps","Operator Only","1945","","","","The Ie Jima Auxiliary Airfield is used by the U.S. Marine Corps for various training exercises, including parachute drops and touch-and-go landings. The facility includes a simulated Landing Helicopter Assault (LHA) deck and supports Marine Wing Support Squadron 172.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.3043,139.5903,"United States","Japan","Ikego Housing Area","Ikego","Navy","Operator Only","1945","","","","The Ikego Housing Area, located in Zushi, Kanagawa Prefecture, serves as a residential area for U.S. military personnel and their families. Originally established as a munitions storage site by the Imperial Japanese Navy in 1938, it was seized by the U.S. Army in 1945 and repurposed for housing. The area encompasses approximately 710 acres, accounting for about 14.5% of Zushi City's area.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[33.1179,129.7061,"United States","Japan","Iorizaki POL Dep","Sasebo","Navy","Operator Only","1945","","","","The Iorizaki POL Depot is a storage facility for the United States Forces in Japan. The United States Seventh Fleet is based in Yokosuka. The Iorizaki POL Depot was established in 1945. It is one of several fuel terminals in Japan, including the Akasaki and Yokose terminals.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[33.5844,130.4517,"United States","Japan","Itazuke Auxiliary Airfield","Fukuoka","Air Force","Operator Only","1950","","","","Itazuke AB was the largest USAF base on Kyūshū, but was closed in 1972. Although the base was closed, the United States Air Force still uses the airport occasionally.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[24.774,141.3273,"United States","Japan","Iwo Jima-3181","Iwo-jima","Navy","Operator Only","1945","","","","The Iwo Jima Communication Site, designated as FAC3181, is located on Iwo Jima in the Ogasawara Islands. Following the Japanese surrender in World War II, the U.S. military occupied Iwo Jima and established this facility. It is maintained under the U.S.–Japan Status of Forces Agreement and serves as a communication site for the U.S. Navy.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.3559,127.7679,"United States","Japan","Kadena Air Base","Kadena Air Base Okinawa","Air Force","Operator Only","1945","","","","Kadena Air Base, situated in Okinawa Prefecture, is the largest U.S. Air Force base in East Asia. It hosts the 18th Wing and supports various operations, including air defense and reconnaissance. The base has been a focal point of local opposition due to concerns over noise, safety, and environmental impact.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.3657,127.7523,"United States","Japan","Kadena Ammo Storage Annex","Kadena Air Base Okinawa","Air Force","Operator Only","1972","","","","The Kadena Ammunition Storage Annex, also known as the Kadena Munitions Storage Area, is a forested area northeast of Kadena Air Base. It covers multiple municipalities and serves as a storage site for munitions. The area is ecologically significant, housing rare flora and fauna, and has been subject to environmental concerns.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[34.39,132.44,"United States","Japan","Kawakami Ammunition Depot","Higashi-hiroshima","Army","Operator Only","1945","","","","The Kawakami Ammunition Depot, located in Hiroshima Prefecture, is managed by the U.S. Army. It functions as a storage and distribution point for various types of munitions. The facility has been part of discussions about the historical U.S. military presence in the region.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.4434,127.9382,"United States","Japan","Kin Blue Beach - 6020","Onna Okinawa","Marine Corps","Operator Only","1955","","","","Kin Blue Beach, located in Okinawa Prefecture, is used by the U.S. Marine Corps for amphibious training exercises. The area has been a site for various military drills, including the landing of Amphibious Combat Vehicles. These activities have raised environmental and community concerns due to their impact on the local ecosystem.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.395,139.9131,"United States","Japan","Kisarazu JGSDF","Kisarazu","Navy","Operator Only","1945","","","","The United States used Kisarazu Air Field to repair Navy jets stationed on Pacific aircraft carriers. In 1968, the Japan Air Self-Defense Force moved to Iruma Air Base, and the Japan Ground Self-Defense Force took over Kisarazu. In 2014, the Japanese government offered Kisarazu as a maintenance hub for the United States Marine Corps' V-22 Ospreys.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[24.4439,124.2135,"United States","Japan","Kobi Sho Range 6084","Okinawa Island","Navy","Operator Only","1945","","","","Located near Ishigaki Island in Okinawa Prefecture, Kobi Sho Range is utilized by U.S. Forces Japan for air-to-ground bombing and gunnery training with conventional aircraft ordnance. Its remote location has raised environmental concerns due to potential impacts on marine ecosystems.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.47,139.62,"United States","Japan","Koshiba POL Dep 3113","Yokohama","Navy","Operator Only","1945","","","","Koshiba POL Depo is situated in Yokosuka, Kanagawa Prefecture, the Koshiba Petroleum, Oil, and Lubricants Depot serves as a fuel storage facility supporting U.S. naval operations. The presence of such facilities has been a point of contention among local communities concerned about environmental and safety risks.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[34.2275,132.5503,"United States","Japan","Kure Pier 6","Kure","Army","Operator Only","1950","","","","Kure Pier 6 is located in Kure, Hiroshima Prefecture, Pier 6 is a U.S. Army port facility supporting logistics and ammunition storage. Its operations have been scrutinized due to the potential hazards associated with munitions handling in populated areas.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.7643,135.1964,"United States","Japan","Kyogamisaki Communication Site","Kyoto","Army","Operator Only","1945","","","","This U.S. Army communications facility is part of a missile defense system. The site's establishment has faced opposition from residents concerned about its role in regional militarization and potential as a target in conflicts.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[33.0952,129.7431,"United States","Japan","Maebata Ordnance Facility","Sasebo","Navy","Operator Only","1945","","","","Located in Sasebo, Nagasaki Prefecture, Maebata is one of the largest U.S. Navy ordnance storage sites in the Western Pacific. The storage and maintenance of large quantities of munitions have raised environmental and safety concerns among local populations.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.2708,127.7481,"United States","Japan","Marine Corps Air Station Futenma","Futenma Marine Corps Air Stati","Marine Corps","Operator Only","1945","","","","This base is a United States Marine Corps base. It is home to approximately 3,000 Marines of the 1st Marine Aircraft Wing and other units. For years, the relocation of the base has been a major political issue for Okinawa, Japan and the US military and diplomacy in Asia.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[34.145,132.2442,"United States","Japan","Marine Corps Air Station Iwakuni","Iwakuni","Marine Corps","Operator Only","1952","","","","This base is a United States Marine Corps air station in Japan. The Marine Corps took control of the installation in 1958. The station was officially designated as MCAS Iwakuni in 1962. The station's mission is to support operations, maintenance, and supply of tenant units and ships.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.2974,127.783,"United States","Japan","MCB Camp S D Butler ASP","Koza","Marine Corps","Operator Only","1955","","","","Part of the Marine Corps Base Camp S.D. Butler complex in Okinawa, this facility stores and manages munitions. The concentration of such military infrastructure in Okinawa has been a longstanding issue, with locals advocating for a reduction in U.S. military presence due to associated risks and land use concerns.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[40.7053,141.3719,"United States","Japan","Misawa Air Base","Misawa Air Force Base","Air Force","Operator Only","1946","","","","This base is an air base of the Japan Air Self-Defense Force (JASDF), the United States Air Force, and the United States Navy located in Misawa, Aomori, in the northern part of the island of Honshū of Japan.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.7539,139.3398,"United States","Japan","Momote Annex","Saitama Ken","Air Force","Operator Only","1946","","","","Momote Annex is an airfield management facility in Japan.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.4547,139.45,"United States","Japan","Naval Air Facility Atsugi","Atsugi","Navy","Operator Only","1950","","","","This base is a joint Japan-US naval air base located in Japan. It is the largest United States Navy (USN) air base in the Pacific Ocean and once housed the squadrons of Carrier Air Wing Five (CVW-5), which deploys with the aircraft carrier USS Ronald Reagan.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.2908,139.6714,"United States","Japan","Nagasaka Rifle Range","Yokosuka","Navy","Operator Only","1945","","","","The Nagasaka Rifle Range, designated as FAC 3104, is a training area used by the Japan Ground Self-Defense Force and U.S. forces . Its operation has been a point of contention due to noise pollution and the potential risks associated with live-fire exercises near civilian areas.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.2083,127.6667,"United States","Japan","Naha Port","Okinawa Island","Army","Operator Only","1945","","","","The Naha Port Facility, formerly the Naha Military Port, is a United States Forces Japan facility located in Naha, Okinawa, Japan. The Naha Military Port was constructed by the U.S. troops after their landing on Okinawa Island in 1945. The port's presence has been controversial, with local communities expressing concerns over its environmental impact and the delay in returning the land to Japan.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.3491,139.6507,"United States","Japan","Negishi Dh Area","Yokohama","Navy","Operator Only","1945","","","","The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.0872,127.6991,"United States","Japan","Okidaito Jima Rng 6088","Okinawa Island","Navy","Operator Only","1945","","","","Okidaito Jima Range is a United States Forces Japan (USFJ) installation with the FAC 6088 code. The island of Okidaitōjima was used as a bombing range by the US Navy after World War II. In 1972, the island was returned to Japan. The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2025.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.3576,127.7873,"United States","Japan","Okuma Recreation Annex","Okuma Okinawa","Air Force","Operator Only","1947","","","","Okuma Recreation Annex is located at Kadena Air Base in Okinawa, Japan. It's part of the 18th Mission Support Group, which also includes the 18th Logistics Readiness Squadron and the 18th Security Forces Squadron. It's exclusively for military and government employees.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.7817,139.5462,"United States","Japan","Owada Communications Station","Owada","Air Force","Operator Only","1975","","","","The Owada Communications Station is a U.S. military communication facility located in Niiza. Its operations have been a subject of concern for residents due to potential electromagnetic emissions and the broader issue of foreign military installations in residential areas.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.5808,139.3778,"United States","Japan","Sagami General Depot","Sagamihara","Army","Operator Only","1945","","","","This base was established in 1935, the Sagami General Depot is a U.S. Army logistics base. It has been involved in various military operations and currently supports logistics and supply functions. The depot's presence has been controversial, particularly after incidents such as the 2015 explosions in a storage building, raising safety and environmental concerns among local residents .","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.5243,139.4191,"United States","Japan","Sagamihara Family Housing Area","Sagamihara","Army","Operator Only","1945","","","","Sagamihara Family Housing Area (SHA) is one of two main housing areas for the Camp Zama community in Japan. The other is Camp Zama. Both are located in Kanagawa Prefecture, about 25 miles southwest of Tokyo. SHA is part of the U.S. Army Garrison Japan (USAGJ).","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.6468,139.7253,"United States","Japan","Sanno Hotel Tokyo-3185","Tokyo","Navy","Operator Only","1945","","","","The New Sanno Hotel is a U.S. military building that is still used by the U.S. military. The U.S. Navy operates the hotel. The hotel was leased to the U.S. government during the Occupation of Japan (1945-1952). The U.S. military used the hotel as a billeting and PX facility until the 1980s.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[24.5127,124.2718,"United States","Japan","Sekibi Sho Range 6085","Okinawa Island","Navy","Operator Only","1978","","","","Sekibi Sho, also known as Taishō Island, was added to the list of U.S. military bombing ranges in 1956. The use of this island for military exercises has been a point of contention due to environmental concerns and its location in a region with rich marine biodiversity.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[40.9666,140.3212,"United States","Japan","Shariki Communication Site","Zama","Army","Operator Only","1945","","","","The Shariki Communications Site is a radar site located on the northern edge of the Japanese island of Honshu. The site is home to the 10th Missile Defense Detachment, which has been operational since 2006. The site's AN/TPY-2 Radar is a land-based X-Band Radar that can detect ballistic missiles.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.6507,139.4845,"United States","Japan","Tama Service Annex","Tana","Air Force","Operator Only","1945","","","","The Tama Service Annex, situated in Inagi City, Tokyo, was formerly the site of the Japanese Army's Tama Ammunition Depot. Currently, it functions as a recreational facility for U.S. military personnel and their families, featuring amenities such as a golf course and camping areas. Access to the facility is generally restricted, with limited public entry during specific events.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.4051,127.8445,"United States","Japan","Tengan Pier 6028","Tengan","Navy","Operator Only","1945","","","","Tengan Pier is a U.S. military base in Okinawa, Japan. It's part of the United States Forces Japan, which is used by all branches of the U.S. military, including the U.S. Navy. The pier is a port facility for the U.S. Marine Corps. It can handle ships carrying up to 20,000 tons of cargo, including dangerous materials like munitions.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.8079,139.4724,"United States","Japan","Tokorozawa Transmitter Site","Tokorozawa","Air Force","Operator Only","1945","","","","The Tokorozawa Transmitter Site is a U.S. Air Force communications facility located in Tokorozawa City, Saitama Prefecture. Despite local demands for the return of the land, only a small portion has been relinquished, leading to ongoing discussions about the future of the site and its impact on the community.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[30.4838,140.2992,"United States","Japan","Tori Shima Air Range","Okinawa Island","Air Force","Operator Only","1945","","","","Tori Shima, an uninhabited island approximately 28 km north of Kume Island, serves as a U.S. military training range. The entire island is utilized for various training exercises, including live-fire drills. Past incidents, such as the accidental firing of depleted uranium rounds, have raised environmental and safety concerns among local populations.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.3792,127.7367,"United States","Japan","Torii Station","Okinawa","Army","Operator Only","1945","","","","This base is a United States Army facility. It is home to the United States Army on Okinawa, 10th Support Group (Regional), along with the 1st Battalion, 1st Special Forces Group (Airborne), 247th MP DET, and the 349th Signal Company (78th SIG BN). Formerly named Torii Station, the garrison was re-designated in March 2014.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.47,139.62,"United States","Japan","Tsurumi POL Dep","Yokohama","Navy","Operator Only","1945","","","","The Tsurumi POL Depot is located in the Yokohama harbor. The Yokosuka Resident Office is responsible for the Tsurumi POL Depot. The Public Works Department Yokosuka also includes the Tsurumi POL Depot. The Tsurumi POL Depot is also known as the US Government Tsurumi Fuel Terminal. Japan Oil Transportation Co., Ltd. provides POL trucking services from the Tsurumi Fuel Terminal to Yokota Air Base.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.3015,127.9104,"United States","Japan","Ulibaru Jima Range","White Beach Nav Inst","Marine Corps","Operator Only","1945","","","","Ukibaru Jima, an uninhabited island in Okinawa Prefecture, is used as a U.S. military training range. The island's utilization for military exercises has sparked environmental concerns, particularly regarding the preservation of its natural habitats and marine ecosystems.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.3097,139.6388,"United States","Japan","Urago Ordinance","Yokosuka","Navy","Operator Only","1945","","","","Urago Ordinance is a US military base in Yokosuka, Japan. The base is located near a Navy Munitions Command. The US Navy and USACE are involved in the construction of a loading wharf in Urago.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.3045,127.915,"United States","Japan","White Beach","White Beach Nav Inst","Navy","Operator Only","1945","","","","The White Beach Naval Facility is a staging area for Marines and their equipment, based on Okinawa. This departure point allows utility landing craft and air-cushioned landing vehicles to ferry troops, vehicles and equipment to amphibious ships pier side or at sea. Its presence has been a focal point of local protests due to concerns over environmental degradation and the militarization of the region.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.4741,139.6466,"United States","Japan","Yokohama No Dock","Yokohama","Navy","Operator Only","1945","","","","The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.4722,139.644,"United States","Japan","Yokohama North Dock","Yokohama","Army","Operator Only","1945","","","","Yokohama North Dock is a U.S. Army transportation hub located in Yokohama, Kanagawa Prefecture. It supports logistics operations and is co-located with the U.S. Army 836th Transportation Battalion. The facility plays a role in port operations and maintenance for Military Sealift Command units operating within the Pacific theater.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[32.9984,129.8067,"United States","Japan","Yokose POL Depot","Sasebo","Navy","Operator Only","1945","","","","The Yokose POL Depot is a military facility in Nagasaki, Japan. It is located in Saikai City, Nagasaki Prefecture. The Yokose POL Depot is one of three POL Depot facilities in Japan, which total 402 acres. The other two are Akasaki and Iroizaki. The Yokose POL Depot is 153 acres.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.7486,139.3486,"United States","Japan","Yokota Air Base","Yokota Air Base","Air Force","Co-base","1946","","","","Tokyo, Yokota Air Base serves as the headquarters for United States Forces Japan and the Fifth Air Force. It hosts the 374th Airlift Wing, which provides rapid global mobility through airlift operations.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.3431,127.7571,"United States","Japan","Awase Communication Site","Kadena Air Base","Navy","Operator Only","1945","","","","The Awase Communication Site is located near the tip of the Awase Peninsula in Okinawa City. It provides communication support, including Low Frequency (LF) submarine broadcasts and Extremely High Frequency (EHF) circuits, for U.S. naval operations in the Pacific.","https://www.globalsecurity.org/military/facility/awase.htm"],[33.1276,129.7286,"United States","Japan","Sakibe Navy Annex","Sasebo ","Navy","Co-base","1945","","","","The Sakibe Navy Annex is a United States Navy unit located at the Sakibe Bay facility, away from the Sasebo base. The annex provides space for LCAC operations and maintenance. The detachment is split between the USS GERMANTOWN (LSD-42) and the USS FORT MCHENRY (LSD-43) when deployed on local operations.","https://www.globalsecurity.org/military/facility/sakibe.htm"],[26.333,127.7774,"United States","Japan","COMFLEACT Kadena","Okinawa","Navy","Operator Only","1945","","","","Commander, Fleet Activities Okinawa (CFAO) is located on the north side of Kadena Air Base, next to Kadena Town. CFAO's facilities include Camp Marvin B and other U.S. Naval facilities.","https://cnrj.cnic.navy.mil/Installations/CFA-Okinawa/#:~:text=Welcome%20to%20Commander%2C%20Fleet%20Activities,5493%20from%20a%20commercial%20line."],[35.5136,139.3968,"United States","Japan","Camp Zama Communications Stn","Zama","Air Force","Operator Only","1945","","","","Camp Zama, located in Kanagawa Prefecture, hosts a communications station that ensures connectivity for U.S. Army Japan. The facility provides internet services, satellite communications, and telephone connectivity, supporting various military operations.","https://www.pacom.mil/Media/NEWS/News-Article-View/Article/2317037/air-force-unit-keeps-communications-running-247-at-camp-zama/"],[26.3902,127.8596,"United States","Japan","Camp Courtney FH Annex","Okinawa","Air Force","Operator Only","1955","","","","The Camp Courtney Family Housing Annex is part of the Marine Corps Base Camp S.D. Butler complex in Okinawa. It provides housing for U.S. military families stationed at Camp Courtney and nearby installations.","https://www.housing.af.mil/Home/Installations/Okinawa/#:~:text=Effective%201%20Aug%202009%2C%20all,is%2060%20minutes%20or%20less."],[26.2525,127.6974,"United States","Japan","Camp Kinser Marines","Makiminato Okinawa","Marine Corps","Operator Only","1945","","","","Camp Kinser is a U.S. Marine Corps logistics base located in Urasoe, Okinawa Prefecture. It serves as a major logistics hub for Marine Corps Forces on Okinawa, housing the 3rd Marine Logistics Group. The base includes various facilities, including housing, dining, and recreational amenities.","https://www.bileckilawgroup.com/locations/japan/camp-kinser/"],[40.7045,141.3858,"United States","Japan","Naval Air Facility Misawa","Misawa","Navy","Operator Only","1938","","","","Naval Air Facility (NAF) Misawa is an associate command, hosted by the U.S. Air Force 35th Fighter Wing (FW). NAF Misawa is tasked with providing aviation and ground logistic support and services to all permanent and transient USN and USMC forces in Northern Japan. NAF Misawa hosts 13 permanently assigned associate and tenant commands.","https://militarybases.com/overseas/japan/naf-misawa/"],[26.3844,127.738,"United States","Japan","US Army Garrison Okinawa Headquarter","Okinawa","Army","Operator Only","1945","","","","The U.S. Army Garrison Okinawa Headquarters is located at Torii Station in Yomitan, Okinawa Prefecture. It provides support to U.S. Army units on the island and coordinates with other U.S. military branches. The garrison also manages installation services and community programs for soldiers and their families.","https://www.dw.com/en/japan-why-okinawa-is-strategically-crucial-for-us-military/a-67502058"],[35.2932,139.6713,"United States","Japan","Fleet Activities Yokosuka","Yokosuka","Navy","Operator Only","1945","","","","This base is a United States Navy base in Yokosuka, Japan. Its mission is to maintain and operate base facilities for the logistic, recreational, administrative support and service of the U.S. Naval Forces Japan, Seventh Fleet and other operating forces assigned in the Western Pacific. CFAY is the largest strategically important U.S. naval installation in the western Pacific.","https://militarybases.com/overseas/japan/yokosuka/"],[33.1628,129.7114,"United States","Japan","Fleet Activities Sasebo","Sasebo","Navy","Operator Only","1883","","","","This base provides facilities for the logistic support of forward-deployed units and visiting operating forces of the United States Pacific Fleet and designated tenant activities.","https://militarybases.com/?s=Fleet+Activities+Sasebo"],[26.3376,127.7536,"United States","Japan","Fleet Activities Okinawa"," Okinawa","Air Force","Operator Only","1945","","","","Fleet Activities Okinawa (CFAO) is a U.S. naval base in Okinawa, Japan. The base was established during the Korean War, which is about half a decade after most other American bases in Japan were established. CFAO is located on the north side of Kadena Air Base, next to Kadena Town. CFAO facilities include Camp Marvin B and other U.S. naval facilities.","https://militarybases.com/?s=Fleet+Activities+Okinawa"],[26.2957,127.7771,"United States","Japan","Fort Buckner"," Okinawa","Army","Operator Only","1945","","","","Fort Buckner is situated near Camp Foster in Okinawa, Fort Buckner is a U.S. Army installation hosting the 78th Signal Battalion and E Company of the 53rd Signal Battalion. It provides communication support for U.S. military operations in the region. The base relies on nearby installations for additional support services.","https://militarybases.com/overseas/japan/fort-buckner/"],[33.1527,129.7057,"United States","Japan","US Navy Fuel Center Akasaki","Nagasaki","Army","Operator Only","1946","","","","US Navy Fuel Center Akasaki is located in Sasebo, Nagasaki Prefecture, the Akasaki Fuel Center is a primary fueling station for U.S. Navy vessels in the Seventh Fleet area of responsibility. It supports naval operations by providing fuel and maintenance services.","https://files.pca-cpa.org/pcadocs/2017-06/15.%20Russian%20Federation%20-%20Hearing%20on%20Merits%20-%20Additional%20Exhibits/15.%20Russian%20Federation%20-%20Hearing%20on%20Merits%20-%20Additional%20Exhibits/RU-824.pdf"],[26.3814,127.8464,"United States","Japan","Camp McTureous","Tengan","Marine Corps","Operator Only","1955","","","","Camp McTureous is part of Marine Corps Base Butler in Kawasaki and Nishihara, Uruma City, Okinawa, Japan.","https://www.scmp.com/week-asia/health-environment/article/3093435/anger-japan-us-army-bases-report-mounting-covid-19"],[31.3681,130.8381,"United States","Japan","Kanoya Air Base","Kanoya","Army","Co-base","2018","","","Drone Base","Kanoya Air Base base is operated by the Japan Maritime Self-Defense Force. It has hosted U.S. military units, including the 319th Expeditionary Reconnaissance Squadron, under bilateral agreements. The base supports joint training and operations between U.S. and Japanese forces.","https://www.eurasiantimes.com/major-relocation-plan-usaf-announces-arrival-of-first-mq/"],[26.3551,127.7674,"United States","Japan","Marine Wing Liaison Kadena","Okinawa","Marine Corps","Operator Only","1945","","","","Marine Wing Liaison Kadena (MWLK) is a United States Marine Corps logistics and liaison unit based at Kadena Air Base in Okinawa, Japan. They fall under 1st Marine Aircraft Wing and III Marine Expeditionary Force.","https://www.1stmaw.marines.mil/Portals/65/Docs/MWLK/MWLK_MissionBrief.pdf?ver=qNzDLhoKUCZh8NmZlPF-FA%3D%3D"],[33.0822,129.7163,"United States","Japan","US Navy Yokose Filling Station","Saikaicho","Navy","Operator Only","1971","","","","The US Navy Yokose Fuel Terminal is located in Sasebo, Nagasaki Prefecture. The Yokose Fuel Terminal is a U.S. Navy facility that underwent a significant upgrade with the completion of a new fuel pier in September 2022.","https://www.dvidshub.net/image/8474685/uss-america-lha-6-refuels-yokose-fuel-terminal"],[26.2934,127.7739,"United States","Japan","US Hospital Okinawa","Okinawa","Navy","Operator Only","1977","","","","U.S. Naval Hospital Okinawa is situated on Camp Foster in Okinawa, the U.S. Naval Hospital Okinawa serves as the primary medical facility for U.S. military personnel and their families in the region. It was relocated from Camp Lester to its current location on Camp Foster in March of 2013.","https://www.med.navy.mil/US-NMRTC-Okinawa-Japan/"],[32.2944,131.35,"United States","Japan","Camp Foster FH Annex","Okinawa","Air Force","Operator Only","1955","","","","Camp Foster is a United States Marine Corps camp in Ginowan City, Japan. It's home to Marine Corps Base Okinawa and several housing towers and areas for families. The housing process is centralized for all accompanied Marines, Sailors, Soldiers, and Airmen.","https://cnrj.cnic.navy.mil/Installations/CFA-Okinawa/About/Installation-Guide/Installations/Foster"],[26.7231,127.778,"United States","Japan","Ie Shima Airfield","Ie Shima","Army","Operator Only","1945","","","","Ie Shima Airfield is a former World War II airfield complex. The US military still uses part of the former Ie Shima Airfield as a training facility. The airfield is used for parachute drops, vertical take-off and landing aircraft, and touch and go practice. The US Marine Corps operates the range, which includes a simulated LHA deck and a drop zone.","https://pacificwrecks.com/airfield/japan/ie_shima/index.html"],[35.513,139.3951,"United States","Japan","Camp Zama, POL Facilities","Unknown","Army","Operator Only","None","","","","At Camp Zama in Kanagawa Prefecture, Petroleum, Oil, and Lubricants (POL) facilities are integral to the base's logistical operations, ensuring fuel and related supplies are available for U.S. Army activities in the region.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.5134,139.3972,"United States","Japan","Camp Zama, White Beach Area","Unknown","Army","Operator Only","None","","","","The White Beach Area, associated with U.S. military operations, is located near the tip of the Katsuren Peninsula in Okinawa. It features port facilities that accommodate various naval vessels and supports joint U.S.-Japan maritime activities.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.3892,127.8618,"United States","Japan","TAIYO GOLF COURSE","Koza","Marine Corps","Operator Only","None","","","","Taiyo Golf Course, situated in Uruma, Okinawa, is a recreational facility managed by Marine Corps Community Services. It offers an 18-hole course for service members and their families.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.6486,127.8829,"United States","Japan","YAEDAKE COMMUNICATIONS ANNEX SITE 10","Okinawa Island","Air Force","Operator Only","None","","","","Yaedake Communications Annex Site 10 is located in Motobu, Okinawa. It is a U.S. military communication facility. While portions of the site were returned to Okinawa in 1994, the remaining area continues to support communication operations.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.3604,127.8703,"United States","Japan","Kachin Hanto Area","Gushikawa","Army","Operator Only","1945","","","","The term \"Kachin Hanto Area\" refers to a U.S. military facility located in Okinawa, Japan, specifically associated with the White Beach Naval Port. This installation, known as \"Kachin Hanto Area A,\" is part of the broader network of U.S. military bases in Japan and is utilized for various logistical and operational purposes by the U.S. Navy. It was listed among the U.S. military installations in Japan in the DoD report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[34.1448,132.2441,"United States","Japan","Iwakuni Communications Station","Iwakuni ","Marine Corps","Co-base","1940","","","","Marine Corps Air Station Iwakuni is a U.S. Marine Corps / joint-use air station in Yamaguchi Prefecture, Japan, located in the Nishiki River delta, about 1.3 nautical miles southeast of Iwakuni Station. It is leased from the Japanese government and operated under the U.S.–Japan security framework.","https://www.globalmilitary.net/airbases/marine-corps-air-station-iwakuni/"],[33.064,129.6687,"United States","Japan","Sakibe Navy Annex","Sakibe ","Navy","Operator Only","None","","","","Sakibe Navy Annex is a component facility under U.S. Fleet Activities Sasebo (CFAS) in Japan. It hosts LCAC (Landing Craft, Air Cushion) operations and maintenance detachments.","https://www.globalsecurity.org/military/facility/sakibe.htm"],[-2.2745,40.9009,"United States","Kenya","Magogoni Airfield","Lamu County","Unknown","Co-base","None","","","","Magogoni Airfield, located near Manda Bay in Lamu County, serves as a joint-use facility for U.S. and Kenyan military operations. It is utilized for logistics, personnel recovery, and intelligence, surveillance, and reconnaissance missions. In January 2020, the airfield was the site of an attack by al-Shabaab militants, resulting in the deaths of three Americans and the destruction of several aircraft.","https://shabellemedia.com/boost-as-us-military-conducts-operations-in-lamu-in-war-against-al-shabaab/"],[0.5461,36.5359,"United States","Kenya","Lakipia","Lakipia","Unknown","Unknown","None","","","","According to secret documents revealed in 2017, some of AFRICOM’s CL inventory, including Lakipia, the site of a Kenyan Air Force base in Kenyan, has been disclosed. Since then, there have been no updates regarding the funding and usage of this site.","https://www.the
