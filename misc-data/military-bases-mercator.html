showing how observation points often escalate rather than de-escalate conflict.","https://vdc-nsy.com/archives/38701"],[36.0077,36.9993,"Turkiye","Syria","Observation points (Aleis)","","Army","Operator Only","2017","","","","Located on the Al‑Eiss (also spelled Aleis) hills south of Aleppo, this Turkish tower began operations in February 2018 under the Astana de-escalation deal. Rather than reducing conflict, it became a regular target of Syrian regime artillery and deepened Turkey’s logistical entrenchment in contested territory.","https://vdc-nsy.com/archives/38701"],[35.8258,36.9464,"Turkiye","Syria","Observation points (Tala Tuqan)","","Army","Operator Only","2020","","","","Set up in February 2018 on Tell Tuqan, east of Saraqeb in Idlib, it was intended to monitor ceasefire zones. However, it has since turned into a militarized outpost, reinforcing Ankara’s domination and illustrating how civilian oversight morphed into frontline occupation.","https://vdc-nsy.com/archives/38701"],[35.6632,36.6914,"Turkiye","Syria","Observation points (Surman village)","","Army","Operator Only","2018","","","","While Turkish forces established many towers, no verified public mention is found for “Surman village.” If present, such a site fits Turkey’s pattern of deploying observation posts deep inside Idlib, where they increasingly function as coercive checkpoints rather than peacekeepers.","https://vdc-nsy.com/archives/38701"],[35.3623,36.6963,"Turkiye","Syria","Observation points (Mork)","","Army","Operator Only","2018","","","","Established in April 2018, this observation tower near Morek in southern Idlib has been encircled multiple times by Syrian regime forces. It has transitioned from a monitoring role to becoming a flashpoint in anti-regime offensives, exemplifying Turkey’s strategic overreach.","https://vdc-nsy.com/archives/38701"],[35.1636,36.3392,"Turkiye","Syria","Observation points (Alzaawia)","","Army","Operator Only","2018","","","","Situated on Jabal al-Zawiya in southern Idlib, this Turkish observation post was one of 17 emplaced as part of Ankara’s “de-escalation” strategy in mid–2024. Far from easing tensions, its ongoing reinforcement with armored convoys and weaponry demonstrates that Turkey has effectively militarized the mountain range—turning it into a fortified forward base that shields extremist factions and actively hinders Syrian regime advances.","https://vdc-nsy.com/archives/38701"],[35.8114,36.1333,"Turkiye","Syria","Observation points (Zaytuna)","","Army","Operator Only","2018","","","","Built in April 2018 on Jabal Zaytuna in northern Latakia, this observation post reinforces Turkey’s network in the de-escalation zone. It underscores militarization of high ground and control over strategic terrain under the guise of monitoring.","https://vdc-nsy.com/archives/38701"],[36.1332,36.7818,"Turkiye","Syria","Kafr Nasih","","Army","Operator Only","2020","","","","Located in western Aleppo countryside, the Turkish post in Kafr Nasih occupies civilian homes and agricultural lands, militarizing local communities and disrupting educational services—serving as part of Ankara’s broader strategy of asserting control in non-state zones.","https://aawsat.com/home/article/4136146/%D8%AA%D8%B1%D9%83%D9%8A%D8%A7-%C2%AB%D8%AA%D8%AB%D8%A8%D9%91%D8%AA%C2%BB-%D9%88%D8%AC%D9%88%D8%AF%D9%87%D8%A7-%D9%81%D9%8A-%D8%B3%D9%88%D8%B1%D9%8A%D8%A7-%D8%A8%D9%80-10-%D8%A2%D9%84%D8%A7%D9%81-%D8%AC%D9%86%D8%AF%D9%8A-%D9%88%D8%B9%D8%B4%D8%B1%D8%A7%D8%AA-%D8%A7%D9%84%D9%82%D9%88%D8%A7%D8%B9%D8%AF-%D8%A7%D9%84%D8%B9%D8%B3%D9%83%D8%B1%D9%8A%D8%A9"],[36.1685,36.7915,"Turkiye","Syria","Kafr Karmin","","Army","Operator Only","2020","","","","Between Kafr Karmin and Kafr Nasih, Turkish forces established a fortified military point, deploying about 400 troops and 20 armoured vehicles in farmlands—entrenching military occupation and undercutting civilian governance in the region.","https://aawsat.com/home/article/4136146/%D8%AA%D8%B1%D9%83%D9%8A%D8%A7-%C2%AB%D8%AA%D8%AB%D8%A8%D9%91%D8%AA%C2%BB-%D9%88%D8%AC%D9%88%D8%AF%D9%87%D8%A7-%D9%81%D9%8A-%D8%B3%D9%88%D8%B1%D9%8A%D8%A7-%D8%A8%D9%80-10-%D8%A2%D9%84%D8%A7%D9%81-%D8%AC%D9%86%D8%AF%D9%8A-%D9%88%D8%B9%D8%B4%D8%B1%D8%A7%D8%AA-%D8%A7%D9%84%D9%82%D9%88%D8%A7%D8%B9%D8%AF-%D8%A7%D9%84%D8%B9%D8%B3%D9%83%D8%B1%D9%8A%D8%A9"],[36.1701,36.8666,"Turkiye","Syria","Abzimo","","Army","Operator Only","2020","","","","Turkish forces took over civilian houses east of the Al‑Ibzmo (Abzimo) village, deploying ~400 soldiers and 23 armoured units—turning residential villages into military zones and reinforcing a sprawling buffer strip.","https://aawsat.com/home/article/4136146/%D8%AA%D8%B1%D9%83%D9%8A%D8%A7-%C2%AB%D8%AA%D8%AB%D8%A8%D9%91%D8%AA%C2%BB-%D9%88%D8%AC%D9%88%D8%AF%D9%87%D8%A7-%D9%81%D9%8A-%D8%B3%D9%88%D8%B1%D9%8A%D8%A7-%D8%A8%D9%80-10-%D8%A2%D9%84%D8%A7%D9%81-%D8%AC%D9%86%D8%AF%D9%8A-%D9%88%D8%B9%D8%B4%D8%B1%D8%A7%D8%AA-%D8%A7%D9%84%D9%82%D9%88%D8%A7%D8%B9%D8%AF-%D8%A7%D9%84%D8%B9%D8%B3%D9%83%D8%B1%D9%8A%D8%A9"],[36.2083,36.8676,"Turkiye","Syria","Tqad","","Army","Operator Only","2020","","","","Likely referring to Qminas/Tqad, this site was added to Turkey's observation network in early 2020, forming part of more than 60 military points that expand Ankara's surveillance and occupation across rebel-held Idlib.","https://aawsat.com/home/article/4136146/%D8%AA%D8%B1%D9%83%D9%8A%D8%A7-%C2%AB%D8%AA%D8%AB%D8%A8%D9%91%D8%AA%C2%BB-%D9%88%D8%AC%D9%88%D8%AF%D9%87%D8%A7-%D9%81%D9%8A-%D8%B3%D9%88%D8%B1%D9%8A%D8%A7-%D8%A8%D9%80-10-%D8%A2%D9%84%D8%A7%D9%81-%D8%AC%D9%86%D8%AF%D9%8A-%D9%88%D8%B9%D8%B4%D8%B1%D8%A7%D8%AA-%D8%A7%D9%84%D9%82%D9%88%D8%A7%D8%B9%D8%AF-%D8%A7%D9%84%D8%B9%D8%B3%D9%83%D8%B1%D9%8A%D8%A9"],[36.1383,36.8289,"Turkiye","Syria","Al Atārib","","Army","Operator Only","2020","","","","Turkish forces converted buildings in and around Al‑Atarib, including school districts, into military posts housing approximately 500 soldiers and armored units—demonstrating Turkey’s deep penetration into civilian infrastructure and institutional life.","https://aawsat.com/home/article/4136146/%D8%AA%D8%B1%D9%83%D9%8A%D8%A7-%C2%AB%D8%AA%D8%AB%D8%A8%D9%91%D8%AA%C2%BB-%D9%88%D8%AC%D9%88%D8%AF%D9%87%D8%A7-%D9%81%D9%8A-%D8%B3%D9%88%D8%B1%D9%8A%D8%A7-%D8%A8%D9%80-10-%D8%A2%D9%84%D8%A7%D9%81-%D8%AC%D9%86%D8%AF%D9%8A-%D9%88%D8%B9%D8%B4%D8%B1%D8%A7%D8%AA-%D8%A7%D9%84%D9%82%D9%88%D8%A7%D8%B9%D8%AF-%D8%A7%D9%84%D8%B9%D8%B3%D9%83%D8%B1%D9%8A%D8%A9"],[36.4673,36.9963,"Turkiye","Syria","Ibbīn","","Army","Operator Only","2017","","","","Set up in February 2018 on the hills of Al‑Eiss (also spelled Ibbīn or Aleis), south of Aleppo, this tower began as part of the Astana ceasefire monitoring network but quickly transformed into a militarized watch post. Regular artillery strikes on the position reveal how such “observation” sites have become frontline targets and extensions of Turkish tactical control, rather than neutral stabilizers.","https://aawsat.com/home/article/4136146/%D8%AA%D8%B1%D9%83%D9%8A%D8%A7-%C2%AB%D8%AA%D8%AB%D8%A8%D9%91%D8%AA%C2%BB-%D9%88%D8%AC%D9%88%D8%AF%D9%87%D8%A7-%D9%81%D9%8A-%D8%B3%D9%88%D8%B1%D9%8A%D8%A7-%D8%A8%D9%80-10-%D8%A2%D9%84%D8%A7%D9%81-%D8%AC%D9%86%D8%AF%D9%8A-%D9%88%D8%B9%D8%B4%D8%B1%D8%A7%D8%AA-%D8%A7%D9%84%D9%82%D9%88%D8%A7%D8%B9%D8%AF-%D8%A7%D9%84%D8%B9%D8%B3%D9%83%D8%B1%D9%8A%D8%A9"],[36.0544,36.8118,"Turkiye","Syria","Ketyan","","Army","Operator Only","2020","","","","Located near Ketyan village in eastern Idlib, this Turkish outpost is part of Ankara’s expansive network of observation towers, functioning less as a peacekeeping station and more as a frontline military checkpoint undermining Syrian sovereignty.","https://aawsat.com/home/article/4136146/%D8%AA%D8%B1%D9%83%D9%8A%D8%A7-%C2%AB%D8%AA%D8%AB%D8%A8%D9%91%D8%AA%C2%BB-%D9%88%D8%AC%D9%88%D8%AF%D9%87%D8%A7-%D9%81%D9%8A-%D8%B3%D9%88%D8%B1%D9%8A%D8%A7-%D8%A8%D9%80-10-%D8%A2%D9%84%D8%A7%D9%81-%D8%AC%D9%86%D8%AF%D9%8A-%D9%88%D8%B9%D8%B4%D8%B1%D8%A7%D8%AA-%D8%A7%D9%84%D9%82%D9%88%D8%A ocated at Rothera Point, Adelaide Island. Rothera also serves as the capital of the British Antarctic Territory, a British Overseas Territory.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[-7.963,-14.404,"United Kingdom","Ascension","Ascension Island Auxiliary Airfield","Ascension Island","Air Force","Co-base","1956","","","","This base is a military airfield and facility located on Ascension Island in the Atlantic Ocean. The airfield is jointly operated by the Royal Air Force (RAF) and the United States Space Force (USSF). The facility is home to a U.S. Space Force ground tracking station in support of the Eastern Range and rocket launches from Cape Canaveral Space Force Station in Florida.","https://media.defense.gov/2010/Sep/21/2001330255/-1/-1/0/AFD-100921-026.pdf"],[-7.9504,-14.4112,"United Kingdom","Ascension","Cat Hill","","Army","Operator Only","1961","","","","The settlement of Cat Hill on Ascension Island hosts a satellite-ground station and signals-intelligence facility built in 1960-61 and operated under the joint aegis of the Government Communications Headquarters (GCHQ) of the United Kingdom and the National Security Agency (NSA) of the United States; it remains “in use” and “active” according to publicly available records, and research by the organisation Declassified UK describes GCHQ’s presence at Cat Hill as “significant”.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[-7.9313,-14.4141,"United Kingdom","Ascension","Georgetown","","Air Force","Operator Only","None","","","","Georgetown is the capital of Ascension Island, a British Overseas Territory in the Atlantic Ocean, and is home to the Royal Air Force base, Traveller's Hill. The island also has other settlements, including Cat Hill, the United States' main base, and Wideawake Airfield, with the Royal Air Force station.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[-7.9452,-14.373,"United Kingdom","Ascension","RAF Travellers Hill","","Air Force","Operator Only","1983","","","","RAF Travellers Hill, originally known as Travellers Hill Camp, is a small military village of the British Armed Forces, located near Two Boats on Ascension Island, a British Overseas Territory. It was built following the Falklands War to house Royal Air Force (RAF) personnel working on RAF Ascension Island, opening in December 1983.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[-7.9679,-14.4037,"United Kingdom","Ascension","Wideawake airfield","","Air Force","Co-base","1982","","","","This base is known as RAF Ascension Island or Ascension Island Auxiliary Field. It is is a military airfield and facility located on Ascension Island in the Atlantic Ocean. The airfield is jointly operated by the Royal Air Force (RAF) and the United States Space Force (USSF). Under the terms of an international agreement between the UK and US governments, only state aircraft (e.g. military and diplomatic flights) are authorised to land at Ascension; however, it is also open to air services between Saint Helena and Ascension.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[-34.8169,138.6197,"United Kingdom","Australia","Skynet Satellite Ground Station, Mawson Lakes","","Air Force","Co-base","2016","","","","In 2016, a new Australian ground station was opened at Mawson Lakes, Adelaide, managed by Airbus in partnership with SpeedCast, an Australian provider for over 25 years which works with the Australian military at that base.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[-32.7979,151.8393,"United Kingdom","Australia","Williamtown Airfield","","Air Force","Co-base","None","","","","Four Royal Air Force (RAF) officers are based at the Williamtown airfield in New South Wales, where they are learning to fly the Wedgetail radar plane.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[-31.146,136.8087,"United Kingdom","Australia","Woomera Airfield","","Air Force","Co-base","None","","","","A high-altitude drone, the PHASA-35, is being tested by staff from arms corporation BAE Systems and the UK military’s Defence Science and Technology Laboratory in Woomera, South Australia.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[-15.5042,128.1503,"United Kingdom","Australia","Wyndham aerodrome","","Air Force","Co-base","2019","","","","Britain’s MOD is testing its high-altitude Zephyr surveillance drone at an Airbus site in the remote settlement of Wyndham in Western Australia. MOD staff visit the test site but are not based there.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[26.2688,50.629,"United Kingdom","Bahrain","Muharraq Air Base","","Air Force","Co-base","None","","","","The UK has eight Armed Forces personnel based between Muharraq Air Base and Headquarters Maritime Component Commander in Bahrain. These personnel form the UK Joint Support Detachment and belong to the UK Maritime Component Commander and the UK Air Component Commander. These British personnel in the eastern province are close to the King Fahd Causeway, the vast bridge connecting Saudi Arabia to the neighbouring island of Bahrain where Britain has a naval base and a smaller presence (costing £270,000 per year) near the international airport in Muharraq.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[26.2043,50.617,"United Kingdom","Bahrain","Mina Salman","","Navy","Co-base","2018","","","","Britain increased its military presence in Bahrain with the construction of a naval base that was opened in 2018 by Prince Andrew, a friend of King Hamad.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[17.5418,-88.3072,"United Kingdom","Belize","BATSUB, Philip Goldson International Airport","","Air Force","Co-base","None","","","","British troops maintain a small garrison at Belize’s main airport from where they have access to 13 sites for jungle warfare training. According to Declassified's investigation, British troops have access to one sixth of Belize’s land. Exercises in Belize are run by the British Army Training Support Unit Belize (BATSUB), located at Price Barracks near Belize City. In 2018, the MOD spent £575,000 on a new water treatment plant for the barracks.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[32.2566,-64.8153,"United Kingdom","Bermuda","Warwick Camp","","Army","Operator Only","None","","","","Bermuda, a British territory in the mid-Atlantic, is ranked as the world’s second “most corrosive” tax haven. It contains a small military site at Warwick Camp, run by 350 members of the Royal Bermuda Regiment which is “affiliated to the British army” and commanded by a British officer.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[4.8069,114.6409,"United Kingdom","Brunei","Sittang Camp","","Army","Training Base","1997","","","","Among the other two garrisons, this is a garrison in Brunei. Sittang Camp is a military facility in Brunei. It is a British Army Training Camp.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[4.6166,114.3264,"United Kingdom","Brunei","Tuker Lines","","Army","Training Base","1997","","","","This is a garrison in Brunei among other two garrisons. Houses the Garrison Headquarters, the resident Gurkha Battalion, and the Garrison Support Services.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[4.6084,114.326,"United Kingdom","Brunei","Medicina Lines","","Army","Training Base","1997","","","","This is a garrison in Brunei among other two garrisons. Located near the town of Seria. This site is home to the JWD and the 1563 Flt RAF. The 7Fl also provides aviation support to the JWD, the RIB, and other units exercising in Brunei.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[4.5867,114.2467,"United Kingdom","Brunei","Kuala Belait accomodation","","Army","Co-base","None","","","","Special accommodation for British troops is provided through a network of 545 apartments and bungalows in Kuala Belait, near the military bases.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[4.9984,114.9353,"United Kingdom","Brunei","Berakas Garrison","","Army","Co-base","None","","","","This base a Royal Brunei Armed Forces base with British officers.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[5.0331,115.0827,"United Kingdom","Brunei","Muara Naval base","","Navy","Co-base","None","","","","The Muara Naval Base is a naval base that serves as the main headquarters for the Royal Brunei Navy. British troops are there at this site.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[4.8476,114.7005,"United Kingdom","Brunei","Penanjong Garrison","","Army","Operator Only","None","","","","Penanjong Garrison is one of the three main garrisons of the British Forces Brunei, located in the Brunei-Muara District of Brunei. It primarily serves as a base for the British Army's logistical and administrative functions.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[50.2742,-111.1669,"United Kingdom","Canada","BATUS, Suffield","","Army","Operator Only","1971","","","","The British Army Training Unit Suffield (BATUS) is a British Army unit located at the vast training area of Canadian Forces Base Suffield near Suffield, Alberta, Canada. BATUS is the British Army's largest armoured training facility, and it can accommodate live-firing and tactical effect simulation exercises up to battle group level.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[49.302,16.9793,"United Kingdom","Czechia","Military Academy, Vyškov","","Army","Co-base","None","","","","Twenty UK military personnel are currently on loan to the Czech military academy in Vyškov.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[19.2931,-81.3784,"United Kingdom","Cayman Islands","Cayman Islands","","Army","Operator Only","2019","","","","Since 2019, there have been efforts to establish a Cayman Islands Regiment, which aims to recruit 175 soldiers by the end of 2021. Much of the officer training has taken place at Sandhurst in the UK.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[-7.2983,72.4042,"United Kingdom","Chagos Islands","Diego Garcia","","Army","Co-base","None","","","","British forces at Duqm work closely with the US military facility at Diego Garcia on the Chagos Islands, part of the British Indian Ocean territory that belongs to Mauritius under international law. Some 40 UK military personnel are stationed at Diego Garcia.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[34.5912,32.9794,"United Kingdom","Cyprus","Akrotiri Air Base","","Army","Operator Only","1955","","","","This base is a large Royal Air Force base on the Mediterranean island of Cyprus. It is located in the Western Sovereign Base Area, one of two areas which comprise Akrotiri and Dhekelia, a British Overseas Territory, administered as a Sovereign Base Area. The UK military can use a large area of land outside Akrotiri known as Lima as a training area. It was revealed that low flying British military aircraft have caused the deaths of farm animals in the Lima training area.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[34.5759,33.0278,"United Kingdom","Cyprus","Petroleum Storage Depot","","Army","Operator Only","1955","","","","Plumley Petroleum Storage Depot (PSD) is an underground storage facility. The storage facility consists of 34 underground salt caverns that sit approximately 200 metres below ground. The caverns have been in existence since the 1950s. Due to the volume of fuel stored, Plumley PSD is a ‘top tier’ site under the Control of Major Accident Hazards (COMAH).","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[34.9429,33.8581,"United Kingdom","Cyprus","Cape Pyla","","Army","Operator Only","None","","","","Cape Pyla is situated within the Dhekelia Sovereign Base Area, a sovereign overseas territory of the United Kingdom on the island of Cyprus. As part of this UK-administered area, it falls under British jurisdiction and military control. Consequently, Cape Pyla can be viewed as part of a broader system of contested and politically sensitive overseas basing.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[34.621,32.9455,"United Kingdom","Cyprus","Pluto II","","Army","Operator Only","None","","","","PLUTO II is an Over The Horizon Radar located in the UK Sovereign Base Area just outside the RAF Akrotiri base in Cyprus. Uses FMCW (Frequency Modulated Continuous Wave). PLUTO has been seen with sweeprates of 25 and 50 sweeps/sec even sometimes 12.5 sweeps/sec.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[34.6751,32.8115,"United Kingdom","Cyprus","Paramali North Quarters","","Army","Operator Only","None","","","","","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[34.6717,32.8104,"United Kingdom","Cyprus","Paramali South Quarters","","Army","Operator Only","None","","","","","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[34.6927,32.8446,"United Kingdom","Cyprus","Reservoir","","Army","Operator Only","None","","","","","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[34.6788,32.8369,"United Kingdom","Cyprus","Episkopi Garrison","","Army","Operator Only","None","","","","","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[34.9974,33.7339,"United Kingdom","Cyprus","Dhekelia Garrison","","Army","Operator Only","None","","","","Dhekelia is situated within the Eastern Sovereign Base Area, one of 2 British Sovereign Base Areas in Cyprus..","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[35.0009,33.7369,"United Kingdom","Cyprus","Nightingale Barracks","","Army","Operator Only","None","","","","","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[34.9937,33.7489,"United Kingdom","Cyprus","Dhekalia Airfield","","Air Force","Operator Only","None","","","","Dhekelia Airfield is a small airport in Larnaka, Cyprus.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[35.0147,33.7155,"United Kingdom","Cyprus","Kingsfield Airfield","","Air Force","Operator Only","None","","","","Kingsfield Airfield is a small airfield in the Eastern Soverign Base Area in Cyprus.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[34.9824,33.7209,"United Kingdom","Cyprus","Alexander Barracks","","Army","Operator Only","None","","","","Alexander Barracks is a home to 2nd Battalion, The Princess of Wales's Royal Regiment.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[34.9367,32.8638,"United Kingdom","Cyprus","Olympus","","Army","Operator Only","None","","","","There are several of the sites are located beyond the sovereign base areas, including on the top of Mount Olympus, the highest point on Cyprus.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[34.5671,33.0285,"United Kingdom","Cyprus","Cape Gata","","Army","Operator Only","None","","","","","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[34.9384,32.861,"United Kingdom","Cyprus","RAF Troodos","","Army","Operator Only","None","","","","This base is commonly known as RAF Troödos, is a Royal Air Force station in the Republic of Cyprus. RAF Troödos is a remote Signals Station run by 27 personnel from Golf Section, Joint Service Signal Unit (Cyprus), and also contains Mount Olympus Radar Station.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[35.0833,33.8979,"United Kingdom","Cyprus","Ayios Nikolaos Station","","Army","Operator Only","None","","","","Ayios Nikolaos Station is a British military station and part of in the British Sovereign Base Area of Dhekelia in Cyprus. The Joint Service Signal Unit (Cyprus) (JSSU(Cyp)), formerly 9th Signal Regiment and the Royal Air Force's 33 Signals Unit, is based at Ayios Nikolaos. This unit is a British Armed Forces run electronic intelligence gathering station.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[34.6656,32.7829,"United Kingdom","Cyprus","Bloodhound Camp","","Army","Operator Only","None","","","","","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[11.5449,43.1486,"United Kingdom","Djibouti","Camp Lemonnier","","Army","Co-base","None","","","","A smaller British military presence can be found at Camp Lemonnier in Djibouti, where UK forces are involved in drone operations over the Horn of Africa and Yemen. This secretive site is linked by a high-speed fibre optic cable to the Croughton spy base in England, which is connected to the GCHQ headquarters in Cheltenham. Djibouti has also been linked to UK special forces operations in Yemen.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[59.2618,24.2223,"United Kingdom","Estonia","Amari Air Base","","Air Force","Operator Only","None","","","","The RAF bases Typhoon fighter jets at Estonia’s Amari Air Bas.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[-51.8202,-58.4559,"United Kingdom","Falkland Islands","Mount Pleasant","","Army","Operator Only","None","","","","In 2016, £55.7-million went on a boiler house and power station for the Mount Pleasant military headquarters complex.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[-51.9,-58.4377,"United Kingdom","Falkland Islands","Mare Harbour","","Army","Operator Only","None","","","","In 2018, Mare Harbour was expanded at a cost of £19-million, mainly to ensure food and other supplies can reach the troops more easily. Cleaning, cooking, emptying the bins and other administrative tasks costs another £5.4-million a year, payable to outsourcing firm Sodexo.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[-52.153,-60.5981,"United Kingdom","Falkland Islands","Mount Alice","","Army","Operator Only","None","","","","The barracks and airport at RAF Mount Pleasant is the largest, but it relies upon a dockyard at Mare Harbour and three anti-aircraft missile silos on Mount Alice.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[-51.4252,-60.5643,"United Kingdom","Falkland Islands","Byron Heights","","Army","Operator Only","None","","","","The barracks and airport at RAF Mount Pleasant is the largest, but it relies upon a dockyard at Mare Harbour and three anti-aircraft missile silos on Byron Heights.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overs n local forces to guard against the threat from Boko Haram. Amnesty International alleges that 10,000 civilians have died in detention camps run by the Nigerian military, one of which was part funded by the UK.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[26.8069,87.2692,"United Kingdom","Nepal","British Gurkha Dharan","","Army","Operator Only","None","","","","This base is one of other two bases that runs by the British army, which is used for recruitment.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[27.6684,85.3169,"United Kingdom","Nepal","British Gurkhas Nepal (BGN)","","Army","Operator Only","None","","","","This base is a administrative facilities in the capital Kathmandu.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[28.2475,83.9914,"United Kingdom","Nepal","British Gurkha Camp, Pokhara","","Army","Operator Only","None","","","","This base is one of other two bases that runs by the British army, which is used for recruitment.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[69.0521,18.5169,"United Kingdom","Norway","Bardufoss Airport","","Air Force","Co-base","None","","","","In Norway, the British military has a helicopter base codenamed “Clockwork” at Bardufoss airport, deep in the Arctic Circle. The base is frequently used for mountain warfare exercises and lies 350 miles from the headquarters of Russia’s northern fleet in Severomorsk near Murmansk.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[19.014,57.7487,"United Kingdom","Oman","Joint Training area","","Army","Training Base","2019","","","","The Omani-British Joint Training Area is a training area established in 2019 for joint military training between Oman and the United Kingdom.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[19.6605,57.7111,"United Kingdom","Oman","Duqm port","","Army","Co-base","2017","","","","Duqm Port is a seaport located in the Duqm, Oman. The port is equipped with a Ship Repair Yard & Drydock facility. In August 2017, the Oman and the U.K. governments jointly established the UK Joint Logistics Support Base at Duqm Port. The port has sufficient space and depth to berth the Royal Navy's ski-jump carriers. In 2018, the port was used for Exercise Saif Sareea 3, a 10-day long military exercise. In September 2020, the UK Defence Secretary announced a plan to triple the size of its base at the Omani port.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[23.6749,58.1208,"United Kingdom","Oman","Overseas Processing Centre 1 \"TIMPANI\"","","Army","Operator Only","None","","","","The secret British spy base is part of a programme codenamed “CIRCUIT” and also referred to as Overseas Processing Centre 1 (OPC-1). It is located at Seeb, on the northern coast of Oman, where it taps in to various undersea cables passing through the Strait of Hormuz into the Persian/Arabian Gulf. Seeb is one of a three site GCHQ network in Oman, at locations codenamed “TIMPANI”, “GUITAR” and “CLARINET”. TIMPANI, near the Strait of Hormuz, can monitor Iraqi communications. CLARINET, in the south of Oman, is strategically close to Yemen.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[20.672,58.8879,"United Kingdom","Oman","RAFO Masirah","","Air Force","Operator Only","1977","","","","This base is a military airport located on the island of Masirah in Oman, which is used by the British army.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[23.647,57.5026,"United Kingdom","Oman","Al Musannah Air Base","","Air Force","Co-base","2015","","","","This base is a Royal Air Force of Oman air base, which is used by the British army. It was announced that No. 902 Expeditionary Air Wing RAF has deployed to the base with the Royal Navy's AgustaWestland Merlin HM.2's as part of Operation Kipion.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[22.4925,57.389,"United Kingdom","Oman","Adam Air Base","","Air Force","Co-base","None","","","","Adam Airport is an air base and proposed domestic airport. The air base is 18 kilometres (11 mi) northwest of the town of Adam. This base is used by the British army.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[22.7364,57.7176,"United Kingdom","Oman","Sultan bin Safy Camp","","Army","Co-base","None","","","","","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[23.8255,57.5228,"United Kingdom","Oman","Wudam Al Sahil","","Navy","Co-base","None","","","","","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[22.9536,57.7757,"United Kingdom","Oman","Izki Air Base","","Air Force","Co-base","None","","","","","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[23.5727,58.2502,"United Kingdom","Oman","Muaskar al Murtafa'a","","Army","Co-base","None","","","","","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-networ ase","None","","","","There are separate contracts for Britain to support the “special security brigade” of Saudi Arabia’s National Guard (SANG), a unit that protects the ruling family and promotes internal security.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[26.364,50.1653,"United Kingdom","Saudi Arabia","SANG Eastern Command","","Army","Co-base","None","","","","A British army lieutenant colonel advises SANG infantry units at their Eastern Command post in Damman.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[24.7257,46.8864,"United Kingdom","Saudi Arabia","SANG Signals school","","Army","Co-base","None","","","","British soldiers are believed to be stationed at the Guard’s ministry in Riyadh as well as at its Signals School (SANGCOM) in Khashm al-An on the outskirts of the capital.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[21.5358,39.2194,"United Kingdom","Saudi Arabia","SANG Western Command","","Army","Co-base","None","","","","A small teams are stationed at SANG command posts in the western and central regions at Jeddah and Buraydah.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[21.4749,40.5278,"United Kingdom","Saudi Arabia","King Fahad Air Base","","Air Force","Co-base","None","","","","RAF staff, some of whom are on secondment to BAE Systems, also serve at the King Fahad air base in Taif, which services the Typhoon jet fleet, the King Khalid air base in Khamis Mushayt close to the Yemen border and at the King Faisal air base in Tabuk where Hawk jet pilots train.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[28.3753,36.6257,"United Kingdom","Saudi Arabia","King Faisal Air Base","","Air Force","Co-base","None","","","","Most faculty in this base are British.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[26.2668,50.1331,"United Kingdom","Saudi Arabia","King Abdulaziz Air Base","","Air Force","Co-base","None","","","","RAF staff assist the Tornado jet fleet at King Abdulaziz air base in Dhahran.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[26.1474,50.1498,"United Kingdom","Saudi Arabia","Sara compound","","Army","Co-base","None","","","","Accommodation for British contractors and personnel is provided by BAE at the company’s purpose built Sara compound at Khobar, near Dhahran.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[18.3041,42.8099,"United Kingdom","Saudi Arabia","King Khalid Air Base","","Air Force","Co-base","None","","","","King Khalid Air Base is an airbase of Royal Saudi Air Force, where Hawk jet pilots train.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[26.9574,49.6829,"United Kingdom","Saudi Arabia","King Fahd Naval Academy","","Navy","Co-base","None","","","","A Royal Navy team teaches at the King Fahd Naval Academy in Jubail.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[8.4476,-13.2301,"United Kingdom","Sierra Leone","Horton Academy","","Army","Co-base","None","","","","One British officer still runs the Horton Academy, a military training centre, in Sierra Leone, a legacy of Britain’s involvement in the country’s civil war.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[3.1025,43.6321,"United Kingdom","Somalia","Baidoa Security Training Centre","","Army","Training Base","2021","","","","British troops have a permanent presence in Somalia. Army training teams are stationed at Mogadishu International Airport, with another team at the Baidoa Security Training Centre.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[2.0136,45.3047,"United Kingdom","Somalia","Mogadishu International Airport","","Air Force","Co-base","2021","","","","Mogadishu International Airport, home to the UK Mission Headquarters in Somalia. According to declassified UK website in 2020, Uk Army training teams are stationed at Mogadishu International Airport, with another team at the Baidoa Security Training Centre.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[36.5355,37.9194,"United Kingdom","Syria","Manbij","","Air Force","Co-base","None","","","","British special forces operating in Syria are believed to be resupplied by air from Cyprus, where RAF transport planes can be seen online taking off before their trackers disappear over Syria.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[33.5062,38.6179,"United Kingdom","Syria","Al-Tanf","","Air Force","Co-base","2016","","","","In August 2016, the BBC published photographs taken in June that year which it said showed British special forces soldiers apparently guarding the perimeter of the al-Tanf base.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[1.4641,103.8256,"United Kingdom","Singapore","The British Defence Singapore Support Unit, Sembawang","","Navy","Operator Only","1971","","","","It is a British naval facility located in Sembawang, Singapore. A remnant of a larger naval base, known as HMNB Singapore, the facility provides fuel and other supplies to Royal Navy ships in the region, as well as those of other countries.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[21.7745,-72.2774,"United Kingdom","Turks and Caicos","Turks and Caicos","","Navy","Operator Only","2020","","","","The Turks and Caicos Islands Regiment is the home defence unit of the British Overseas Territory of the Turks and Caicos Islands. It is a single territorial infantry and engineer reserve unit of the British Armed Forces that was formed in 2020. The Regiment has an authorized strength level objective of 46 personnel.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[25.0316,55.3689,"United Kingdom","United Arab Emirates","Al Minhad Air Base","","Air Force","Co-base","2013","","","","Al Minhad Air Base is a military installation in the United Arab Emirates, and operated by the United Arab Emirates Air Force. The British Armed Forces have operations at this base. As of March 2024 the airbase is also host the permanent British Support Operations facility Donnelly Lines.","https://www.dailymaverick.co.za/article/2020-11-24-revealed-the-uk-militarys-overseas-base-network-involves-145-sites-in-42-countries/"],[31.9986,21.194,"United Arab Emirates","Libya","Forward Operating Base (Al-Khadim Airport)","","Air Force","Operator Only","2016","","","","This secretive remote airfield operated by the United Arab Emirates and located about 50 miles southeast of Benghazi. There, the UAE has deployed a pocket air force of heavily armed and armored agricultural planes developed into surveillance and light attack platforms–the AT-802U Border Patrol variant of the Air Tractor and the more capable IOMAX Archangel–in addition to S-70 Blackhawks, and Chinese Wing Loong unmanned aircraft, which are loosely analogous the General Atomics MQ-1 Predator.","https://www.euspaceimaging.com/blog/2020/06/24/the-libyan-conflict-through-the-lens-of-very-high-resolution-satellite-imagery/"],[32.2201,21.2633,"United Arab Emirates","Libya","Charruba Base","","Air Force","Operator Only","2016","","","","Libyan sources indicate that the UAE has built a military base 100 kilometers southwest of the Sarir oil field, specifically at the Kharouba military airport. The sources indicated that the UAE military base that was built contains Emirati equipment, “amongst this equipment is the S-100 Shebel Camcopter, which is an unmanned aircraft that directs its missiles with a laser. And it had a major role in the battles for Benghazi.",""],[32.0181,21.1901,"United Arab Emirates","Libya","Alkhadim Base","","Air Force","Operator Only","2016","","","","In 2017, military study centers revealed that the UAE had built the “al-Khadim” base, which is located about 65 km south of the city of al-Marj, about 100 km from the city of Benghazi, and it is a secret base established by the former regime in the eighties of the last century.",""],[11.2886,49.1712,"United Arab Emirates","Somalia","Bosaso","","Air Force","Co-base","2022","","","","The Emirati soldiers estimated at 180 in number, are stationed at the bases of the PMPF, the UAE-trained and funded maritime police force in the coastal city of Puntland in northern Somalia.","https://www.ispionline.it/en/publication/the-uaes-rising-military-role-in-africa-defending-interests-advancing-influence-172825#:~:text=Mauritania%3A%20In%202016%2C%20the%20UAE,jihadi%20terrorism%20established%20in%202014."],[-0.3503,42.5647,"United Arab Emirates","Somalia","Kismayo","","Air Force","Co-base","2023","","","","The United Arab Emirates has deployed military vehicles to Jubaland, a region in southern Somalia, with the intent of opening a military base there. According to a statement from the Jubaland government, these vehicles will participate in the fight to liberate the region from the Al-Shabaab terrorist group.","https://www.ispionline.it/en/publication/the-uaes-rising-military-role-in-africa-defending-interests-advancing-influence-172825#:~:text=Mauritania%3A%20In%202016%2C%20the%20UAE,jihadi%20terrorism%20established%20in%202014."],[16.0694,22.8463,"United Arab Emirates","Chad","Amdjarass Airport","","Air Force","Co-base","2023","","","","The UAE developed Amjaras Airport in Chad to be a headquarters for support operations in Sudan and Ethiopia.","https://www.ispionline.it/en/publication/the-uaes-rising-military-role-in-africa-defending-interests-advancing-influence-172825#:~:text=Mauritania%3A%20In%202016%2C%20the%20UAE,jihadi%20terrorism%20established%20in%202014."],[18.0916,-15.9811,"United Arab Emirates","Mauritania","Mohammed bin Zayed Defense College","","Air Force","Operator Only","2016","","","","In 2016, the UAE established a military academy in Mauritania, the Mohammed bin Zayed Defense College, to train senior officers from the G5 Sahel countries (Burkina Faso, Chad, Mali, Mauritania, and Niger).","https://www.ispionline.it/en/publication/the-uaes-rising-military-role-in-africa-defending-interests-advancing-influence-172825#:~:text=Mauritania%3A%20In%202016%2C%20the%20UAE,jihadi%20terrorism%20established%20in%202014."],[16.8385,48.6762,"United Arab Emirates","Yemen","Hadramout, Al Mukalla","","Army","Co-base","2022","","","","Following AQAP’s capture of Mukalla in 2015, UAE-backed Hadhrami Elite Forces—with Emirati training and arms—retook the city in April 2016, establishing a special‑operations base at Mukalla port and airport that continues under Yemen’s Second Military Region. Satellite imagery confirms UAE’s continued military presence in Al‑Riyan (Mukalla airport) and nearby Al‑Riyan port, both enhanced under UAE and Western support post‑2018.","https://emiratesleaks.com/emirates-uses-airport-yemen-military-base/?lang=en"],[14.6115,47.122,"United Arab Emirates","Yemen","Shabwa- Balhaf Camp","","Army","Co-base","2015","","","","Since 2016, the UAE has controlled the Balhaf LNG terminal in Shabwa, establishing a multipurpose military facility within the site, which includes dozens of buildings and defensive positions by late 2023. It serves joint UAE–U.S. operations and monitors energy infrastructure.","https://carnegieendowment.org/sada/2024/04/flexible-outposts-the-emirati-approach-to-military-bases-abroad?utm_source=chatgpt.com&lang=en"],[12.66,43.42,"United Arab Emirates","Yemen","Perim Island","","Air Force","Operator Only","2021","","","","In 2021, the AP reported that an airfield was being built on Mayun Island, also known as Perim Island, which sits in the narrow Bab el-Mandeb Strait linking the Gulf of Aden to the Red Sea.","https://apnews.com/article/yemen-island-airstrip-houthis-israel-hamas-war-gaza-8f1e8b70ddff7ca25842509ca7f0f2b0"],[12.51,53.92,"United Arab Emirates","Yemen","Socotra Island","","Air Force","Operator Only","2018","","","","Socotra Island Base – UAE deployed over 100 troops, including artillery and armoured vehicles. It took control of Socotra’s airport and port in April 2018, later returning administrative control to Yemen in May while maintaining a military presence.","https://www.yemenmonitor.com/en/Details/ArtMID/908/ArticleID/135891"],[12.179,52.2864,"United Arab Emirates","Yemen","Abd al Kuri Island","","Air Force","Operator Only","2018","","","","The Abd al‑Kuri airbase is now fully operational—satellite and Sentinel‑2 imagery from February 2025 show concrete resurfaced runway and a C‑17 transport aircraft on-site, with routine smaller aircraft activity. In March 2025, the UAE, via the Southern Transitional Council, officially inaugurated the base facilities and airport, despite no formal agreement with the Yemeni government, confirming its de facto control over the island. Additional strategic enhancements include Israeli-supplied air defence systems deployed since late 2023, reflecting deeper UAE–Israel cooperation aimed at monitoring Houthi drone and missile threats.","https://www.yemenmonitor.com/en/Details/ArtMID/908/ArticleID/135891"]];
// [lat,lng,op,host,name,city,component,usage,opened,nuke,nato,drone,notes,url]
const map=L.map('map',{worldCopyJump:true,preferCanvas:true,minZoom:2}).setView([25,10],2);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{
  attribution:'Tiles &copy; Esri',maxZoom:16}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,pane:'shadowPane'}).addTo(map);
const layer=L.layerGroup().addTo(map);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const color=b=>b[9]?'#d6452f':b[11]?'#e0a100':b[10]?'#6a3fb5':'#1f5fa8';

const opSel=document.getElementById('op'),usSel=document.getElementById('usage'),q=document.getElementById('q');
const count=(i)=>{const m={};B.forEach(b=>{if(b[i])m[b[i]]=(m[b[i]]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
opSel.innerHTML='<option value="">全部國家 ('+B.length+')</option>'+count(2).map(([k,v])=>`<option value="${esc(k)}">${esc(k)} (${v})</option>`).join('');
usSel.innerHTML+=count(7).map(([k,v])=>`<option value="${esc(k)}">${esc(k)} (${v})</option>`).join('');
const params=new URLSearchParams(location.search);
opSel.value=params.get('op')??'United States';

function popup(b){
  const tags=[b[7],b[6],b[9]&&'核武',b[11]&&'無人機',b[10]&&'NATO'].filter(Boolean)
    .map(t=>`<span class="tag${t==='核武'?' n':''}">${esc(t)}</span>`).join('');
  return `<h3>${esc(b[4])}</h3><div>${esc([b[5],b[3]].filter(Boolean).join(', '))}</div>
    <div>營運：${esc(b[2])}${b[8]?' · 啟用 '+esc(b[8]):''}</div><div>${tags}</div>
    ${b[12]?`<div class="note">${esc(b[12])}</div>`:''}
    ${/^https?:/.test(b[13])?`<div><a href="${esc(b[13])}" target="_blank">來源</a></div>`:''}`;
}
function render(fit){
  layer.clearLayers();
  const op=opSel.value,us=usSel.value,s=q.value.trim().toLowerCase();
  const sel=B.filter(b=>(!op||b[2]===op)&&(!us||b[7]===us)&&(!s||(b[4]+' '+b[3]+' '+b[5]).toLowerCase().includes(s)));
  sel.forEach(b=>L.circleMarker([b[0],b[1]],{radius:5,weight:1,color:'#fff',fillColor:color(b),fillOpacity:.85})
    .bindPopup(popup(b)).bindTooltip(esc(b[4])).addTo(layer));
  const hosts=new Set(sel.map(b=>b[3])).size;
  document.getElementById('stats').innerHTML=`<b>${sel.length}</b> 個基地，分布於 <b>${hosts}</b> 個國家／地區`;
  if(fit&&sel.length){const bb=L.latLngBounds(sel.map(b=>[b[0],b[1]]));
    if(bb.getEast()-bb.getWest()>120)map.setView([25,10],2);else map.fitBounds(bb,{padding:[30,30],maxZoom:6})}
}
opSel.onchange=()=>render(true);usSel.onchange=()=>render(false);q.oninput=()=>render(false);
render(true);
</script>
</body>
</html>
