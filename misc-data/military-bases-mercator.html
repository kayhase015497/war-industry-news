used by the Armed Forces of the Philippines. Since Aprial 2023, the U.S. has access to Philippine bases, including Camp Melchor Dela Cruz for joint training, pre-positioning of equipment and building of facilities such as runways, fuel storage and military housing, but it is not a permanent presence.","https://www.reuters.com/world/asia-pacific/philippines-reveals-locations-4-new-strategic-sites-us-military-pact-2023-04-03/"],[7.9419,117.0081,"United States","Philippines","Balabac Island","Palawan","Navy","Co-base","2023","","","","Since Aprial 2023, the U.S. has access to Philippine bases, including Balabac Island for joint training, pre-positioning of equipment and building of facilities such as runways, fuel storage and military housing, but it is not a permanent presence. The US can now rotate troops to nine bases in the Philippines, including Balabac Island, which is close to Chinese installations in the South China Sea. The island has a small naval and littoral monitoring station, but plans are in place to upgrade it.","https://www.reuters.com/world/asia-pacific/philippines-reveals-locations-4-new-strategic-sites-us-military-pact-2023-04-03/"],[18.1811,121.745,"United States","Philippines","Lal-lo Airport","Cagayan","Air Force","Co-base","2023","","","","Since Aprial 2023, the U.S. has access to Philippine bases, including Lal-lo Airport for joint training, pre-positioning of equipment and building of facilities such as runways, fuel storage and military housing, but it is not a permanent presence.","https://www.reuters.com/world/asia-pacific/philippines-reveals-locations-4-new-strategic-sites-us-military-pact-2023-04-03/"],[6.9225,122.0597,"United States","Philippines","Edwin Andrews Air Base","Zamboanga","Air Force","Co-base","1942","","","","This base operates through Runway 09/27. The U.S. military forces actively use the airstrip and have based C-12, C-130 aircraft, and Chinook helicopters. In January 2002, US soldiers arrived in the southern Philippines on a C-17 transport plane.","https://www.9news.com.au/world/us-military-get-expanded-access-to-philippines-bases-in-efforts-to-counter-china-aggression-world-news/7aa1d15c-99d0-4388-800c-6a4aa6e84c24"],[6.9222,122.0597,"United States","Philippines","Zamboanga International Airport","Zamboanga","Air Force","Co-base","2012","","","Drone Base","The U.S. operates MQ-1 Predator and MQ-1C Gray Eagle drones from Zamboanga International Airport, sharing the runway with Edwin Andrews Air Base. These drones are utilised for surveillance, intelligence, and targeting missions. Notably, a U.S. drone crash occurred near Zamboanga in 2002 during such operations.","https://foreignpolicy.com/2012/05/29/where-the-drones-are/"],[53.4727,15.7625,"United States","Poland","Drawsko Pomorskie Training Area","Główna","Army","Training Base","2014","","NATO","","The U.S. uses the Drawsko Pomorskie Training Area (DPTA) in Poland. All NATO member states also use it.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[51.5516,19.1791,"United States","Poland","Lask Air Base","Gmina Buczek","Air Force","Co-base","2012","","","","Łask Air Base hosts a rotational presence of U.S. Air Force units, including F-35 deployments. The base has undergone upgrades funded by the European Deterrence Initiative to enhance its operational capabilities. These improvements aim to support NATO's air shielding missions in the region.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[54.4821,16.9862,"United States","Poland","Naval Support Facility, Poland","Slupsk","Navy","Operator Only","2008","","NATO","","This facility supports the Aegis Ashore missile defense system, providing layered defense against missile threats. It is the U.S. Navy's newest base in Poland and plays a critical role in NATO's missile defense architecture. The base has been a point of contention, with Russia expressing concerns over its presence. Despite this, the facility continues to operate.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[52.3814,17.8511,"United States","Poland","Powidz Army pre-op (33rd Air Base)","Powidz","Army","Co-base","2017","","NATO","","Powidz is a hub for base operations for the U.S. Army in Poland. The Army Prepositioned Stocks program enhances U.S. Army Europe. Since 2019, the base has been the site of a depot and storage site for United States Army combat vehicles in Poland. It is mostly funded by NATO's NATO Security Investment Program.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[54.4802,17.1064,"United States","Poland","Redzikowo Naval detachment","Slupsk","Navy","Co-base","2023","","","","The Naval Support Facility (NSF) Redzikowo is the Navy's newest base and the first US installation in Poland. It supports the Aegis Ashore missile defense system, which protects against any ballistic missiles.","https://cnreurafcent.cnic.navy.mil/Installations/NSF-Redzikowo/"],[51.4692,15.3896,"United States","Poland","Swietoszow Training Area","Unknown","Army","Co-base","None","","NATO","","This training area supports heavy armored brigade combat team rotations and various training operations. Recent developments include the establishment of a Post Exchange.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[51.2247,15.5562,"United States","Poland","Boleslawiec","Unknown","Army","Co-base","None","","NATO","","Bolesławiec hosts a forward operating station for U.S. Army soldiers. The base serves as a location for training and operational support activities. The facility is part of the broader U.S. military infrastructure in Poland.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[51.589,15.3236,"United States","Poland","Camp Karliki Training Area","Unknown","Army","Co-base","None","","NATO","","Camp Karliki is one of several base camps providing life-sustaining services for U.S. soldiers in Poland. The facility supports various training exercises and operational activities. The camp is managed by the 652nd Regional Support Group.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[52.4085,16.895,"United States","Poland","Poznan Military Complex (Camp K)","Unknown","Army","Co-base","None","","NATO","","Camp Kosciuszko is the US V Corps' Forward Operating Station Poznan (FOS Poznan), Poland, also denoted V Corps Headquarters (Forward). Forward Operating Station Poznan is the permanent headquarters for V Corps (Forward), which was announced in June 2022 by US President Joe Biden, as the eastern flank of the NATO alliance.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[38.3228,-7.2838,"United States","Portugal","Caldeira Ammunition Storage Area","Lajesfield","Air Force","Operator Only","1944","","","","This facility is located near Lajes Field on Terceira Island, This facility serves as a munitions storage site for the U.S. Air Force. It comprises several buildings and structures dedicated to the secure storage of ammunition and explosives.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[38.7619,-27.0908,"United States","Portugal","Lajes Field/ Lajes Air Base","Lajesfield","Air Force","Co-base","1944","","NATO","","Lajes Field, or Lajes Air Base, is officially designated Air Base No. 4. This base is a multi-use airfield. It is home to the Portuguese Air Force Base and Azores Air Zone Command, a United States Air Force detachment unit, and a regional air passenger terminal.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[38.73,-27.06,"United States","Portugal","Praia Da Victoria Dock Annex","Lajesfield","Air Force","Operator Only","1944","","","","This annex is a port facility adjacent to Lajes Field, utilized for the offloading and storage of fuel and other supplies. The facility includes infrastructure for handling large volumes of materials.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[38.7299,-27.0599,"United States","Portugal","Praia Da Victoria Fuel Storage Annex","Lajesfield","Air Force","Operator Only","1944","","","","This facility stores fuel necessary for aircraft and other military vehicles. It ensures a steady supply of fuel to support ongoing operations at Lajes Field and other associated sites. The storage capacity is designed to meet the demands of transiting military assets.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.8852,-7.9159,"United States","Portugal","Villa Nova Globecom Annex","Lajesfield","Air Force","Operator Only","1944","","","","This annex functions as a communications facility supporting U.S. military operations in the Azores. It houses equipment and personnel responsible for maintaining secure communication channels","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[39.518,-8.479,"United States","Portugal","Agualva Munitions Storage Annex","Lajesfield","Air Force","Co-base","1944","","","","According to a 2018 base structure report, the US military uses the Agualva Munitions Storage Annex.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[38.7699,-27.08,"United States","Portugal","Lajes Water System Annex Site 1","Lajesfield","Air Force","Co-base","None","","","","This facility manages water resources and infrastructure to support the operations at Lajes Field. It includes systems for water storage, treatment, and distribution to meet the needs of personnel and operations.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[38.7705,-27.101,"United States","Portugal","Cinco Picos Globecom Annex Site 1","Lajesfield","Air Force","Co-base","None","","","","This communications annex supports the transmission and reception of military communications. It plays a role in ensuring effective communication links for command and control purposes. The facility is part of the broader communications infrastructure supporting U.S. operations in the Azores.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.2381,-65.6278,"United States","Puerto Rico","Roosevelt Roads Naval Station","Ceiba","Navy","Co-base","2025","","","","In October 2025, Roosevelt Roads Naval Station in Ceiba, Puerto Rico, which had been closed since 2004, was reported by CNN to be actively used again by the U.S. military as a staging ground for operations in the Caribbean. At the same time, U.S. Secretary of Defense Pete Hegseth did not offer a clear response when asked about reopening the facility.","https://www.reuters.com/graphics/USA-CARIBBEAN/MILITARY-BUILDUP/egpbbnzyrpq/"],[18.495,-67.1294,"United States","Puerto Rico","Rafael Hernández Airport"," Aguadilla ","Air Force","Co-base","2025","","","","Reuters found that Rafael Hernández Airport in Aguadilla, Puerto Rico has received mobile air-traffic control towers, communications systems, and visible MQ-9 Reaper drones, along with satellite-identified construction of an ammunition storage site, indicating a shift from civilian use to dual-use military functionality.","https://www.reuters.com/graphics/USA-CARIBBEAN/MILITARY-BUILDUP/egpbbnzyrpq/"],[18.0083,-66.5631,"United States","Puerto Rico","Mercedita International Airport","Ponce","Air Force","Co-base","2025","","","","According to the November 2025 Reuters investigation, Mercedita International Airport in Ponce, Puerto Rico has been used repeatedly by U.S. C-17 Globemaster III cargo aircraft to unload military equipment, indicating that the civilian airport is functioning as a logistical air-bridge feeding the wider buildup in the Caribbean.","https://www.reuters.com/graphics/USA-CARIBBEAN/MILITARY-BUILDUP/egpbbnzyrpq/"],[17.9694,66.6175,"United States","Puerto Rico","Port of Ponce","Ponce","Navy","Co-base","2025","","","","Reuters documented that the Port of Ponce hosted the MV Ocean Trader—a vessel widely associated with U.S. Special Operations forces—along with other support ships, confirming that the port is being used as a maritime supply and staging point within the same operational network surrounding Venezuela.","https://www.reuters.com/graphics/USA-CARIBBEAN/MILITARY-BUILDUP/egpbbnzyrpq/"],[18.2496,-65.6371,"United States","Puerto Rico","Roosevelt Rds Nav Sta USARC","San Juan","Army Reserve","Operator Only","1941","","","","This base is a former United States Navy base. However, the United States Armed Forces keeps some portions of the former Roosevelt Roads Naval Base, including 54 acres transferred for the Reserve Component of the United States Army that includes the existing Roosevelt Roads US Army Reserve Center and an Armed Forces Reserve Center (AFRC). The last update to this base was included in the 2023 DoD report.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.4448,-67.1465,"United States","Puerto Rico","Cpl J.G. Rosario/Aguadilla","San Juan","Army Reserve","Operator Only","1936","","","","According to the Pentagon Air Forces Sites 2015, Cpl J.G. Rosario is an Army Reserve site in Aguadilla, Puerto Rico. However, the information is very limited about the current usage of this site.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.0069,-66.5,"United States","Puerto Rico","NG Fort Allen"," Juana Diaz","Navy","Training Base","1941","","","","Fort Allen Army Base is a United States Army Installation. Today, there are no active duty units stationed at the base, but it serves an active role in the training and education of United States Army Reserve and Puerto Rico Army National Guard soldiers on the island. A majority of Fort Allen’s facilities are dedicated solely to the training of soldiers with a few being used for administrative, temporary lodging, support, storage and maintenance.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.4113,-66.0835,"United States","Puerto Rico","Cpt E Rubio Jr/Puerto Nuevo","San Juan","Army Reserve","Operator Only","1922","","","","The Captain Euripides Rubio Junior United States Army Reserve Center (USARC) is a military base located in the Puerto Nuevo ward of Puerto Rico.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.413,-66.1198,"United States","Puerto Rico","Fort Buchanan","San Juan","Army Reserve","Operator Only","1923","","","","The United States Army Garrison Fort Buchanan, is a United States Army installation in Puerto Rico. It is located in the metropolitan area of the capital, San Juan.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.4636,-67.0664,"United States","Puerto Rico","Isabela N00207-Air Base","Isabela","Air Force","Operator Only","1960","","","","This facility is designated as an active U.S. Air Force installation. It encompasses approximately 413 acres. Specific operational details are limited in public sources. The base is listed as active in the DoD report 2010.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.0236,-66.2858,"United States","Puerto Rico","MTA Camp Santiago Rq","San Juan","Army Guard","Training Base","1940","","","","MTA Camp Santiago Rq is the primary training area for the United States Army, Army National Guard, United States Army Reserve, United States Marine Corps Reserve, and the Air National Guard in Puerto Rico. The camp is used for monthly drills throughout the year and for Annual Field Training Exercises (FTX) each summer.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.3986,-67.1772,"United States","Puerto Rico","Low Frequency Transmitter Site Aguada","Aguada","Navy","Operator Only","1923","","","","Aguada transmission station is a tall guyed radio mast erected by the US Navy. It is used as a facility of the US Navy for transmitting orders to submerged submarines near Aguada.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.0109,-66.5133,"United States","Puerto Rico","LTC HG Pesquera/Fort Allen","San Juan","Army Reserve","Operator Only","1941","","","","LTC Hernan G. Pesquera United States Army Reserve Center (USARC) is located on 40 acres within the grounds of Fort Allen, Puerto Rico.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.4392,-66.0019,"United States","Puerto Rico","Luis Munoz Marin IAP","Carolina","Air Force","Operator Only","1941","","","","Luis Muñoz Marín International Airport (SJU) in San Juan, Puerto Rico is home to the Muñiz Air National Guard Base. This base is where the Puerto Rican Air National Guard is headquartered. The base serves as a rally and distribution point for the U.S. Armed Forces during wartime.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.2518,-67.154,"United States","Puerto Rico","Mayaguez Armed Forces Reserve Center","San Juan","Army Reserve","Training Base","1902","","","","This facility serves as a Reserve Center and training site for units of the Army Reserve and the Puerto Rico Army National Guard (PRARNG).","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.2695,-65.8141,"United States","Puerto Rico","NSGA Sabana Seca","Sabana Seca","Navy","Operator Only","1941","","","","The U.S. Naval Security Group Activity (NSGA) Sabana Seca is a 2,200-acre naval communications station located in Puerto Rico. The facility is about 11 miles west of San Juan and is divided into North and South Tracts.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.27,-65.65,"United States","Puerto Rico","Pico Del Este - AFWTF","Naguabo","Navy","Training Base","1975","","","","Pico del Este is part of the Atlantic Fleet Weapons Training Facility (AFWTF). The AFWTF's \"Inner Range\" is an air-to-ground range used for aircraft training.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.27,-65.8143,"United States","Puerto Rico","Pineros Island","Ceiba","Navy","Operator Only","1942","","","","According to a 1993 New York Times article, the US Navy used the small, uninhabited island of Pineros, located off Roosevelt Roads, to store bombs.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.4851,-67.1488,"United States","Puerto Rico","Punta Borinquen Radar Site","Aguadilla","Air Force Guard","Operator Only","1936","","","","Punta Borinquen Radar Station is a facility of the Puerto Rico Air National Guard home for the 141st Air Control Squadron.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.4748,-66.1824,"United States","Puerto Rico","Punta Salinas Radar Site","Toa Baja","Air Force","Co-base","1959","","","","The Punta Salinas Radar Site is a directional search radar site established by the Puerto Rico Air National Guard (ANG) in 1959. The United States uses the Punta Salinas Radar Site. The Puerto Rico Air National Guard's 140th Air Defense Support Squadron (ADS) runs the Punta Salinas Radar Site.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.1178,-65.9629,"United States","Puerto Rico","Ramey AF Solar Observatory Research Site","Aguadilla","Air Force","Operator Only","1978","","","","The Ramey Solar Observatory is a research site operated by the Air Force Weather Agency (AFWA). The observatory was established in 1978 and is located at Ramey Air Force Base in Puerto Rico. The observatory includes the Razdow telescope and the W-250-1 solar optical telescope.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.5057,-67.1241,"United States","Puerto Rico","Ramey USARC/Aquadilla","San Juan","Army Reserve","Operator Only","1941","","","","Ramey USARC/Aguadilla is a government office and military base.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.0047,-66.279,"United States","Puerto Rico","Salinas N00207-JA","Salinas","Air Force","Operator Only","1940","","","","This site in Salinas, Puerto Rico, is identified as an active U.S. Air Force installation. It spans approximately 249 acres. According to the Pentagon Base Structure Report 2023, this base is called \"Salinas N00207-JA,\" but no information is available.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.1419,-65.4862,"United States","Puerto Rico","Vieques West","Vieques","Navy","Operator Only","1941","","","","The United States Navy used Vieques, Puerto Rico, as a bombing practice range from 1941 to 2003. The Navy left the island on May 1, 2003. However, the US is still using it for unknown purposes.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.402,-67.1547,"United States","Puerto Rico","Aguadilla North","Aguadilla","Army Reserve","Operator Only","None","","","","According to the Pentagon Base Structure Report 2023, this base is called \"Aguadilla North,\" but there is no available information about it.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.2482,-65.5775,"United States","Puerto Rico","Cabeza De Perro","Ceiba","Navy","Operator Only","1942","","","","Cabeza de Perro is an island that is the easternmost point of Isla de Culebra. It is also the name of an offshore island that is part of the former Naval Station Roosevelt Roads base in Puerto Rico.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[17.995,-66.6076,"United States","Puerto Rico","Cpt P.J. Parra/Ponce","Ponce","Army Reserve","Operator Only","None","","","","The Captain Pedro J. Parra Army Reserve Center is located in Ponce, Puerto Rico.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.2381,-65.6278,"United States","Puerto Rico","Naval Activity Puerto Rico","Naval Station Roosevelt Roads","Navy","Operator Only","1941","","","","Naval Station Roosevelt Roads, also known as Rosy Roads, was a United States Navy base in Ceiba, Puerto Rico.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.4395,-67.1523,"United States","Puerto Rico","NG Aguadilla Readiness Center","Aguadilla","Army Guard","Operator Only","2023","","","","The NG Aguadilla Readiness Center is a US base in Puerto Rico.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.1519,-65.847,"United States","Puerto Rico","NG Humacao Readiness Center","Humacao","Army Guard","Operator Only","None","","","","According to the Pentagon Base Structure Report 2023, this base is called \"NG Humacao Readiness Center,\" but there is no available information about it.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.4102,-66.1205,"United States","Puerto Rico","NOSC Puerto Rico","Fort Buchanan","Navy Reserve","Operator Only","2003","","","","The Navy Operational Support Center (NOSC) in Puerto Rico is an administrative service center for Navy Reserve Sailors. The NOSC is responsible for keeping assigned Sailors ready for mobilization so they can support mission requirements around the world.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.4118,-66.1164,"United States","Puerto Rico","PFC L.G. Oliveras/Yauco","Fort Buchanan","Army Reserve","Operator Only","None","","","","PFC L.G. Oliveras/Yauco is a U.S. Army Reserve Center.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.046,-66.2552,"United States","Puerto Rico","PFC S.C. Aviles/Salinas","Salinas","Army Reserve","Operator Only","None","","","","PFC Santos Cruz Avilés is a U.S. Army Reserve Center in Salinas, Puerto Rico.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[17.9781,-67.0797,"United States","Puerto Rico","Lajas Radar Site (TARS No.16)","Lajas","Air Force","Operator Only","2011","","","","This site is part of the Tethered Aerostat Radar System (TARS), a network of aerostat-mounted radars used for surveillance purposes. It is designed to detect low-flying aircraft and support counter-narcotics operations. The site remains operational under U.S. Customs and Border Protection.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.4566,-66.0983,"United States","Puerto Rico","San Juan National Guard","Isla Verde","Army","Operator Only","1939","","","","This facility serves as the Joint Forces Headquarters for the Puerto Rico National Guard. The primary mission of the San Juan Army National Guard Aviation Support Station is to provide aviation maintenance support, repair and maintenance for United States and allied aviation components in the region. The headquarters is active and functions as the central command for National Guard activities on the island.","https://www.milbases.com/puerto-rico/san-juan-national-guard-army-base#:~:text=San%20Juan%20Army%20National%20Guard,the%20U.S.%20and%20Puerto%20Rico."],[18.4392,-66.0019,"United States","Puerto Rico","Muñiz Air Base","Carolina","Air Force","Operator Only","1956","","","","Muñiz Air National Guard Base is the home base for the Puerto Rico Air National Guard. This installation is located within the grounds of Luis Muñoz Marín International Airport. This base is owned by the Pentagon, operated by the US Air Force and controlled by the Puerto Rico Air National Guard.","https://www.nationalguard.mil/News/Article-View/Article/4121567/156th-wing-airmen-train-with-disaster-relief-beddown-system/"],[18.5002,-67.1265,"United States","Puerto Rico","USCG Air Station Boriquen","Aguadilla","Air Force","Operator Only","1971","","","","USCG Air Station Borinquen is a United States Coast Guard Air Station located at Rafael Hernandez International Airport in Aguadilla, Puerto Rico. The station is located on the northwest tip of the island, about two hours west of San Juan Airport.","https://www.basedirectory.com/uscg-air-station-borinquen-directory"],[17.9902,-66.2857,"United States","Puerto Rico","Salinas Receiver Site","Salinas","Air Force","Operator Only","None","","","","This site in Salinas has been associated with military communications. Specific details about its current operations are limited. The operational status of the Salinas Receiver Site is not clearly documented in available sources.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.5129,-67.0755,"United States","Puerto Rico","Isabela Transmitter Site","Isabela","Air Force","Operator Only","None","","","","This site was part of the Navy's communication infrastructure. It was turned over to Collins in 1976. This site is listed as an active Air Force base in the DoD report 2025.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.2504,-65.6228,"United States","Puerto Rico","Prarng Mms Boatshop","Ceiba","Army Guard","Operator Only","None","","","","This facility is associated with the Puerto Rico Army National Guard's maintenance operations. It supports watercraft maintenance and related activities. The boatshop is active and contributes to the operational readiness of National Guard units.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.411,-66.1119,"United States","Puerto Rico","Navrescen Puerto Rico","Fort Buchanan","Navy","Operator Only","None","","","","This center supports Navy Reserve personnel in Puerto Rico. It provides administrative and training support for reservists. The facility is active and functions as a hub for Navy Reserve operations on the island.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.2184,-66.0426,"United States","Puerto Rico","Msg D Claudio Caguas","Caguas","Army Reserve","Operator Only","None","","","","This Army Reserve Center provides facilities for training and administrative support to Army Reserve units.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.4113,-66.1127,"United States","Puerto Rico","Area Maintenance Support Activity (AMSA) 161","Unknown","Army Reserve","Operator Only","None","","","","Area Maintenance Support Activity (AMSA) 161 is a closed US Army Reserve facility in Guaynabo, Puerto Rico. However, the US is still using this site for unknown purposes.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[18.3538,-65.6755,"United States","Puerto Rico","Cieba Reserve Complex","Ceiba","Army Reserve","Operator Only","None","","","","This complex includes facilities for various reserve components. It supports training and administrative functions for reserve units.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[25.1186,51.3186,"United States","Qatar","Al-Udeid Air Base","Doha","Air Force","Co-base","2001","","","Drone Base","This base is one of two military bases southwest of Doha, Qatar, also known as Abu Nakhlah Airport. It houses the Qatar Emiri Air Force, United States Air Force, Royal Air Force, and other foreign forces. It is host to a forward headquarters of United States Central Command, headquarters of the United States Air Forces Central Command, No. 83 Expeditionary Air Group RAF, and the 379th Air Expeditionary Wing of the USAF.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[44.3622,28.4883,"United States","Romania","Mihail Kogalniceanu Airfield","Mihail Kogalniceanu","Army","Co-base","1999","","NATO","","Mihail Kogălniceanu Air Base (MKAB) serves as a strategic hub for U.S. military operations in the Black Sea region. As of March 2025, over 1,400 American soldiers are stationed at the base, which hosts the U.S. Army Garrison Black Sea and Area Support Group Black Sea. The base is undergoing significant expansion to become NATO's largest military base in Europe, with plans to accommodate up to 10,000 troops and their families by 2040.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[44.3709,28.4621,"United States","Romania","Mihail Kogalniceanu Main Camp","Mihail Kogalniceanu","Army","Co-base","2014","","","","Mihail Kogalniceanu Main Camp in Romania is a forward operating site that supports the European Command's (EUCOM) mission in Eastern Europe.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[44.0767,24.43,"United States","Romania","NAVSUPPFAC Romania","Mihail Kogalniceanu","Navy","Co-base","2014","","NATO","","NSF Deveselu is a U.S. Navy installation co-located with Romania's 99th Military Base. It hosts the Aegis Ashore Missile Defense System, a land-based component of NATO's ballistic missile defense architecture. Approximately 200 personnel, including U.S. Navy sailors and Department of Defense civilians, are assigned to the facility, which became operational in 2016.","https://cnreurafcent.cnic.navy.mil/Installations/NSF-Deveselu/About/"],[46.5033,23.8853,"United States","Romania","Turzii Lrct/RoAF 71st Air Base","Cluj County","Air Force","Co-base","2003","","NATO","Drone Base","The 71st Air Base provides technical, operational, and logistical support to US soldiers conducting intelligence, surveillance, and reconnaissance missions in support of NATO operations. The base also hosts MQ-9 Reaper drones of the 31st Expeditionary Operations Group, Detachment 1, maintained by the 731st Expeditionary Attack Squadron and operated remotely by the 25th Attack Group.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[44.0787,24.4134,"United States","Romania","Deveselu Military Base","Caracal","Navy","Co-base","2008","","NATO","","This base is referred to as 99th Military Base Deveselu. This base is a Romanian NATO base hosting the United States Navy Aegis Ashore Ballistic Missile Defense System. The base consists of three military units: The Romanian 99th Military Base, which hosts two American bases: the Naval Support Facility Deveselu and the Aegis Ashore Defense System Romania.","https://www.romania-insider.com/usa-bases-romania-february-2025"],[44.8981,28.7419,"United States","Romania","Babadag training area","Babadag","Army","Training Base","2008","","NATO","","The Babadag Training Area is a military training facility in Romania. It's one of the largest and most modern training ranges in Europe. The U.S. Army began training at Babadag in 2008 as part of Romania's integration into NATO.","https://2021-2025.state.gov/u-s-relations-with-romania/"],[45.9235,24.7962,"United States","Romania","Cincu Training Base","Cincu","Army","Training Base","2017","","NATO","","The Cincu Training Center, officially known as the National Joint Training Center \"Getica,\" is located in Brașov County. It serves as a major site for multinational NATO exercises, including U.S. Army participation. The facility is undergoing modernization to accommodate up to 1,000 NATO troops and heavy equipment.","https://2021-2025.state.gov/u-s-relations-with-romania/"],[45.4833,27.9333,"United States","Romania","Smardan Training range","Smardan","Army","Training Base","2007","","NATO","","The Smârdan Training Range is used for joint military exercises involving U.S. and NATO forces. It has hosted live-fire exercises, including the use of the M142 High Mobility Artillery Rocket System (HIMARS) by Romanian and U.S. troops.","https://2021-2025.state.gov/u-s-relations-with-romania/"],[45.0777,29.4939,"United States","Romania","Campu Media training range","Unknown","Army","Training Base","2007","","","","The Capu Midia Training Range is an air defense training facility used by Romanian and U.S. forces. It has been the site of live-fire exercises, including Romania's first Patriot missile system test, supported by the U.S. Army.","https://2021-2025.state.gov/u-s-relations-with-romania/"],[46.536,24.5435,"United States","Romania","Targu Mures military base","Targu Mures","Navy","Co-base","2014","","NATO","","Târgu Mureș hosts the headquarters of the Romanian Special Operations Forces Command. While primarily a Romanian facility, it coordinates with NATO allies, including the U.S., for special operations training and missions.","https://2021-2025.state.gov/u-s-relations-with-romania/"],[-4.6166,55.4487,"United States","Seychelles","Victoria","Victoria","Unknown","Unknown","None","","","","The Seychelles' small capital of Victoria is also home to the USS Hershel “Woody” Williams (ESB-4), an Expeditionary Sea Base that supports military operations.","https://www.thenation.com/article/archive/secret-us-military-documents-reveal-a-constellation-of-american-military-bases-across-africa/"],[-4.6744,55.5219,"United States","Seychelles","Seychelles International Airport","Mahe Island","Air Force","Co-base","2011","","","Drone Base","The United States drone base in Seychelles is a military base operated by the United States and located at the Seychelles International Airport in Mahé island, Seychelles. The aerial fleet is made up of General Atomics MQ-9 Reaper drones.","https://nation.sc/archive/232580/secret-base-for-drones-stories-untrue-says-us"],[59.08,18.14,"United States","Sweden","Berga: Regimental Area and Exercise Area","Berg","Army","Training Base","2023","","","","In December 2023, the US and Sweden signed a defense cooperation agreement that gives the US access to all Sweden's mili 's military bases, including Vidsel: Airport and Test Range.","https://www.government.se/contentassets/ad5f87be923e4065b658189a9294f480/agreement-on-defense-cooperation-between-sweden-and-the-united-states-of-america.pdf"],[57.6133,18.2825,"United States","Sweden","Visby: Regimental Area and Exercise Area","Visby","Army","Training Base","2023","","","","In December 2023, the US and Sweden signed a defense cooperation agreement that gives the US access to all Sweden's military bases, including Visby: Regimental Area and Exercise Area.","https://www.government.se/contentassets/ad5f87be923e4065b658189a9294f480/agreement-on-defense-cooperation-between-sweden-and-the-united-states-of-america.pdf"],[61.2295,14.0278,"United States","Sweden","Älvdalen: Military Camp and Exercise Area","Älvdalen","Army","Training Base","2023","","","","In December 2023, the US and Sweden signed a defense cooperation agreement that gives the US access to all Sweden's military bases, including Älvdalen: Military Camp and Exercise Area.","https://www.government.se/contentassets/ad5f87be923e4065b658189a9294f480/agreement-on-defense-cooperation-between-sweden-and-the-united-states-of-america.pdf"],[63.1836,14.6419,"United States","Sweden","Östersund: Military Camp and Exercise Areas","Östersund","Army","Training Base","2023","","","","In December 2023, the US and Sweden signed a defense cooperation agreement that gives the US access to all Sweden's military bases. In 2023, US troops set up camp outside Östersund for the Aurora 23 military exercise.","https://www.government.se/contentassets/ad5f87be923e4065b658189a9294f480/agreement-on-defense-cooperation-between-sweden-and-the-united-states-of-america.pdf"],[21.4834,40.5415,"United States","Saudi Arabia","Unnamed site – Ta’if Airport","Ta’if","Air Force","Operator Only","None","","","","The U.S. has established a small logistical site at Ta’if Airport in western Saudi Arabia, primarily for storing munitions and fuel. The site includes bunkers and paved areas that could accommodate air defense systems or temporary troop facilities. Though limited in scale, it forms part of a broader U.S. strategy to expand supply points beyond Iran’s short-range missile reach.","https://www.nytimes.com/2025/06/26/world/middleeast/jenkins-us-saudi-arabia-iran.html"],[21.6794,39.1567,"United States","Saudi Arabia","Unnamed site – Jeddah Airport","Jeddah ","Air Force","Operator Only","None","","","","This U.S. military outpost has been developed at Jeddah Airport, similar in structure and function to the Ta’if site. It features storage bunkers and logistical infrastructure, supporting pre-positioned supplies for regional operations. Despite its smaller size, it complements L.S.A. Jenkins by enhancing redundancy and strategic depth on Saudi Arabia’s western flank.","https://www.nytimes.com/2025/06/26/world/middleeast/jenkins-us-saudi-arabia-iran.html"],[24.2268,38.2445,"United States","Saudi Arabia","Logistical Support Area Jenkins","Yanbu","Air Force","Operator Only","2022","","","","Logistical Support Area (L.S.A.) Jenkins, located about 20 miles inland from Saudi Arabia’s Red Sea coast, has rapidly expanded since 2024 into a major U.S. logistics and munitions hub, with upgraded storage, troop housing, and road infrastructure. Originally idle when first seen in 2022 satellite imagery, it now supports military exercises and operations by units like the 364th Expeditionary Sustainment Command. .","https://www.nytimes.com/2025/06/26/world/middleeast/jenkins-us-saudi-arabia-iran.html"],[24.5759,46.8475,"United States","Saudi Arabia","Eskan Village","Riyadh","Air Force","Co-base","1990","","","","Eskan Village, located southeast of Riyadh, serves as a U.S. military compound primarily housing personnel involved in training and advisory roles. It hosts the United States Military Training Mission (USMTM), which provides training, advice, and assistance to the Saudi Arabian Armed Forces. Additionally, the Office of the Program Manager for the Saudi Arabian National Guard Modernization Program (OPM-SANG) operates from this location. The compound has been utilized by U.S. forces since 1990 and continues to support non-combat military functions.","https://militarybases.com/overseas/saudi-arabia/"],[24.0553,47.5636,"United States","Saudi Arabia","Prince Sultan Air Base","Al Kharj","Air Force","Co-base","2003","","","","Prince Sultan Air Base is a key U.S. Air Force installation in Saudi Arabia, reestablished in 2019 to enhance regional security and deterrence capabilities. The base supports various operations, including hosting fighter jets and missile defense systems. It serves as a strategic location for U.S. forces to conduct missions with regional partners.","https://www.pbs.org/newshour/world/us-troops-will-leave-some-bases-in-iraq-under-deal-to-end-mission-fighting-islamic-state"],[26.2626,50.1531,"United States","Saudi Arabia","King Abdulaziz Air Base, Dammam","Dammam","Air Force","Co-base","1991","","","","King Abdul Aziz Air Base is a Royal Saudi Air Force operated military installation. This base is the mother base of all American bases in the Middle East, and the main link between American bases in Europe and West Asia, and American planes moved from it with their crews to Al-Kharj Air Base after the explosion that occurred in the city of Khobar in 1996","https://militarybases.com/overseas/saudi-arabia/abdul-aziz/"],[18.3069,42.8092,"United States","Saudi Arabia","King Khalid Air Base","Khamis Mushait","Air Force","Co-base","1991","","","","King Khalid Air Base, located in Khamis Mushait, was utilized by U.S. and coalition forces during the Gulf War for various operations, including air refueling and medical support. Presently, the U.S. maintains a minimal presence, with activities focused on training and logistical support in collaboration with Saudi counterparts.","https://militarybases.com/overseas/saudi-arabia/king-fahd/"],[21.4834,40.5415,"United States","Saudi Arabia","King Fahad Air Base"," Taif","Air Force","Co-base","1991","","","","The Royal Saudi Air Force operates King Fahad Air Base in Taif. The U.S. Air Force has engaged in joint exercises and training missions at this base.","https://militarybases.com/overseas/saudi-arabia/king-khalid/"],[24.7097,46.7253,"United States","Saudi Arabia","Riyadh Air Base","Riyadh","Air Force","Co-base","1996","","","","Riyadh Air Base, located in the capital city, has historically been significant for U.S. military operations in the region. While current U.S. activities at the base are limited, it continues to serve as a strategic location for coordination and logistical support in partnership with Saudi forces.","https://militarybases.com/overseas/saudi-arabia/riyadh/"],[26.6522,49.9193,"United States","Saudi Arabia","Umm Al-Sahek military city","Safwa","Air Force","Co-base","2001","","","","This base is a Saudi military city that is used by the US military. It began to be used by US forces during the Kuwait War.","https://www.wired.com/2013/02/secret-drone-base-2/"],[14.7283,-17.4575,"United States","Senegal","Theis","Unknown","Air Force","Co-base","2015","","","","The U.S. Army Africa uses space at “host nation facilities” in Theis, Senegal.","https://www.army.mil/article/285404/senegal_hosts_african_lion_2025_with_us_allied_forces"],[1.3211,104.0258,"United States","Singapore","Changi Naval Base","Singapore","Navy","Co-base","2017","","","","Changi Naval Base, officially known as RSS Singapura – Changi Naval Base, is a facility of the Republic of Singapore Navy that also accommodates U.S. Navy vessels. Under the 1990 U.S.–Singapore Memorandum of Understanding, U.S. Navy ships, including aircraft carriers and submarines, utilize CNB for port calls, resupply, and maintenance.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[1.3603,103.9094,"United States","Singapore","Paya Lebar Air Base","Singapore","Navy","Co-base","1991","","","","Paya Lebar Air Base, operated by the Republic of Singapore Air Force, serves as a strategic location for U.S. military aviation activities. The U.S. Air Force utilizes the base for refueling, transit, and training missions. Notably, the 497th Combat Training Squadron has operated there since 1991. The base also hosts U.S. VIP aircraft during official visits.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[1.4626,103.8313,"United States","Singapore","Singapore Area Coordinator","Singapore","Navy","Co-base","2007","","","","Established in 2007, the Singapore Area Coordinator manages and coordinates shore support activities for the U.S. military community in Singapore. SAC provides administrative support to various Navy, Army, Air Force, and Joint commands, overseeing housing, facilities, and family services.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[1.3667,103.8,"United States","Singapore","COMLOG Westpac Navy Base","Singapore","Navy","Operator Only","1992","","","","Task Force 73/Commander, Logistics Group Western Pacific (CTF 73/CLWP) is a U.S. Navy task force of the United States Seventh Fleet that is based in Singapore. CTF 73/CLWP is the U.S. 7th Fleet's provider of combat-ready logistics, maintaining and operating government-owned ships and operating government-contracted vessels to sustain combatant ships and units throughout the U.S. 7th Fleet area of operations.","https://militarybases.com/overseas/singapore/comlog-westpac/"],[48.4019,17.1183,"United States","Slovakia","Malacky-Kuchyna Air Base","Malacky","Air Force","Co-base","2018","","","","Malacky Air Base is operated by The Slovak Air Force. Slovakia signed an agreement in 2022 with the US to allow the US military to use the Malacky-Kuchyna Air Force base for the next ten years.","https://www.defensenews.com/global/europe/2022/02/09/new-deal-will-let-us-forces-use-two-slovakian-air-bases-for-a-decade/"],[48.6381,19.1342,"United States","Slovakia","Sliac Air Base","Sliac","Air Force","Co-base","2018","","NATO","","Situated in central Slovakia, Sliač Air Base is currently undergoing reconstruction to accommodate Slovakia's new fleet of F-16 Block 70 fighter jets. While the Slovak Air Force primarily operates the base, the DCA permits U.S. forces to utilize the facility. In 2022, NATO deployed Patriot missile defense systems near Sliač to reinforce the defense of NATO's eastern flank.","https://www.defensenews.com/global/europe/2022/02/09/new-deal-will-let-us-forces-use-two-slovakian-air-bases-for-a-decade/"],[3.1094,43.6355,"United States","Somalia","Baidoa","Baidoa","Unknown","Training Base","2024","","","","On February 15, 2024, the U.S. an agreement with Somalia to construct up to five military bases. These bases will be funded and used by the U.S. under various pretexts.","https://responsiblestatecraft.org/us-base-somalia/"],[5.5261,46.3799,"United States","Somalia","Dhusamareb","Dhusamareb","Unknown","Training Base","2024","","","","On February 15, 2024, the U.S. an agreement with Somalia to construct up to five military bases. These bases will be funded and used by the U.S. under various pretexts.","https://responsiblestatecraft.org/us-base-somalia/"],[2.7769,45.5026,"United States","Somalia","Jowhar","Jowhar","Unknown","Training Base","2024","","","","On February 15, 2024, the U.S. an agreement with Somalia to construct up to five military bases. These bases will be funded and used by the U.S. under various pretexts.","https://responsiblestatecraft.org/us-base-somalia/"],[2.6673,44.7959,"United States","Somalia","Baledogle Airfield","Wanlaweyn ","Air Force","Co-base","2017","","","Drone Base","Baledogle Airfield serves as the primary U.S. military installation in Somalia. It functions as a hub for drone operations, special forces missions, and training programs for the Somali National Army's Danab Brigade.","https://www.hiiraan.com/news4/2025/May/201434/u_s_builds_up_baledogle_airfield_in_somalia.aspx"],[-0.3547,42.5464,"United States","Somalia","Kismayo","Kismayo","Unknown","Training Base","2024","","","Drone Base","On February 15, 2024, the U.S. an agreement with Somalia to construct up to five military bases. These bases will be funded and used by the U.S. under various pretexts.","https://responsiblestatecraft.org/us-base-somalia/"],[6.7926,47.4635,"United States","Somalia","Galcayo","Galcayo","Unknown","Co-base","2019","","","","The current usage or funding of this base by the US is not yet clear. However, we will update the information once it becomes available.","Turse, Nick. “The Stealth Expansion of a Secret U.S. Drone Base in Africa,” The Intercept, October 22, 2015."],[2.0627,45.3149,"United States","Somalia","Mogadishu","Mogadishu","Unknown","Training Base","2024","","","","On February 15, 2024, the U.S. an agreement with Somalia to construct up to five military bases. These bases will be funded and used by the U.S. under various pretexts.","https://responsiblestatecraft.org/us-base-somalia/"],[11.2555,49.2884,"United States","Somalia","Bosasso","Bosasso","Unknown","Co-base","2019","","","","The current usage or funding of this base by the US is not yet clear. However, we will update the information once it becomes available.","https://www.thenation.com/article/archive/secret-us-military-documents-reveal-a-constellation-of-american-military-bases-across-africa/"],[10.438,44.997,"United States","Somalia","Berbera Port","Berbera","Army","Co-base","2020","","","","The Berbera port in Somaliland, Africa, has been used by the US military to monitor sea lines along the Arabian Peninsula's southern coast and Africa's east coast.","https://www.thenation.com/article/archive/secret-us-military-documents-reveal-a-constellation-of-american-military-bases-across-africa/"],[37.1747,-5.6158,"United States","Spain","Moron Air Base","Moron de la Frontera","Air Force","Co-base","1953","","","","Morón Air Base is a joint-use facility under Spanish command, with U.S. forces operating under the 496th Air Base Squadron. The base serves as a forward operating location for U.S. Air Force and Marine Corps units, supporting rapid deployment and contingency operations across Europe, Africa, and the Middle East","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[36.6208,-6.3316,"United States","Spain","Naval Station Rota","Rota","Navy","Co-base","1953","","NATO","","Naval Station Rota is a pivotal logistics hub for U.S. and NATO forces, offering port and airfield facilities that support operations in Europe, Africa, and the Middle East. The base hosts U.S. Navy destroyers equipped with the Aegis Ballistic Missile Defense System. Recent developments include the planned deployment of an advanced Arleigh Burke-class destroyer in 2026.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[36.6345,-6.3507,"United States","Spain","Rota Naval Hospital","Rota","Navy","Operator Only","1953","","","","Naval Hospital Rota is situated within Naval Station Rota, the U.S. Naval Hospital provides comprehensive medical services to active-duty personnel, retirees, Department of Defense civilians, and their families","https://rota.tricare.mil/About-Us"],[40.4967,-3.4458,"United States","Spain","Torrejon Air Base","Madrid","Air Force","Co-base","1953","","NATO","","Torrejón Air Base was a U.S. Air Force installation, now primarily serves NATO operations. The base hosts the Combined Air Operations Centre Torrejón, responsible for planning and executing NATO air missions. While the U.S. military presence has diminished since the early 1990s, the base remains a critical component of NATO's air defense infrastructure.","https://ac.nato.int/about/caoc/torrejon"],[4.9996,-54.9823,"United States","Suriname","Afobaka Tropics Test Site","Afobaka","Army","Operator Only","2012","","","","The Afobaka Tropics Test Site has been used by the U.S. Army's Tropic Regions Test Center (TRTC) for testing military vehicles and materials under tropical conditions. The site features a 19-mile dirt road course through dense jungle terrain, designed to simulate challenging operational environments. Infrastructure improvements, such as reinforced bridges and maintenance facilities, were implemented to support testing activities. The site also includes accommodations and communication facilities for personnel.","https://www.army.mil/article/76636/u_s_army_tropic_regions_test_center_puts_mrap_through_its_paces"],[5.6026,-54.3957,"United States","Suriname","Moengo Tropics Test Site","Moengo","Army","Operator Only","2008","","","","The Moengo Tropics Test Site is a testing area for the U.S. Army Test and Evaluation Command's Tropic Regions Test Center. It's located on the Suriname Aluminum Company's bauxite mining complex in northeastern Suriname.","https://www.researchgate.net/publication/318458100_A_technical_analysis_of_Suriname_for_tropical_testing_of_army_materiel_and_systems"],[37.0023,41.9399,"United States","Syria","Rumailan Base","Al-Hasakah","Air Force","Co-base","2014","","","","This base is secured by a long concrete wall and very protected barriers. Inside is an airstrip used to transport soldiers and military supplies. The facility has two sections, one of which is designated exclusively for American soldiers.","https://jusoor.co/ar/details/%D8%AE%D8%B1%D9%8A%D8%B7%D8%A9-%D8%A7%D9%84%D9%85%D9%88%D8%A7%D9%82%D8%B9-%D8%A7%D9%84%D8%B9%D8%B3%D9%83%D8%B1%D9%8A%D8%A9-%D9%84%D9%84%D9%82%D9%88%D9%89-%D8%A7%D9%84%D8%AE%D8%A7%D8%B1%D8%AC%D9%8A%D8%A9-%D9%81%D9%8A-%D8%B3%D9%88%D8%B1%D9%8A%D8%A9-%D9%85%D9%86%D8%AA%D8%B5%D9%81-2024"],[37.245,9.7864,"United States","Tunisia","Sidi Ahmed Air Base","Bizerte","Air Force","Co-base","2017","","","Drone Base","This base is a Tunisian air base, it has an air reconnaissance base for the US.","https://theintercept.com/2023/09/08/africa-air-base-us-military/"],[13.7629,100.5335,"United States","Thailand","Armed Forces Research Institute of Medical Sciences","Thung Phaya Thai","Army","Operator Only","1956","","","","The mission of this Institute is to conduct basic and applied research for the development of diagnostic tests, drugs, and vaccines for infectious diseases of military importance. Essentially, it is focused on addressing disease threats to soldiers in Southeast Asia and the Indian Subcontinent.","https://hivresearch.org/global-research/thailand"],[12.6797,101.005,"United States","Thailand","Utapao Royal Thai Naval Air Station","Bangkok","Navy","Co-base","1990","","","","In 2015, the United States Government rented space at U Tapao from a private contractor for use as a major logistics hub for the Iraq and Afghanistan wars. Because the lease was technically with a private contractor, this allowed U.S. and Thai officials to insist there's no U.S. 'base' and no inter-governmental basing agreement.","https://apnews.com/article/physical-fitness-united-states-government-thailand-e88e05d546ca3d66018e53601dc4c94c"],[13.7255,100.5431,"United States","Thailand","Joint United States Military Advisory Group","Yan Nawa","Army","Operator Only","1953","","","","The Joint United States Military Advisory Group (JUSMAGTHAI) is the U.S. Department of Defense's Security Assistance Organization in Thailand. It was established on September 22, 1953.","https://jusmagthai.org/home/"],[24.4395,118.3523,"United States","Taiwan","Kinmen","Kinmen","Army","Co-base","2024","","","","Kinmen, a group of islands administered by Taiwan and situated just a few miles from mainland China, has become a focal point for U.S.-Taiwan military cooperation. In early 2024, Taiwan's Defense Minister Chiu Kuo-cheng confirmed the presence of U.S. Army Special Forces on Kinmen. These forces are engaged in training exercises with Taiwan's 101st Amphibious Reconnaissance Battalion. While some reports suggest a permanent U.S. military presence.","https://www.newsweek.com/taiwan-confirms-us-troops-front-line-islands-near-china-1880865"],[23.5657,119.6033,"United States","Taiwan","Pescadores","Pescadores","Army","Co-base","2024","","","","The Pescadores, also known as the Penghu Islands, are located in the Taiwan Strait and have strategic significance. Reports indicate that U.S. Special Forces are stationed on these islands, working closely with Taiwan's military units.","https://www.wsws.org/en/articles/2024/02/10/gidn-f10.html"],[24.825,121.2737,"United States","Taiwan","Taoyuan","Taoyuan","Army","Co-base","2024","","","","Taoyuan, located in northern Taiwan, has also seen increased U.S. military activity. According to reports, American troops are present at a military base in Taoyuan, where they are involved in training Taiwanese forces, particularly in the use of drones and other advanced technologies.","https://www.newsweek.com/taiwan-confirms-us-troops-front-line-islands-near-china-1880865"],[41.0844,28.7862,"United States","Turkiye","LJYCIKOY BACHELOR HOUSING SITE SITE # 1","Istanbul","Air Force","Unknown","None","","","","The current usage or funding of this base by the US is not yet clear. However, it was listed in the DoD report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[39.9735,32.694,"United States","Turkiye","Ankara Administration Office","Ankara","Air Force","Operator Only","1965","","","","The current usage or funding of this base by the US is not yet clear. However, we will update the information once it becomes available.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.9326,41.1228,"United States","Turkiye","Batman Air Base","Batman","Air Force","Co-base","1982","","","","Batman Air Base has been used for transit of aircraft and helicopters during various operations, including search and rescue missions. While primarily a Turkish military facility, it has supported U.S. operations in the past, particularly during the Gulf War.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[38.5128,27.01,"United States","Turkiye","Cigli Air Base","Izmir","Air Force","Co-base","1961","","","","Çiğli Air Base, located near Izmir, has historically served as a military airport and was İzmir's main airport until the opening of Adnan Menderes Airport. While its current use by U.S. forces is limited, it remains a military installation used by the U.S.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.0019,35.4258,"United States","Turkiye","Incirlik Air Base","Adana","Air Force","Co-base","1980","Nuclear weapons","NATO","Drone Base","The U.S. Air Force and the Turkish Air Force are the primary users of the air base. The United States has used the base since March 1980 under the Defense and Cooperation Agreement between Turkiye and the US. The US reportedly stores dozens of B61 nuclear weapons at the base for delivery by Turkish or American aircraft.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[38.4575,27.1705,"United States","Turkiye","Izmir Air Station","Izmir","Air Force","Operator Only","1961","","NATO","","Izmir Air Station is a United States Air Force facility in Izmir, Turkiye. It is the home of the 425th Air Base squadron, a detachment of the 39th Air Base Wing out of Incirlik Air Base. It administers the Çiğli AB Loan Agreement. The station provides administrative and logistical support to NATO's Allied Land Command Headquarters and other associate units operating in the area.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[38.3494,37.7936,"United States","Turkiye","Kürecik Radar Station","Malatya","Army","Operator Only","2012","","NATO","","Kürecik Radar Station is a military installation. This base is owned and operated by the U.S. Army. It was established in 2012 for use by NATO as an early-warning radar against ballistic missile attacks. The installation of the radar system was carried out by U.S. military personnel. The establishment of the radar station was completed in February 2012. The radar station's control was transferred to NATO command in the frame of the European Phased Adaptive Approach (EPAA).","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[37.8812,41.1351,"United States","Turkiye","Mus Air Base","Batman","Air Force","Unknown","1982","","","","Muş Air Base is primarily a Turkish military installation. It has been identified among facilities where the U.S. Air Force has upgraded infrastructure. The purpose of these upgrades is to enhance improvements to runways, housing, and support facilities.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[36.77,35.78,"United States","Turkiye","Yumurtalik Petroleum Prod Storage Annex","Yumurtalik","Air Force","Co-base","1951","","","","The Yumurtalık Petroleum Product Storage Annex is a fuel storage facility that supports U.S. military operations in the region. It plays a role for the logistical readiness of U.S. forces stationed in Türkiye.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[-0.0292,30.1441,"United States","Uganda","Kasenyi","Kasenyi","Unknown","Training Base","None","","","","According to secret documents revealed in 2017, some of AFRICOM’s CL inventory, including Kasenyi in Uganda, has been disclosed. Since then, there have been no updates regarding the funding and usage of this site.","https://www.thenation.com/article/archive/secret-us-military-documents-reveal-a-constellation-of-american-military-bases-across-africa/"],[0.0447,32.4431,"United States","Uganda","Entebbe International Airport","Entebbe","Air Force","Training Base","2009","","","","Entebbe International Airport (EBB) is a US Military Cooperative Security Location (CSL). The Pentagon established CSLs in the mid-2000s to provide training for endless wars. The airport is also a reliable air access point to different parts of a continent.","https://www.thenation.com/article/archive/secret-us-military-documents-reveal-a-constellation-of-american-military-bases-across-africa/"],[-0.8002,31.4983,"United States","Uganda","Singo Training School","Kampala","Army","Training Base","2012","","","","U.S. contractors, military advisers have been training African Union troops at Singo Training School, near Kampala, to fight in Somalia.","https://newafricanmagazine.com/3492/"],[24.24,54.5483,"United States","United Arab Emirates","Al Dhafra Air Base","Abu Dhabi","Air Force","Co-base","1992","","","Drone Base","Al Dhafra Air Base hosts the U.S. Air Force's 380th Air Expeditionary Wing, supporting operations with aircraft like the F-22 Raptor, KC-10 Extender, and RQ-4 Global Hawk. The base facilitates intelligence, surveillance, reconnaissance, and air refueling missions across the region. Approximately 3,500 U.S. personnel are stationed here, collaborating closely with Emirati forces.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[25.1881,56.3597,"United States","United Arab Emirates","Fujairah Naval Base","Al Fujayrah","Navy","Co-base","2004","","","","Fujairah Naval Base is located on the Gulf of Oman, Fujairah Naval Base serves as a logistical hub for U.S. Navy operations, particularly for maritime prepositioning and joint exercises like Native Fury. The base enables rapid deployment of equipment. Its strategic position allows U.S. forces to operate outside the Strait of Hormuz.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[25.0268,55.3663,"United States","United Arab Emirates","Al Minhad Air Base","Dubai","Navy","Co-base","2001","","","","Al Minhad Air Base, operated by the UAE Air Force, has hosted various coalition forces, including the Australian Defence Force's Joint Task Force 633. While primarily supporting Australian operations, the base has been utilized by U.S. forces for logistical and operational purposes. Its facilities have been expanded to accommodate multinational missions.","https://armyrecognition.com/news/navy-news/2023/united-arab-emirates-departs-from-us-led-partnership-combined-maritime-forces"],[25.0113,55.0612,"United States","United Arab Emirates","NSA Bahrain - Jebel Ali","Dubai","Navy","Operator Only","1994","","","","The United States uses the Jebel Ali port in Dubai, United Arab Emirates. The port is the most frequently visited port by the U.S. Navy outside of the United States. The U.S. Navy's Fifth Fleet relies on the port for some operations in the Arabian Gulf.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[52.4078,0.5183,"United States","United Kingdom","Eriswell FH Annex","Lakenheath","Air Force","Operator Only","1948","","","","Eriswell Family Housing Annex serves as a residential area for U.S. military families, particularly those assigned to RAF Lakenheath and RAF Mildenhall. The annex provides convenient access to base facilities. The latest update regarding this base was included in the 2022 DoD report.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[51.9161,-1.1353,"United States","United Kingdom","RAF Bicester","Bicester","Air Force","Co-base","1950","","","","Bicester Aerodrome, formerly RAF Bicester, is a private airfield on the outskirts of the English town of Bicester in Oxfordshire. It was originally established as a military airfield, used by Royal Air Force until 2004.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[51.5694,-0.4336,"United States","United Kingdom","RAF Blenheim Crescent","Ruislip","Air Force","Co-base","2007","","","","Royal Air Force Blenheim Crescent is a non-flying Royal Air Force station in England, presently used by the United States military for administration.The site was originally leased to the United States Navy but transferred to the United States Air Force in October 2007.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[52.3633,-0.2228,"United States","United Kingdom","RAF Alconbury","Cambridge","Air Force","Co-base","1942","","","","Royal Air Force Alconbury is an active Royal Air Force station in England. The airfield has been used since 1942 by the United States Army Air Force. In 2015, the U.S. Department of Defense announced that RAF Alconbury would close as a USAFE base in 2022. In 2021, the United Kingdom Ministry of Defence approved a request from the U.S. DoD to keep RAF Alconbury open as a base for visiting U.S. forces.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[51.997,-1.3628,"United States","United Kingdom","RAF Barford St John Transmitter Annex","Croughton","Air Force","Co-base","1951","","","","The RAF Barford St John Transmitter Annex is a high-frequency (HF) transmitter annex operated by the United States Air Force (USAF). It is located six miles west of the main USAF Croughton site and relays HF, VHF, and UHF radio communications. The annex is connected to the Croughton site by a point-to-point microwave link.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[51.9875,-1.1861,"United States","United Kingdom","RAF Croughton","Croughton","Air Force","Co-base","1950","","","","RAF Croughton is a U.S. communications hub in Europe, hosting the 422nd Air Base Group. It supports global communications and intelligence operations of the U.S. military communications in Europe.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[51.6822,-1.79,"United States","United Kingdom","RAF Fairford","Fairford","Air Force","Co-base","1951","","","","RAF Fairford is a Royal Air Force (RAF) station in Gloucestershire, United Kingdom. While being an RAF station, Fairford hosts United States Air Force personnel. This base was used as an airfield during the 2003 Iraq War and the first Gulf War in 1991.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[52.4794,0.5192,"United States","United Kingdom","RAF Feltwell","Feltwell","Air Force","Co-base","1942","","","","RAF Feltwell is a Royal Air Force station in Norfolk, East Anglia that is used by the United States Air Forces in Europe – Air Forces Africa. This base is a former Second World War bomber station, the airfield is used as a housing estate for United States Air Force personnel stationed nearby at RAF Mildenhall.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[52.4083,0.5567,"United States","United Kingdom","RAF Lakenheath","Lakenheath","Air Force","Co-base","1948","","NATO","","RAF Lakenheath is the largest U.S. Air Force-operated base in the UK, hosting the 48th Fighter Wing. It operates F-15E Strike Eagles and F-35A Lightning II aircraft, playing a role in NATO's air defense.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[54.0081,-1.69,"United States","United Kingdom","RAF Menwith Hill","Harrogate","Air Force","Co-base","1954","","NATO","","RAF Menwith Hill is a joint U.S.-UK facility focused on intelligence and communications. Operated by the U.S. National Security Agency, it supports global surveillance and intelligence-gathering operations.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[52.365,0.4808,"United States","United Kingdom","RAF Mildenhall","Mildenhall","Air Force","Co-base","1950","","NATO","","RAF Mildenhall is a Royal Air Force station located in England. Despite its status as a Royal Air Force station, it primarily supports any United States military invasion. It provides air refueling capabilities, supporting U.S. and NATO operations across Europe and Africa.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[52.3833,-0.4229,"United States","United Kingdom","RAF Molesworth","Huntingdon","Air Force","Co-base","1942","","NATO","","RAF Molesworth is a Royal Air Force station. It is now a non-flying facility under the control of the United States Air Force. Currently, it is used by the United States Air Forces in Europe (USAFE). RAF Molesworth is home to the North Atlantic Treaty Organization (NATO).","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[52.3794,-0.405,"United States","United Kingdom","RAF Molesworth Storage Annex 12","Cambridge","Air Force","Co-base","1942","","","","This annex serves as an extension of RAF Molesworth, providing additional storage and logistical support for U.S. military operations. Specific details about its functions are limited.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[51.1154,-0.8935,"United States","United Kingdom","RAF Oakhanger","Selborne","Air Force","Co-base","1950","","","","RAF Oakhanger is a Royal Air Force (RAF) station in England that supports the United States Space Force's Satellite Control Network and the Skynet 5 constellation. The station is home to the Number 1001 Signals Unit (1001 SU), which provides the UK anchor for the United Kingdom military satellite communications system (UKMSCS).","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[51.5694,-0.4336,"United States","United Kingdom","Office of Naval Research","Middlesex","Navy","Operator Only","1946","","","","The Office of Naval Research (ONR) is an organization within the United States Department of the Navy responsible for the science and technology programs of the U.S. Navy and Marine Corps. The U.S. Office of Naval Research (ONR) Global for Europe, Africa, and the Middle East is located in Middlesex, England, just outside London.","https://www.onr.navy.mil/"],[51.4683,-1.4036,"United States","United Kingdom","RAF Welford Ammo Storage Area","Berkshire","Air Force","Co-base","1943","","","","RAF Welford functions as one of the largest ammunition storage facilities for the U.S. Air Force in Western Europe. It supports munitions storage and logistics, primarily for operations at RAF Fairford.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[52.0036,-1.36,"United States","United Kingdom","RAF Barford St John"," Oxfordshire","Air Force","Co-base","1941","","","","RAF Barford St John is a Royal Air Force station just north of the village of Barford St. John, England. It is now a non-flying facility, operated by the United States Air Force as a communications centre with many large communications aerials, and is a satellite of RAF Croughton.","https://www.bbc.com/news/articles/ckv7j17p1v3o"],[54.3589,-0.6697,"United States","United Kingdom","RAF Fylingdales","Pickering","Air Force","Co-base","1963","","","","RAF Fylingdales is a ballistic missile early warning station operated jointly by the UK and U.S. governments. It provides continuous radar surveillance to detect and track missile launches.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[57.7109,-3.3061,"United States","United Kingdom","RAF Lossiemouth","Scotland","Navy","Co-base","None","","","","RAF Lossiemouth is a key Royal Air Force station that hosts U.S. Navy P-8A Poseidon maritime patrol aircraft operations. The facility includes purpose-built barracks and support infrastructure for U.S. personnel.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[56.0674,-4.8148,"United States","United Kingdom","HMNB Clyde (Faslane)","Scotland","Navy","Co-base","None","","","","While Faslane is a UK base, it hosts US Navy personnel and is used for joint operations such as underwater warfare training and submarine logistics. The US military operates from shared facilities in Scotland.","https://thegunzone.com/does-the-us-have-a-military-base-in-scotland/"],[-3.5297,-3.5297,"United States","United Kingdom","DM Crombie","Scotland","Navy","Co-base","None","","","","At Defence Munitions (DM) Crombie on the Firth of Forth, the U.S. Navy operates a Cooperative Security Location (CSL). This site supports U.S. and allied naval operations with ammunition handling and logistical capabilities, managed under Naval Supply Systems Command Sigonella.","https://www.navy.mil/Press-Office/News-Stories/Article/3206705/navsup-commander-visits-navys-only-operational-logistics-support-site-in-europe/"],[46.7,36.0,"United States","Ukraine","12 Sites","Unknown","Unknown","Unknown","2017","","","","The New York Times has uncovered information about twelve CIA-operated bases in Ukraine; however, details remain unconfirmed.","https://www.nytimes.com/2024/02/25/world/europe/cia-ukraine-intelligence-russia-war.html"],[17.7044,-64.8017,"United States","Virgin Islands","Henry E. Rohlsen Airport","","Air Force","Operator Only","2025","","","","At Henry E. Rohlsen Airport in St. Croix, U.S. Virgin Islands, satellite imagery from September–October 2025 showed apron expansion works and the installation of a new radar system, developments analysts say could support refueling, parking, and surveillance for increased U.S. air operations in the Caribbean.","https://www.reuters.com/graphics/USA-CARIBBEAN/MILITARY-BUILDUP/egpbbnzyrpq/"],[18.3176,-64.8511,"United States","Virgin Islands","St. Thomas","Virgin Islands","Army Guard","Operator Only","1917","","","","St. Thomas hosts a U.S. Coast Guard Marine. The facility conducts vessel inspections.","https://myairforcebenefits.us.af.mil/Benefit-Library/Resource-Locator/US-Virgin-Islands"],[17.7116,-64.8776,"United States","Virgin Islands","NG 210th RTI Hams Bluff","Frederiksted","Army Guard","Operator Only","1973","","","","The 210th Regiment Regional Training Institute (RTI) at Hams Bluff is an active Virgin Islands National Guard facility. It provides institutional training for various military occupational specialties and leadership courses.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[17.7008,-64.7989,"United States","Virgin Islands","NG AASF Blair Hangar","Christiansted","Army Guard","Operator Only","1973","","","","The Army Aviation Support Facility (AASF) at Blair Hangar is an active National Guard installation. It supports aviation operations, including maintenance and logistical support for rotary-wing aircraft.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[17.7334,-64.794,"United States","Virgin Islands","NG Bethlehem Military Compound","Christiansted","Army Guard","Operator Only","1973","","","","The Bethlehem Military Compound is a USVI National Guard facility located in Christiansted, Virgin Islands. The compound also includes a National Guard Vehicle Maintenance Shop.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[17.7193,-64.8812,"United States","Virgin Islands","NG Sprat Hall","Frederiksted","Army Guard","Operator Only","1973","","","","Sprat Hall is a National Guard facility located in Frederiksted, St. Croix. While specific details about its current operations are limited, it has been associated with military activities in the past.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[17.7221,-64.8917,"United States","Virgin Islands","UNDERWATER RANGE USVI","Saint Croix","Navy","Operator Only","1973","","","","The Underwater Range in the U.S. Virgin Islands is a Navy-operated facility used for underwater tracking and acoustic communication. It supports naval training exercises and research activities.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[17.7064,-64.7953,"United States","Virgin Islands","ST CROIX ANG STATION SITE 1","Frederiksted","Air Force","Operator Only","None","","","","The St. Croix Air National Guard Station, located in Christiansted, is an active facility supporting the Virgin Islands Air National Guard. It hosts units responsible for civil engineering and communications missions.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[19.2825,166.6367,"United States","Wake Island","Wake Island Airfield","Wake Island","Air Force","Operator Only","1935","","","","Wake Island Airfield is a U.S. Air Force installation in the Pacific Ocean. It is owned by the U.S. Air Force and operated by the 611th Air Support Group. It serves as a trans-Pacific refueling stop and supports missile defense testing activities.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[25.0268,55.3663,"Australia","United Arab Emirates","Al Minhad Air Base","Dubai","Air Force","Co-base","2008","","","","Al Minhad Air Base, located approximately 15 miles south of Dubai, serves as the headquarters for the Australian Defence Force's (ADF) Joint Task Force 633. This facility, known as Camp Baird, functions as a logistics and operational hub for Australian military operations in the Middle East. The base has hosted various Australian aircraft, such as the F/A-18F Super Hornet and the E-7A Wedgetail.","https://www.globalsecurity.org/military/facility/uae.htm"],[5.4661,100.3911,"Australia","Malaysia","Butterworth Air Base","Butterworth ","Air Force","Co-base","1958","","","","Under the Five Power Defence Arrangements (FPDA), Australia maintains a permanent military presence at the Royal Malaysian Air Force (RMAF) Butterworth Air Base in Penang, Malaysia. The Royal Australian Air Force (RAAF) operates units such as No. 19 Squadron and No. 92 Wing Detachment Alpha from this base. Additionally, the Australian Army's Rifle Company Butterworth conducts regular rotations here.","https://www.airforce.gov.au/about-us/bases/rmaf-base-butterworth"],[29.3766,47.9826,"Bangladesh","Kuwait","Unknown location","Kuwait","Air Force","Co-base","1991","","","","Bangladesh Military Contingent (BMC) has resided in Kuwait since the end of the 1991 Gulf War to assist the Kuwait Military Forces in logistics and other sectors under a bilateral agreement.","https://kuwaittimes.com/kuwaiti-bangladeshi-military-ties-distinctive-senior-officer/"],[29.3313,47.6159,"Canada","Kuwait","OSH Kuwait","","Air Force","Co-base","2011","","","","In late 2011, Canada entered into an OSH arrangement with Kuwait to establish a means to support CAF operations in Afghanistan. This operational support detachment served as a transportation hub, a point where CAF personnel, materiel, and equipment were transferred between modes of transportation. Canada signed a new agreement with Kuwait on 12 May 2014 to establish and maintain an OSH in Southwest Asia.","https://breachmedia.ca/canada-building-global-network-of-military-bases-in-aggressive-shift/"],[14.7444,-17.4908,"Canada","Senegal","OSH Senegal","","Air Force","Co-base","2018","","","","In Spring of 2018, an Interim Operational Support Hub (IOSH) was established at the Léopold Sédar Senghor (LSS) airport in Dakar, Senegal to support Operation (Op) PRESENCE Task Force Mali. This later became a standing OSH in West Africa.","https://breachmedia.ca/canada-building-global-network-of-military-bases-in-aggressive-shift/"],[17.9405,-76.8307,"Canada","Jamaica","OSH Jamaica","","Air Force","Co-base","2016","","","","It was activated in 2016. This hub is located in Kingston, Jamaica. It serves as a logistical support point for Canadian operations in the Caribbean region.","https://breachmedia.ca/canada-building-global-network-of-military-bases-in-aggressive-shift/"],[50.8668,7.1392,"Canada","Germany","OSH Germany","","Air Force","Co-base","2009","","","","This hub has been operational since 2009. The European hub is based at the Köln-Bonn Airport in Germany. It offers logistical support for Canadian missions in Europe and provides access to the continent's transportation networks.","https://breachmedia.ca/canada-building-global-network-of-military-bases-in-aggressive-shift/"],[11.5902,43.0631,"China","Djibouti","People's Liberation Army Support Base","","Navy","Operator Only","2017","","","","The People's Liberation Army (PLA) Base in Djibouti is China's first overseas military base, run by the PLA Navy (PLAN). It's located in the Horn of Africa, between the port of Djibouti and a new railway station, and measures approximately 1 kilometer in length and 700 meters in width. The base cost is US$ 590 million to build.","https://www.eurasiantimes.com/second-chinese-military-base-in-africa/"],[38.9973,72.0014,"China","Tajikistan","Gorno-Badakhshan","","Navy","Operator Only","2021","","","","In February 2019, the Washington Post published information on Chinese troops' presence in Central Asia based on photos and interviews in Tajikistan. China operates a military base in Tajikistan in the Murghab region near the Afghan border in a remote stretch close to the Wakhan Corridor. The collection of facilities and outposts is believed to have been in operation for at least five years.","https://jamestown.org/program/china-increasing-its-military-presence-in-tajikistan/"],[10.5072,103.6119,"China","Cambodia","Ream Naval Base","","Navy","Co-base","2018","","","","In 2019, the Wall Street Journal reported that China and Cambodia had reached a secret agreement to upgrade the Ream Naval Base. Three years later, in June 2022, the two countries hosted a groundbrea
