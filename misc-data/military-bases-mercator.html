ently for small-unit exercises and simulations. It includes ranges and field spaces operated under the U.S. military in Germany. Environmental impact and local concerns have occasionally been raised. Access is restricted and its use depends on training schedules and coordination.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[48.6791,9.0395,"United States","Germany","Boeblingen Officers Club","Boeblingen","Army","Operator Only","1945","","","","The Boeblingen Officers Club is a U.S.-operated facility near Panzer Kaserne. It has historically been used for official events, dining, and gatherings. In recent years, parts of the building have faced closure due to structural issues. Its future remains uncertain amid evolving base realignment plans.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.1764,7.0578,"United States","Germany","Buechel Air Base","Buchel","Air Force","Co-base","1945","Nuclear weapons","","","Buechel Air Base is a German military installation that hosts U.S. nuclear weapons under NATO nuclear sharing. It is operated by the German Air Force, with a U.S. military presence primarily for technical support and oversight. The base has drawn criticism due to its nuclear role and secrecy.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.5631,8.4628,"United States","Germany","Coleman Barracks","Mannheim","Army","Operator Only","1937","","","","Coleman Barracks in Mannheim is currently a U.S. Army facility used for equipment storage and as a staging area. Though once marked for closure, it remains in limited use due to logistical needs. Reports have confirmed temporary deployments and supply operations as recent as 2024.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.0841,8.2738,"United States","Germany","Crestview Housing Area","Wiesbaden","Army","Operator Only","1945","","","","Crestview Housing Area, formerly part of the U.S. military housing system in Wiesbaden, was used for accommodating American service families. Over time, much of the housing has been handed back to German authorities. Some buildings remain vacant or are being repurposed.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.446,7.8132,"United States","Germany","Daenner Kaserne","Kaiserlautern","Army","Operator Only","1950","","","","Daenner Kaserne is the home of the 2143rd U.S. Army Maintenance Battalion, the Kaiserslautern Regional Support Detachment and Army Reserve units - the 310th TAACOM forward, 313th and 330th Support Centers, and the 793rd and 1177th Movement Control teams.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[51.8349,7.3164,"United States","Germany","Duelmen Tower Barracks","Dulmen","Army","Operator Only","2017","","","","Acquired in 2016 by U.S. Army Garrison Benelux, Dülmen Tower Barracks functions as an Army Prepositioned Stock-2 Work Site, managed by the 405th Army Field Support Battalion-Germany","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.3191,11.9003,"United States","Germany","East Camp Grafenwoehr","Grafenwohr","Army","Operator Only","2001","","","","East Camp Grafenwoehr—commonly called Tower Barracks—is the principal post of the Grafenwoehr Training Area, housing the 7th Army Joint Multinational Training Command and regimental engineer and cavalry squadrons. It now hosts elements of the 173rd Airborne Brigade under the European Deterrence Initiative for rotational deployments.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[48.6898,9.2237,"United States","Germany","Echterdingen Airfield","Stuttgart","Army","Co-base","1946","","","","Stuttgart Army Airfield (Fliegerhorst Echterdingen) occupies the southern sector of Stuttgart Airport and has been under U.S. Army control since 1945. It is managed by U.S. Army Special Operations Command and supports military troop and cargo flights separate from civilian operations","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.004,8.6118,"United States","Germany","Egelsbach Transmitter Facility","Langen","Army","Operator Only","1945","","","","The Egelsbach Transmitter Facility is a U.S. Army communications and SIGINT station on a 30 ha site in Hesse, active since WWII’s end. It hosts 20 log-periodic shortwave antennas, four radomes, and microwave relays, all secured by fence, gate, and U.S. military police watches. Owned and managed by U.S. Army Europe (7th Army HQ), it relays and intercepts military communications across the European theater.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.1972,7.9678,"United States","Germany","Einsiedlerhof Maintenance Annex","Einsiedlerhof","Air Force","Operator Only","1945","","","","The Einsiedlerhof Maintenance Annex, part of U.S. Army Garrison Rheinland-Pfalz, provides repair and upkeep of Army vehicles and equipment for the Kaiserslautern Military Community. Located adjacent to the main air station, it supports both routine service and contingency work on tactical and support vehicles.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.5956,9.9598,"United States","Germany","Einsiedlerhof Storage Annex","Einsiedlerhof","Air Force","Operator Only","1945","","","","Operated by U.S. Army Garrison Rheinland-Pfalz, the Einsiedlerhof Storage Annex houses general supplies and materiel in secured warehouses on the Kaiserslautern Post. It functions as a distribution point for consumables and small arms equipment to units across the region.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.45,7.75,"United States","Germany","Einsiedlerkoepfe Training Annex","Kaiserlautern","Air Force","Operator Only","1945","","","","The Einsiedlerhof Training Annex is a ground-training area within the Kaiserslautern Military Community footprint. It offers field lanes and maneuver space for small-unit drills and joint U.S.–NATO exercises, such as simulated air-defense and command-post scenarios","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[47.5,11.0804,"United States","Germany","Garmisch Family Housing","Garmisch","Army","Operator Only","1946","","","","Garmisch Family Housing comprises government-owned quarters assigned by USAG Bavaria to command-sponsored service members and their families.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.9608,6.0425,"United States","Germany","Geilenkirchen Air Base","Geilenkirchen","Air Force","Co-base","1968","","NATO","","NATO Air Base Geilenkirchen hosts the Alliance’s 14-aircraft E-3A AWACS fleet, with U.S. Air Force personnel from the 470th Air Base Squadron providing support alongside multinational crews. The base functions under NATO ownership, not U.S. control, yet American airmen maintain base operations and logistics. Recent upgrades include final lifetime extension work on several E-3As, ensuring fleet capability through 2035.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.2198,8.37,"United States","Germany","Germersheim Army Depot","Germersheim","Army","Operator Only","1951","","","","Germersheim Army Depot, established in 1951 as the Germersheim Ordnance Vehicle Park, has long served as a U.S. Army storage and issuance site for vehicles and equipment in support of USAREUR. Today it operates under DLA Distribution Europe for supply and HAZMAT storage.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.72,11.91,"United States","Germany","Grafenwoehr","Grafenwohr","Army","Operator Only","1945","","","","The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2024.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.7988,7.9678,"United States","Germany","Grafenwoehr Training Area","Grafenwohr","Army","Training Base","1945","","","","Grafenwoehr Training Area (GTA) is a United States Army training base, which is considered as the largest US training facility in Europe. The base is operated by 7th Army Joint Multinational Training Command. Facilities include the Tower Barracks.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.341,10.0816,"United States","Germany","Gruenstadt AAFES Fac","Gruenstadt","Army","Operator Only","1949","","","","Gruenstadt AAFES Facility serves as a logistical hub for the Army and Air Force Exchange Service (AAFES) in Germany. It primarily supports retail distribution operations for U.S. military installations across Europe. While not a typical base with troops, it plays a background support role.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.08,8.23,"United States","Germany","Hainerberg Housing and Shop Ctr","Wiesbaden","Army","Operator Only","1945","","","","Hainerberg Housing and Shopping Center, located in Wiesbaden, Germany, provides family housing and retail services for U.S. personnel. It includes a PX, commissary, and other community support amenities. It remains active and managed by U.S. Army Garrison Wiesbaden. No public updates have reported major changes or closures.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[47.4995,11.0804,"United States","Germany","Hausberg Ski Area","Garmisch","Army","Operator Only","1950","","","","Hausberg Ski Area, situated in Garmisch-Partenkirchen, is associated with the U.S. military's recreational and morale services. It provides winter sports access for authorized personnel and families. Though part of the U.S. Armed Forces Recreation Centers (AFRC), it has faced scrutiny over costs. The area continues operations but with limited transparency.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.2003,11.8514,"United States","Germany","Hohenfels","Hohenfels","Army","Operator Only","1951","","","","The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.2,11.85,"United States","Germany","Hohenfels Training Area","Hohenfels","Army","Operator Only","1951","","","","The Hohenfels Training Area (HTA), located in Bavaria, Germany, spans approximately 163 square kilometers (about 40,000 acres), making it the second-largest U.S. military training area in Europe after Grafenwöhr . Established in 1951, HTA serves as the home of the Joint Multinational Readiness Center (JMRC), the U.S. Army's only overseas Combat Training Center . The facility includes over 1,300 training structures, 319 kilometers of roads, numerous cross-country trails, and a short take-off/landing airfield, supporting realistic multinational training exercises.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.6202,7.3304,"United States","Germany","Hoppstaedten Waterworks","Baumholder","Army","Operator Only","1950","","","","The Hoppstädten Waterworks was a U.S. Army-operated facility supplying drinking water to the military community of Baumholder. Situated on the Nahe River, it comprised several buildings and two sludge drying pits. In 2015, the U.S. Department of Defense announced plans to return the waterworks to the German government as part of the European Infrastructure Consolidation initiative. However, this site is mentioned in the DoD report of 2024 as an active base.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.2,7.5998,"United States","Germany","Husterhoeh Communication Site","Pirmasens","Air Force","Operator Only","1945","","","","The Husterhöh Communication Site, part of the Husterhöh Kaserne in Pirmasens, Germany, was a significant U.S. military installation from 1945 until its closure in 1994. Although most of the site has been returned to German control and repurposed for civilian use, some U.S. military operations, such as the U.S. Army Medical Materiel Center-Europe, continue to operate there.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.2268,7.6117,"United States","Germany","Husterhoeh Kaserne","Pirmasens","Army","Co-base","1945","","","","Husterhoeh Kaserne is a former U.S. military base located in Pirmasens, Germany, operational from 1945 until 1994. While most of the facility has been transferred to German civilian and military use, parts of it still support U.S. operations, notably the U.S. Army Medical Materiel Center-Europe.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.2003,7.6002,"United States","Germany","Husterhoehe Warehouse Complex","Pirmasens","Air Force","Co-base","1951","","","","The Husterhoehe Warehouse Complex, adjacent to the former kaserne, functions primarily as a logistics and storage site. Though it no longer hosts large troop deployments, it continues to support military supply chains and medical logistics, jointly operated by U.S. and German personnel under evolving NATO infrastructure support roles.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.4504,7.7057,"United States","Germany","Kaiserslautern","Kaiserlautern","Army","Operator Only","1950","","","","Kaiserslautern hosts the largest U.S. military community outside the United States, known as the Kaiserslautern Military Community (KMC). The KMC supports approximately 54,000 individuals, including service members, Department of Defense civilians, contractors, and their families. Key installations within the KMC include Ramstein Air Base, Landstuhl Regional Medical Center, and various Army facilities such as Kleber Kaserne and Pulaski Barracks.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.3787,7.7856,"United States","Germany","Kaiserslautern Army Depot","Kaiserlautern","Army","Operator Only","1950","","","","The Kaiserslautern Army Depot is a logistics hub operated by the 21st Theater Sustainment Command's Theater Logistics Support Center-Europe (TLSC-E). It provides direct and theater-level supply support, including the receipt, storage, maintenance, and issuance of various supply classes. The depot also manages specialized services such as textile repair, NBC protective mask testing, and hazardous material control.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.45,7.75,"United States","Germany","Kaiserslautern Equipment Support Center","Kaiserlautern","Army","Operator Only","1950","","","","The Kaiserslautern Equipment Support Center (KEMC) is the largest of ten Equipment Maintenance Centers under the U.S. Army Equipment Maintenance Group. It offers depot-level maintenance services for a wide range of military equipment.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.4364,7.7146,"United States","Germany","Kaiserslautern Warehouse Storage","Ramstein","Air Force","Operator Only","1950","","","","The Kaiserslautern area hosts several U.S. military storage and logistics facilities","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.4499,7.7502,"United States","Germany","Kapaun Administration Annex","Kaiserlautern","Air Force","Operator Only","1950","","","","Kapaun Administration Annex, located in Kaiserslautern, Germany, is part of the Kaiserslautern Military Community. The annex hosts various administrative and support functions for U.S. military personnel in the region.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.3,10.57,"United States","Germany","Katterbach Kaserne","Ansbach","Army","Operator Only","1935","","","","Katterbach Kaserne is an active U.S. Army installation located in Ansbach, Germany. It serves as a key site for Army aviation operations and is part of U.S. Army Garrison Ansbach. The installation supports various units and provides facilities for military personnel and their families.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[48.79,9.19,"United States","Germany","Kefurt & Craig Village Family Housing","Stuttgart","Army","Operator Only","1946","","","","Kefurt and Craig Villages are active family housing areas located in the Vaihingen district of Stuttgart, Germany. They are part of the U.S. Army Garrison Stuttgart's housing portfolio, providing accommodations for military personnel and their families. These housing areas are situated near Patch Barracks and are managed by the U.S. Army.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.5038,7.7504,"United States","Germany","Kleber Kaserne","Kaiserlautern","Army","Operator Only","1945","","","","Kleber Kaserne is a U.S. Army base in Kaiserslautern, Germany. It's part of the Kaiserslautern Military Community (KMC), which is the largest U.S. military community outside of the United States","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[48.8256,9.19,"United States","Germany","Kornwestheim Golf Course","Kornwestheim","Army","Operator Only","1956","","","","The Kornwestheim Golf Course, officially known as Golfclub Neckartal e.V., is located in Kornwestheim, near Stuttgart, Germany. Originally established in 1956 as a U.S. military golf course, it has since transitioned to a German civilian golf club. The course is known for its challenging layout and is open to both military personnel and civilians.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.4199,7.5706,"United States","Germany","Landstuhl Family Hsg Annex O3","Landstuhl","Air Force","Operator Only","1953","","","","Landstuhl Family Housing Annex O3 is part of the U.S. Army Garrison Rheinland-Pfalz's housing portfolio. It provides residential accommodations for military personnel and their families stationed in the Kaiserslautern Military Community. The housing annex is active and managed by the Housing Services Office.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.4031,7.5361,"United States","Germany","Landstuhl Heliport","Landstuhl","Army","Operator Only","1989","","","","The Landstuhl Heliport, designated as ETIY, is an active military heliport located in Landstuhl, Germany. It supports medical evacuation operations and other military aviation activities. Flight tracking data indicates ongoing usage of the facility.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.4042,7.5603,"United States","Germany","Landstuhl Hospital","Landstuhl","Army","Operator Only","1953","","","","Landstuhl Regional Medical Center is the largest American military hospital outside the United States. It serves as a critical medical facility for U.S. forces in Europe, providing comprehensive healthcare services, including trauma care. LRMC is currently operational and continues to play a role in military medical readiness.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.6965,9.1674,"United States","Germany","Landstuhl Maintenance Site 1","Landstuhl","Air Force","Operator Only","1953","","","","Landstuhl Maintenance Site 1 is an active U.S. military maintenance facility located in Landstuhl, Germany. It supports the maintenance and logistical needs of military operations within the region. The facility remains operational under the oversight of U.S. Army Garrison Rheinland-Pfalz.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.8497,7.5504,"United States","Germany","Landstuhl Maintenance Site No 2","Landstuhl","Air Force","Operator Only","1953","","","","Landstuhl Maintenance Site No. 2 is another active maintenance facility supporting U.S. military operations in the Landstuhl area. It provides essential maintenance services to ensure the readiness of military equipment and vehicles. The site continues to function under the administration of U.S. Army Garrison Rheinland-Pfalz.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.0097,8.2844,"United States","Germany","Mainz-Kastel Station","Wiesbaden","Army","Operator Only","1953","","","","Mainz-Kastel Station, located in the Mainz-Kastel district of Wiesbaden, was historically utilized by the U.S. Army as a logistics and storage facility. Notably, it housed the European Technical Center (ETC), a significant signals intelligence hub operated by the National Security Agency (NSA), serving as a primary communications node for U.S. military and intelligence operations across Europe, Africa, and the Middle East. However, as part of the U.S. Department of Defense's European Infrastructure Consolidation (EIC) initiative announced in 2015, Mainz-Kastel Station was slated for closure and full return to the German government.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.9651,8.1247,"United States","Germany","McCully Barracks","Wackernheim","Army","Operator Only","1953","","","","McCully Barracks, situated in Wackernheim near Mainz, remains an active U.S. Army installation under the administration of U.S. Army Garrison Wiesbaden. The facility has undergone recent renovations to support the 5th Signal Command, including a $3.3 million project to refurbish Building 6217, a historic hangar repurposed as a warehouse.","https://www.globalsecurity.org/military/facility/mccully.htm"],[48.7304,9.1454,"United States","Germany","Moehringen Family Housing","Stuttgart","Army","Operator Only","1946","","","","The Möhringen Family Housing area in Stuttgart is an active residential community for U.S. military personnel. Established between 1950 and 1957, it comprises part of the approximately 3,465 housing units available to the U.S. military in Stuttgart.",""],[49.7909,6.6976,"United States","Germany","Niederkail water System Annex Site 1","Trier","Air Force","Operator Only","1945","","","","The Niederkail Water System Annex Site 1 is associated with U.S. Air Force infrastructure. As of 2017, projects were planned to replace the intrusion alarm system at the site, indicating its operational status at that time. However, more recent information about its current status is not readily available.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.2995,10.5702,"United States","Germany","Oberdachstetten Training Area","Unknown","Army","Co-base","1949","","NATO","","The Oberdachstetten Local Training Area is a training area in Germany that's used by the U.S. Army Europe, NATO, and rotational unit soldiers. The area includes a two-lane automated pistol range, five known distance ranges, and a five-lane, 300-meter automated record fire range.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.4049,7.4368,"United States","Germany","Miesau","Miesau","Army","Operator Only","1953","","","","The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2025.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.7506,8.0796,"United States","Germany","Miesau Ammo Depot","Miesau","Army","Operator Only","1953","","","","Miesau Army Depot is the largest ammunition storage area outside the United States. Its mission is to issue, receive, store, transship, inspect, inventory, and maintain ammunition stock records accounting.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.4416,7.827,"United States","Germany","Panzer Kaserne, Kaiserlautern","Kaiserlautern","Army","Operator Only","1945","","","","Panzer Kaserne in Kaiserslautern is an active U.S. Army installation, part of U.S. Army Garrison Rheinland-Pfalz. It hosts the headquarters of the 21st Theater Sustainment Command (TSC), the largest forward-deployed logistical command in the U.S. Army, providing comprehensive support across the European theater.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[48.6818,9.046,"United States","Germany","Panzer Kaserne, Stuttgart","Stuttgart","Army","Operator Only","1945","","","","Panzer Kaserne is a U.S. military installation in Böblingen, Germany, part of U.S. Army Garrison Stuttgart. The post is administered by the U.S. Army Installation Management Command-Europe (IMCOM-Europe).","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[48.7364,9.0811,"United States","Germany","Patch Barracks","Stuttgart","Army","Operator Only","1946","","","","Patch Barracks, situated in Stuttgart-Vaihingen, is an active U.S. military installation serving as the headquarters for U.S. European Command (EUCOM). It also hosts Special Operations Command Europe (SOCEUR) and other critical defense agencies. The base includes a Department of Defense Education Activity (DoDEA) middle school and various support facilities for military personnel and their families.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.4314,7.6867,"United States","Germany","Pulaski Barracks","Kaiserlautern","Army","Operator Only","1950","","","","Pulaski Barracks is an active U.S. Army installation located in Kaiserslautern, Germany. It serves as a key component of U.S. Army Garrison Rheinland-Pfalz, providing administrative support and housing various military units. The installation continues to function for the U.S. military operations in the region.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.4368,7.6003,"United States","Germany","Ramstein Air Base","Ramstein","Air Force","Co-base","1951","","NATO","Drone Base","Ramstein Air Base is an active U.S. Air Force installation situated in Ramstein-Miesenbach, Germany. It serves as the headquarters for U.S. Air Forces in Europe – Air Forces Africa (USAFE-AFAFRICA) and NATO Allied Air Command. This base has a large housing community for troops. The U.S. stores nuclear weapons at this base.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.4499,7.7505,"United States","Germany","Ramstein Storage Annex","Weilerbach","Air Force","Operator Only","1951","","","","The Ramstein Storage Annex, located in Weilerbach, Germany, is an active U.S. Air Force facility. It provides storage and logistical support to Ramstein Air Base and other military operations in the region.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.0802,8.2297,"United States","Germany","Rheinblick Recreation Annex","Wiesbaden","Army","Operator Only","1945","","","","The Rheinblick Recreation Annex, situated in Wiesbaden, Germany, is an active U.S. Army recreational facility. It offers amenities such as a golf course and dining options for military personnel and their families. The annex remains operational.","https://www.army.mil/article/60189/american_hunters_welcomed_to_brotherhood_of_traditional_german_hunters"],[49.4431,7.6972,"United States","Germany","Rhine Ordnance Barracks","Kaiserlautern","Army","Operator Only","1948","","","","Rhine Ordnance Barracks is across Kaiserstrasse from Vogelweh and houses the 29th Support Group, TSC's forward-deployed contingency logistical command. Other 21st TSC units on ROB are the 5th Maintenance Company, the 230th Military Police Company and the 5th Quartermaster Detachment.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[48.8214,9.1878,"United States","Germany","Robinson Barracks","Stuttgart","Army","Operator Only","1946","","","","Robinson Barracks is a military base of the U.S. in the Burgholzhof community in the northern Stuttgart district of Bad Cannstatt. Unlike Patch Barracks and Kelley Barracks, also located in Stuttgart, the modern Robinson Barracks is now largely a residential neighborhood for US personnel stationed in the greater Stuttgart area operated and administered by IMCOM-Europe.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[48.79,9.19,"United States","Germany","Robinson-Grenadier Family Housing","Stuttgart","Army","Operator Only","1946","","","","Robinson Barracks, located in the Burgholzhof area of Stuttgart, serves as a residential community for DoD personnel. It includes family housing, a DoDEA elementary/middle school, and various support facilities. The adjacent Grenadier Kaserne was closed in 1993 and has since been redeveloped into a civilian neighborhood. Robinson Barracks remains active under U.S. Army Garrison Stuttgart, providing housing and community services to military families.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[48.4,11.98,"United States","Germany","Sembach Admin Annex (Wing HQ)","Sembach","Army","Operator Only","1951","","","","The Sembach Admin Annex (Wing HQ) is a US Air Force base in Germany.",""],[47.4998,11.0804,"United States","Germany","Sheridan Barracks","Garmisch","Army","Operator Only","1946","","","","Sheridan Kaserne was a U.S. Army installation located in Augsburg, Germany. Established in the 1950s. The base was decommissioned in 1998. However, this base is listed in the DoD report as an active base, but there is no current update.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.3178,10.6156,"United States","Germany","Shipton Kaserne","Ansbach","Army","Operator Only","1980","","","","Shipton Kaserne is an active U.S. Army post situated near Ansbach, Germany. Constructed in the late 1980s, it currently hosts the 5th Battalion, 4th Air Defense Artillery Regiment. The installation remains operational and is part of the U.S. Army Garrison Ansbach.","https://usarmybarracks.com/2022/01/11/shipton-kaserne/"],[49.62,7.3298,"United States","Germany","Smith Barracks","Baumholder","Army","Operator Only","1951","","","","Smith Barracks is a military installation in Baumholder, Germany. It's the main post of the Baumholder base, which also includes the base operations area support teams of Strassburg and Neubrucke.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.61,11.7999,"United States","Germany","South Camp Vilseck","Vilseck","Army","Operator Only","1947","","","","South Camp Vilseck is part of the U.S. Army Garrison Bavaria, located near Rose Barracks in Vilseck, Germany. It supports various operational and logistical functions for units stationed in the area.",""],[50.4648,7.6359,"United States","Germany","Spangdahlem Waste Annex","Spangdahlem","Air Force","Operator Only","1951","","","","The Spangdahlem Waste Annex refers to the base's recycling and waste management facilities. These facilities are operational and support the base's environmental sustainability efforts, including proper disposal and recycling of various materials.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[48.79,9.19,"United States","Germany","Steuben & Weicht Vil Family Housing","Stuttgart","Army","Operator Only","1946","","","","Information on \"Steuben & Weicht Vil Family Housing\" is limited. There is no publicly available data confirming its current use or operational status by the U.S. military.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.4733,10.3864,"United States","Germany","Storck Barracks","Illesheim","Army","Operator Only","1948","","","","Storck Barracks/Illesheim Kaserne is a United States Army facility. it is part of the United States Army Garrison (USAG) Franconia. It is the home of the 2nd Battalion, 159th Aviation Regiment, and the 3rd Battalion, 159th Aviation Regiment, both equipped with the Boeing AH-64 Apache; D Co 412th Aviation Support Battalion (all units part of the 12th Combat Aviation Brigade) and the 3rd of the 58th Airfield Operations Battalion (AOB).","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.9758,6.6972,"United States","Germany","Spangdahlem Air Base","Spangdahlem","Air Force","Co-base","1951","","NATO","","Spangdahlem Air Base, located in Rhineland-Palatinate, Germany, is an active U.S. Air Force installation. It hosts the 52nd Fighter Wing, which operates F-16CJ aircraft and supports various NATO missions. This base is owned by the German Federal Government, but operated and controlled by the US Air Force.","https://www.stripes.com/theaters/europe/2024-06-30/us-military-bases-germany-terrorism-threat-14342506.html."],[48.7964,9.125,"United States","Germany","Stuttgart Admin Facility","Stuttgart","Army","Operator Only","1942","","","","The Stuttgart Administrative Facility is an active U.S. Army installation located in Stuttgart, Germany. It serves as a central hub for administrative and support services within the Stuttgart Military Community, including in-processing and personnel management. The facility is part of U.S. Army Garrison Stuttgart, which encompasses several installations such as Patch Barracks, Kelley Barracks, and Panzer Kaserne. However, this facility was identified to be returned to the host country in 2015, but the USA still maintains it to this date.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.61,11.8,"United States","Germany","Vilseck","Vilseck","Army","Operator Only","1947","","","","Vilseck, part of U.S. Army Garrison Bavaria, is an active installation housing Rose Barracks and supporting units like the 2nd Cavalry Regiment.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[48.7898,9.1907,"United States","Germany","Stuttgart Dependent School","Stuttgart","Army","Operator Only","1946","","","","Stuttgart Dependent School refers to Department of Defense Education Activity (DoDEA) schools in the Stuttgart area, including Stuttgart High School on Panzer Kaserne, which remain active and serve U.S. military dependents.","https://www.stuttgartcitizen.com/newcomers/pcs-in/dodea-schools-in-the-stuttgart-military-community/"],[49.45,7.75,"United States","Germany","Vogelweh FH Annex","Kaiserlautern","Air Force","Operator Only","1950","","","","Vogelweh Family Hsg Annex is a US Air Force family housing annex in Germany. The Vogelweh Housing Area is one of several military housing areas in the Kaiserslautern Military Community.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[48.8267,9.0986,"United States","Germany","Weilimdorf Warehouse","Stuttgart","Army","Operator Only","1946","","","","Weilimdorf Warehouse, located in Stuttgart, was initially slated for closure in 2015 but was retained by the U.S. Army in 2021 due to increased operational needs.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.6198,7.3304,"United States","Germany","Wetzel Family Housing","Baumholder","Army","Operator Only","1951","","","","Adjacent to Wetzel Kaserne, the Wetzel Family Housing area provides residential accommodations for military families. Originally constructed in the 1950s, the housing units are currently being modernized to meet contemporary standards. The U.S. Army has invested over $700 million in projects that include the construction of new townhouses, apartment buildings, and a state-of-the-art elementary school designed to serve approximately 700 students.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.6064,7.3225,"United States","Germany","Wetzel Kaserne","Baumholder","Army","Operator Only","1951","","","","Wetzel Kaserne serves as a multifaceted facility within the Baumholder Military Community. It houses various support services, including child and youth programs, fitness centers, and community spaces. The installation is undergoing significant infrastructure enhancements to accommodate the relocation of Special Operations Forces from U.S. Army Garrison Stuttgart, with completion anticipated by 2027.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.0494,8.3244,"United States","Germany","Lucius D. Clay Kaserne","Wiesbaden","Army","Operator Only","1945","","","","Lucius D. Clay Kaserne (formerly Wiesbaden Army Airfield). It is commonly called Clay Kaserne, this base is the US Army Europe Headquarters. The base is one of the only bases in Europe that has existed as a US Army base since before WWII. The base previously hosted Lindsey Air Station and retains elements of an airfield to this day.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.6398,11.794,"United States","Germany","U.S. Army Health Clinic Vilseck","Vilseck","Army","Operator Only","None","","","","The U.S. Army Health Clinic Vilseck serves the US army in Germany.","https://mhs-europe.tricare.mil/Vilseck"],[52.5846,10.7539,"United States","Germany","USAG Hohenfels","Truppenubungsplatz","Army","Co-base","1951","","NATO","","U.S. Army Garrison (USAG) Hohenfels, located in Bavaria, Germany, is a component of USAG Bavaria, serving as a premier training facility for U.S. and NATO forces. Established in 1951, it encompasses the Hohenfels Training Area (HTA), which spans approximately 163 square kilometers, making it the second-largest U.S. military training area in Europe.","https://militarybases.com/overseas/germany/hohenfels/"],[49.3982,7.5331,"United States","Germany","Breitenwald Tng Area","Landstuhl","Army","Training Base","None","","","","The Breitenwald Training Area is a U.S. Army facility located near Landstuhl in Rhineland-Palatinate, Germany. It is utilized for various military training exercises, including marksmanship and Chemical, Biological, Radiological, and Nuclear (CBRN) training.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.8438,8.5842,"United States","Germany","Dagger Complex","Darmstadt ","Army","Operator Only","None","","","","The Dagger Complex is a US military base in Darmstadt. The complex is under US Army Intelligence and Security Command (INSCOM) command on behalf of the US National Security Agency (NSA) and is officially known as Subunit 1 operated by USMC G Company.","https://web.archive.org/web/20140221075232/http://www.matthewaid.com/post/56164997223/the-european-cryptologic-center-at-darmstadt-germany"],[49.5283,7.8658,"United States","Germany","Sembach Kaserne"," Donnersbergkreis","Army","Operator Only","None","","","","Sembach Kaserne is a U.S. Army installation located in Donnersbergkreis, Rhineland-Palatinate, Germany, approximately 19 miles east of Ramstein Air Base. Originally established as Sembach Air Base in 1951, it served as a U.S. Air Force installation until 1995, after which it became an annex of Ramstein Air Base. In October 2010, the facility was transferred to the U.S. Army and renamed Sembach Kaserne.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[48.69,9.2219,"United States","Germany","Stuttgart Army Airfield (Stuttgart Airport)","Stuttgart","Army","Operator Only","None","","","","The U.S. Army still maintains a small helicopter base - Stuttgart Army Airfield - on the southern side of the airport, which it shares with the Baden-Württemberg State Police helicopter wing.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.3173,10.6025,"United States","Germany","U.S. Army Health Clinic Ansbach","Ansbach","Army","Operator Only","None","","","","The U.S. Army Health Clinic (USAHC) Ansbach, situated at Urlas Kaserne in Ansbach, Germany, serves as a primary healthcare facility for over 5,500 Soldiers, DoD civilians, and their families in the Ansbach Military Community. Operating under the Defense Health Agency and the Medical Readiness Command, Europe.","https://www.army.mil/article/277658/medical_soldiers_from_u_s_army_health_clinic_ansbach_train_alongside_bundeswehr_counterparts"],[47.484,11.067,"United States","Germany","Edelweiss Lodge and Resort","garmisch-partenkirchen","Army","Operator Only","2004","","","","This base is operated by the U.S. DoD under the Armed Forces Recreation Centers (AFRC) program. It serves as a vacation destination for U.S. service members, their families, and other authorized personnel, on land taken as spoils of war and never given back.","https://www.armymwr.com/happenings/edelweiss-lodge-and-resort-reopening"],[49.8445,8.6504,"United States","Germany","USAG Darmstadt","Cooperstrasse","Army","Operator Only","None","","","","These days, the base is inactivated since 2008. It no longer has any military purposes, although the military communities remain in the area and benefit from the same logistical support. Even the military newspaper is still operating. The base was inactivated after all the operations were transferred to USAG Heidelberg. There are still more than 9000 citizens around. Over 3500 of them are military troops, while the others are family members, retired veterans and civilians that used to work on site.","https://militarybases.com/overseas/germany/darmstadt/"],[48.79,9.19,"United States","Germany","Kelley Barracks-Ger-GE44F","Stuttgart","Army","Operator Only","None","","","","According to the DoD report (2024), Kelley Barracks-Ger-GE44F is a US Army base in Stuttgart, Germany. Kelley Barracks-Ger-GE44F is likely a specific designation used within certain databases or systems to uniquely identify Kelley Barracks among other installations.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[48.7239,9.1792,"United States","Germany","Kelley Barracks","Stuttgart","Army","Operator Only","1938","","","","Kelley Barracks is a U.S. military installation and the headquarters of the United States Africa Command (AFRICOM). The post is part of the US Army Garrison Stuttgart and is administered by IMCOM-Europe.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.9703,8.1479,"United States","Germany","Finthen Local Training Area","Wackernheim","Army","Operator Only","None","","","","The Finthen Local Training Area, situated at the former Finthen Army Airfield near Mainz, remains an active U.S. military training site. Although the airfield was returned to German control in 1992, the U.S. Army continues to operate a radar station and an urban warfare training facility on-site. Additionally, a small unit from the 1st Military Intelligence Battalion, under the 66th Military Intelligence Brigade, conducts SIGINT and IMINT operations from this location.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.424,11.9724,"United States","Germany","Freihoelser Tng Area","Amberg","Army","Operator Only","None","","","","The Freihoelser Training Area, also known as Freihölser Forst, is an active U.S. Army training site. It is part of the Integrated Training Area Management program developed by the U.S. Army Corps of Engineers' Construction Engineering Research Laboratory for the Seventh Army Training Command.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.054,8.335,"United States","Germany","Mccully Support Center","Wackernheim","Army","Operator Only","None","","","","The McCully Support Center, located in Wackernheim, is an active U.S. Army facility under the administration of U.S. Army Garrison Wiesbaden. It hosts several logistics units and provides support services to the military community. The center also offers storage space for personal belongings, vehicles, and recreational equipment.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[47.5923,11.0832,"United States","Germany","Oberammergau NATO School","Garmisch","Army","Co-base","None","","","","The NATO School Oberammergau (NSO), established in 1953, serves as NATO's premier training facility at the operational level. Located in Bavaria, Germany, the school offers over 100 courses annually to approximately 12,000 students from NATO member and partner nations. Its curriculum encompasses various disciplines, including intelligence, joint operations, and cooperative security.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.0815,8.1613,"United States","Germany","Rheinblick Golf Course","Wiesbaden","Army","Operator Only","None","","",""," Rheinblick Golf Course, located near Wiesbaden, Germany, is a U.S. Army-operated 18-hole golf facility established in 1957. The course is open to both U.S. military personnel and local German golfers. Amenities include a clubhouse, pro shop, restaurant, and conference rooms, supporting various recreational and official events. ","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[53.5679,8.62,"United States","Germany","Bremerhaven","Bremerhaven","Army","Operator Only","None","","",""," Bremerhaven was a significant U.S. military logistics hub during the Cold War, hosting facilities like the Bremerhaven Port of Embarkation and Carl Schurz Kaserne. These installations were closed by the late 1990s. However, this hotel is listed in the DoD report 2024. ","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[47.8813,12.1354,"United States","Germany","Frasdorf Operations Area","Garmisch","Army","Operator Only","None","","",""," The Frasdorf Operations Area, located in Bavaria, was previously utilized by the U.S. military. As of 1996, the site was demilitarized, and the high-performance siren installed there was dismantled. Currently, there is no active U.S. military presence at this location. However, this hotel is listed in the DoD report 2025. ","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.0677,8.2303,"United States","Germany","Amelia Earhart Hotel","Wiesbaden","Army","Operator Only","None","","",""," The Amelia Earhart Hotel, constructed in the early 1950s in Wiesbaden, served as a U.S. military lodging facility. In 2015, the Department of Defense announced its closure as part of the European Infrastructure Consolidation initiative, returning the property to German control. However, this hotel is listed in the DoD report 2024. ","https://www.atlanticcouncil.org/blogs/natosource/us-announces-it-will-close-15-military-bases-in-europe/"],[51.0845,11.9351,"United States","Germany","Osterfelderstrasse Housing","Garmisch","Army","Operator Only","None","","",""," Osterfelderstraße Housing refers to residential accommodations associated with U.S. military installations in Germany. Specific details about this housing area are limited in publicly available sources. ",""],[49.5385,7.3066,"United States","Germany","Pfeffelbach Waterworks","","Army","Operator Only","None","","",""," The Pfeffelbach Waterworks, previously operated by the U.S. Army in Rheinland-Pfalz, Germany, was identified for closure as part of the European Infrastructure Consolidation initiative. The facility was scheduled to be returned to the German government following the integration of the military community into the local water supply system. However, this hotel is listed in the DoD report 2025. ","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.6198,9.4839,"United States","Germany","Carl-Schurz Kaserne","Bremerhaven","Army","Operator Only","1945","","","","Carl-Schurz-Kaserne in Bremerhaven, Germany, currently functions as a logistical hub for the U.S. Army, primarily hosting the 950th Transportation Company under the 838th Transportation Battalion, which is part of the 598th Transportation Brigade. However, this base was listed in the 2023 DoD report. Since then, no publicly available information has been released.",""],[49.82,6.6968,"United States","Germany","Suelm Annex","Trier","Air Force","Operator Only","None","","","","Suelm Annex, located near Dülmen, Germany, functions as a U.S. Army prepositioned stock site, supporting the Army Prepositioned Stocks-2 (APS-2) program. The facility is managed by the U.S. Army Garrison Benelux, with support services coordinated through multiple sites due to its geographical separation from the main garrison. The last update for this base was in the DoD report 2022-2023.",""],[50.0118,8.2094,"United States","Germany","Mainz Sand Dunes Trg Area","Mainz","Army","Operator Only","None","","",""," The Mainz Sand Dunes Training Area, located near Mainz, Germany, is an active U.S. Army training site. It supports various military exercises, including land navigation and tactical driving. The area is also a protected natural reserve, home to rare flora and fauna. ","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.4444,7.5917,"United States","Germany","Vogelweh Family Housing","Kaiserlautern","Air Force","Operator Only","None","","",""," Vogelweh Family Housing Annex Site 1 is part of the Kaiserslautern Military Community in Germany. It provides housing for U.S. military personnel and their families. The area includes various amenities and is managed by the U.S. Air Force. ","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.8445,8.6504,"United States","Germany","Darmstadt Training Center","Darmstadt","Army","Operator Only","1945","","","","The USAG Darmstadt Training Center is a non-active base in Germany that was closed in 2008. The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.959,8.1331,"United States","Germany","Wackernheim Regional Range Complex","Wackernheim","Army","Operator Only","None","","",""," The Wackernheim Regional Range Complex, located in Wackernheim, Germany, is an active U.S. Army training facility. It offers shooting ranges and supports various training activities for military personnel. The complex is managed by the U.S. Army and is part of the 7th Army Training Command. ","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[47.4862,10.9686,"United States","Germany","Osterfelderstr Hsg","Garmisch","Army","Operator Only","None","","",""," Osterfelderstraße Housing refers to residential accommodations associated with U.S. military installations in Germany. Specific details about this housing area are limited in publicly available sources. However, this hotel is listed in the DoD report 2025. ","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[48.6887,9.1944,"United States","Germany","Echterdingen Stuttgart Army Airfield","Stuttgart","Army","Operator Only","None","","","","Echterdingen Stuttgart Army Airfield, located adjacent to Stuttgart Airport, has historically served as a U.S. Army aviation facility. While the airfield's military operations have diminished over time, it remains a site of strategic importance, occasionally supporting U.S. military activities in coordination with Stuttgart Airport.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[53.5841,8.5578,"United States","Germany","Bremerhaven Port","Bremerhaven","Army","Operator Only","None","","","","Bremerhaven Port continues to be a logistics hub for the U.S. military. It serves as a primary transshipment point for military equipment and vehicles, supporting operations such as DEFENDER-Europe. The port's facilities enable efficient handling and transportation of U.S. military assets across Europe.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[48.6882,9.0399,"United States","Germany","Boeblingen Panzer Fam Hsg","Boeblingen","Army","Operator Only","None","","","","Böblingen Panzer Family Housing, located within Panzer Kaserne, provides on-post accommodations for U.S. military families stationed in the Stuttgart area. The housing units are equipped with modern amenities and are managed by the U.S. Army Garrison Stuttgart Housing Office.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[48.6838,9.0412,"United States","Germany","Boeblingen Range","Boeblingen","Army","Operator Only","None","","","","The Böblingen Range is a U.S. Army training facility and firing range complex located near Panzer Kaserne in Böblingen, Germany, which is part of the U.S. Army Garrison (USAG) Stuttgart.","https://www.stuttgartcitizen.com/usag-stuttgart-panzer-range-complex/"],[5.6047,-0.1674,"United States","Ghana","Kotoka International Airport","Accra","Air Force","Co-base","None","","","","According to the research institute of Pratt’s Socialist Movement and Tricontinental: Institute for Social Research, the United States has established the West Africa Logistics Network (WALN) at Kotoka International Airport in Accra, the capital of Ghana. The WALN, has now taken over one of the three terminals at the airport in Accra, and at this terminal, hundreds of U.S. soldiers have been seen arriving and leaving. It is suspected that they may be involved in some operational activities in other West African countries and generally across the Sahel.","https://peoplesdispatch.org/2022/06/15/why-does-the-united-states-have-a-military-base-in-ghana/"],[35.4691,24.1436,"United States","Greece","MOMAG COMPOUND","Ormos Soudas","Navy","Co-base","None","","","","There is limited publicly available information regarding its current status in Greece. However, this hotel is listed in the DoD report 2025.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.5376,24.1536,"United States","Greece","NATO Ordnance Area","Soudha Bay","Navy","Co-base","1969","","","","The term \"NATO Ordnance Area\" is broad and could refer to various ammunition storage or handling sites used by NATO forces in Greece. Without a specific location, it's challenging to determine the exact facility in question. However, Greece hosts several NATO-related installations, and ordnance areas are typically integral to such bases.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.5398,24.1394,"United States","Greece","NSA Souda Bay/ Crete Naval Base","Soudha Bay","Navy","Co-base","1969","","NATO","","Naval Support Activity Souda Bay is operated by the United States Navy. This base serves as the second largest (in number of warships harbored) naval base of the Hellenic Navy and the largest and most prominent naval base for NATO in the eastern Mediterranean Sea.","https://cnreurafcent.cnic.navy.mil/Installations/NSA-Souda-Bay/About/"],[35.497,24.1494,"United States","Greece","NSA Souda Bay Marathi Pier Area","Soudha Bay","Navy","Co-base","1969","","NATO","","The Marathi Pier Complex is part of NSA Souda Bay and serves as a logistics hub. It includes deep-water piers capable of accommodating large naval vessels, including aircraft carriers. The facility supports various operations, including resupply missions and joint exercises with NATO allies.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.4833,24.1381,"United States","Greece","NSA Souda Bay NAMFI Compound","Soudha Bay","Navy","Co-base","1969","","","","The NATO Missile Firing Installation (NAMFI) is a missile firing range located near Souda Bay. Established in 1967, NAMFI is used for testing and training with various missile systems, including MIM-104 Patriot and MIM-23 Hawk. The facility is operated by Greece and utilized by NATO allies, including the United States, Germany, and the Netherlands.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[39.6491,22.4655,"United States","Greece","Larissa air base","Larissa","Air Force","Co-base","None","","","Drone Base","Larissa National Airport, also known as Larissa Air Base, is a military airfield operated by the Hellenic Air Force. It hosts the 110th Combat Wing and has been used by the U.S. military for various operations. Notably, in 2018, the U.S. Air Force temporarily based MQ-9 Reaper drones at Larissa while their usual base in Africa was undergoing upgrades. The base remains active and continues to support both Greek and allied military activities.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[76.5311,-68.7031,"United States","Greenland (Denmark)","Thule Air Base/ Pituffik Airport","Thule","Air Force","Co-base","1941","","NATO","","Thule Air Base is the United States Space Force's northernmost base, and the northernmost installation of the U.S. Armed Forces. The base is home to a substantial portion of the global network of missile warning sensors of Space Delta 4, and space surveillance and space control sensors of Space Delta 2, providing space awareness and advanced missile detection capabilities to North American Aerospace Defense Command (NORAD), the United States Space Force, and joint partners.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.473,144.7649,"United States","Guam","Agana","Agana","Navy","Operator Only","1899","","","","According to the DoD 2025 report, Agana is an active Navy base. However, there was a base called Naval Air Station Agana which was closed in 1995. The current usage of Agana by the US is not yet clear.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.5761,144.9244,"United States","Guam","NSA Andersen","Yigo","Navy","Operator Only","1944","","","","NSA Andersen is part of the broader U.S. military infrastructure embedded in northern Guam, functioning as a Navy logistics and administrative compound. NSA Andersen is deeply tied to the ongoing militarization of Guam, often criticized for facilitating a U.S. presence that many Indigenous Chamorro residents see as unwanted and imposed.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.5761,144.9244,"United States","Guam","Andersen Air Force Base","","Air Force","Operator Only","None","","","","Andersen Air Force Base in Yigo, Guam, hosts critical U.S. military infrastructure, including fuel storage (Annexes 1 & 2), communications (Annex No. 2), water supply, and administrative and housing annexes. These facilities support large-scale air operations and logistics. However, the base has long been criticized for occupying Indigenous land, straining local resources, and contributing to environmental degradation. Its presence continues to raise concerns over sovereignty, militarization, and ecological harm in Guam.","https://www.pacaf.af.mil/Info/Fact-Sheets/Display/Article/909895/andersen-air-force-base/"],[13.4033,144.6761,"United States","Guam","APRA HEIGHTS OLD","Naval Station Apra","Navy","Operator Only","None","","","","It refers to the older, original structures in the Apra Heights area prior to revitalization. Many of these buildings were demolished or heavily renovated due to unsafe conditions. Hazards included asbestos, termites, and outdated plumbing and electrical systems. This phase of housing highlights the long-term environmental and structural neglect of military land.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.4016,144.6787,"United States","Guam","NAVBASE Guam Apra Heights","Naval Station Apra","Navy","Operator Only","1944","","","","Apra Heights is a U.S. military housing area located in Santa Rita, near Naval Base Guam. The site underwent a major revitalization project to update infrastructure and living conditions. Despite upgrades, reports of vacant units and unused space persist. The project reflects broader issues around U.S. military resource allocation and land use in Guam.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.4752,144.7417,"United States","Guam","Bull Cart 3","Agana","Navy","Operator Only","None","","","","This area is part of historical trails used during wartime, now intersecting with military zones, affecting local heritage sites. There is no update regarding this base; however, it is listed in the DoD report 2025.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.2759,144.7451,"United States","Guam","Bullcart Trail","Agana","Navy","Operator Only","1899","","","","Bullcart Trail is a traditional pathway, it has been impacted by military development, leading to cultural and environmental concerns. There is no update regarding this base; however, it is listed in the DoD report 2025.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.4716,144.7575,"United States","Guam","Civil 3-49 Parcel 1","Agana","Navy","Operator Only","None","","","","A designated military parcel under Naval Base Guam, its use has implications for land rights and local access. There is no update regarding this base; however, it is listed in the DoD report 2025.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.3107,144.7368,"United States","Guam","Dandan","Agana","Navy","Operator Only","1899","","","","This site of Guam's first solar facility, developed with military collaboration, raising discussions on land use and energy sovereignty. There is no update regarding this base; however, it is listed in the DoD report 2025.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.3863,144.6563,"United States","Guam","Drydock Island","Agat","Navy","Operator Only","None","","","","Drydock is a home to the former Dry Dock 'Richland', its removal after decades of service has environmental and historical significance. There is no update regarding this base; however, it is listed in the DoD report 2025.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.4633,144.7285,"United States","Guam","Family Housing","Nimitz Hill","Navy","Operator Only","None","","","","The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.4648,144.6416,"United States","Guam","Glass Breakwater","Agat","Navy","Operator Only","1941","","","","The Glass Breakwater is a 3-mile long breakwater in Guam that protects Apra Harbor from the Philippine Sea. The 76th U.S. Naval Construction Battalion constructed the breakwater after World War II to protect the heavy traffic of American vessels that traveled to Guam.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.4428,144.6528,"United States","Guam","GLUP 77 Apra","Naval Station Apra","Navy","Operator Only","1899","","","","“GLUP 77” refers to parcels claimed by the U.S. under the 1977 Guam Land Use Plan for military consolidation. Many lands were seized without full consent of Indigenous Chamorro communities, sparking sovereignty disputes. These designations enable unchecked military use of territory marked as “excess” yet remain under U.S. control.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.5225,144.8177,"United States","Guam","Harmon Substation","Dededo","Navy","Operator Only","1944","","","","The Harmon Substation is part of Guam’s civilian power grid but is also linked to U.S. military infrastructure. Power reliability issues near military zones have drawn criticism about prioritization of military over local needs. Residents question why upgrades often align with military buildup rather than local resilience.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.3919,144.7493,"United States","Guam","Guam US Army Reserve Center","Barrigada","Army Reserve","Operator Only","1944","","","","The United States Army Reserve in Guam is located at 61 Annon Ave., Barrigada, Guam. The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2025.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.4754,144.7363,"United States","Guam","Naval Hospital","Agana","Navy","Operator Only","1899","","","","Established in 1899, Naval Hospital Guam provides medical services to military personnel and their families. While it offers essential healthcare, its operations have been scrutinized for overshadowing local healthcare needs. The hospital's expansion has sometimes conflicted with community interests and land use. Its role during health crises, such as the COVID-19 pandemic, highlighted tensions between military and civilian healthcare priorities.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.4286,144.6535,"United States","Guam","NAVBASE Guam","Agana","Navy","Operator Only","1899","","","","Naval Base Guam is a U.S. naval base. In 2009, it was combined with Andersen Air Force Base to form Joint Region Marianas, which is a Navy-controlled joint base. Naval Base Guam is home to Commander Submarine Squadron 15, Coast Guard Sector Guam, and Naval Special Warfare Unit One, and supports 28 other tenant commands. It is the home base to dozens of Pacific Command, Pacific Fleet, Seventh Fleet, and Seabee units.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.6225,144.85,"United States","Guam","J3-AVGAS Area 3","Dededo","Navy","Operator Only","None","","","","According to a GDB Dataset Spreadsheet, J3-AVGAS Area 3 is located at NSA Andersen. J3-AVGAS Area 3 is a designated fuel storage and distribution site supporting military aviation operations in Guam. Its presence raises concerns about environmental risks, including potential fuel spills and groundwater contamination.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.4768,144.8288,"United States","Guam","NAVBASE Guam Barrigada","Barrigada","Navy","Operator Only","1944","","","","Naval Base Guam Barrigada is a 38,000 square acre base located south of Route 16, near the village of Barrigada. It is the home base for five submarines and many units that support the US Pacific Command, US Pacific Fleet, SEVENTH Fleet, and FIFTH Fleet.","https://jrm.cnic.navy.mil/Installations/NAVBASE-Guam/About/Installations/"],[13.55,144.8309,"United States","Guam","NAVBASE Guam Finegayan, South","Finegayan","Navy","Operator Only","1945","","","","Situated in Dededo, this area was formerly a military housing complex and is now utilized for missile-defense operations. The transformation has sparked debates over the repurposing of land and its implications for local communities.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.374,144.6899,"United States","Guam","Ordnance Annex","Rita","Navy","Operator Only","1944","","","","Ordnance Annex is a US naval base in the United States territory of Guam. It used to be known as Naval Magazine, Guam. The base is on the south-central section of the island. It occupies an area of 8,800 acres (36 km2).","https://jrm.cnic.navy.mil/Installations/NAVBASE-Guam/About/Installations/"],[13.5219,144.8156,"United States","Guam","NAVBASE Guam Harmon","Dededo","Navy","Operator Only","1944","","","","NAVBASE Guam Harmon is located in Dededo, this facility is in close proximity to civilian infrastructure, including shopping centers. Its presence has led to discussions about the blending of military and civilian spaces and the potential risks involved.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.3903,144.6863,"United States","Guam","NAVBASE Guam Magazine Reservoir, Naval Magazine","Santa Rita","Navy","Operator Only","1944","","","","This base is 8,800-acre inland weapons storage facility located in the interior of Guam. It encompasses the man-made Fena Lake, which provides drinking water to the southern part of the island.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.4958,144.8212,"United States","Guam","NAVBASE Guam Tiyan","Agana","Navy","Operator Only","1899","","","","Formerly Naval Air Station Agana, this area has been repurposed for various uses, including civilian aviation and commercial development.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.4244,144.6664,"United States","Guam","NAVBASE Guam Water Treatment, Naval Magazine","Santa Rita","Navy","Operator Only","1944","","","","The U.S. Navy's Naval Base Guam Water Treatment Plant is located at Bldg. 585, Route 2A, Santa Rita, Guam 96915. The base also has the Apra Harbor Wastewater Treatment Plant.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.3879,144.6852,"United States","Guam","NAVBASE Guam Naval Magazine","Santa Rita","Navy","Operator Only","1944","","","","NAVBASE Guam Naval Magazine is known as the Ordnance Annex, this facility stores a wide variety of munitions for warships and submarines. Its extensive operations have led to concerns about safety, environmental degradation, and the militarization of the island.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.489,144.8653,"United States","Guam","NAVBASE Guam Marbo","Mangilao","Navy","Operator Only","1944","","","","The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2023.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.4691,144.8202,"United States","Guam","NG Fort Juan Muna","Barrigada","Army Guard","Operator Only","1944","","","","Fort Juan Muna is a military installation and the main headquarters of the Guam National Guard. It is located in the Tamuning-Tumon-Harmon Municipality, Guam, and is 60 meters above sea level.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.4741,144.8099,"United States","Guam","NG Guam Barrigada Complex","Barrigada","Army Guard","Operator Only","1944","","","","This complex houses the Joint Force Headquarters of the Guam National Guard. It includes units such as the 105th Troop Command and the 94th Civil Support Team.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.464,144.7287,"United States","Guam","Nimitz Hill (Joint Region Marianas)","Nimitz Hill","Navy","Operator Only","1944","","","","Joint Region Marianas' mission is to provide installation management support to all the Pentagon components and tenants through assigned regional installations on Guam and the Northern Mariana Islands in support of training in the Marianas.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.4623,144.6897,"United States","Guam","Piti Power Plant","Piti","Navy","Operator Only","1999","","","","The Piti Power Plant is a power station in Piti, Guam, that generates electricity.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.4748,144.7213,"United States","Guam","Pol Area 2","Asan","Navy","Operator Only","None","","","","POL Area 2, part of the Defense Fuel Support Point Guam, manages storage and transfer of marine and aviation fuels.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.4667,144.7294,"United States","Guam","Pump Station","Nimitz Hill","Navy","Operator Only","1916","","","","The Asan Springs Pump Station, constructed by the U.S. Navy in 1916, was shut down in 2004 due to bacterial contamination and inadequate chlorination. Plans to upgrade the facility aim to provide a clean, dependable water source, but concerns remain about the environmental impact and the militarization of water resources.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.4647,144.7287,"United States","Guam","Region HQ","Nimitz Hill","Navy","Operator Only","2009","","","","The Joint Region Marianas Headquarters, established in 2009, consolidates command for U.S. Navy and Air Force installations in Guam. Located on Nimitz Hill, it oversees operations at Naval Base Guam and Andersen Air Force Base.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.5935,144.9101,"United States","Guam","Santa Rosa Parcel A","Andersen Air Force Base","Navy","Operator Only","None","","","","Santa Rosa Parcel A is a U.S. military facility located in Yigo, Guam, near a radar station and Mount Santa Rosa. surroundings.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.5359,144.9148,"United States","Guam","Santa Rosa Parcel B","Andersen Air Force Base","Navy","Operator Only","1944","","","","Santa Rosa Parcel B is a military facility in Guam. It is situated nearby to Mount Santa Rosa and Yigo.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.5645,144.9285,"United States","Guam","Santa Rosa Reservoir","Andersen Air Force Base","Navy","Operator Only","None","","","","The Santa Rosa Reservoir, also known as Mt. Santa Rosa Water Reservoir, was reserved for U.S. military use under Executive Order No. 10178 in 1950.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.4489,144.6996,"United States","Guam","Sasa Valley Fuel Farm","Piti","Navy","Operator Only","1899","","","","The farm is part of the Defense Fuel Support Point Guam, which is operated by the U.S. Naval Base Guam. The Nova Group constructed a 16-mile fuel transfer pipeline from the farm to Andersen Air Force Base.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.5976,144.9143,"United States","Guam","Submerged Lands Nbg","Andersen Air Force Base","Navy","Operator Only","None","","","","The U.S. Navy controls extensive submerged lands around Naval Base Guam, designated for military use.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.5416,144.8085,"United States","Guam","Tanguisson Point","Dededo","Navy","Operator Only","1944","","","","Tanguisson Point, located in Tamuning, Guam, is a military facility near Tanguisson Beach. The area is known for its sloping reef and abundant marine life, attracting divers and environmental interest.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.433,144.6875,"United States","Guam","Tenjo Vista","Piti","Navy","Operator Only","1899","","","","Tenjo Vista is a military base located in the Piti Municipality of Guam. It is a place used by the armed forces to store arms and supplies. The base is 40 meters above sea level.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.5121,144.8206,"United States","Guam","Us Navsuppact Mcb Guam","Finegayan","Navy","Operator Only","None","","","","US Navsuppact MCB Guam is a recreation center in Finegayan, Guam.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.5721,144.8836,"United States","Guam","Yigo Lot 7123","Yigo","Navy","Operator Only","None","","","","Yigo Lot 7123 is a privately owned parcel in Yigo, Guam, listed for residential development. There is no publicly available information indicating current U.S. military use of this site. However, it was listed in Bases Structure Report 2024.",""],[13.5759,144.9085,"United States","Guam","YIGO LOT 7133","Yigo","Navy","Operator Only","None","","","","Lot 7133 is a federally owned property located just outside Andersen Air Force Base along Route 9 in Yigo. Previously under Air Force control, it was transferred to the U.S. Department of the Interior. The land lies within a Radio Frequency Interference (RFI) Free zone due to nearby communication facilities, limiting its development potential.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.5596,144.8377,"United States","Guam","TUMON WATER WELL","Andersen Air Force Base","Navy","Operator Only","None","","","","The Tumon-Maui Well, located on Navy property in Tumon, was a significant freshwater source for northern Guam. Closed in 1995 due to chemical contamination, it briefly reopened before being shut down again in 1999. However, it was listed in the Bases Structure Report 2025.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.4198,144.7271,"United States","Guam","TUMON TANK FARM","Andersen Air Force Base","Navy","Operator Only","None","","","","The Tumon Tank Farm is a 24-acre fuel storage facility maintained by the U.S. Navy in Tumon. While the Navy has indicated potential plans to transfer the property between 2022 and 2026, no definitive actions have been taken.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.475,144.8207,"United States","Guam","Dydasco USARC","Barrigada","Army Reserve","Operator Only","None","","","","The Vincente T. Dydasco U.S. Army Reserve Center is located in Barrigada, Guam, serving as a hub for reserve military operations. The facility has undergone energy efficiency upgrades, including lighting retrofits, to reduce operational costs.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.5698,144.8407,"United States","Guam","Marine Corps Base (MCB) Camp Blaz","Dededo","Navy","Operator Only","2020","","","","This base was activated in 2020 in Dededo, Camp Blaz is the first new Marine Corps base since 1952, intended to house Marines relocated from Okinawa.","https://www.stripes.com/theaters/asia_pacific/marines-activate-camp-blaz-on-guam-the-corps-first-new-base-since-1952-1.647005"],[13.573,144.844,"United States","Guam","Naval Computer and Telecommunications Station Guam","Finegayan","Navy","Operator Only","1944","","","","The Naval Computer and Telecommunications Station Guam (NCTS Guam) is a US Navy communications facility located on the northwest coast of Guam. It provides network operations, information assurance, and multi-spectral connectivity to the Navy.",""],[13.6041,144.8989,"United States","Guam","Harmon Annex","Yigo","Navy","Operator Only","1955","","","","Originally part of Harmon Air Force Base, the Harmon Annex was transferred to the Government of Guam in 2002 with stipulations for public benefit use. If the land is used otherwise, ownership reverts to the U.S. government.","https://kanditnews.com/what-other-lands-can-the-federal-government-take-back/"],[13.438,144.6504,"United States","Guam","War Dog Cemetery","Yigo","Navy","Operator Only","1944","","","","The National War Dog Cemetery is a memorial to war dogs located at Naval Base Guam.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.5867,144.8623,"United States","Guam","Potts Tank Farm","Dededo","Navy","Operator Only","1944","","","","Situated in Dededo, Guam, Potts Tank Farm is a U.S. Navy fuel storage facility near Andersen Air Force Base. Also known as Andersen Petrol Product Storage Annex #1, it plays a role in regional fuel logistics. The facility is currently active, supporting military operations in the Pacific.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[14.3819,-87.6167,"United States","Honduras","Soto Cano Air Base","Comayagua","Army","Co-base","1982","","","","Soto Cano Air Base is a Honduran military base. The Honduran Air Force Academy also uses it. It serves as one of the bases for the US Military's presence in Central America. Now, the U.S. military uses Soto Cano as a launching point for its missions throughout Honduras and Central America.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[46.9175,19.7492,"United States","Hungary","Kecskemet Air Base","Kecskemet","Air Force","Co-base","2018","","NATO","","Kecskemét Air Base is primarily operated by the Hungarian Air Force, hosting JAS 39 Gripen fighter jets. In 2021, the U.S. and Hungary signed implementing agreements granting U.S. forces access to this base. Subsequent infrastructure upgrades have been undertaken to accommodate advanced aircraft, including nuclear-capable F-15 Eagles.","https://www.newsweek.com/us-military-expand-hungary-kecskemet-air-base-russia-nato-1969141"],[47.3639,17.4972,"United States","Hungary","Papa Air Base","Papa","Air Force","Co-base","2009","","NATO","","Pápa Air Base serves as the home of the Strategic Airlift Capability (SAC) program's Heavy Airlift Wing (HAW), a multinational initiative comprising 12 nations, including the U.S. The HAW operates three C-17 Globemaster III aircraft, providing strategic airlift support for NATO, EU, and UN missions. In 2021, the U.S. and Hungary signed implementing agreements granting U.S. forces access to this base.","https://www.newsweek.com/us-military-expand-hungary-kecskemet-air-base-russia-nato-1969141"],[63.985,-22.6056,"United States","Iceland","Naval Air Station Keflavik","Grindavik","Navy","Co-base","2018","","NATO","","Naval Air Station Keflavik was a United States Navy station at Keflavík International Airport, Iceland. This base was closed on 8 September 2006, and its facilities were taken over by the Icelandic Defence Agency as their primary base until 1 January 2011, when the Agency was abolished and the base handed over to the Icelandic Coast Guard, which has since then operated the base. The base is regularly visited by the American military and other NATO allies for military exercises, NATO Air Policing, and other tasks. As of 2021, the base has hosted deployments of B-2 Spirit stealth bombers and approximately 200 U.S. personnel.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[63.8503,-22.4667,"United States","Iceland","Naval Radio Transmitter Facility Grindavik","Grindavik","Navy","Operator Only","2014","","","","The Naval Radio Transmitter Facility Grindavik (NRTF Grindavik) is a US Navy transmission facility in Grindavík, Iceland. It's maintained by the N62 Division and is active on shortwave and longwave under the callsign TFK on 37.5 kHz.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.7658,43.1217,"United States","Iraq","Qayyarah Airfield West","Mosul","Air Force","Co-base","2020","","","","Qayyarah Airfield West is an Iraqi Air Force base. It was captured by the U.S. Army in 2003. Control of the base was returned to Iraq in March 2020. It is utilized by U.S. forces for operations against ISIS, particularly in northern Iraq.","https://shafaq.com/en/Iraq/US-military-convoy-heads-toward-Iraq-s-Qayyarah-Air-Base"],[33.2625,44.2344,"United States","Iraq","Victory Base Complex Joint Operations","Baghdad","Air Force","Co-base","2014","","","","This base is an amalgam of military installations around the Baghdad International Airport. The complex includes 10 bases: Victory Fuel Point, Slayer, Striker, Cropper, Liberty, Radwaniyah Palace, Dublin, Sather Air Base, Logistics Base Seitz and Victory. The most important one is Camp Victory. It hosts the headquarters for all the US operations in Iraq. The camp also includes the Al Faw Palace.","https://www.barrons.com/news/rockets-target-base-hosting-us-troops-near-baghdad-airport-security-sources-bf8f5a3f"],[35.1924,45.981,"United States","Iraq","Halabja 1","Halabja","Army","Co-base","2014","","","","This base is currently used by the united states.","https://breakingdefense.com/2020/01/us-builds-several-new-bases-in-iraq-near-iran/"],[35.2081,45.9611,"United States","Iraq","Halabja 2","Halabja","Army","Co-base","2014","","","","This base is currently used by the united states.","https://breakingdefense.com/2020/01/us-builds-several-new-bases-in-iraq-near-iran/"],[33.9333,44.3667,"United States","Iraq","Balad Air Base"," Sunni Triangle ","Air Force","Co-base","2014","","","","This base is home to the Iraqi Air Force. This base has American aircraf
