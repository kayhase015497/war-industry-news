const B=
[[-14.3252,-170.7127,"United States","American Samoa","Fiatele Taulago Te'o US Army Reserve Center","Pago Pago","Army Reserve","Operator Only","1985","","","","This facility functions as a U.S. Army Reserve site in American Samoa, where military training and operational activities are conducted. Its presence reflects the extension of U.S. military infrastructure into a non-sovereign territory, where local populations have limited influence over defense-related land use and decision-making.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[-14.3324,-170.7172,"United States","American Samoa","Pele U.S. Army Reserve Center","Pago Pago","Army Reserve","Operator Only","2002","","","","The Pele U.S. Army Reserve Center, which broke ground in 2002, is now home to both Charlie and Bravo Companies with the famous 100th ‘Go for Broke” Infantry Battalion, 442nd Infantry Regiment; Theater Support Group American Samoa Detachment; 962nd Quartermaster (Mortuary Affairs) Company, and the 411th Forward Support Company.",""],[-14.32,-170.7201,"United States","American Samoa","U.S. Army Reserve Training Center","Unknown","Army Reserve","Operator Only","1980","","","","The U.S. Army Reserve Training Center is comprised of four separate structures including a training facility, organizational storage and maintenance shop, parking garage and ancillary pump house.","https://www.blackconstructionguam.com/uncategorized/u-s-army-reserve-training-center-american-samoa/?"],[-77.8463,166.6682,"United States","Antarctica","McMurdo Station","Ross Island","Air Force","Co-base","1956","","","","McMurdo Station is a United States Antarctic research station on the south tip of Ross Island, which is in the New Zealand-claimed Ross Dependency on the shore of McMurdo Sound in Antarctica. It is operated by the United States through the United States Antarctic Program (USAP), a branch of the National Science Foundation.","https://oceanwide-expeditions.com/to-do/experiences/mcmurdo-base"],[12.5014,-70.0153,"United States","Aruba","Queen Beatrix International Airport","Oranjestad","Air Force","Co-base","1945","","","","Within Queen Beatrix International Airport, the United States maintains a Cooperative Security Location (CSL), enabling periodic access for military aircraft and personnel. Such arrangements allow the U.S. to utilize civilian infrastructure for military mobility, embedding flexible and often low-visibility forms of presence within host nations under the framework of security cooperation.","https://www.southcom.mil/Commanders-Priorities/Counter-Threats/Cooperative-Security-Locations/?"],[-7.9694,-14.3939,"United States","Ascension","Ascension Island Auxiliary Airfield","Ascension Island","Air Force","Co-base","1956","","","","This installation functions as a joint UK–U.S. military airfield on Ascension Island, supporting long-range operations across the Atlantic. Its role in space tracking and launch monitoring links it directly to U.S. military space infrastructure, extending surveillance and control capabilities far beyond U.S. territory under bilateral arrangements that limit local oversight.","https://media.defense.gov/2010/Sep/21/2001330255/-1/-1/0/AFD-100921-026.pdf"],[-15.3476,130.2761,"United States","Australia","Bradshaw Field Training Area","Darwin","Army","Training Base","1996","","","","Bradshaw Field Training Area is a large military zone in northern Australia used for joint exercises between Australian forces and U.S. Marines deployed through Darwin. These arrangements embed recurring U.S. military presence within Australian territory, normalizing rotational deployments that function as a semi-permanent extension of U.S. force projection in the Indo-Pacific.","https://www.abc.net.au/news/2024-02-06/back-roads-timber-creek-unlikely-friendship-adf-us-marines/103185138"],[-21.8167,114.1714,"United States","Australia","Area A, VLF Transmitter Antenna, Naval Communications Station Harold E. Holt","Exmouth","Navy","Co-base","1963","","","","Area A contains the Very Low Frequency (VLF) transmission system that enables communication with submerged submarines across vast ocean regions. This infrastructure forms part of a global military communications network that supports naval operations, including nuclear-capable assets, embedding strategic command and control functions within Australian territory.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[-21.9064,114.129,"United States","Australia","Area B, Base Administrative Area, Naval Communications Station Harold E. Holt","Exmouth","Navy","Co-base","1967","","","","Area B includes administrative, residential, and support facilities that sustain continuous military operations at the site. Such infrastructure underpins the long-term functioning of the installation, anchoring personnel presence and reinforcing the permanence of what is often framed as a technical or communications facility.","https://nautilus.org/publications/books/australian-forces-abroad/defence-facilities/naval-communication-station-harold-e-holt-north-west-cape/"],[-22.3398,114.0519,"United States","Australia","Area C, Naval Communication Station Harold E. Holt","Exmouth","Navy","Co-base","1963","","","","Area C operates as the receiving component of the station’s communications system, linked to naval networks across the Indian and Pacific Oceans. Together with transmission infrastructure, it integrates the site into a wider system of military communications that enables sustained naval activity across distant maritime regions.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[-21.9377,114.1326,"United States","Australia","Exmouth FH Annex","Exmouth","Air Force","Operator Only","1970","","","","​The Exmouth Family Housing Annex Site 1 is a U.S. Air Force-operated housing facility located in Exmouth, Western Australia. This annex provides accommodation for U.S. military personnel, including those assigned to nearby installations such as the Learmonth Solar Observatory and the Harold E. Holt Naval Communication Station.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[-22.2358,114.0886,"United States","Australia","RAAF Base Learmonth","Darwin","Air Force","Co-base","1942","","","","RAAF Base Learmonth functions as both a civilian airport and military installation, increasingly used by U.S. forces for aircraft deployments, refueling, and surveillance activities. The growing U.S. access to this base reflects the integration of Australian infrastructure into broader U.S. military operations, extending operational reach while remaining formally under host-nation control.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[-23.8,133.7375,"United States","Australia","Pine Gap","Alice Springs","Navy","Co-base","1966","","","","Pine Gap is a jointly operated U.S.–Australian installation that plays a central role in satellite surveillance and signals intelligence collection. In practice, it forms part of a wider U.S. intelligence architecture, involving agencies such as the CIA, NSA, and NRO, raising persistent concerns about sovereignty, transparency, and the extent of Australian control over operations conducted on its territory.","https://nautilus.org/publications/books/australian-forces-abroad/defence-facilities/pine-gap/pine-gap-intro/"],[-21.8889,114.1301,"United States","Australia","Space Surveillance Radar System, Naval Communications Station Harold E. Holt","North West Cape","Navy","Co-base","2011","","","","This radar system forms part of a U.S.-led space surveillance network, tracking objects in orbit and transmitting data to command centers in the United States. Its operation from Australian territory illustrates how remote installations are integrated into global military space monitoring systems, with limited local visibility over how the data is ultimately used.","https://www.kunsan.af.mil/News/Article/2177532/eyes-on-the-sky-us-australia-collaborate-to-advance-space-superiority/."],[-21.8957,114.0899,"United States","Australia","Space Surveillance Telescope, Naval Communications Station Harold E. Holt","North West Cape","Air Force","Co-base","2017","","","","The Space Surveillance Telescope contributes to U.S.-aligned space monitoring activities by tracking satellites and orbital objects, with data routed to centralized command systems in the United States. While presented as cooperative infrastructure, such systems embed host territory within expanding military space architectures, where operational control and data governance remain largely external.","https://www.ssc.spaceforce.mil/Newsroom/Article-Display/Article/3176471/space-surveillance-telescope-reaches-operational-acceptance-set-to-provide-spac"],[-12.445,130.9744,"United States","Australia","Robertson Barracks","Holtze NT","Navy","Training Base","2012","","","","Robertson Barracks is an Australian Army base that regularly accommodates U.S. Marines under the Marine Rotational Force – Darwin program. Although framed as rotational, the recurring presence of up to 2,500 personnel embeds a continuous U.S. military footprint within Australian territory, normalizing long-term deployment patterns without formal basing arrangements.","https://www.dvidshub.net/news/404479/come-meet-marines-sailors-marine-rotational-force-darwin"],[-22.2183,114.1024,"United States","Australia","HANDS Ground Station Learmonth","Learmonth","Navy","Co-base","1979","","","","This U.S.-operated ground station at Learmonth forms part of a wider space surveillance network, tracking satellites and orbital activity. Data collected at the site is transmitted to U.S.-based command centers, illustrating how geographically remote installations are integrated into centralized military space systems beyond host-nation control.","https://johnmenadue.com/post/2021/11/dangerous-liaisons-americas-huge-little-known-military-footprint-in-australia/"],[-22.2192,114.1033,"United States","Australia","Learmonth Solar Observatory","Learmonth","Navy","Co-base","1979","","","","The U.S. military operates monitoring systems at the Learmonth Solar Observatory to track solar activity affecting communications and space-based systems. While presented as technical monitoring, such capabilities are directly linked to maintaining the reliability of military communications and space operations, embedding strategic functions within a civilian scientific site.",""],[-22.2204,114.1036,"United States","Australia","Learmonth Space Situational Awareness (SSA) Observatory, Electro Optical Systems","Learmonth","Navy","Co-base","1957","","","","Although not directly operated by the United States, this observatory contributes data to a broader space surveillance network aligned with U.S. military interests. Its integration into these systems illustrates how privately operated or nationally managed facilities can still be incorporated into U.S.-led space monitoring architectures.","https://amostech.com/TechnicalPapers/2018/Optical-Systems_Instrumentation/Smith.pdf"],[-22.3363,114.0485,"United States","Australia","Defence High Frequency System Receiver Station, Rough Range","Exmouth Gulf ","Navy","Co-base","None","","","","This Australian-operated communications facility is designed for interoperability with U.S. military systems, enabling data exchange and coordinated operations. Such technical alignment reflects deeper structural integration, where communication infrastructures are configured to function within U.S.-led military networks.",""],[-14.5211,132.3778,"United States","Australia","Tindal Air Base","Tindal","Navy","Co-base","1942","","","","RAAF Base Tindal has been expanded with significant U.S. funding to support rotational deployments of advanced aircraft, including nuclear-capable bombers. These upgrades transform the base into a platform for extended U.S. air power projection in the region, raising concerns about escalation risks and the strategic use of host-nation territory in potential conflict scenarios.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[-12.3588,130.9822,"United States","Australia","Shoal Bay Receiving Station","Shoal Bay","Navy","Operator Only","None","","","","Shoal Bay is a signals intelligence facility involved in the interception and analysis of electronic communications. Its role within a broader intelligence-sharing framework aligns it with U.S.-linked surveillance networks, embedding sensitive intelligence functions within Australian territory with limited public transparency.","https://nautilus.org/publications/books/australian-forces-abroad/defence-facilities/shoal-bay-receiving-station/"],[-28.695,114.8422,"United States","Australia","Australian Defence Satellite Communications Station","Kojarena","Navy","Co-base","2006","","","","Operated by Australia, this station hosts U.S.-built satellite communication systems, including MUOS and WGS infrastructure. These facilities connect the site to U.S. global military communications networks, reinforcing dependence on external systems for secure communications and integrating national infrastructure into U.S.-aligned operations.","https://nautilus.org/publications/books/australian-forces-abroad/defence-facilities/australian-defence-satellite-communications-station-kojarena/"],[-32.2417,115.6833,"United States","Australia","HMAS Stirling","Garden Island","Navy","Co-base","2022","","","","HMAS Stirling is set to host rotational deployments of U.S. and U.K. nuclear-powered submarines under the AUKUS framework. This arrangement positions the base as a forward site for allied submarine operations, embedding nuclear-capable platforms within Australian territory.","https://www.reuters.com/business/aerospace-defense/us-starts-build-submarine-presence-strategic-australian-coast-under-aukus-2025-03-16/#:~:text=On%20a%20training%20exercise%20from,nuclear%20submarine%20capability%20to%20Australia."],[-12.4199,130.8634,"United States","Australia","Royal Australian Air Force Base Darwin","Darwin","Air Force","Co-base","2012","","","","RAAF Base Darwin remains under Australian control but is increasingly used by U.S. forces for deployments, training, and infrastructure development. This expanding access reflects a broader pattern in which national bases are adapted to support U.S. military activities, blurring the distinction between sovereign control and operational integration.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[12.3531,-1.5122,"United States","Burkina Faso","Thomas Sankara International Airport","Ouagadougou","Air Force","Co-base","2007","","","","The United States military has used the military side of Thomas Sankara International Airport in Ouagadougou, Burkina Faso, for airborne intelligence operations since 2007. These operations are conducted using small, unarmed turboprop aircraft disguised as civilian planes. The surveillance focuses on militant groups in West Africa. However, due to recent political changes, including military coups in Burkina Faso, the continuation of these operations might be impacted, and there is no current public information confirming if the U.S. still operates there under the current government.","https://www.washingtonpost.com/world/national-security/us-expands-secret-intelligence-operations-in-africa/2012/06/13/gJQAHyvAbV_story.html."],[12.3531,-1.5122,"United States","Burkina Faso","Ouagadougou International Airport","Ouagadougou","Air Force","Co-base","2007","","","Drone Base","The United States has used the military side of Ouagadougou International Airport (Thomas Sankara International Airport) in Burkina Faso for airborne intelligence operations. Since 2007, it has served as a hub for surveillance missions over Western Africa. These operations typically involve small, unarmed turboprop aircraft disguised as civilian planes. However, due to recent political changes, including military coups in Burkina Faso, the continuation of these operations might be impacted, and there is no current public information confirming if the U.S. still operates there under the current government.","https://www.washingtonpost.com/world/national-security/us-expands-secret-intelligence-operations-in-africa/2012/06/13/gJQAHyvAbV_story.html."],[-3.3833,29.3667,"United States","Burundi","Bujumbura","Bujumbura","Unknown","Unknown","None","","","","According to previously classified U.S. Africa Command (AFRICOM) documents from 2015, Bujumbura (now Gitega), Burundi, was listed as a contingency location (CL) under AFRICOM's contingency planning. These documents identified Bujumbura as one of several sites across Africa designated for potential use to support U.S. military operations and partnerships in the region.​ However, there have been no publicly available updates or disclosures regarding the funding, development, or current status of this site since the release of these documents. The absence of recent information makes it difficult to ascertain whether Bujumbura continues to be utilized for military activities or if it has been decommissioned.​","https://www.thenation.com/article/archive/secret-us-military-documents-reveal-a-constellation-of-american-military-bases-across-africa/"],[24.3508,-77.7159,"United States","Bahamas","AUTEC Big Wood Cay","Andros Island","Navy","Operator Only","1966","","","","The Atlantic Undersea Test and Evaluation Center, located in Big Wood Cay, is an island. The US Navy has described AUTEC as its own secretive testing facility.",""],[25.0384,-76.1168,"United States","Bahamas","AUTEC Golding Cay","Andros Island","Navy","Operator Only","1966","","","","The Atlantic Undersea Test and Evaluation Center (AUTEC) is located at Golding Cay, which is a rock in the ocean that is not much larger than a football field.",""],[25.8253,-77.9096,"United States","Bahamas","AUTEC Great Stirrup","Andros Island","Navy","Operator Only","1966","","","","The Atlantic Undersea Test and Evaluation Center (AUTEC) is located at Great Stirrup Cay, Bahamas. The facility has three test ranges: the Weapons Range, the Acoustic Range, and the FORACS Range.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[23.9005,-77.4953,"United States","Bahamas","AUTEC High Point Cay","Andros Island","Navy","Operator Only","1966","","","","The Atlantic Undersea Test and Evaluation Center (AUTEC) is a complex of torpedo located on Tudor Hill, Bermuda, with an auxiliary site at High Point Cay.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[24.7831,-78.0601,"United States","Bahamas","AUTEC Main Base","Andros Island","Navy","Operator Only","1966","","","","The main base of the Atlantic Undersea Test and Evaluation Center (AUTEC) is located on Andros Island, Bahamas. The base is a short flight from Nassau.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[24.6265,-77.9128,"United States","Bahamas","AUTEC Salvador Point","Andros Island","Navy","Operator Only","1966","","","","The Atlantic Undersea Test and Evaluation Center (AUTEC) is located in the Bahamas. The installation at Salvador Point is connected to AUTEC via radio transmission from a surface buoy.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[20.9744,-73.6753,"United States","Bahamas","United States Coast Guard Inagua Base","Matthew","Navy","Operator Only","None","","","","The United States Coast Guard has a Category 3 hangar in Great Inagua, the southernmost island in the Bahamas. The Coast Guard's Area of Operations includes the Gulf of Mexico, the Caribbean basin, and the Bahamas.",""],[26.2665,50.6476,"United States","Bahrain","NSA Bahrain-Aviation Unit Muharraq","Al Jufayr","Navy","Co-base","1948","","","","NSA Bahrain–Aviation Unit Muharraq is a U.S. military facility located near Bahrain International Airport. It operates under U.S. Navy control and supports air logistics and surveillance missions in the Gulf region. The base is part of a broader U.S. military presence in Bahrain, rooted in post-colonial agreements. Its continued operation reflects entrenched foreign military influence in the region.","https://www.globalsecurity.org/military/facility/muharraq.htm"],[26.0729,50.5584,"United States","Bahrain","NSA Bahrain-Banz Wrhs Compound","Al Jufayr","Navy","Operator Only","1948","","","","​The NSA Bahrain – Banz Warehouse Compound is a U.S. Navy facility located at 1 Juffair Avenue, Manama, Bahrain. It houses various administrative and support services, including the Personnel Support Detachment and the Fleet and Family Support Center. The compound also accommodates services such as ID/CAC card processing and housing offices, indicating its role in logistical and personnel support operations. Its presence exemplifies the unjustified extensive U.S. military infrastructure established within Bahrain.​","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.2081,50.6036,"United States","Bahrain","NSA Bahrain-Dependent School","Al Jufayr","Navy","Operator Only","1968","","","","​The NSA Bahrain–Dependent School, officially known as Bahrain School, is a U.S. DoD Education Activity institution located in Juffair, Manama, Bahrain. In 2024, a rainstorm damaged the school, and so it closed for three weeks.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.0546,50.6128,"United States","Bahrain","ISA Flightline","Askar","Navy","Operator Only","1991","","","","Isa Air Base, situated in southern Bahrain, serves as a military airfield operated by the Royal Bahraini Air Force and hosts U.S. military operations. Since 2009, the U.S. Air Force has maintained a presence here, primarily supporting aerial port operations and logistics missions.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.201,50.607,"United States","Bahrain","NSA Bahrain-Mina Sulman Pier Area","Manama","Navy","Operator Only","1948","","","","The Mina Salman Pier Area is part of NSA Bahrain, used primarily for U.S. Navy operations. The U.S. Navy has leased this facility since the 1970s. It serves as a docking area for U.S. military vessels, including aircraft carriers and other naval ships.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.2756,50.6361,"United States","Bahrain","NSA Bahrain - North Ramp","Manama","Navy","Operator Only","None","","","","The NSA Bahrain – North Ramp is a section of the U.S. Naval Support Activity Bahrain, located adjacent to Bahrain International Airport. It functions as an operational area for U.S. military aircraft. The U.S. Navy and other military branches for aircraft operations, maintenance, and storage utilize the North Ramp. This integration of military assets into public spaces blurs lines between war zones and civilian life.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.2787,50.6144,"United States","Bahrain","Nsa-III","","Navy","Operator Only","None","","","","NSA III is a separate facility that has been integrated into the NSA Bahrain complex. While specific details about NSA III are limited in publicly available sources, it is mentioned in official documents, such as the 2022 Drinking Water Consumer Confidence Report, indicating its operational status and integration into the base's infrastructure. This report notes that potable water from NSA II is trucked to NSA III, suggesting logistical coordination between the two sites. ​","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.2079,50.6155,"United States","Bahrain","Nsa-II","Manama","Navy","Operator Only","1948","","","","​The NSA Bahrain – Nsa-II is a U.S. military installation situated in Juffair, Manama, Bahrain. This facility functions as a command and control center for U.S. naval operations in the region. Its presence has raised concerns about the militarization of civilian areas and the potential for Bahrain to become a target in regional conflicts. The base exemplifies the extensive U.S. military footprint in the Middle East, which some critics argue contributes to regional instability.​","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[25.9183,50.5906,"United States","Bahrain","Shaikh Isa Air Base","Riffa","Navy","Operator Only","1991","","","","Shaikh Isa Air Base is a military installation in Bahrain used by the U.S. Air Force under a long-term agreement with the Bahraini government. It hosts U.S. aerial operations, including drones and combat aircraft. The U.S. presence there has drawn criticism for entrenching foreign military influence in the Gulf. The base's activities risk drawing Bahrain into broader regional conflicts.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.1133,50.5868,"United States","Bahrain","ISA SITE 3","","Navy","Operator Only","None","","","","​ISA Site 3 is a U.S. military facility located within Isa Air Base in southern Bahrain. While specific details about its operations are not publicly disclosed, the U.S. presence at Isa Air Base includes aerial port operations and logistics missions. The lack of transparency regarding the activities at ISA Site 3 contributes to apprehensions about its role in regional military dynamics.​","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.2056,50.6153,"United States","Bahrain","NAVSUPPACT BAHRAIN","Al Jufayr","Navy","Co-base","1950","","","","Bahrain is the headquarters of the US Navy's Fifth Fleet, whose operations include the Gulf region, the Gulf of Oman, the Arabian Sea, the Gulf of Aden, the Red Sea, and parts of the Indian Ocean, as it is stationed in the \"Juffair\" area, east of the Bahraini capital, Manama. One of the tasks of the US Fifth Fleet is to secure the Gulf region through whose waters nearly half of the world's oil supplies pass","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[26.0519,50.5411,"United States","Bahrain","Naval Regional Contracting Center (NRCC) Bahrain","Riffa","Navy","Operator Only","1998","","","","​The Naval Regional Contracting Center (NRCC) Bahrain is a U.S. Navy facility operating under the jurisdiction of the Naval Regional Contracting Center Naples. Headquartered in Naples, Italy, NRCC Naples oversees two detachments: one in Bahrain and another in London, UK.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[-23.6294,-46.6975,"United States","Brazil","Office of Naval Research","São Paulo","Navy","Operator Only","1946","","","","​The Office of Naval Research Global (ONR Global) maintains a regional office in São Paulo, Brazil, situated within the U.S. Consulate General. This office serves as a strategic node for fostering science and technology (S&T) collaboration between the United States and South America, encompassing Brazil, Argentina, Mexico, and other regional partners. ​","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.8642,4.4346,"United States","Belgium","USAG Brussels","Brussels","Army","Co-base","1967","","","","USAG Brussels is a U.S.-operated military facility in Belgium that supports American personnel assigned to NATO and related missions. It includes administrative services and housing but does not directly host combat units. The nearby Brussels American School serves children of U.S. and NATO personnel. e.",""],[50.5758,3.8311,"United States","Belgium","Chievres Air Base","Chievres Ab","Army","Co-base","1968","","NATO","","Chièvres Air Base, also known as SHAPE Airfield, is a NATO facility in Belgium operated by the United States Army, not the Air Force. It is primarily used for logistical support to NATO and SHAPE.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.5903,3.8194,"United States","Belgium","Daumerie Caserne","Chievres","Army","Operator Only","1968","","","","Caserne Daumerie, located in Chièvres, Belgium, serves as the headquarters of the U.S. Army Garrison Benelux. This garrison manages U.S. Army installations across Belgium, the Netherlands, and Luxembourg, including support for NATO operations. It is adjacent to Chièvres Air Base.","https://www.dvidshub.net/image/5586315/historical-resources-caserne-daumerie"],[51.1683,5.47,"United States","Belgium","Kleine Brogel Air Base","Kleine-brogel","Air Force","Co-base","1962","Nuclear weapons","NATO","","Kleine Brogel Air Base is a Belgian Air Component military airfield. The base has been subject to much political controversy, because of American nuclear weapons being stored in the facility by the United States Air Force (USAF).","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.8636,4.4819,"United States","Belgium","Brussels American School","Brussels","Army","Co-base","1967","","","","This school serves as a DoDDS school for all US military and DOD civilian sponsor dependents, who are allowed to enroll their children tuition free.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.9475,5.5906,"United States","Belgium","Zutendaal Air Base","Zutendaal","Army","Co-base","2017","","","","The United States no longer operates Zutendaal Air Base in Belgium. However, the US military wants to use the base to store military equipment. U.S. Army vehicles are stored and maintained at the Zutendaal Work Site.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.5758,3.831,"United States","Belgium","USAG Benelux","Chievres","Army","Co-base","1967","","NATO","","USAG Benelux is a U.S.-controlled base, but it operates in support of NATO and under the legal framework of the host nations. It is not a \"co-base\" in the sense of being jointly operated by NATO and the U.S., but its operations indirectly benefit NATO's broader mission in Europe.","https://www.dvidshub.net/video/951720/welcome-usag-benelux"],[50.8634,4.4815,"United States","Belgium","U.S. Army Health Clinic Brussels","Zaventem","Army","Operator Only","2022","","","","U.S. Army Health Clinic Brussels provides non-urgent care to US army and their families.",""],[50.5061,3.9778,"United States","Belgium","U.S. Navy Element SHAPE, Mons","Mons","Army","Co-base","1967","","NATO","","The U.S. Navy Element (USNE) is located at the Supreme Headquarters Allied Powers Europe (SHAPE) in Mons, Belgium. SHAPE is the military headquarters of the North Atlantic Treaty Organization's (NATO) Allied Command Operations (ACO).","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.4805,4.0053,"United States","Belgium","Chievres Chateau Gendebien","Chievres ","Army","Co-base","None","","","","Château Gendebien is the official residence of the Supreme Headquarters Allied Powers Europe (SHAPE), located in Casteau, near Mons, Belgium. SHAPE serves as the military headquarters for NATO's Allied Command Operations (ACO).​ The U.S. Army Garrison (USAG) Benelux operates a facility in Chièvres, approximately 25 km from Château Gendebien. This installation provides support to U.S. military personnel and their families in the region. While USAG Benelux and SHAPE are distinct entities, they collaborate closely to support NATO operations.​","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.5903,3.8194,"United States","Belgium","Chievres Daumerie Caserne","Chievres ","Army","Operator Only","None","","","","Caserne Daumerie is a U.S. military installation located in Chièvres, Belgium, approximately 25 kilometers from Casteau, where NATO's Supreme Headquarters Allied Powers Europe (SHAPE) is situated. It serves as the headquarters of U.S. Army Garrison (USAG) Benelux, which provides support to U.S. military personnel and their families across Belgium, the Netherlands, and Luxembourg .​","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.5849,3.7734,"United States","Belgium","Chievres","Chievres","Army","Operator Only","None","","","","The term \"Chievres Leased\" refers to U.S. government-leased facilities or housing in Chievres, Belgium, specifically for U.S. military personnel and their families. These are accommodations that are leased by the U.S. military from private landlords or property owners, rather than being owned by the U.S. government. These leased properties are typically used to house personnel assigned to U.S. Army Garrison (USAG) Benelux or those stationed at nearby SHAPE.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.4656,3.8771,"United States","Belgium","Mons","Mons","Army","Operator Only","None","","","","The term \"Mons Leased\" refers to U.S. government-leased facilities or housing in Mons, Belgium, specifically for U.S. military personnel and their families. These are accommodations that are leased by the U.S. military from private landlords or property owners, rather than being owned by the U.S. government. Personnel stationed at NATO's Supreme Headquarters Allied Powers Europe (SHAPE) or other U.S. military units in the Mons area may use these leased properties.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.8901,4.3453,"United States","Belgium","Brussels","Brussels ","Army","Operator Only","None","","","","The term \"Brussels Leased\" refers to U.S. government-leased facilities or housing in Brussels, Belgium, specifically for U.S. military personnel and their families. These are accommodations that are leased by the U.S. military from private landlords or property owners, rather than being owned by the U.S. government. These leased properties are typically used by military personnel assigned to U.S. Army Garrison (USAG) Benelux or those stationed in Brussels.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.5091,3.9764,"United States","Belgium","Shape Headquarters","Mons","Army","Co-base","None","","NATO","","The command headquarters, known as Supreme Headquarters Allied Powers Europe, or SHAPE, is located in Casteau near Mons, Belgium. The mission of ACO and the SACEUR is to serve militant purposes of NATO member nations in its area of responsibility.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[-24.2208,25.3486,"United States","Botswana","Thebephatshwa Airbase","Molepolole","Air Force","Co-base","2022","","","","In 2022, The US contracted a deal with Botswana to construct Thebephatshwa Airbase. The U.S. Africa Command Special Operations Forces conducted a Joint Combined Exchange Training with the Botswana Defence Force at Thebephatshwa Air Base in September 2022.","https://www.sundaystandard.info/us-army-builds-p100m-facility-at-thebephatshwa-air-base/"],[-24.5553,25.9183,"United States","Botswana","Sir Seretse Khama airport","Letlametlo","Air Force","Co-base","2022","","","","The United States has an agreement with Botswana permitting the use of Sir Seretse Khama International Airport in Gaborone for U.S. military operations. According to declassified Pentagon documents, the U.S. DoD designates Botswana as hosting a Cooperative Security Location—a type of military site that can be activated for operations with host nation consent. This setup does not involve a permanent U.S. military base; instead, it allows for flexible access to the airport for various military activities as needed. ​","https://www.sundaystandard.info/us-base-in-gaborone-hiding-in-plain-sight/"],[42.7203,26.5919,"United States","Bulgaria","Novo Selo Training Area"," Burgas","Army","Co-base","2005","","NATO","","​The Novo Selo Training Area (NSTA), established in 1962 near Mokren in Sliven Province, Bulgaria, is a significant military training facility utilized by both Bulgarian forces and NATO allies. Under the 2006 Defense Cooperation Agreement (DCA) between the United States and Bulgaria, NSTA became one of four joint military facilities. The U.S. Army has since invested in infrastructure enhancements at the site, including the construction of barracks, maintenance shops, and other support buildings to accommodate rotational forces. ​","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[42.2903,24.7139,"United States","Bulgaria","Graf Ignatievo Air Base","Graf Ignatievo","Air Force","Co-base","2006","","NATO","","Under the 2006 Defense Cooperation Agreement (DCA) between the United States and Bulgaria, U.S. forces are permitted to use certain Bulgarian military installations, including Graf Ignatievo and Bezmer, for training and operations. These facilities remain under Bulgarian command, and the agreement allows for the deployment of up to 2,500 U.S. military personnel across the joint facilities .​","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[42.7114,27.2328,"United States","Bulgaria","Aytos Logistics Center","Aytos","Army","Co-base","2005","","NATO","","​The Aytos Logistics Center, situated near the town of Aytos in southeastern Bulgaria, is one of four joint U.S.-Bulgarian military facilities established under the 2006 Defense Cooperation Agreement (DCA) between the United States and Bulgaria. This agreement permits U.S. forces to utilize Bulgarian military installations for training and operations, while the facilities remain under Bulgarian command and sovereignty. Primarily, the Aytos Logistics Center functions as a military storage facility, housing armaments and equipment to support U.S. and NATO operations in the region.","https://militarybases.com/overseas/bulgaria/aitos/"],[42.4547,26.3522,"United States","Bulgaria","Bezmer Air Base","Tundzha","Air Force","Co-base","2006","","","","​Bezmer Air Base, located in Yambol Province, Bulgaria, is one of four joint U.S.-Bulgarian military facilities established under the 2006 Defense Cooperation Agreement (DCA) between the United States and Bulgaria. This agreement permits U.S. forces to utilize Bulgarian military installations for training and operations, while the facilities remain under Bulgarian command and sovereignty. ​","https://web.archive.org/web/20060614030659/https://foreignpolicy.com/story/cms.php?story_id=3460"],[42.5703,27.5153,"United States","Bulgaria","Burgas Airport","Sarafovo","Air Force","Co-base","2003","","","","The United States has utilized Burgas Airport in Bulgaria for military operations, particularly for aerial refueling missions. In 2011, due to the temporary closure of another regional base for runway repairs, the U.S. Air Force deployed KC-135 Stratotankers and approximately 80 personnel from the 621st Contingency Response Wing and the 927th Air Refueling Squadron to Burgas Airport.","https://www.jbmdl.jb.mil/News/Article/244343/airmen-provide-refueling-support-from-bulgaria/"],[4.3667,18.5833,"United States","Central African Republic","Camp Kasaï","Kasaï","Army","Co-base","None","","","","The Central African Republic has a Camp Kasaï in Bangui or Bouar. In 2014, the United States warned of sanctions against those working against peace in the country, and former Seleka rebels left Camp Kasaï.","https://time.com/3444979/witness-to-collapse-william-daniels-in-central-african-republic"],[6.05,25.3167,"United States","Central African Republic","Djema","Djema","Army","Co-base","None","","","","In October 2011, President Obama authorized the deployment of approximately 100 U.S. Army Special Forces personnel to central Africa, including CAR, to assist in operations against the LRA. These forces established temporary outposts in remote areas such as Djema, collaborating with local and regional forces. While these locations were not officially listed in AFRICOM's 2015 plans, they were identified as U.S. outposts or staging areas in earlier reports. ​","https://www.washingtonpost.com/world/national-security/us-has-secretly-expanded-its-global-network-of-drone-bases-to-north-africa/2016/10/26/ff19633c-9b7d-11e6-9980-50913d68eacb_story.html"],[5.3971,26.4938,"United States","Central African Republic","Obo","Obo","Army","Co-base","None","","","","In October 2011, President Obama authorized the deployment of approximately 100 U.S. Army Special Forces personnel to central Africa, including CAR, to assist in operations against the LRA. These forces established temporary outposts in remote areas such as Obo, collaborating with local and regional forces. While these locations were not officially listed in AFRICOM's 2015 plans, they were identified as U.S. outposts or staging areas in earlier reports. ​","https://www.washingtonpost.com/world/national-security/us-has-secretly-expanded-its-global-network-of-drone-bases-to-north-africa/2016/10/26/ff19633c-9b7d-11e6-9980-50913d68eacb_story.html"],[11.55,104.9167,"United States","Cambodia","Navy Med Research Unit 2","Phnom Penh","Navy","Co-base","1970","","","","Naval Medical Research Unit Two (NAMRU-2) is a biomedical research laboratory of the US Navy established with the purpose to study infectious diseases of potential military significance in Asia. NAMRU-2 operates in several countries in Southeast Asia, including Cambodia.",""],[10.4563,14.2579,"United States","Cameroon","Salak military base","Salak","Army","Co-base","2014","","","","The Salak military base, located near Maroua in Cameroon's Far North Region, serves as a hub for U.S. military operations in Central Africa. Since 2015, approximately 300 U.S. military personnel have been deployed to this base to support intelligence, surveillance, and reconnaissance. However, the Salak base has been the subject of serious human rights concerns. Investigations by Amnesty International and Forensic Architecture have documented over 100 cases of illegal detention, torture, and extrajudicial killings at Salak and other military sites in Cameroon between 2013 and 2017.","https://forensic-architecture.org/investigation/torture-and-detention-in-cameroon"],[9.3433,13.3777,"United States","Cameroon","Garoua Airport","Garoua","Air Force","Co-base","2017","","","Drone Base","The United States has a small portion at Garoua Airport, which works as a secret drone base.","https://theworld.org/stories/2016/03/01/new-drone-base-cameroon-latest-weapon-against-boko-haram"],[4.0451,9.7597,"United States","Cameroon","Douala Air Force Base","Douala","Army","Training Base","2014","","","","The United States provides training to Cameroonian forces at the Douala Naval Headquarters Base, particularly focusing on intelligence and tactical operations.​",""],[10.4674,14.2439,"United States","Cameroon","Rapid Intervention Battalion, Salak","Salak","Army","Co-base","2014","","","","The United States maintains a military presence at Camp Salak, the headquarters of Cameroon's elite Rapid Intervention Battalion (BIR), located near Maroua in the Far North Region. U.S. military advisors are stationed there to support Operation Alpha. The U.S. partnership with the BIR includes training, intelligence sharing, and logistical support. This collaboration has been ongoing since at least 2015, with approximately 300 U.S. military personnel working with the BIR at any given time.",""],[47.3061,-53.99,"United States","Canada","Argentia Newfoundland","Placentia, Newfoundland","Navy","Co-base","1941","","","","Naval Station Argentia is a former base of the United States Navy that operated from 1941 to 1994. The current usage of this base by the US is not yet clear. However, it was listed in Bases Structure Report 2025.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[48.3306,-70.9964,"United States","Canada","Bagotville Airport","Bagotville, Quebec","Air Force","Co-base","None","","","","This base hosts 3 Wing of the Royal Canadian Air Force (RCAF) and is one of two bases in Canada operating CF-18 Hornet fighters. In 2024, Canada began constructing a Quick Reaction Alert facility at Bagotville to support NORAD missions with F-35A fighters.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[54.4775,-110.2692,"United States","Canada","Cold Lake Airport","Cold Lake, Alberta","Air Force","Co-base","None","","","","Cold Lake Airport is home to 4 Wing, CFB Cold Lake is Canada's busiest fighter base, operating CF-18 Hornets and serving as a training hub for fighter pilots. The base supports NORAD operations and hosts joint exercises with U.S. forces, such as the annual Maple Flag exercise.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.7067,-124.9073,"United States","Canada","Comox Airport","Comox, B.c.","Air Force","Co-base","None","","","","The 19 Wing Comox operates CP-140 Aurora aircraft for maritime patrol and surveillance, as well as CH-149 Cormorant helicopters for search and rescue missions. The base supports NORAD's Pacific operations and collaborates with U.S. forces in joint training exercises.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[53.3192,-60.4258,"United States","Canada","Goose Bay Airport","Goose Bay, Labrador","Air Force","Co-base","None","","","","This base had a role during World War II and the Cold War, CFB Goose Bay continues to serve as a forward deployment base for CF-18 Hornet fighters rotating from CFB Bagotvill.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[44.9844,-64.9169,"United States","Canada","Greenwood Airport","Greenwood, Nova Scotia","Air Force","Co-base","None","","","","This base is the largest air base on Canada's East Coast. The 14 Wing Greenwood operates CP-140 Aurora aircraft for long-range patrol and CH-149 Cormorant helicopters for search and rescue. The base supports NORAD operations and hosts joint exercises with U.S. forces.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[68.3039,-133.4831,"United States","Canada","Inuvik Airport","Dawson City","Air Force","Co-base","None","","","","Inuvik serves as a location for Arctic defense. In 2024, Canada's Minister of National Defence highlighted the town's importance in the updated Arctic defense policy, \"Our North, Strong and Free,\" emphasizing investments in defense infrastructure.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[63.7567,-68.5561,"United States","Canada","Iqaluit Airport","Goose Bay, Labrador","Air Force","Co-base","None","","","","Iqaluit Airport functions as a forward operating base for the RCAF and supports NORAD exercises. In 2025, increased military activity was observed around the airport as part of routine NORAD training to enhance operational readiness in the Arctic region.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[46.3639,-79.4242,"United States","Canada","North Bay Airport","North Bay, Ontario","Air Force","Co-base","None","","","","The 22 Wing North Bay is a component of NORAD's aerospace defense, providing surveillance and control of Canadian and U.S. airspace. The base also contributes to space surveillance through Canada's Sapphire satellite, which is integrated into the U.S. Space Surveillance Network.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[45.6119,-62.6215,"United States","Canada","Trenton Airport","Trenton, Ontario","Air Force","Co-base","None","","","","The 8 Wing Trenton is Canada's primary hub for air transport operations, supporting both domestic and international missions. The base facilitates the movement of personnel and equipment for NORAD and collaborates with U.S. forces in joint operations.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.91,-97.24,"United States","Canada","Winnipeg Airport","Winnipeg, Manitoba","Air Force","Co-base","None","","","","The 17 Wing Winnipeg provides aircrew training and supports various RCAF operations. The base's co-location with Winnipeg James Armstrong Richardson International Airport enhances its missions for NORAD and joint exercises with U.S. forces.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[62.4631,-114.4403,"United States","Canada","Yellowknife Airport","Yellowknife N W Terr","Air Force","Co-base","None","","","","Yellowknife hosts a Canadian NORAD Region Forward Operating Location, upgraded under the North American Air Defence Modernization program. The location supports NORAD operations and facilitates joint exercises with U.S. forces to ensure Arctic security.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.8441,20.8417,"United States","Chad","Abeche","Abeche","Army","Co-base","None","","","","The United States has utilized a base in Abeche, Chad, for counterterrorism operations, particularly in collaboration with Chadian forces. This facility has served as a location for U.S. military personnel engaged in training, intelligence sharing, and operational against groups in the Sahel region.​ While the U.S. does not maintain a permanent base in Abeche, the facility has been utilized for counterterrorism operations in partnership with Chadian forces.","https://www.military.africa/2024/09/us-forces-returning-to-chad-but-with-a-different-objective/"],[17.9207,19.104,"United States","Chad","Faya Largeau","Faya Largeau","Air Force","Co-base","None","","","","According to secret documents obtained and published in 2017, Faya Largeau in Chad was listed as one of the \"Contingency Locations\" (CLs) used or planned by U.S. Africa Command. These CLs are forward operating sites or temporary facilities intended to support counterterrorism operations and regional stability missions across Africa. However, since the 2017 disclosures, there have been no publicly available updates regarding U.S. military funding, construction, or active operational use of the Faya Largeau site. The lack of transparency may reflect the sensitive nature of these locations, often tied to intelligence or special operations activities.","https://theintercept.com/2017/10/22/the-u-s-will-invade-west-africa-in-2023-after-an-attack-in-new-york-according-to-pentagon-war-game/"],[12.1291,15.0207,"United States","Chad","Camp Tassone","Camp Tassone","Air Force","Co-base","None","","","","Camp Tassone, situated within N'Djamena International Airport in Chad, has served as a base for U.S. special operations forces under U.S. Africa Command (AFRICOM). In recent years, the U.S. has maintained a presence at Camp Tassone, utilizing it for training and counterterrorism missions. However, in April 2024, Chad requested the U.S. to cease operations at an air force base in N'Djamena, leading to a reevaluation of U.S. military activities in the region. ​","https://www.army-technology.com/news/newsflintlock-2015-counter-terrorism-exercise-starts-in-chad-4514411/"],[12.1396,15.0401,"United States","Chad","N’Djamena","N’Djamena","Air Force","Co-base","2014","","","Drone Base","N'Djamena is one of around 12 air bases in Africa, used for surveillance flights.","https://www.defensenews.com/pentagon/2024/08/27/us-quietly-reopens-talks-with-chad-amid-challenges-in-africa-posture/"],[-33.4125,-70.6047,"United States","Chile","Office of Naval Research","Santiago","Navy","Co-base","1946","","","","The Office of Naval Research (ONR) is located at the U.S. Embassy in Santiago, Chile, is headed by a Regional Director and staffed by an Science Director for S&T, an Assistant Director for research and a Strategic Communications Specialist.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[-32.9473,-71.4517,"United States","Chile","Fuerte Aguayo NB, Concón","Concón","Army","Co-base","2012","","","","Fuerte Aguay is a joint-use military base utilized by both the Chilean and U.S. armed forces. The United States has been involved with this base since at least 2012, when U.S. Army South, in cooperation with Chile, constructed a Military Operations on Urban Terrain (MOUT) training facility there. Organizations like the Ethics Commission against Torture have expressed concerns over the U.S. role in Fuerte Aguayo, arguing that it grants the U.S. increased influence over Chilean security matters","https://www.codepink.org/united_states_military_bases_cuba"],[5.4836,-74.6572,"United States","Colombia","Captain Germán Olano Moreno Air Base","Palanquero","Air Force","Co-base","None","","","","Base Aérea Capitán Germán Olano, also known as Palanquero Air Base, is a Colombian military installation that has been utilized by the United States for various training and defense initiatives.​ In 2009, a military agreement between Colombia and the United States proposed increased access for U.S. forces to several Colombian bases, including Palanquero",""],[10.8799,-74.7769,"United States","Colombia","Base Aérea Alberto Pawells Rodríguez","Malambo","Army","Co-base","2010","","","","The United States has utilized General Alberto Pauwels Rodríguez Air Base in Barranquilla, Colombia, for military training and cooperation. On June 27, members of the 571st Mobility Support Advisory Squadron (MSAS) conducted a Building Partner Capacity (BPC) mission at the base.",""],[4.2447,-74.6497,"United States","Colombia","Fuerte Militar de Tolemaida","Nilo","Air Force","Co-base","None","","","","In January 2020, the United States and Colombian troops conducted airborne insertion from U.S. and Colombian Lockheed C-130 Hercules aircraft and then carried out exercises simulating the capture of an airfield. Consisting of around 75 paratroopers from the U.S. Army's 82nd Airborne Division and 40 personnel from U.S. Army South working with Colombian troops.","https://www.army.mil/article/278586/us_colombian_armies_enhance_interoperability_during_airborne_infiltration_exercise_hydra_iii_2024"],[1.4789,-75.4867,"United States","Colombia","Fuerte Militar Larandia","Florencia","Army","Training Base","None","","","","The U.S. has maintained a military presence at this base under the guise of counter-narcotics and counterinsurgency support. It has been a key site for American surveillance and operational planning. U.S. personnel have used it to influence Colombian military conduct. This base extends American military reach deep into Colombia's conflict zones.",""],[4.0761,-73.5628,"United States","Colombia","Base Aérea Capitán Luis Fernando Gómez Niño","Apíay","Army","Co-base","2010","","","","The U.S. forces have used this air base to conduct surveillance, coordinate air operations, and deploy personnel. American involvement here has been linked to monitoring and controlling Colombian airspace. The base also serves as a site for military coordination that reflects U.S. strategic interests in the region. Its use underscores ongoing U.S. military entanglement.",""],[10.4119,-75.5488,"United States","Colombia","Base Naval ARC Bolívar en Cartagena","Bocagrande","Navy","Co-base","2010","","","","The U.S. operates alongside Colombian forces at this naval base under joint arrangements. It facilitates American access to Caribbean maritime routes and military infrastructure. U.S. presence here reflects power projection rather than cooperative defense. Activities at the site raise questions about sovereignty and military dependency.","https://www.zona-militar.com/en/2024/07/16/the-colombian-navy-has-deployed-the-arc-tayrona-submarine-to-the-u-s-as-part-of-the-desi-exercise/"],[3.9743,-77.3256,"United States","Colombia","Base Naval ARC Málaga en Bahía Málaga","Málaga","Navy","Co-base","None","","","","The U.S. has been active at this Pacific naval facility through advisory and operational roles. Its presence supports persistent military oversight along key trafficking corridors. The base functions as a platform for U.S. military influence in Colombia’s Pacific region. This involvement ties Colombia to American geopolitical interests.",""],[19.9175,-75.16,"United States","Cuba","Naval Station Guantanamo Bay","Caimanera","Navy","Operator Only","1903","","","","Guantanamo Bay Naval Base, officially known as Naval Station Guantanamo Bay or NSGB, is a United States military base. It has been occupied by the U.S. military since 1903 and against the will of the Cuban government since 1959. It is the oldest overseas U.S. naval base in the world. It has been used to prevent refugees from entering the United States and to imprison people outside the United States and therefore supposedly outside legal protections. Prisoners have been tortured and murdered. This novel use of Guantanamo has created a model for Australia and other nations to imprison refugees on island territories to prevent their entering official national borders.","https://www.nytimes.com/2024/12/30/us/politics/guantanamo-detainee-released-tunisia.html"],[12.1846,-68.9559,"United States","Curaçao (Netherlands Antilles)","Curaçao International Airport","Willemstad","Air Force","Co-base","2001","","","","Curaçao International Airport, also known as Hato International Airport, hosts a Forward Operating Location (FOL) under a bilateral agreement with the U.S. It functions as a Cooperative Security Location (CSL), enabling U.S. and allied aircraft to conduct surveillance and counter-narcotics missions in the Caribbean. The base supports U.S. Southern Command’s regional strategy. Its operations have drawn local scrutiny due to sovereignty and transparency concerns.","https://bes-reporter.com/u-s-forward-operating-location-welcomes-new-commander-on-curacao/"],[12.1922,-68.9734,"United States","Curaçao (Netherlands Antilles)","CURACAO SITE 1","Willemstad","Air Force","Co-base","None","","","","Bases Structure Report 2023, listed CURACAO SITE 1 as Air Force Base. However, the current usage of this base by the US is not yet clear.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[34.5677,33.0363,"United States","Cyprus","Cape Gata","Cape Gata","Air Force","Co-base","None","","","","Cape Gata hosts two signals intelligence (SIGINT) facilities operated in partnership with the U.S., including an unmanned station near RAF Akrotiri. These installations are believed to support electronic surveillance across the Eastern Mediterranean. The U.S. presence here has been largely unacknowledged publicly, reflecting the covert nature of operations in this area.","https://www.declassifieduk.org/revealed-americas-secret-military-deployment-on-british-cyprus/"],[34.9128,32.8839,"United States","Cyprus","RAF Troodos","Troodos","Air Force","Co-base","None","","","","RAF Troodos is a British \"retained site\" where the U.S. operates a listening post for covert electronic intelligence gathering. The site is highly valued by the NSA for its strategic location, offering access to signals from the Levant, North Africa, and Turkey. Intelligence collected here supports technical SIGINT analysis, including monitoring of regional military activities.","https://www.declassifieduk.org/revealed-americas-secret-military-deployment-on-british-cyprus/"],[34.5903,32.9878,"United States","Cyprus","RAF Akrotiri","Akrotiri","Air Force","Co-base","1974","","","","RAF Akrotiri is a major Royal Air Force base that has been utilized by the U.S. for various military operations. Notably, it supported the 2018 missile strikes against Syria. The base also serves as a transit point for U.S. reconnaissance aircraft, including U-2 spy planes, under operations.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[35.0931,33.8867,"United States","Cyprus","Ayios Nikolaos Station","Deryneia","Air Force","Co-base","1946","","","","Ayios Nikolaos Station is a significant signals intelligence gathering site operated by the UK's Joint Service Signal Unit (Cyprus). The U.S. National Security Agency (NSA) is reported to fund approximately half of the station's operations. The facility is equipped with satellite interception capabilities and hosts a MASINT component, enabling the collection of detailed technical intelligence from across the Middle East and North Africa. ​","https://www.declassifieduk.org/revealed-americas-secret-military-deployment-on-british-cyprus/"],[55.2374,9.255,"United States","Denmark","Fighter Wing Skrydstrup","Jutland","Air Force","Co-base","None","","","","In December 2023, Denmark allowed US troops to be stationed on its soil. The United States has access to three Danish air bases, including Aalborg Air Bases. The 10-year Defense Cooperation Agreement (DCA) allows the US to permanently station troops and store weapons and equipment on Danish soil.","https://timesofindia.indiatimes.com/world/europe/denmark-to-host-us-troops-amid-greenland-standoff-off/articleshow/120221909.cms"],[57.0928,9.8492,"United States","Denmark","Aalborg Air Base","Vadum","Air Force","Co-base","None","","","","In December 2023, Denmark allowed US troops to be stationed on its soil. The United States has access to three Danish air bases, including Skrydstrup Air Bases. The 10-year Defense Cooperation Agreement (DCA) allows the US to permanently station troops and store weapons and equipment on Danish soil.","https://timesofindia.indiatimes.com/world/europe/denmark-to-host-us-troops-amid-greenland-standoff-off/articleshow/120221909.cms"],[56.2795,9.1203,"United States","Denmark","Air Base Karup","Karup","Air Force","Co-base","None","","","","In December 2023, Denmark allowed US troops to be stationed on its soil. The United States has access to three Danish air bases, including Karup Air Bases. The 10-year Defense Cooperation Agreement (DCA) allows the US to permanently station troops and store weapons and equipment on Danish soil.","https://timesofindia.indiatimes.com/world/europe/denmark-to-host-us-troops-amid-greenland-standoff-off/articleshow/120221909.cms"],[-7.3172,72.4285,"United States","Diego Garcia","Ground-based Electro-Optical Deep Space Surveillance","Unknown","Navy","Operator Only","1987","","","","Ground-based Electro-Optical Deep Space Surveillance (GEODSS) is an optical system that tracks objects in deep space. GEODSS uses large telescopes, low-light-level TV cameras, and computers. GEODSS is a passive sensor used to observe artificial satellites in deep space that have periods greater than 225 minutes.",""],[-7.3133,72.4111,"United States","Diego Garcia","Naval Support Facility Diego Garcia","Diego Garcia","Navy","Operator Only","1971","","","","Naval Support Facility Diego Garcia is a British Ministry of Defence facility leased to the United States Navy, located on the atoll Diego Garcia in the Indian Ocean. Camp Thunder Cove is part of the facility, and is operated by the United States Armed Forces and British Armed Forces.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[-7.291,72.386,"United States","Diego Garcia","Camp Thunder Cove","Diego Garcia","Air Force","Operator Only","2001","","","","Camp Thunder Cove, formerly Camp Justice is a United States Navy and Air Forces support facility within the US-UK Naval Support Facility on Diego Garcia.","https://www.realcleardefense.com/articles/2025/02/03/shifting_sands_at_diego_garcia_1088811.html"],[11.5436,43.1486,"United States","Djibouti","Camp Lemonnier","Djibouti","Navy","Operator Only","2002","","","","Camp Lemonnier is a United States Naval Expeditionary Base, situated next to Djibouti–Ambouli International Airport in Djibouti City, and home to the Combined Joint Task Force–Horn of Africa (CJTF-HOA) of the U.S. Africa Command (USAFRICOM). The camp is operated by U.S. Navy Region Europe, Africa, Southwest Asia; CJTF-HOA is the most notable tenant command located at the facility as of 2008.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[11.5167,43.0667,"United States","Djibouti","Chabelley Airfield","Djibouti","Air Force","Co-base","2013","","","Drone Base","Chabelley Airfield is a military airstrip in Chabelley. Although it is operated and used by the French military, it began serving as a temporary base for U.S. military unmanned aircraft in September 2013.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[29.9723,31.2862,"United States","Egypt","Naval Medical Research Unit 3","Cairo","Navy","Operator Only","1946","","","","Naval Medical Research Unit 3 (NAMRU-3), is the largest U.S. military medical research facility operating overseas and one of the largest medical research laboratories in the North Africa-Middle East region.",""],[13.4502,-89.0497,"United States","El Salvador","CSL El Salvador","San Salvador","Navy","Co-base","2000","","","","The United States has a Cooperative Security Location (CSL) in Comalapa, El Salvador. The CSL is located at the Comalapa International Airport and has been operated by the Navy since 2000.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[13.4408,-89.0556,"United States","El Salvador","Comalapa International Airport","Comalapa","Air Force","Co-base","2000","","","","Also known as El Salvador International Airport, this facility serves both civilian and military purposes. The U.S. presence here is primarily through the Cooperative Security Location (CSL) Comalapa, focusing on counter-narcotics operations. The airport's strategic location enables efficient deployment of surveillance aircraft to monitor transnational criminal activities. ​","https://dialogo-americas.com/articles/csl-comalapa-strong-regional-partnership-to-counter-illicit-trafficking/"],[13.5883,-88.9254,"United States","El Salvador","Miraflores","La Paz","Army","Co-base","None","","","","The United States has a Forward Operating Base (FOB) Miraflores in El Salvador, which is located in the jungles of La Paz.","https://www.dvidshub.net/news/282128/life-forward-operating-base-miraflores-la-paz-el-salvador-beyond-horizon-2018"],[13.3365,-87.8333,"United States","El Salvador","La Unión Base Naval","La Unión","Navy","Co-base","None","","","","La Unión Base Naval is the home base of the Fuerza Naval de El Salvador (FNES), the naval force of El Salvador. The US Navy use this base for unknown purpose.",""],[59.2622,24.2186,"United States","Estonia","Amari Air Base","Harjumaa","Air Force","Co-base","2014","","NATO","","Ämari Air Base is a military airbase in Harjumaa. Since April 2014, Ämari Air Base has hosted NATO Baltic Air Policing patrols. On 30 April 2014, this mission began with the arrival of four Danish F-16s. NATO Air Policing are operating from this base.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[68.6399,27.568,"United States","Finland","Border Guard Base, Ivalo","Ivalo","Army","Co-base","2024","","","","In December 2023, the US and Finland signed a defense cooperation agreement that will give the US access to 15 military bases in Finland, including the Border Guard Base in Raja-Joosepintie, Ivalo. The agreement came into effect on 1 September 2024.","https://news.usni.org/2023/12/21/new-pact-gives-u-s-military-access-to-15-bases-in-finland"],[63.0086,27.7944,"United States","Finland","Karelia Air Command Air Base","Rissala","Air Force","Co-base","2024","","","","In December 2023, the US and Finland signed a defense cooperation agreement that will give the US access to 15 military bases in Finland, including Karelia Air Command Air Base. The agreement came into effect on 1 September 2024.","https://news.usni.o -in-finland"],[66.5707,25.8297,"United States","Finland","Rovaniemi, Lapland Air Command Air Base and Jaeger Brigade Garrison","Rovaniemi","Air Force","Co-base","2024","","","","In December 2023, the US and Finland signed a defense cooperation agreement that will give the US access to 15 military bases in Finland, including Rovaniemi, Lapland Air Command Air Base and Jaeger Brigade Garrison. The agreement came into effect on 1 September 2024.","https://news.usni.org/2023/12/21/new-pact-gives-u-s-military-access-to-15-bases-in-finland"],[60.1386,22.481,"United States","Finland","Skinnarvik Military Storage Area","Skinnarvik","Army","Co-base","2024","","","","In December 2023, the US and Finland signed a defense cooperation agreement that will give the US access to 15 military bases in Finland, including Skinnarvik Military Storage Area. The agreement came into effect on 1 September 2024.","https://news.usni.org/2023/12/21/new-pact-gives-u-s-military-access-to-15-bases-in-finland"],[60.8112,23.7679,"United States","Finland","Tammela Military Storage Area","Tammela","Army","Co-base","2024","","","","In December 2023, the US and Finland signed a defense cooperation agreement that will give the US access to 15 military bases in Finland, including Tammela Military Storage Area. The agreement came into effect on 1 September 2024.","https://news.usni.org/2023/12/21/new-pact-gives-u-s-military-access-to-15-bases-in-finland"],[61.4153,23.5878,"United States","Finland","Satakunta Air Command Air Base","Tampere-Pirkkala","Air Force","Co-base","2024","","","","In December 2023, the US and Finland signed a defense cooperation agreement that will give the US access to 15 military bases in Finland, including Satakunta Air Command Air Base. The Satakunta Air Command is a Finnish Air Force unit that operates out of Tampere-Pirkkala Airport. The agreement came into effect on 1 September 2024.","https://news.usni.org/2023/12/21/new-pact-gives-u-s-military-access-to-15-bases-in-finland"],[66.1166,25.1564,"United States","Finland","Tervola Military Storage Area","Tervola","Army","Co-base","2024","","","","In December 2023, the US and Finland signed a defense cooperation agreement that will give the US access to 15 military bases in Finland, including Tervola Military Storage Area. The agreement came into effect on 1 September 2024.","https://news.usni.org/2023/12/21/new-pact-gives-u-s-military-access-to-15-bases-in-finland"],[62.3978,25.6034,"United States","Finland","Air Force Academy Air Base","Jyväskylä-Tikkakoski","Air Force","Co-base","2024","","","","In December 2023, the US and Finland signed a defense cooperation agreement that will give the US access to 15 military bases in Finland, including Air Force Academy Air Base in Jyväskylä-Tikkakoski. The agreement came into effect on 1 September 2024.","https://news.usni.org/2023/12/21/new-pact-gives-u-s-military-access-to-15-bases-in-finland"],[60.0296,24.3576,"United States","Finland","Upinniemi Navy Base and Garrison including Russarö Island","Upinniemi","Navy","Co-base","2024","","","","In December 2023, the US and Finland signed a defense cooperation agreement that will give the US access to 15 military bases in Finland, including Upinniemi Navy Base and Garrison in Kirkkonummi including Russarö Island in Hanko. The agreement came into effect on 1 September 2024.","https://news.usni.org/2023/12/21/new-pact-gives-u-s-military-access-to-15-bases-in-finland"],[65.6669,24.5184,"United States","Finland","Veitsiluoto Military Storage Area","Veitsiluoto","Army","Co-base","2024","","","","In December 2023, the US and Finland signed a defense cooperation agreement that will give the US access to 15 military bases in Finland, including Veitsiluoto Military Storage Area. On July 1, 2024, The agreement came into effect on 1 September 2024.","https://news.usni.org/2023/12/21/new-pact-gives-u-s-military-access-to-15-bases-in-finland"],[61.1132,26.9835,"United States","Finland","Vekaranjärvi Garrison and Pahkajärvi Training Area","Vekaranjärvi","Army","Training Base","2024","","","","In December 2023, the US and Finland signed a defense cooperation agreement that will give the US access to 15 military bases in Finland, including Vekaranjärvi Garrison and Pahkajärvi Training Area. The Pahkajärvi military area is part of the Vekaranjärvi Garrison and is under the control of the Karelian Brigade of the Finnish Defence Forces. The agreement came into effect on 1 September 2024.","https://news.usni.org/2023/12/21/new-pact-gives-u-s-military-access-to-15-bases-in-finland"],[0.3984,9.4766,"United States","Gabon","CSL Liberville","Liberville","Army","Co-base","2005","","","","​The United States maintains a Cooperative Security Location (CSL) in Libreville, Gabon, serving as a site for regional military cooperation and contingency operations. This CSL facilitates joint training exercises, such as generator maintenance and non-lethal weapons tactics.","https://www.marforeur.marines.mil/In-the-News/Stories/Article/Article/602139/no-limits-us-marines-gabonese-train-at-cooperative-security-location/"],[41.5824,44.9129,"United States","Georgia","Krtsanisi Training Centre"," Krtsanisi settlement","Navy","Co-base","2009","","","","The Krtsanisi Training Centre near Tbilisi has been used since the early 2000s for training programs involving the U.S. military. These programs have included instruction and joint exercises with Georgian forces under U.S.-funded initiatives like GTEP and GDP-ISAF. The site also hosts the NATO–Georgia Joint Training and Evaluation Center (JTEC), which was inaugurated in 2015. .","https://www.defensenews.com/home/2015/08/27/nato-opens-training-center-in-georgia-amid-russia-tensions/"],[41.6947,45.0467,"United States","Georgia","Vaziani base","Tbilisi","Army","Training Base","2008","","NATO","","Vaziani is a former Soviet base now under Georgian control and used for joint military exercises involving the U.S. and NATO countries. The base hosted “Immediate Response 2008,” a U.S.-Georgian exercise conducted shortly before the 2008 war with Russia. It remains a location for ongoing NATO-related training activities, including the “Noble Partner” series. These exercises involve rotating deployments of foreign troops for short-term training missions.","https://www.nationalguard.mil/News/Article/2338392/noble-partner-20-multinational-exercise-begins/"],[47.4831,11.0607,"United States","Germany","Artillery Kaserne","Garmisch","Army","Co-base","1949","","","","Artillery Kaserne in Garmisch, Germany, is a U.S. military installation integrated into the U.S. Army Garrison Bavaria. Originally built in the 1930s by Germany, it has been under U.S. use since World War II. The site hosts administrative and logistical operations supporting U.S. and allied personnel. It also provides access to nearby institutions like the Marshall Center and NATO School.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[50.0931,8.2726,"United States","Germany","Aukamm Housing Area","Wiesbaden","Army","Co-base","2019","","","","​The Aukamm Housing Area is a U.S. military residential community located in the Bierstadt district of Wiesbaden, Germany. Designated primarily for senior non-commissioned officers, officers, and their families, it is part of the U.S. Army Garrison Wiesbaden's housing infrastructure. ​","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.3974,7.5951,"United States","Germany","Bann Communications Station 1","Bann","Air Force","Operator Only","1951","","","","Bann Communications Station is a U.S. military satellite and communication facilities located near Bann, Germany. It supports secure transmission and reception of military communications, likely including satellite and signal operations. These facilities operate under the authority of U.S. Army Garrison Rheinland-Pfalz and are not publicly accessible. Their specific operational details are not fully disclosed, reflecting their strategic communication roles.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.3778,7.6028,"United States","Germany","Bann Communications Station 2","Bann","Air Force","Operator Only","1951","","","","The Bann Communications Station 2 is located in Bann, Rhineland-Palatinate, Germany, and is owned and managed by the United States Air Force.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.6514,7.3053,"United States","Germany","Baumholder Airfield","Baumholder","Army","Operator Only","1951","","NATO","","Baumholder Airfield is a small U.S. military landing zone in Germany primarily supporting helicopter operations. It is occasionally used during training rotations involving NATO and U.S. forces. No permanent U.S. aviation unit is stationed there.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.6148,7.3311,"United States","Germany","Baumholder Family Housing","Baumholder","Army","Operator Only","1951","","","","Baumholder Family Housing is military family housing for soldiers with command-sponsored dependents. The Baumholder Family Housing project includes a four-story apartment building with 12 three-bedroom apartments, and 42 three-bedroom and 10 four-bedroom townhouses. The project also includes new playgrounds and a dog park.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.6154,7.3299,"United States","Germany","Baumholder Hospital","Baumholder","Army","Operator Only","1951","","","","The Baumholder Army Health Clinic remains operational and is actively used by the U.S. military. It provides outpatient medical services to active-duty personnel, their families, and other eligible beneficiaries. While the clinic does not offer emergency care—patients requiring such services are referred to host nation hospitals—it continues to function as a key healthcare facility within the Baumholder military community. ​","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.6131,7.3296,"United States","Germany","Baumholder Quartermaster Area","Baumholder","Army","Operator Only","1951","","","","This logistics area supports supply and material storage for U.S. Army operations. It includes warehouses and operational support buildings. The site is intermittently used depending on deployment cycles and supply chain needs. It has experienced restructuring following drawdowns in U.S. presence in Germany.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.2869,10.5652,"United States","Germany","Barton Barracks","Ansbach","Army","Operator Only","1951","","","","​Barton Barracks, located in Ansbach, Germany, is part of the U.S. Army Garrison Ansbach. It serves as the headquarters for the garrison, providing administrative and support functions. The installation operates alongside other U.S. military facilities in the area, including Katterbach Kaserne and Shipton Kaserne.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[49.2903,10.5802,"United States","Germany","Bleidorn Family Housing","Ansbach","Army","Operator Only","1951","","","","Located in Ansbach, Germany, Bleidorn Family Housing accommodates U.S. military families. The area includes stairwell apartments and older housing units, some under renovation. Concerns have been raised in the past about infrastructure and maintenance. It is managed as part of U.S. Army Garrison Ansbach's housing program.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[48.7894,9.1907,"United States","Germany","Boeblingen Family Housing","Boeblingen","Army","Operator Only","1945","","","","This housing area, near Panzer Kaserne, serves U.S. military families stationed in Stuttgart. Facilities include multi-family housing units and limited outdoor space. Renovation projects have targeted heating systems and water infrastructure. The area operates under U.S. Army Garrison Stuttgart oversight.","https://www.acq.osd.mil/eie/imr/rpid/library.html"],[48.7013,9.1544,"United States","Germany","Boeblingen Training Area","Boeblingen","Army","Operator Only","1945","","","","This training area is used intermitt
