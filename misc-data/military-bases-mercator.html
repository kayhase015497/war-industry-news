king ceremony, with new infrastructure improvements to the base’s port facility planned. In 2023, Chinese warships docked for the first time at Cambodia’s Ream Naval Base.","https://amti.csis.org/a-tale-of-two-reams-questions-remain-at-cambodias-growing-naval-base/"],[25.1105,62.3396,"China","Pakistan","Gwadar port","","Navy","Co-base","2017","","","","On 18 February 2013, Pakistan awarded a contract for the construction and operation of Gwadar Port to a Chinese state-owned enterprise. As per the details of the contract, the port would remain the property of Pakistan but would be operated by the state-run Chinese firm – China Overseas Port Holding Company (COPHC)."," https://www.csis.org/analysis/pakistans-gwadar-port-new-naval-base-chinas-string-pearls-indo-pacific"],[6.1194,81.1081,"China","Sri Lanka","Hambantota port","","Navy","Co-base","2010","","","","The Hambantota International Port is a deep water port in Hambantota, Sri Lanka, which has been leased to China on a 99-year lease. Opened in 2010, it is Sri Lanka's second largest port, after Colombo.","https://thediplomat.com/2023/08/aiddata-report-warns-of-a-chinese-naval-base-in-sri-lankas-hambantota-port/"],[14.1403,93.3702,"China","Myanmar","Coco Islands","","Navy","Co-base","2017","","","","According to The Guardian, some satellite images taken in January 2023 show telltale signs of military modernization, based on a report by the think tank Chatham House. There’s a newly lengthened 2,300-metre runway and radar station, two new hangars, what appears to be an accommodation block, and a new causeway linking to a smaller island. At the tip of the island is evidence of land-clearing efforts, suggesting further construction work is to come.","https://www.theguardian.com/world/2023/may/01/military-construction-on-myanmars-great-coco-island-prompts-fears-of-chinese-involvement"],[11.3714,43.0936,"France","Djibouti","Naval base of Héron","","Navy","Operator Only","1977","","","","France has had a military presence in Djibouti since the country gained independence in 1977, and the two countries have military and economic agreements. France has a military base in Djibouti, Africa, known as the French Naval Base of Djibouti or the Naval Base of Héron. It's the largest French military base in Africa, with around 1,500 soldiers.","https://www.unav.edu/web/global-affairs/djibouti-the-tiny-valuable-nation-hosting-the-world-s-military-giants"],[0.4429,9.4269,"France","Gabon","Camp de Gaulle","","Army","Training Base","1975","","","","The former Camp de Gaulle in Libreville has been transformed into a shared military training academy, co-managed by France and Gabon. The site now hosts instructors and training facilities, including Gabon’s new Defence Forces Administration School.","https://www.terradaily.com/reports/In_Gabon_French_army_base_shifts_focus_as_one_of_last_in_Africa_999.html?"],[32.5389,38.1958,"France","Jordan","H-4 Air Base (Ruwaished Base)","","Air Force","Co-base","2014","","","","This base remained secret until it was announced in 2023 when French President Macron visited the base. The French wing at the base includes a squadron of 6 Mirage 2000 aircraft, 8 advanced Rafale aircraft, and a command and control centre. The airport also includes an American department that manages the operation of unmanned reconnaissance aircraft in the skies of Jordan, Syria and Iraq.","https://www.misbar.com/en/editorial/2023/12/24/is-there-a-french-military-base-in-jordan-for-safeguarding-israel"],[32.1608,37.1497,"France","Jordan","Prince Hassan Air Base","","Air Force","Co-base","2014","","","","France uses Prince Hassan Air Base as part of the Opération Chammal.","https://www.aerotime.aero/articles/french-rafale-fighters-neutralize-iranian-drones"],[24.24,54.5483,"France","United Arab Emirates","Al Dhafra air base","","Air Force","Co-base","2008","","","","On 1 September 2008, the French Air Force opened its own military settlement in the northwest corner of the base, operating Dassault Mirage 2000-5Fs. The French also deployed Breguet Atlantique II maritime patrol aircraft as part of Opération Chammal.","https://www.spf.org/iina/en/articles/takahashi_06.html"],[24.5252,54.3959,"France","United Arab Emirates","Mina Zayed port naval base (Camp de la Paix)","","Navy","Co-base","2009","","","","Camp de la Paix constitutes an air force base, an army training camp and a naval base. The military installation is called Implantation Militaire Française aux Émirats Arabes Unis or IMFEAU. The base is located in the Strait of Hormuz. The French base includes a naval camp at Mina Zayed Port, an air force camp at Al Dhafra Air Base and an army training camp about 50km from Abu Dhabi.","https://www.spf.org/iina/en/articles/takahashi_06.html"],[24.5242,54.8629,"France","United Arab Emirates","Zayed Military City","","Army","Co-base","2009","","","","This base includes a training centre, equipment, and facilities for training soldiers in the desert and urban operations.","https://www.spf.org/iina/en/articles/takahashi_06.html"],[27.3599,89.3017,"India","Bhutan","Indian Military Training Team","","Army","Training Base","1961","","","","The Indian Military Training Team more commonly referred to as the IMTRAT, is based in Haa Dzong in Western Bhutan. This military base outside India is an Indian army base serving as a training facility in Bhutan. It is responsible for training the Royal Bodyguard of Bhutan Troops (RBG) and Royal Bhutan Army (RBA).","https://zeenews.india.com/photos/india/indias-secret-global-outposts-the-unexpected-countries-hosting-indian-military-bases-2776661/tajikistan-2776666"],[27.4738,89.6128,"India","Bhutan","Thimphu","","Army","Co-base","None","","","","The Indian Army also maintains a detachment in the capital city of Thimphu.","https://factodata.com/where-does-india-have-military-bases-abroad/#:~:text=India%20has%20two%20base%20in,has%20its%20station%20in%20Bhutan."],[38.5142,68.6755,"India","Tajikistan","Hisar Air Base","","Air Force","Co-base","2002","","","","Ayni Air Force Base, also known as Gissar Air Base, is a military air base in Tajikistan. The base is jointly operated by the Indian Air Force and the Tajik Air Force. It is also India’s first overseas air base. Since 2014 India has deployed Su-30MKI in limited numbers at this base.","https://zeenews.india.com/photos/india/indias-secret-global-outposts-the-unexpected-countries-hosting-indian-military-bases-2776661/tajikistan-2776666"],[37.4701,69.3809,"India","Tajikistan","Farkhor Air Base","","Air Force","Co-base","2007","","","","Farkhor Air Base is in Tajikistan. It is run jointly by the Indian Air Force and the Tajik Air Force. It is India’s first foreign military facility.","https://theprint.in/defence/gissar-military-aerodrome-indias-first-overseas-base-that-came-to-the-rescue-in-afghan-crisis/720356/"],[-10.3448,56.5918,"India","Mauritius","Agalega Airstrip (FIMA)","","Navy","Co-base","2015","","","","India is collaborating with Mauritius to establish a military base on North Agalega Island. This island has been leased to the Indian military for deploying a coastal surveillance radar system. India has been funding the construction of a 3000 m long airfield with associated facilities to house troops on Agaléga Island.","https://zeenews.india.com/photos/india/indias-secret-global-outposts-the-unexpected-countries-hosting-indian-military-bases-2776661/tajikistan-2776666"],[22.5171,59.7483,"India","Oman","Coastal Surveillance Radar (CSR) station","","Navy","Operator Only","2018","","","","India has a listening station in Ras al Hadd in Oman. The CSR station installed by India in Oman represents an expansion of India’s extraterritorial surveillance apparatus into the Arabian Sea. Such facilities effectively impose foreign monitoring over regional maritime spaces, subordinating local autonomy to the strategic interests of a distant power. These stations institutionalize external military influence and normalize surveillance of sovereign waterways.","https://zeenews.india.com/photos/india/indias-secret-global-outposts-the-unexpected-countries-hosting-indian-military-bases-2776661/tajikistan-2776666"],[19.6709,57.7264,"India","Oman","Duqm Naval base","","Navy","Co-base","2018","","","","Duqm, the central-eastern port town of Oman on the Arabian Sea, India has an Indian Air Force base and an Indian Naval base. India’s access to Duqm Port is a troubling example of how foreign military powers carve out enclaves in weaker states under the rhetoric of “logistics.” By embedding a naval presence at Duqm, India entrenches itself in Oman’s territory and contributes to the creeping militarization of the Indian Ocean. This dynamic serves to displace regional priorities and aligns Omani infrastructure with Indian power projection at the expense of neutrality.","https://zeenews.india.com/photos/india/indias-secret-global-outposts-the-unexpected-countries-hosting-indian-military-bases-2776661/tajikistan-2776667"],[23.611,58.2963,"India","Oman","Muscat Naval Base","","Navy","Co-base","2018","","","","India has berthing privileges at the Muscat naval base. This means that the Indian Navy vessels can enter and leave the base at all times and access the facilities at the Muscat naval base. India’s use of Muscat’s naval facilities illustrates the persistence of neo-imperial military arrangements in the Gulf. These agreements, negotiated without meaningful public consultation, undermine sovereignty by allowing a foreign navy to use local infrastructure on a permanent basis. Such practices reflect a broader pattern of militarized dependencies that exacerbate insecurity instead of reducing it.","https://factodata.com/where-does-india-have-military-bases-abroad/#:~:text=India%20has%20two%20base%20in,has%20its%20station%20in%20Bhutan."],[19.6472,57.643,"India","Oman","Duqm Air Base","","Air Force","Co-base","2018","","","","Duqm is the central-eastern port town of Oman on the Arabian Sea. India has an Air Force base and a Naval base. The inclusion of Duqm Air Base into India’s operational orbit epitomizes how military aviation facilities are co-opted to extend external power. This arrangement prioritizes India’s geostrategic calculus over the aspirations of demilitarization and peaceful use of land and airspace in Oman. It also reinforces the trend of turning civilian infrastructure into dual-use, foreign-controlled assets under the guise of “cooperation”.","https://factodata.com/where-does-india-have-military-bases-abroad/#:~:text=India%20has%20two%20base%20in,has%20its%20station%20in%20Bhutan."],[1.318,104.0163,"India","Singapore","Changi Naval Base","","Navy","Operator Only","2017","","","","Singapore signed a naval cooperation agreement with both China and India on the 29th of November 2017, to counter the Chinese expansionism strategy in the Strait of Malacca. This naval cooperation agreement has helped India establish its military presence on the Chinese trade route. Singapore’s Changi Naval Base serves as an Indian Naval base outside India.","https://zeenews.india.com/photos/india/indias-secret-global-outposts-the-unexpected-countries-hosting-indian-military-bases-2776661/tajikistan-2776668"],[-14.1737,48.4744,"India","Madagascar","Coastal Surveillance Radar (CSR) station","","Navy","Operator Only","2007","","","","This Indian military base was established in 2007 in northern Madagascar to detect and monitor shipping movements and intercept marine communications in the Indian Ocean. This was India’s first foreign listening post. This military base has also helped the Madagascar Navy to survey the country’s coastal area.","https://factodata.com/where-does-india-have-military-bases-abroad/#:~:text=India%20has%20two%20base%20in,has%20its%20station%20in%20Bhutan."],[25.2961,60.6127,"India","Iran","Chabahar Port","","Navy","Co-base","2016","","","","Chabahar Port in south-eastern Iran is Iran’s one and only oceanic port located on the Gulf of Oman. In December 2018, India took over the operations of the Chabahar Port. In May 2016, India and Iran signed a bilateral agreement in which India would refurbish one of the berths at Shahid Beheshti port, and reconstruct a 600-meter-long container handling facility at the port.","https://legalresearchandanalysis.com/indian-military-bases-outside-of-india/"],[-9.6976,46.5184,"India","Seychelles","Coastal Surveillance Radar (CSR) station","","Navy","Operator Only","None","","","","India operates and maintains a coastal surveillance radar system in the archipelagic country of Seychelles. Recently, India signed a defence agreement with Seychelles for the construction of an Indian naval base on Assumption Island. The main purpose of this Indian naval base outside India is to counter the String of Pearls strategy by China.","https://factodata.com/where-does-india-have-military-bases-abroad/#:~:text=India%20has%20two%20base%20in,has%20its%20station%20in%20Bhutan."],[28.5858,81.6358,"India","Nepal","Surkhet Air Base","","Air Force","Co-base","None","","","","In Surkhet, the Indian Air Force maintains an airstrip. Surkhet air base is located near the tri-junction of Kalapani, where the boundaries of China, India, and Nepal intersect. It has strategic importance for India.","https://factodata.com/where-does-india-have-military-bases-abroad/#:~:text=India%20has%20two%20base%20in,has%20its%20station%20in%20Bhutan."],[6.1206,81.1072,"India","Sri Lanka","Hambantota Air Force base","","Air Force","Co-base","2018","","","","India acquired a Sri Lankan Air Force base in Hambantota in 2018 to surveil and monitor the Chinese Navy. This Air Force Base outside India could be converted into a fully operational Indian Air Force base in Sri Lanka and be used to counter any potential Chinese threats.","https://www.sriramsias.com/upsc-daily-current-affairs/indian-military-bases-around-the-world-a-strategic-overview/"],[9.7831,80.2491,"India","Sri Lanka","Coastal Surveillance Radar (CSR) station","","Navy","Operator Only","2015","","","","A few Indian Doppler Radars systems have been exported to Sri Lanka and have been used to detect planes of the LTTE's air wing.","https://resonantnews.com/2022/12/14/5573/"],[8.2686,73.0455,"India","Maldives","INS Jatayu","","Navy","Operator Only","2024","","","","INS Jatayu is a naval base commissioned by the Indian Navy on March 6, 2024, on Minicoy Island, Lakshadweep. It is the second base in Lakshadweep, after INS Dweeprakshak in Kavaratti.","https://www.reuters.com/world/asia-pacific/india-opens-new-naval-base-near-maldives-amid-tense-ties-with-eye-beijing-2024-03-06/"],[-0.5928,73.203,"India","Maldives","Coastal Surveillance Radar","","Navy","Co-base","None","","","","India has setup radars on all 26 atolls of Maldives and networked with Indian Coastal Radar System. Indian Coast Guard regularly conducts sorties and Patrols in Maldivian Waters to keep its security intact.","https://www.hindustantimes.com/india-news/india-hands-over-coastal-radar-system-to-maldives-101648399727073.html"],[4.2268,73.3858,"India","Maldives","Uthuru Thila Falhu Naval Base","","Navy","Co-base","2021","","","","In 2021, India signed an agreement with the Maldives to “develop, support and maintain” a harbour at Uthuru Thila Falhu naval base in the island nation.","https://www.deccanherald.com/india/delhi-plays-host-to-muizzu-but-indias-role-in-building-harbour-in-naval-base-in-maldives-goes-under-probe-3061185"],[12.1126,-68.9207,"Netherlands","Curaçao","Parera Naval Base","","Navy","Operator Only","1944","","","","Parera Naval Base, located in Willemstad, Curaçao, serves as the headquarters of the Royal Netherlands Navy in the Caribbean.","https://english.defensie.nl/organisation/navy/navy-units/dutch-naval-command-caribbean"],[12.1505,-68.9162,"Netherlands","Curaçao","Suffisant Naval Base","","Navy","Operator Only","1929","","","","Suffisant Naval Base is a smaller facility used primarily for training purposes and accommodating military personnel.","https://english.defensie.nl/organisation/navy/navy-units/dutch-naval-command-caribbean"],[12.4439,-69.9363,"Netherlands","Aruba","Savaneta Marine Barracks","","Marine Corps","Operator Only","1951","","","","The Savaneta Marine Barracks on Aruba accommodates 32 Infantry Company of the Marine Corps. The Marines regularly train on the island and in other areas nearby.","https://english.defensie.nl/organisation/navy/navy-units/dutch-naval-command-caribbean"],[18.0115,-63.0428,"Netherlands","Sint Maarten","Pointe Blanche Naval Support Point","","Navy","Operator Only","2014","","","","Pointe Blanche Naval Support Point is a base of the Royal Netherlands Navy that is located on Sint Maarten. Since 2014, a detachment of the Netherlands Marine Corps has been permanently stationed at the base.","https://www.curacaochronicle.com/post/main/navys-highest-chief-visits-the-caribbean/"],[11.5531,43.1442,"Japan","Djibouti","Japan Self-Defense Force Base, Djibouti","","Army","Operator Only","2011","","","","The Japan Self-Defense Force Base Djibouti (JSDF Base Djibouti) is a military base in Ambouli, Djibouti, operated by the Japan Self-Defense Forces (JSDF). It's the JSDF's first full-scale, long-term overseas base, established in 2011.","https://thediplomat.com/2023/04/why-does-japan-have-a-military-base-in-djibouti/#:~:text=Japan%2C%20one%20of%20the%20many,evacuate%20diplomatic%20personnel%20and%20natives."],[33.2812,35.8181,"Israel","Syria","West of Hadar village","","Army","Operator Only","2025","","","","Israel constructed a military base west of Hadar village, situated within the demilitarised buffer zone, marking a clear breach of the 1974 ceasefire agreement. This base exemplifies Israel’s illegal military encroachment into Syrian sovereign territory, reinforcing its occupation through infrastructure and checkpoints. Such actions undermine international law and provoke local discontent among displaced Syrian residents.","https://www.aljazeera.com/news/2025/2/3/satellite-images-show-israel-building-military-bases-in-syria-buffer-zone"],[33.2206,35.8281,"Israel","Syria","West of Jabata al-Khashab","","Army","Operator Only","2025","","","","A second base was erected west of Jabata al-Khashab, strategically positioned to control road networks and monitor Syrian movements. The establishment of this base underscores Israel’s systematic violation of the demilitarised zone’s neutrality, consolidating its illegal presence under the guise of security operations. The move has drawn criticism for intensifying Israel’s occupation in the Golan region.","https://www.aljazeera.com/news/2025/2/3/satellite-images-show-israel-building-military-bases-in-syria-buffer-zone"],[33.1631,35.8471,"Israel","Syria","North of al-Hamidyah","","Army","Operator Only","2025","","","","Israel’s base north of al-Hamidyah expands its unlawful military footprint deeper into Syrian territory, defying both the ceasefire arrangement and Syrian sovereignty. By fortifying positions in this area, Israel entrenches its illegal occupation and exacerbates the militarisation of civilian zones. This base serves as yet another instance of Israel’s disregard for international agreements.","https://www.aljazeera.com/news/2025/2/3/satellite-images-show-israel-building-military-bases-in-syria-buffer-zone"],[33.1356,35.8296,"Israel","Syria","Quneitra village","","Army","Operator Only","2025","","","","In Quneitra village itself, Israel has built a military base amid widespread reports of house raids, arbitrary arrests, and road closures against the local Syrian population. This base entrenches the ongoing Israeli occupation of Quneitra, a city already devastated by decades of conflict and displacement. Such unilateral actions reflect a sustained policy of land appropriation in contravention of UN resolutions.","https://www.aljazeera.com/news/2025/2/3/satellite-images-show-israel-building-military-bases-in-syria-buffer-zone"],[33.2198,35.8343,"Israel","Syria","South of Lake Aziz- Site 1","","Army","Operator Only","2025","","","","Two separate military installations were built south of Lake Aziz, a sensitive area within the occupied Golan Heights. These twin bases exemplify Israel’s expansionist aims, using military presence to solidify its de facto control over additional Syrian land. Their construction violates both the demilitarised zone’s status and the broader principle of territorial integrity.","https://www.aljazeera.com/news/2025/2/3/satellite-images-show-israel-building-military-bases-in-syria-buffer-zone"],[33.2185,35.835,"Israel","Syria","South of Lake Aziz- Site 2","","Army","Operator Only","2025","","","","Two separate military installations were built south of Lake Aziz, a sensitive area within the occupied Golan Heights. These twin bases exemplify Israel’s expansionist aims, using military presence to solidify its de facto control over additional Syrian land. Their construction violates both the demilitarised zone’s status and the broader principle of territorial integrity.","https://www.aljazeera.com/news/2025/2/3/satellite-images-show-israel-building-military-bases-in-syria-buffer-zone"],[32.9977,35.8807,"Israel","Syria","Above Tal al-Ahmar","","Army","Operator Only","2025","","","","On the strategic high ground above Tal al-Ahmar, Israel established another military base, bolstering its illegal hold over key elevations in Syrian territory. This position offers a tactical advantage while further embedding the occupation within the buffer zone. It highlights Israel’s continued annexationist policies despite international condemnation.","https://www.aljazeera.com/news/2025/2/3/satellite-images-show-israel-building-military-bases-in-syria-buffer-zone"],[33.2693,35.7727,"Israel","Syria","Majdal Shams area","","Army","Operator Only","2025","","","","The BBC previously filmed Israeli military forces positioned at the Alpha Line near the town of Majdal Shams (within the Israeli-occupied Golan Heights), approximately 5.5 km from the newly identified construction site.","https://www.bbc.com/news/articles/cvgmn3jmm1yo"],[33.258,35.8283,"Israel","Syria","Unnamed Site","","Army","Operator Only","2025","","","","Satellite images (taken 21 January) show a newly cleared area with new structures, trucks, prefabricated guard posts, and heavy equipment, connected by a newly built 1 km track to an existing road leading into occupied Palestinian territory. This suggests a planned long-term Israeli military presence.","https://www.bbc.com/news/articles/cvgmn3jmm1yo"],[33.4447,36.067,"Israel","Syria","Qatana","","Army","Operator Only","2025","","","","Israel built a dedicated helicopter airfield in Qatana, about 30 km north of Damascus, in northern Quneitra countryside. This facility enhances logistical reach and rapid response capability into central Syria. It represents a direct military threat to Damascus itself.","https://www.eremnews.com/news/arab-world/b90tky2"],[33.3083,35.7724,"Israel","Syria","Mt Hermon","","Army","Operator Only","2025","","","","In March, Israel converted the former Syrian Division 24 headquarters atop Mount Hermon into a permanent base. The site provides fire control and surveillance over southern Syria and northern Lebanon. This constitutes a serious violation of Syrian sovereignty.","https://www.eremnews.com/news/arab-world/b90tky2"],[32.7657,35.7918,"Israel","Syria","Ma'ariya","","Army","Operator Only","2025","","","","Israel took over the former Syrian army’s Jazira barracks in Maariah, turning it into a large base. This move consolidates the Israeli military's presence deeper into southern Syria. It underscores Israel’s strategy of permanent occupation beyond the Golan.","https://www.eremnews.com/news/arab-world/b90tky3"],[33.1992,35.7514,"Israel","Syria","Tal al-Ahmar","","Army","Operator Only","2025","","","","A newly built Israeli military base north of Hadar, adjacent to the earlier Tel Ahmar al-Gharbi site. It strengthens logistical control over the surrounding countryside and secures access routes. This base is part of Israel’s systematic expansion into Syrian territory.","https://www.eremnews.com/news/arab-world/b90tky4"],[33.2826,35.8178,"Israel","Syria","Qers al-Nafl","","Army","Operator Only","2025","","","","Israel converted an old Syrian army post on Qers al-Nafl hill into a fortified observation base. The hill offers a strategic vantage point over supply routes, reinforcing Israel’s grip on the area. This reflects the ongoing entrenchment of Israeli occupation in southern Syria.","https://www.eremnews.com/news/arab-world/b90tky5"],[13.4885,2.1842,"Italy","Niger","Military Support Base in Niamey","","Air Force","Co-base","2018","","","","Italy maintains an advanced inter-service military support base at Niamey International Airport, officially the “Base militare italiana di supporto Niamey. This base includes personnel from the Italian Army, Air Force, and Carabinieri, numbering around 350 troops .","https://www.reuters.com/world/italy-cuts-troops-niger-free-up-military-base-space-civilians-2023-08-06/"],[11.5288,43.1485,"Italy","Djibouti","Militare Nazionale di Supporto, \"Amedeo Guillet\"","","Army","Co-base","2014","","","","The Italian military support base \"Amedeo Guillet\" is a joint advanced operational base of the Italian armed forces abroad, located in Djibouti, 17 km from the border with Somalia.","https://worldbeyondwar.org/djibouti/"],[28.3718,36.639,"Pakistan","Saudi Arabia","Tabuk","","Air Force","Co-base","2018","","","","Pakistan does not maintain overseas military bases in Saudi Arabia; instead, its military personnel are deployed in a training and advisory role, primarily at Tabuk, under a 1982 agreement.","https://www.dw.com/en/examining-saudi-pakistani-ties-in-changing-geopolitics/a-19512946"],[12.5604,43.2285,"Saudi Arabia","Djibouti","A base in Bab-el-Mandeb","","Navy","Operator Only","2016","","","","Since 2015, Saudi Arabia has leased military facilities in Djibouti and signed a 2016 security agreement to establish a base. However, critics argue that this effort risks turning Djibouti into a geopolitical pawn amid Gulf competition, rather than bolstering regional stability.","https://africa.cgtn.com/saudi-arabia-is-latest-nation-to-build-military-base-in-djibouti/"],[12.6282,53.9095,"Saudi Arabia","Yemen","Socotra","","Air Force","Operator Only","2022","","","","Saudi Arabia has established a military base in the city of Hadibu in 2022, the capital of the archipelago. The Saudi occupation forces “808” moved from the General Authority for Environmental Protection building, which it used to take as its headquarters, to the new military base it established near Hadiboh Airport.","https://hodhodyemennews.net/en_US/2023/02/25/saudi-occupation-force-constructs-military-base-on-socotra-island-archipelago/"],[-34.6028,20.3028,"Singapore","South Africa","Denel Overberg Test Range","","Army","Co-base","None","","","","","https://www.rsaf.gov.sg/careers/overseas-opportunities"],[-31.6678,116.015,"Singapore","Australia","RAAF Base Pearce","","Air Force","Co-base","1993","","","","RAAF Base Pearce is the main Royal Australian Air Force (RAAF) military air base in Western Australia. It is used for training by the RAAF and the Republic of Singapore Air Force. Since 1993, Republic of Singapore Air Force (RSAF) has operated its Flying Training Institute at Pearce. As part of the institute, No. 130 Squadron RSAF operates training aircraft at Pearce.",""],[-27.4114,151.7353,"Singapore","Australia","Oakey Army Aviation Centre (training base)","","Air Force","Training Base","2018","","","","Oakey Army Aviation Centre provides a training establishment for Australian Army Aviation, and also hosts the Republic of Singapore Air Force's \"Cougar\" 126 Squadron.",""],[4.9467,114.9705,"Singapore","Brunei","Jalan Aman Camp","","Air Force","Training Base","1998","","","","Singapore maintains a training establishment in Brunei, known as the Jalan Aman Camp and operates support helicopters mainly to transport the soldiers to Lakiun Camp in Temburong District for jungle training.",""],[4.732,115.1405,"Singapore","Brunei","Lakiun Camp","","Air Force","Training Base","1977","","","","Lakiun Camp is another Singapore military establishment in Brunei This provides jungle training for the Singapore Armed Forces (SAF) in the interior of Temburong.",""],[44.5322,-1.1286,"Singapore","France","Cazaux Air Base","","Air Force","Training Base","1998","","","","Since 1998, the base has hosted the No. 150 Squadron of the Republic of Singapore Air Force, equipped with ST Aerospace A-4SU Super Skyhawks, and since 15 November 2012, with Alenia Aermacchi M-346 Masters to train pilots before assigning Singaporeans to operational F-16C/D Fighting Falcons and F-15SG Strike Eagle units.",""],[-40.2061,175.3878,"Singapore","New Zealand","RNZAF Base Ohakea","","Air Force","Training Base","2017","","","","This is a military base in New Zealand that has sometimes been used by Singapore since 2017.",""],[22.005,120.7449,"Singapore","Taiwan","Joint Operations Training Base Command, Hengchun","","Air Force","Training Base","1975","","","","Singapore has operated three military training camps in Taiwan since 1975, including a camp in Hengchun Township. The Joint Operations Training Base Command covers more than 2,000 hectares and encompasses Pingtung’s four southernmost townships—Hengchun, Checheng, Mudan, and Manzhou. It has been used as a firing range and for military field combat training.",""],[23.715,120.5372,"Singapore","Taiwan","Douliu Artillery Base","","Air Force","Training Base","1975","","","","Singapore has operated three military training camps in Taiwan since 1975, including a camp in Douliu Township. Singapore used to send more than 15,000 servicemen a year for military training at an armoured car base in Hukou in northern Taiwan, an artillery base at Douliu in central Taiwan, and a combined forces base in Hengchun in the south.",""],[24.872,121.0138,"Singapore","Taiwan","Hukou Armored Force Base","","Air Force","Training Base","1975","","","","Singapore has operated three military training camps in Taiwan since 1975, including a camp in Hukou Township in Hsinchu County. Singapore used to send more than 15,000 servicemen a year for military training at an armoured car base in Hukou in northern Taiwan, an artillery base at Douliu in central Taiwan, and a combined forces base in Hengchun in the south.",""],[14.0022,99.2415,"Singapore","Thailand","Sai Yok Camp","","Air Force","Training Base","1994","","","","The Singaporean soldiers have been training for more than 30 years in this camp.",""],[40.7792,43.833,"Russia","Armenia","Russian border guard unit in Gyumri","","Army","Operator Only","1992","","","","Gyumri, located near the Turkish border in northwestern Armenia, hosts an FSB detachment that plays a role in monitoring this key border area. On 9 May 2024, Russian Presidential spokesman Dmitry Peskov announced that Russian border guards would continue to serve on Armenia's borders with Iran and Turkiye at the request of the Armenian side.","https://evnreport.com/politics/russia-s-increasing-military-presence-in-armenia/"],[40.2043,44.5255,"Russia","Armenia","Administration of the FSB Border Guards in Armenia","","Army","Operator Only","1992","","","","The administration of the FSB border guards in Armenia is located in Yerevan.","https://evnreport.com/politics/russia-s-increasing-military-presence-in-armenia/"],[40.1463,44.038,"Russia","Armenia","Russian border guard unit in Armavir","","Army","Operator Only","1992","","","","In Armavir, the FSB operates to oversee the western border of Armenia, particularly the sections adjoining Turkiye. On 9 May 2024, Russian Presidential spokesman Dmitry Peskov announced that Russian border guards would continue to serve on Armenia's borders with Iran and Turkiye at the request of the Armenian side.","https://evnreport.com/politics/russia-s-increasing-military-presence-in-armenia/"],[39.955,44.5516,"Russia","Armenia","Russian border guard unit in Artashat","","Army","Operator Only","1992","","","","The FSB detachment in Artashat is strategically positioned to manage security along the southwestern borders of Armenia, close to both Turkiye and Azerbaijan. On 9 May 2024, Russian Presidential spokesman Dmitry Peskov announced that Russian border guards would continue to serve on Armenia's borders with Iran and Turkiye at the request of the Armenian side.","https://evnreport.com/politics/russia-s-increasing-military-presence-in-armenia/"],[39.7668,44.916,"Russia","Armenia","Russian border guard outpost in Paruyr Sevak","","Army","Operator Only","2020","","","","Established near the Azerbaijan-Nakhichevan corridor post-2020, this outpost was confirmed by TASS in November 2021, alongside the one at Yeraskh. It remains active, though Armenia’s recent demarcation efforts have prompted some moderation in its functions.","https://evnreport.com/politics/russia-s-increasing-military-presence-in-armenia/"],[39.741,44.8279,"Russia","Armenia","Russian border guard outpost in Yeraskh","","Army","Operator Only","2020","","","","Located on the Armenia–Nakhichevan border, this post was deployed in late 2020–2021 and confirmed alongside Paruyr Sevak by TASS. It is also currently active, tasked with monitoring this sensitive enclave.","https://evnreport.com/politics/russia-s-increasing-military-presence-in-armenia/"],[39.5748,46.4846,"Russia","Armenia","Russian field camp near Tegh","","Army","Operator Only","2020","","","","In the latter phase of the 2020 Artsakh War, Russia established its military presence near the village of Tegh in the border areas with Azerbaijan. On 9 May 2024, Russian Presidential spokesman Dmitry Peskov announced that Russian border guards would continue to serve on Armenia's borders with Iran and Turkiye at the request of the Armenian side.","https://evnreport.com/politics/russia-s-increasing-military-presence-in-armenia/"],[39.4428,46.3952,"Russia","Armenia","Unknown Russian outpost","","Army","Operator Only","2021","","","","","https://evnreport.com/politics/russia-s-increasing-military-presence-in-armenia/"],[39.4297,46.3841,"Russia","Armenia","Russian border guard outpost near Vorotan","","Army","Operator Only","2021","","","","In December 2021, Melikset Poghosyan, the regional governor of Syunik, stated that Russian border guards, along with Armenian ones, are deployed at the villages of Vorotan and Shurnukh.","https://evnreport.com/politics/russia-s-increasing-military-presence-in-armenia/"],[39.2017,46.4478,"Russia","Armenia","Russian field camp near Kapan Airport","","Army","Operator Only","2021","","","","In Kapan, Syunik’s regional capital, Russian border guards have been stationed since 2021 near the newly built airport. The airport is located immediately next to the newly formed border with Azerbaijan, which runs through the Voghji River.","https://evnreport.com/politics/russia-s-increasing-military-presence-in-armenia/"],[38.8918,46.2523,"Russia","Armenia","Russian border guard unit in Meghri","","Army","Operator Only","1992","","","","Meghri, located at Armenia’s southern tip near the Iranian border, is home to an FSB detachment responsible for securing the Armenian-Iranian border. On 9 May 2024, Russian Presidential spokesman Dmitry Peskov announced that Russian border guards would continue to serve on Armenia's borders with Iran and Turkiye at the request of the Armenian side.","https://evnreport.com/politics/russia-s-increasing-military-presence-in-armenia/"],[35.4117,35.945,"Russia","Syria","Khmeimim/ Hmeymim Air Base","","Air Force","Operator Only","2015","","","","This facility is Russia’s largest military installation in the country, spanning an area of 1.6 million square meters. It features an airstrip measuring approximately 2,800 square meters and is home to around 35 fighter jets, 80 drones, reconnaissance aircraft, attack helicopters, and an S-400 missile system.","https://www.mei.edu/publications/russias-military-presence-post-assad-syria-growing-security-liability-undermining"],[34.9151,35.8736,"Russia","Syria","Tartous Naval Base","","Navy","Operator Only","2015","","","","Tartous Naval Base on the Mediterranean coast is Russia’s only permanent naval facility outside its territory. It supports warships, submarines, and provides logistics, repairs, and resupply for the Russian Navy. This base secures Russia’s maritime access and influence in the Eastern Mediterranean.","https://www.mei.edu/publications/russias-military-presence-post-assad-syria-growing-security-liability-undermining"],[37.0206,41.1914,"Russia","Syria","Qamishli Airport Base","","Air Force","Operator Only","2015","","","","Qamishli Airport in northeastern Syria functions as Russia’s forward outpost in the Kurdish-controlled region. It houses troops, air-defence systems, and electronic warfare units. It hosts more than 100 Russian military personnel, including experts, intelligence officers, and advisors, as well as listening stations.","https://www.mei.edu/publications/russias-military-presence-post-assad-syria-growing-security-liability-undermining"],[46.3833,72.8667,"Russia","Kazakhstan","Sary Shagan range","","Army","Operator Only","1958","","","","Sary Shagan is an anti-ballistic missile testing range located in Kazakhstan. The first missile launched from the facility was a V-1000 on 16 October 1958, but the facilities for full-scale testing were not ready until 1961. Sary Shagan remains in use to this day, with the latest known launch on 2 December 2022. The town of Sary Shagan was a closed city until 2005. The administrative center, Priozersk remained a closed city.","https://defence24.com/geopolitics/russian-overseas-military-bases"],[45.965,63.305,"Russia","Kazakhstan","Baikonur Cosmodrome","","Army","Operator Only","1955","","","","The Baikonur Cosmodrome is a spaceport in an area of southern Kazakhstan leased to Russia. The Cosmodrome is the world's first spaceport for orbital and human launches and the largest (in area) operational space launch facility. All crewed Russian spaceflights are launched from Baikonur.","https://defence24.com/geopolitics/russian-overseas-military-bases"],[42.8531,74.8464,"Russia","Kyrgyzstan","Kant Air Base","","Air Force","Co-base","2003","","","","Kant Air Base is a military air base in the Ysyk-Ata District of the Chüy Region in Kyrgyzstan. It is located just south of Kant, around 20 km east of Bishkek, and is home to the Russian Air Force's 999th Air Base.","https://defence24.com/geopolitics/russian-overseas-military-bases"],[42.5766,78.1628,"Russia","Kyrgyzstan","The 954th Anti-Submarine Weapons Test Base","","Navy","Training Base","1955","","","","Currently, this military base operates on the basis of bilateral agreements of the Kyrgyz Republic with the Russian Federation. The Russians stationed at the base use the water of the nearby lake for exercises with the use of sea mines, self-propelled underwater warheads, depth bombs and underwater vehicles.","https://defence24.com/geopolitics/russian-overseas-military-bases"],[38.5017,68.7311,"Russia","Tajikistan","Russian 201st Military Base","","Army","Operator Only","1941","","","","The Russian 201st Military Base is a Russian military base based in Dushanbe, Tajikistan, part of the Central Military District. It was originally raised twice in World War II as part of the Soviet Union's Red Army and is now part of the Russian Ground Forces.","https://defence24.com/geopolitics/russian-overseas-military-bases"],[38.28,69.2245,"Russia","Tajikistan","Okno (\"Window\")","","Air Force","Operator Only","None","","","","Okno is a Russian space surveillance station located in Nurak in Tajikistan. It is run by the Russian Aerospace Defence Forces and is part of the Centre for Outer Space Monitoring. The facility consists of a number of telescopes in domes and is similar to the US GEODSS system. It is designed for the detection and analysis of space objects such as satellites.","https://defence24.com/geopolitics/russian-overseas-military-bases"],[47.7621,29.205,"Russia","Moldova","Cobasna Ammunition Depot","","Army","Operator Only","1941","","","","The Cobasna ammunition depot is a large ammunition depot located in the village of Cobasna. Legally and internationally recognized as part of Moldova as a whole, the unrecognized breakaway state of Transnistria controls the village and the ammunition depot and has denied access to international observers, an exception being the Russian military forces located in the region ever since the end of the Transnistria War in 1992. The Russian and Transnistrian authorities have detailed information regarding the amount and situation of the stored weapons. The ammunition depot was created in the 1940s, when Transnistria was under the former Soviet Union (USSR). At the time, it held important strategic value.","https://www.moldova.org/en/the-russian-ammunition-depot-from-cobasna-discussed-against-the-backdrop-of-the-beirut-explosion/"],[19.6812,37.2517,"Russia","Sudan","Port Sudan","","Navy","Operator Only","2023","","","","Russian Foreign Minister Sergei Lavrov recently met with Sudan’s army chief Abdel Fattah al-Burhan in Khartoum on February 9, 2023, and authorized the creation of a Russian Red Sea Fleet Base in Port Sudan.","https://english.alarabiya.net/News/middle-east/2023/02/11/Sudan-s-ruling-military-finishes-review-of-Russian-Red-Sea-navy-base-deal"],[42.7069,41.4657,"Russia","Abkhazia","Ochamchire Naval Base","","Navy","Operator Only","2024","","","","In October 2023, Abkhazian authorities announced that they had signed an agreement with Russia to establish a technical support facility—not a full-scale naval base—at Ochamchire port in Abkhazia. The site lies approximately 40 km from Georgia’s administrative boundary (Abkhazia–Georgia line). As of mid‑2024, satellite imagery shows active construction, including new foundations, perimeter fencing, dredging, and the arrival of a tugboat—targeting completion by 2025 as a Russian Navy support hub for the Black Sea Fleet.","https://www.bbc.com/news/world-europe-67017375"],[42.189,43.939,"Russia","Georgia","4th Guards Military Base","","Army","Operator Only","2009","","","","The 4th Guards Military Base is a sizable overseas military base of the Russian Armed Forces stationed in the disputed territory of South Ossetia. Russia considers South Ossetia to be an independent state and justifies its military deployment in the area by an intergovernmental agreement, while Georgia considers the entity as its territory occupied by Russia.","https://jamestown.org/program/russia-redeploys-troops-from-its-bases-in-georgia-to-ukraine/"],[43.104,40.579,"Russia","Georgia","7th Military Base","","Army","Operator Only","2009","","","","The 7th Military Base is a sizable overseas military base of the Russian Armed Forces stationed in Bombora in the partially recognized Republic of Abkhazia. The base is subordinate to the command of the 49th Combined Arms Army and the Southern Military District of the Russian Armed Forces.","https://jamestown.org/program/russia-redeploys-troops-from-its-bases-in-georgia-to-ukraine/"],[40.79,43.8257,"Russia","Armenia","Russian 102nd Military Base","","Army","Operator Only","1941","","","","The Russian 102nd Military Base is a Russian military base in Gyumri, Armenia, under the command of the Southern Military District of the Russian Armed Forces.","https://www.understandingwar.org/sites/default/files/Russian%20Ground%20Forces%20OOB_ISW%20CTP_0.pdf"],[40.1283,44.4728,"Russia","Armenia","Erebuni Airport","","Air Force","Co-base","1995","","","","Erebuni Airport is a military airport serving Yerevan and the country of Armenia. At present, the airport is mostly operated by the military and is home to the Russian 3624th Air Base and hosts a squadron of MiG-29s and Mi-24 attack helicopters. In November 2013, the Armenian expanded the space allotted to the Russian Air Force to house new buildings, fuel-storage facilities, and helicopter landing pads to host a squadron of 18 attack helicopters.","https://cacianalyst.org/publications/analytical-articles/item/13816-armenias-enduring-military-dependence-on-russia-resists-erosion.html?tmpl=component&print=1"],[52.8575,26.4819,"Russia","Belarus","Hantsavichy Radar Station","","Air Force","Operator Only","1982","","","","Baranavichy Radar Station is a 70M6 Volga-type radar near Hantsavichy (48 km from Baranavichy in Belarus). It is an early warning radar, which is run by the Russian Space Forces. It is designed to identify launches of ballistic missiles from western Europe and can also track some artificial satellites, partly replacing the demolished radar station at Skrunda in Latvia.","https://prismua.org/en/985457-2/"],[54.4636,26.7789,"Russia","Belarus","Vileyka Naval Communication Centre","","Air Force","Operator Only","1964","","","","The Vileyka VLF transmitter is the site of the 43rd Communications Center of the Russian Navy. The \"Vileyka\" VLF transmitter is an important facility for transmitting orders to submarines in the very low frequency range. Beside this, it is used for transmitting the time signal RJH69 at certain times.","https://prismua.org/en/985457-2/"],[48.075,37.7256,"Russia","Ukraine","Donetsk International Airport","Donetsk ","Air Force","Operator Only","2022","","","","Donetsk International Airport was a major civilian airport that was destroyed during the 2014–2015 war. Its terminal and runways remain largely in ruins. The site has stayed under Russian/DPR control and functions as a hardened military position rather than a working airport.","https://kyivindependent.com/russia-is-turning-occupied-ukraine-into-a-giant-military-base/"],[46.8147,36.7581,"Russia","Ukraine","Berdiansk Airport","Berdiansk","Air Force","Operator Only","2022","","","","Russia repurposed the airfield as a forward base for helicopters supporting operations on the southern axis; on 17 Oct 2023 Ukraine struck the site (and Luhansk airfield) with ATACMS, destroying multiple helicopters and damaging infrastructure.","https://meduza.io/en/news/2023/10/19/satellite-images-show-damage-to-russian-occupied-berdyansk-airfield-after-ukraine-s-october-17-strike"],[48.418,39.374,"Russia","Ukraine","Luhansk Airfield"," Luhansk","Air Force","Operator Only","2022","","","","Although civilian operations ceased years ago, Russia has used the airfield area for helicopter activity. It was also struck by Ukrainian ATACMS on 17 Oct 2023 alongside Berdiansk, with open-source assessments indicating multiple helicopters destroyed and airfield assets damaged.","https://www.rferl.org/a/ukraine-russia-crimea-drone-attack-ammo-depot/32640754.html"],[46.8767,35.3075,"Russia","Ukraine","Melitopol Air Base","Melitopol ","Air Force","Operator Only","2022","","","","Captured in early March 2022, Melitopol became a central node on Russia’s land-bridge corridor, with roads and rail through the city used to feed southern fronts; Ukrainian forces have repeatedly targeted the Russian garrison and base facilities there.","https://www.rferl.org/a/ukraine-russian-aircraft-target-melitopol/31783617.html"],[47.1311,37.6874,"Russia","Ukraine","Base in Kalmiuskyi district","Melitopol ","Army","Operator Only","2025","","","","Kalmiuskyi contains the vast Ilyich Iron & Steel Works; authoritative mapping and fieldwork place that plant in this district. Since Russia’s capture of Mariupol, satellite imagery has documented new Russian military compounds in the city and investigative reporting shows occupation authorities and Kadyrov-linked structures controlling and exploiting the Ilyich site—evidence of sustained garrisoning and military use in/around Kalmiuskyi.","https://www.militarytimes.com/flashpoints/ukraine/2022/12/05/satellite-images-show-new-russian-military-facility-in-mariupol/"],[47.0963,37.6245,"Russia","Ukraine","A logistics base in the Livoberezhnyi district","Melitopol ","Army","Operator Only","2025","","","","Livoberezhnyi is the left-bank district that includes the Azovstal complex; HRW documents extensive demolition and remaking there under occupation. Strategically, Mariupol anchors Russia’s overland logistics between Donbas and the Sea of Azov—Moscow even announced demining/reopening moves at the port—so facilities on the left bank function as staging and supply nodes for operations along this corridor.","https://www.ukrinform.net/rubric-ato/3984496-two-new-russian-military-bases-appear-in-mariupol-in-marchapril.html"],[38.6527,68.7641,"Iran","Tajikistan","Ababil‑2 Drone Factory","","Air Force","Operator Only","2022","","","","In May 2022, Iran inaugurated its first overseas drone production facility in Dushanbe, Tajikistan, to manufacture and export the Ababil-2, a multipurpose reconnaissance, strike, and suicide UAV.","https://mei.edu/publications/irans-drone-factory-tajikistan"],[40.3239,19.4192,"Turkiye","Albania","Pasha Liman Base","","Navy","Co-base","1992","","","","The Pasha Liman Base is an Albanian Navy base south of Vlorë. An Albanian-Turkish military cooperation agreement was signed in 1992 that encompassed rebuilding Albania's Pasha Liman Base by Turkiye alongside granted access for Turkish use.","https://armyrecognition.com/archives/archives-naval-defense/naval-defense-2022/albania-proposes-ex-soviet-naval-base-to-nato-to-counter-russia"],[40.3843,49.8235,"Turkiye","Azerbaijan","Qizil Sherg military town","","Army","Co-base","2016","","","","Azerbaijani and Turkish governments signed the relevant protocol on July 3, 2016. The protocol says Azerbaijan government has allocated buildings and structures in Gizil Sherg military town, and one terminal building located in the airfield in Haji Zeynalabdin Tagiyev settlement for the use of the Turkish Armed Forces.","https://www.hurriyetdailynews.com/turkey-to-establish-military-base-in-azerbaijan-101906"],[40.5914,49.5572,"Turkiye","Azerbaijan","Hacı Zeynalabdin settlement","","Army","Co-base","2016","","","","Azerbaijani and Turkish governments signed the relevant protocol on July 3, 2016. The protocol says Azerbaijan government has allocated buildings and structures in Gizil Sherg military town, and one terminal building located in the airfield in Haji Zeynalabdin Tagiyev settlement for the use of the Turkish Armed Forces.","https://www.hurriyetdailynews.com/turkey-to-establish-military-base-in-azerbaijan-101906"],[36.6612,44.5267,"Turkiye","Iraq","Soran Base","","Army","Operator Only","2020","","","","Soran Base was established around 2020 amid Turkey’s “Forbidden Zone” push, it serves as a logistics and operations hub for cross-border actions, frequently targeted by PKK-related strikes.","https://rojnews.news/ar/?p=225675"],[36.6676,42.6063,"Turkiye","Iraq","Zammar Camp","","Army","Operator Only","2018","","","","Zammar Camp is likely to be inaugurated post-2018 as part of Turkey’s expansion of about 74 bases; known to support troop deployments and counter-PKK surveillance in the Mosul region.","https://rojnews.news/ar/?p=225675"],[36.5713,44.3405,"Turkiye","Iraq","Harir region HQ","","Army","Operator Only","2021","","","","Harir region HQ is a military command outpost used since around 2021 to launch operations into PKK-dominated areas near Erbil; symbolizing Turkey’s deeper incursion beyond traditional border zones.","https://rojnews.news/ar/?p=225675"],[33.2237,43.6728,"Turkiye","Iraq","Sidakan Base","","Army","Operator Only","2024","","","","Sidakan Base is one of several bases built in mid-2024 near Sidakan (Bradost area), linked to recent civilian casualties and drone strikes, reflecting Turkey’s aggressive perimeter deepening.","https://rojnews.news/ar/?p=225675"],[35.7582,45.3529,"Turkiye","Iraq","Sinke Village post","","Army","Operator Only","2020","","","","Sinke Village post is a smaller tactical outpost inside the \"Forbidden Zone\" near Batifa, built in the 2020–2024 period to support rapid assault incursions.","https://rojnews.news/ar/?p=225675"],[36.8855,42.8936,"Turkiye","Iraq","Bykova complex base","","Army","Operator Only","2024","","","","Bykova complex base is part of the Sibari–Sidakan satellite network across Duhok established in early 2024; reportedly combining logistics, surveillance, and infantry forces.","https://rojnews.news/ar/?p=225675"],[36.6717,44.5124,"Turkiye","Iraq","Kiribz Base","","Army","Operator Only","2024","","","","Kiribz Base – Likely a forward base near Soran, created during the 2024 expansion, supporting artillery and drone adaptability in mountainous terrain.","https://rojnews.news/ar/?p=225675"],[37.1542,42.6224,"Turkiye","Iraq","Quickie Base","","Army","Operator Only","2024","","","","Quickie Base is a small rapid-deployment site in the Galiye Baze corridor near Zakho, reportedly active since early 2024 to aid cross-border raids.","https://rojnews.news/ar/?p=225675"],[37.1619,42.6414,"Turkiye","Iraq","Sri Zir Base","","Army","Operator Only","2024","","","","Sri Zir Base is positioned on Shakhol Mountain overlooking Zakho, established in early 2024 and tied to recent village fire and civilian displacement incidents.","https://rojnews.news/ar/?p=225675"],[37.1472,42.5984,"Turkiye","Iraq","Golan Castle Base","","Army","Operator Only","2022","","","","A hillside military facility near Zakho, reportedly active since 2022 to reinforce control over valleys crossing into Syria.","https://rojnews.news/ar/?p=225675"],[37.0986,43.2285,"Turkiye","Iraq","Şîrtê (Şir)","","Army","Operator Only","1995","","","","Şîrtê (Şir) Base was established around 1995 near Duhok, this installation serves as an early anchor of Turkey’s long-standing anti-PKK infrastructure.","https://rojnews.news/ar/?p=225675"],[34.1695,45.3573,"Turkiye","Iraq","Jabal Sarziri (Mount Sarziri)","","Army","Operator Only","2020","","","","A strategic hilltop fortification installed circa 2020 on Harir-Soran border to enable higher-altitude surveillance and targeting.","https://rojnews.news/ar/?p=225675"],[37.0988,43.2685,"Turkiye","Iraq","Bamarni Air Base","","Army","Operator Only","1996","","","","The Turkish Armed Forces began to operate from the airfield in 1996, and established two bases at Bamarni as part of an agreement with the Kurdistan Democratic Party. The Turkish base's facilities were upgraded in 2006.","https://rawabetcenter.com/archives/149066"],[36.4466,43.3471,"Turkiye","Iraq","Bashiqa Air Base","","Army","Operator Only","1996","","","","This base is located on the outskirts of Mosul, more than 140 kilometers from the Turkish-Iraqi border. The base houses about 2,000 soldiers, dozens of tanks and long-range artillery.","https://rawabetcenter.com/archives/149066"],[34.1598,45.3634,"Turkiye","Iraq","Kani Masi","","Army","Operator Only","2020","","","","Kani Masi is a village in Iraq where Turkiye has a military bases there.","https://rawabetcenter.com/archives/149066"],[37.1453,42.7494,"Turkiye","Iraq","Zakho Valley base","","Army","Operator Only","2020","","","","Turkiye has established military bases in Zakho Valley.","https://rawabetcenter.com/archives/149066"],[36.488,43.3542,"Turkiye","Iraq","Camp Zlikan","","Army","Operator Only","2015","","","","Camp Zlikan has hosted Turkish military forces since approximately 2015 for operations against the PKK and ISIS in northern Iraq. The base has endured repeated rocket and drone attacks, including a missile strike from Mosul in August 2022.","https://rawabetcenter.com/archives/149066"],[37.0906,43.4868,"Turkiye","Iraq","HQ of Turkish security (MIT) in the center of Amadiya district.","","Army","Operator Only","2018","","","","Since around 2018, Turkey’s National Intelligence Organization (MIT) has operated at least five covert intelligence bases in Amadiya. The sites house heavy weapons and are linked to military reconnaissance and surveillance activities. Their presence has raised local unease and prompted periodic criticism from Kurdish communities.","https://rawabetcenter.com/archives/149066"],[37.142,42.6041,"Turkiye","Iraq","HQ of Turkish security in Zakho district.","","Army","Operator Only","1995","","","","Turkish MIT maintains long-standing intelligence facilities in Zakho, including one in Batifa, dating back to the mid-1990s. These locations are used for gathering intelligence and coordinating with Turkish-backed groups. They function alongside Turkish military installations, but operate under intelligence cover.","https://rawabetcenter.com/archives/149066"],[36.8763,42.906,"Turkiye","Iraq","HQ of Turkish security (Dohuk, Girê Basi)","","Army","Operator Only","1996","","","","It has been operating since the mid-1990s near Dohuk. The Girê Basi facility is linked to Turkish signals intelligence, reconnaissance, and planning for incursions into PKK areas. Equipped with surveillance capabilities, the site is integrated with Turkey’s regional military network, without serving as a typical combat base.","https://rawabetcenter.com/archives/149066"],[36.565,44.3385,"Turkiye","Iraq","Military HQ in the Harir region","","Army","Operator Only","2019","","","","It is located near Harir in Erbil Governorate. This Turkish military headquarters supports ongoing Claw‑Lock operations against the PKK in northern Iraq. It often serves as a logistics and coordination center for Turkish forces operating across cross-border areas."," https://www.bbc.com/arabic/middleeast-47028202"],[37.1944,43.8016,"Turkiye","Iraq","HQ of Turkish security in the center of Batofa","","Army","Operator Only","1995","","","","It was established in the mid-1990s, the MIT headquarters in Batifa (Zakho district) functions as an intelligence facility, coordinating surveillance and cross-border operations. It has consistently been active in intelligence gathering, focusing on Kurdish movements.","https://rawabetcenter.com/archives/149066"],[36.8203,42.9904,"Turkiye","Iraq","kopke Base","","Army","Operator Only","2021","","","","It is situated in the Amedi district (Duhok Governorate). Kopke is one of several Turkish military bases reportedly established after 2020. It supports operations targeting PKK-affiliated groups in the region, and Turkey has constructed new infrastructure there since early 2024."," https://www.bbc.com/arabic/middleeast-47028202"],[36.6667,42.6041,"Turkiye","Iraq","Zammar Camp","","Army","Operator Only","2015","","","","This camp is located near Mosul in Nineveh Province. Zammar Camp was established around 2015 in conjunction with the Bashiqa zone and remains under Turkish military control. It has been attacked repeatedly by rocket fire from Iranian-backed militias, reflecting its contentious status."," https://www.bbc.com/arabic/middleeast-47028202"],[37.0918,43.4841,"Turkiye","Iraq","Amedi","","Army","Operator Only","1995","","","","Since the mid-1990s, Turkey has maintained a complex of military posts and intelligence offices around Amedi, including Bamarni Air Base. After 2020, Turkey expanded with up to 150 military points up to 35 km into the region, notably in Bamarni and Kani Masi, shifting from mere checkpoints to multi-purpose forward positions during Claw‑Lock operations.","https://www.raialyoum.com/%D9%84%D9%85%D8%A7%D8%B0%D8%A7-%D9%8A%D8%A7-%D8%A3%D8%B1%D8%AF%D9%88%D8%BA%D8%A7%D9%86-%D9%84%D9%85-%D8%AA%D8%AD%D8%B3%D9%85-%D9%86%D8%B4%D8%A7%D8%B7-%D8%A7%D9%84%D9%85%D8%AE%D8%A7%D8%A8%D8%B1%D8%A7/"],[35.4628,44.361,"Turkiye","Iraq","Kirkuk","","Army","Operator Only","2020","","","","While no large Turkish base is publicly documented in Kirkuk, Turkish special forces were involved in a clandestine operation (\"Hood event\") in 2003 in Sulaymaniyah, where Turkish personnel were captured by U.S. troops at a safe house—suggesting covert Turkish activity in the region.","https://www.raialyoum.com/%D9%84%D9%85%D8%A7%D8%B0%D8%A7-%D9%8A%D8%A7-%D8%A3%D8%B1%D8%AF%D9%88%D8%BA%D8%A7%D9%86-%D9%84%D9%85-%D8%AA%D8%AD%D8%B3%D9%85-%D9%86%D8%B4%D8%A7%D8%B7-%D8%A7%D9%84%D9%85%D8%AE%D8%A7%D8%A8%D8%B1%D8%A7/"],[35.5628,45.3107,"Turkiye","Iraq","Sulaymaniyah","","Army","Operator Only","2021","","","","Public records indicate Turkish intelligence and special forces occasionally operated secretively, including the 2003 Sulaymaniyah safe house incident.","https://www.raialyoum.com/%D9%84%D9%85%D8%A7%D8%B0%D8%A7-%D9%8A%D8%A7-%D8%A3%D8%B1%D8%AF%D9%88%D8%BA%D8%A7%D9%86-%D9%84%D9%85-%D8%AA%D8%AD%D8%B3%D9%85-%D9%86%D8%B4%D8%A7%D8%B7-%D8%A7%D9%84%D9%85%D8%AE%D8%A7%D8%A8%D8%B1%D8%A7/"],[37.3145,43.0547,"Turkiye","Iraq","kukhi sbi Base","","Army","Operator Only","1997","","","","Located near Ureh in Barwari Bala (Amedi district), Kukhi Sbi emerged as one of the six documented Turkish military bases in Amedi and Zakho, established post-1997 and reinforced significantly after 2020.","https://rawabetcenter.com/archives/149066"],[37.2794,43.3196,"Turkiye","Iraq","Dirii Dawatiaa Base","","Army","Operator Only","2021","","","","Positioned in a strategic area of Amedi’s Barwari region, this base was identified in Turkish military maps and reports from 2021 to 2024 as part of an expanded footprint supporting cross-border targeting operations.","https://rawabetcenter.com/archives/149066"],[37.2091,43.5072,"Turkiye","Iraq","Jil Sirziriun Base","","Army","Operator Only","2020","","","","Jil Sirziriun Base is located near Mount Sarziri. The base was established by Turkey around 2020 as part of expanded counter-PKK operations in the Harir–Soran area. It functions primarily as a forward post rather than headquarters. While specific details remain limited, the location aligns with Turkey’s mapped deployment of dozens of bases after 2018.","https://rawabetcenter.com/archives/149066"],[37.0742,44.7362,"Turkiye","Iraq","kumri Base","","Army","Operator Only","2020","","","","Positioned in the Brovari/Kumri region of Duhok Governorate, Turkey occupied this base after 1997 and significantly reinforced it after 2020 under Operation Claw-Lock. The site is used to station troops and armoured vehicles monitoring PKK-affiliated zones. Although troop numbers are not disclosed, it’s one of around 40 bases reported on Turkish military maps."," https://www.bbc.com/arabic/middleeast-47028202"],[37.0125,44.2174,"Turkiye","Iraq","Batofa Base","","Army","Operator Only","1995","","","","Batofa Base was established in 1994 in the town of Batifa (near Zakho). This outpost is home to Turkish special forces and MIT units. The base played a role during the early wave of Turkish expansion into Kurdistan and contributed to ongoing intelligence and surveillance operations. Its presence is noted in discussions of early Turkish incursions.","https://rawabetcenter.com/archives/149066"],[37.0096,44.4492,"Turkiye","Iraq","Seri military base in Chiladze","","Army","Operator Only","1995","","","","Seri Military Base is located in Shiladze, Duhok Governorate. This base has existed since the mid‑1990s and was stormed by Iraqi Kurds in January 2019 over civilian airstrikes. It has maintained a Turkish military presence.","https://rawabetcenter.com/archives/149066"],[37.3174,42.8412,"Turkiye","Iraq","Waqamariy Bruari Base","","Army","Operator Only","None","","","","","https://rawabetcenter.com/archives/149066"],[42.3736,21.2421,"Turkiye","Kosovo","Camp Bondsteel","","Army","Co-base","1999","","Yes","","Camp Bondsteel is the operational headquarters of the Kosovo Force (KFOR) in Kosovo. Turkey contributes approximately 402 soldiers to KFOR’s Regional Command–East at Camp Bondsteel.","https://www.turkiyetoday.com/region/turkiye-to-resume-command-of-natos-kfor-mission-in-kosovo-in-october-3201232"],[42.212,20.7211,"Turkiye","Kosovo","Sultan Murat base","","Air Force","Co-base","2023","","Yes","","A Turkish commando battalion from the 65th Mechanized Infantry Brigade has been stationed here since June 2023, as a NATO-designated reserve and rapid response unit supporting stability in northern Kosovo. ","https://www.aa.com.tr/en/europe/turkiye-deploys-additional-troops-to-kosovo-at-nato-s-request/2916482"],[32.9,13.2833,"Turkiye","Libya","Mitiga Airport","","Air Force","Co-base","None","","","","Turkiye has built a secret military base in Tripoli’s Mitiga Airport"," https://thearabweekly.com/fall-al-watiya-base-ushers-era-permanent-turkish-presence-western-libya"],[32.4722,11.9,"Turkiye","Libya","Al-Watiya Airbases","","Air Force","Co-base","2019","","","","Turkey has significantly upgraded this western Libyan airbase, deploying air-defence systems (Hawk late 2020, later replaced by HİSAR-O100), armoured vehicles, drones, and support aircraft. Captured by pro‑GNA forces in mid‑2019, it remains operational under Turkish military control and has been subjected to airstrikes, including a July 2020 strike that destroyed some Turkish systems."," https://thearabweekly.com/fall-al-watiya-base-ushers-era-permanent-turkish-presence-western-libya"],[35.2946,33.7256,"Turkiye","Cyprus","Air base in Lefkonikos","","Air Force","Operator Only","None","","","","Geçitkale Air Base or Lefkoniko Airport is a military airfield of the Turkish Air Force.It was assigned by a decision of the government of Northern Cyprus to the Cyprus Turkish Peace Force Command for use by unmanned aerial vehicle (UAV) operations."," https://en.famagusta.news/local/ammochostos/tourkika-schedia-gia-naftiki-ke-aeroporiki-vasi-se-ammochosto-ke-lefkoniko/"],[25.2139,51.3925,"Turkiye","Qatar","Tariq ibn Ziyad Base/ Al Rayyan base","","Army","Operator Only","2014","","","","This is a Turkish military base in the State of Qatar that was established under the signing of a military cooperation agreement on April 28, 2014 between the Qatari Ministry of Defense and the Turkish Ministry of Defense. There are 90 soldiers of the Turkish, Tariq bin Ziyad Brigade, accompanied by their armored vehicles, and the base can accommodate 3,000 soldiers.","https://www.aljazeera.net/opinions/2017/6/12/%D8%A7%D9%84%D9%82%D8%A7%D8%B9%D8%AF%D8%A9-%D8%A7%D9%84%D8%B9%D8%B3%D9%83%D8%B1%D9%8A%D8%A9-%D8%A7%D9%84%D8%AA%D8%B1%D9%83%D9%8A%D8%A9-%D8%A8%D9%82%D8%B7%D8%B1-%D8%A7%D9%84%D8%B3%D9%8A%D8%A7%D9%82"],[25.2268,51.3522,"Turkiye","Qatar","Khalid ibn Al-Walid Military Camp","","Army","Co-base","2015","","","","","https://thepeninsulaqatar.com/article/08/12/2021/erdogan-visits-khalid-bin-al-walid-military-camp"],[1.996,45.268,"Turkiye","Somalia","Camp TURKSOM","","Army","Co-base","2017","","","","Camp TURKSOM is a military base and a defence university in Mogadishu, Somalia. Since its inception, Camp TURKSOM serves as the main hub of the intergovernmental task force dubbed \"African Eagle.\""," https://www.indyturk.com/node/316736/her-yedi-askerden-biri-s%C4%B1n%C4%B1rlar%C4%B1n-%C3%B6tesinde-tskn%C4%B1n-"],[36.8162,38.0048,"Turkiye","Syria","Jarabulus Base","","Army","Operator Only","2016","","","","Established during Turkey’s 2016 Euphrates Shield offensive, the base functions as a logistics node for Turkish proxies, often criticized for shifting northern Syria into a de facto protectorate and fueling sectarian fragmentation along the border.","https://www.lebarmy.gov.lb/ar/content/%D8%A7%D9%84%D9%82%D9%88%D8%A7%D8%B9%D8%AF-%D8%A7%D9%84%D8%B9%D8%B3%D9%83%D8%B1%D9%8A%D8%A9-%D9%81%D9%8A-%D8%B3%D9%88%D8%B1%D9%8A%D8%A7"],[36.5058,37.3417,"Turkiye","Syria","Akhtarin Base","","Army","Operator Only","2016","","","","This Turkish outpost in northern Aleppo has served as a launchpad for cross-border strikes, drawing ongoing fire from Kurdish and regime forces, highlighting its role in perpetuating conflict rather than enhancing stability.","https://www.lebarmy.gov.lb/ar/content/%D8%A7%D9%84%D9%82%D9%88%D8%A7%D8%B9%D8%AF-%D8%A7%D9%84%D8%B9%D8%B3%D9%83%D8%B1%D9%8A%D8%A9-%D9%81%D9%8A-%D8%B3%D9%88%D8%B1%D9%8A%D8%A7"],[36.5898,37.0523,"Turkiye","Syria","A'zaz Base","","Army","Operator Only","2016","","","","Situated near the border, Turkey’s A’zaz base serves as command outpost for local proxy forces, enabling Ankara to consolidate influence—raising concerns about undermining Syrian sovereignty and prolonging armed fragmentation.","https://www.lebarmy.gov.lb/ar/content/%D8%A7%D9%84%D9%82%D9%88%D8%A7%D8%B9%D8%AF-%D8%A7%D9%84%D8%B9%D8%B3%D9%83%D8%B1%D9%8A%D8%A9-%D9%81%D9%8A-%D8%B3%D9%88%D8%B1%D9%8A%D8%A7"],[36.2756,36.8216,"Turkiye","Syria","Jebel Sheikh Barakat Base","","Army","Operator Only","2016","","","","Perched atop a mountain ridge, this base provides Turkish forces artillery dominance over regime-held areas, reinforcing exclusionary control over Idlib and fueling fears of permanent militarization of contested terrain.","https://www.lebarmy.gov.lb/ar/content/%D8%A7%D9%84%D9%82%D9%88%D8%A7%D8%B9%D8%AF-%D8%A7%D9%84%D8%B9%D8%B3%D9%83%D8%B1%D9%8A%D8%A9-%D9%81%D9%8A-%D8%B3%D9%88%D8%B1%D9%8A%D8%A7"],[35.9833,36.7833,"Turkiye","Syria","Taftanaz Military Airbase","","Air Force","Operator Only","2020","","","","Repurposed from a Syrian helicopter base in 2020, Taftanaz now enables Turkish tactical air response in Idlib—raising alarm over deepening militarization of civilian infrastructure and evasion of international oversight.","https://www.lebarmy.gov.lb/ar/content/%D8%A7%D9%84%D9%82%D9%88%D8%A7%D8%B9%D8%AF-%D8%A7%D9%84%D8%B9%D8%B3%D9%83%D8%B1%D9%8A%D8%A9-%D9%81%D9%8A-%D8%B3%D9%88%D8%B1%D9%8A%D8%A7"],[35.7338,37.1039,"Turkiye","Syria","Abu al-Duhur Airbase","","Air Force","Operator Only","2017","","","","Although captured by rebels in 2015, this facility remains a point of Turkish interest under its 2017 strategic posture—critics argue Turkey's presence here reinforces fragmentation and undermines prospects for centralized Syrian governance.","https://www.lebarmy.gov.lb/ar/content/%D8%A7%D9%84%D9%82%D9%88%D8%A7%D8%B9%D8%AF-%D8%A7%D9%84%D8%B9%D8%B3%D9%83%D8%B1%D9%8A%D8%A9-%D9%81%D9%8A-%D8%B3%D9%88%D8%B1%D9%8A%D8%A7"],[36.7888,37.9671,"Turkiye","Syria","Military Camp (Marm al-Hajar mountain area)","","Army","Operator Only","2016","","","","This camp supports Turkish patrols around Jarabulus yet lacks clear oversight and often induces local displacement—highlighting broader challenges of competing authorities and militarized civilian space .","https://vdc-nsy.com/archives/38701"],[36.5511,37.943,"Turkiye","Syria","Um Rutha village Camp","","Army","Operator Only","2016","","","","Located east of Azaz, this camp provides Turkish military cover for refugee hosting and buffer enforcement; critics see it as part of Turkey’s strategy of securitizing humanitarian zones under military control.","https://vdc-nsy.com/archives/38701"],[36.6292,37.9353,"Turkiye","Syria","Military Point (Manbij-Jarabulus road)","","Army","Operator Only","2016","","","","Situated along the strategic Manbij–Jarabulus highway, this Turkish-controlled checkpoint consolidates Erdogan’s control over a vital corridor connecting re-occupied towns. Its presence accentuates Turkey’s unilateral buffer-zone enforcement, effectively bisecting Kurdish-populated areas and sustaining regional tensions.","https://vdc-nsy.com/archives/38701"],[36.5533,37.9611,"Turkiye","Syria","Military Point near the village of (Al-Hadara, north of Manbij)","","Army","Operator Only","2016","","","","This forward outpost extends Turkish influence into predominantly Kurdish territory, frequently targeted in cross-fire and drone strikes—highlighting Turkey’s role in destabilizing rather than stabilizing front-line zones.","https://vdc-nsy.com/archives/38701"],[36.529,37.9247,"Turkiye","Syria","Military Point (North Manbij)","","Army","Operator Only","2016","","","","Located on the contested northern perimeter of Manbij, this base enables Turkish forces and proxies to monitor and control key approaches—reinforcing buffer lines that perpetuate Kurdish disenfranchisement and hinder potential reconciliation.","https://vdc-nsy.com/archives/38701"],[36.6006,37.7373,"Turkiye","Syria","Military Camp (Tal Ali)","","Army","Operator Only","2016","","","","The Tal Ali encampment secures Turkish access deeper into the Aleppo countryside, often used to pre-empt Kurdish gains and disrupt SDF administration. Its militarized presence undermines civilian confidence in any centralized governance.","https://vdc-nsy.com/archives/38701"],[36.6176,37.6034,"Turkiye","Syria","Military Point (Zulf)","","Army","Operator Only","2016","","","","Although least documented, this position near Zulf amplifies Turkey’s surveillance and control mechanisms in the Manbij region. Its existence underscores persistent territorial encroachment and contributes to insecurity in Kurdish-populated areas.","https://vdc-nsy.com/archives/38701"],[36.5656,37.8796,"Turkiye","Syria","Military Point (Sweiha)","","Army","Operator Only","2018","","","","Located near Sweiha in northern Aleppo, this Turkish checkpoint reinforces control over Kurdish-inhabited regions and frequently serves as a launchpad for drone and artillery strikes, exacerbating local tensions.","https://vdc-nsy.com/archives/38701"],[36.6754,37.7606,"Turkiye","Syria","Military Point (Ghandoura)","","Army","Operator Only","2016","","","","Strategically positioned in Ghandoura, this point underpins Turkish-backed proxy deployments, fueling recurring clashes with Kurdish forces and undermining ceasefire zones.","https://vdc-nsy.com/archives/38701"],[36.3323,38.1136,"Turkiye","Syria","Military Point (Tal Barsha)","","Army","Operator Only","2016","","","","Situated on elevated terrain west of Manbij, Tal Barsha serves as a forward surveillance post, perpetuating Turkey’s tactical dominance while deepening divisions with Syria’s Kurdish governance areas.","https://vdc-nsy.com/archives/38701"],[36.4371,37.5577,"Turkiye","Syria","Military Point (Qabasin)","","Army","Operator Only","2016","","","","Close to the key town of Qabasin—recovered during Operation Euphrates Shield—this point secures Turkey’s control over rebel corridors but contributes to structural fragmentation in northeastern Aleppo.","https://vdc-nsy.com/archives/38701"],[36.3901,37.5623,"Turkiye","Syria","Military Point (Baza'a, East of Al-Bab)","","Army","Operator Only","2020","","","","East of Al-Bab at Baza'a, Turkish forces use this outpost to maintain buffer-zone pressure against SDF influence, reinforcing contested borderland militarization and destabilizing reconciliation prospects.","https://vdc-nsy.com/archives/38701"],[36.3838,37.5633,"Turkiye","Syria","Military Base (Bazaa-Al-Bab road)","","Army","Operator Only","2017","","","","This facility was established after Turkish-backed forces captured al-Bab in early 2017, serving as a forward command and logistics hub overlooking a vital supply route. Critics argue it entrenches Turkey’s de facto buffer zone, reinforcing occupation rather than stabilizing civilian governance.","https://vdc-nsy.com/archives/38701"],[36.3684,37.504,"Turkiye","Syria","Military hospital (Al-Bab in the place of Jabal Aqil)","","Army","Operator Only","2017","","","","Located on the strategic Jabal Aqil hill, this Turkish-run field hospital replaced local medical facilities and serves military priorities. Its presence reflects Turkey’s control over civilian areas and militarization of humanitarian services.","https://vdc-nsy.com/archives/38701"],[36.3773,37.4828,"Turkiye","Syria","Military Base (Al-Bab)","","Army","Operator Only","2017","","","","Turkey maintains a central garrison in the city of al-Bab, integrating armored units and reminders of proxy oversight over the local population. This base symbolizes Ankara’s sustained proxy rule and undermines reintegration of central Syrian authority.","https://vdc-nsy.com/archives/38701"],[36.3519,37.5274,"Turkiye","Syria","Military Point (Al-Bab-Tadf road)","","Army","Operator Only","2017","","","","Positioned on the road between al-Bab and Tadef, this checkpoint secures Turkish supply lines for continued control. It highlights Turkey’s influence in obstructing regional regrouping and contradicts efforts toward de-escalation.","https://vdc-nsy.com/archives/38701"],[36.3255,37.3121,"Turkiye","Syria","Military Base (Abu Zeidan)","","Army","Operator Only","2016","","","","Located near Qabasin and Bizaah, this post was set up after Operation Euphrates Shield to maintain armored support corridors. It fuels fragmentation between Kurdish-held and rebel-held areas, perpetuating Ankara’s military hold in northern Aleppo.","https://vdc-nsy.com/archives/38701"],[36.1207,36.9441,"Turkiye","Syria","Military Point (Khuzan)","","Army","Operator Only","2020","","","","This checkpoint near Khuzan consolidates Turkey’s surveillance over Kurdish-held territories, facilitating artillery and drone strikes from Turkish proxies. Its presence reinforces Ankara’s control over the Manbij axis, deepening the militarization of northern Syria and marginalizing Kurdish authorities.","https://vdc-nsy.com/archives/38701"],[36.5329,37.1222,"Turkiye","Syria","Military Point (Kaljibrin)","","Army","Operator Only","2016","","","","Located near Kaljibrin in northern Aleppo, this Turkish outpost became a frontline target in mid-2022, suffering intense bombardment from Kurdish and regime forces. It epitomizes the recurring cycle of violence enabled by Turkey’s sprawling outpost network in occupied zones.","https://vdc-nsy.com/archives/38701"],[36.5745,37.0531,"Turkiye","Syria","Military Point (South of Azaz)","","Army","Operator Only","2016","","","","Set south of Azaz, this military position secures Turkey’s control over the Azaz corridor and reinforces its buffer-zone doctrine. Placed between Kurdish areas and Syrian government territory, it perpetuates tensions and undermines prospects for reconciliation .","https://vdc-nsy.com/archives/38701"],[36.5274,37.2681,"Turkiye","Syria","Military Point (Dabiq)","","Army","Operator Only","2016","","","","Near the symbolic town of Dabiq—captured during Operation Euphrates Shield in 2016—this position allows Turkey to maintain control over a site of ISIS propaganda significance. Its militarization sustains a legacy of conflict and prevents Kurdish reassertion within this symbolic locale.","https://vdc-nsy.com/archives/38701"],[36.2049,36.7725,"Turkiye","Syria","Observation points (village of Salva)","","Army","Operator Only","2017","","","","Established in October 2017 near Salva (Al-Dana district), this Turkish position was one of the earliest observation posts under the Astana de-escalation protocol. It has transformed from a peacekeeping oversight role to a militarized checkpoint, enabling artillery surveillance and reinforcing Turkey’s frontier control in Idlib.","https://vdc-nsy.com/archives/38701"],[36.3291,36.8385,"Turkiye","Syria","Observation points (Simeon village)","","Army","Operator Only","2018","","","","Positioned near the UNESCO‑listed Mount Simeon (Qalaat Sama’an) in western Aleppo, this post serves as a monitoring outpost for ceasefire enforcement. Its proximity to civilian heritage sites highlights militarization encroaching on both humanitarian and cultural zones.","https://vdc-nsy.com/archives/38701"],[36.2946,36.8475,"Turkiye","Syria","Observation points (Jabal Eaql)","","Army","Operator Only","2020","","","","Located atop Sheikh Aqil mountain near Darat Izza, this elevated outpost gives Turkish forces oversight over Idlib countryside and a platform for enforcing buffer zones. Over time, it has become part of intense battlefront exchanges rather than a stabilizing anchor.","https://vdc-nsy.com/archives/38701"],[36.3061,37.0565,"Turkiye","Syria","Observation points (Eindan)","","Army","Operator Only","2018","","","","Though its precise history and coordinates are less documented, Eindan likely refers to the observation points established across southern Idlib during the 2018 Astana process. These positions collectively reinforce Turkey’s surveillance regime and inhibit Syrian central authority from reasserting control.","https://vdc-nsy.com/archives/38701"],[36.2641,37.1316,"Turkiye","Syria","Observation points (Rashidin)","","Army","Operator Only","2018","","","","Set in western Aleppo in early May 2018, this was Turkey’s 10ᵗʰ tower intended to monitor “de-escalation” zones. It became a flashpoint—Turkish posts there were shelled and later dismantled—
