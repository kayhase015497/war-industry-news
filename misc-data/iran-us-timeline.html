    <div class="tl-headline">${esc(ev.headline)}</div>
    <div class="tl-summary">${esc(ev.summary)}</div>
    ${ev.source?`<div class="tl-source">來源：${esc(ev.source)}</div>`:''}
    ${xhtml}
  </div>
</div>`;
  }).join('');

  document.getElementById('tl-root').innerHTML=
    header+
    `<div class="tl-feed">${entries}</div>`+
    `<footer class="tl-footer">
      <span>${esc(date)}事件彙整，資料來自公開媒體報導</span>
      <span>戰爭即工業力｜交錯地帶</span>
    </footer>`;
}

function tlX(btn){
  const full=btn.nextElementSibling;
  const open=full.classList.toggle('open');
  btn.innerHTML=open?'<span>收起全文</span> ▴':'<span>展開全文</span> ▾';
}

render();
</script>
