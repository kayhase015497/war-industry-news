<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>時間軸｜美伊衝突最新進展</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --tl-bg: #0b0f1a;
      --tl-surface: rgba(255,255,255,0.04);
      --tl-surface-hover: rgba(255,255,255,0.07);
      --tl-border: rgba(255,255,255,0.08);
      --tl-line: rgba(255,255,255,0.12);
      --tl-text: #e2e8f0;
      --tl-muted: #64748b;
      --tl-secondary: #94a3b8;
      --c-attack:     #ef4444;
      --c-diplomatic: #3b82f6;
      --c-casualties: #f97316;
      --c-economic:   #22c55e;
      --c-statement:  #a855f7;
    }

    body {
      background: var(--tl-bg);
      color: var(--tl-text);
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 14px;
      line-height: 1.7;
      min-height: 100vh;
    }

    .tl-root {
      max-width: 800px;
      margin: 0 auto;
      padding: 28px 20px 52px;
    }

    /* ── Header ───────────────────────────────────── */
    .tl-header {
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--tl-border);
    }

    .tl-category {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--tl-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .tl-h1 {
      font-size: clamp(17px, 3.5vw, 22px);
      font-weight: 700;
      color: #f1f5f9;
      line-height: 1.35;
      margin-bottom: 10px;
    }

    .tl-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--tl-muted);
    }

    .tl-live {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #ef4444;
      font-weight: 700;
    }

    .tl-live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
      animation: tl-blink 1.6s ease-in-out infinite;
    }

    @keyframes tl-blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    .tl-context {
      color: var(--tl-secondary);
    }

    .tl-count strong {
      color: #f1f5f9;
    }

    /* ── Feed ─────────────────────────────────────── */
    .tl-feed {
      position: relative;
      padding-left: 80px;
    }

    /* vertical line — positioned so its horizontal center aligns with dots */
    .tl-feed::before {
      content: '';
      position: absolute;
      left: 52px;   /* 80 - 28 = 52 → dot center */
      top: 8px;
      bottom: 24px;
      width: 1px;
      background: var(--tl-line);
    }

    /* ── Entry ────────────────────────────────────── */
    .tl-entry {
      position: relative;
      margin-bottom: 18px;
    }

    .tl-time {
      position: absolute;
      left: -80px;
      top: 13px;
      width: 52px;
      text-align: right;
      padding-right: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--tl-muted);
      line-height: 1;
    }

    /* dot — left: -28px so center lands at 80-28=52px, matching the line */
    .tl-dot {
      position: absolute;
      left: -28px;
      top: 15px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--tl-muted);
      border: 2px solid var(--tl-bg);
      transform: translateX(-50%);
    }

    .tl-entry:first-child .tl-dot {
      width: 13px;
      height: 13px;
      top: 13px;
    }

    /* dot color by event type */
    .tl-entry[data-type="attack"]     .tl-dot { background: var(--c-attack); }
    .tl-entry[data-type="diplomatic"] .tl-dot { background: var(--c-diplomatic); }
    .tl-entry[data-type="casualties"] .tl-dot { background: var(--c-casualties); }
    .tl-entry[data-type="economic"]   .tl-dot { background: var(--c-economic); }
    .tl-entry[data-type="statement"]  .tl-dot { background: var(--c-statement); }

    /* ── Card ─────────────────────────────────────── */
    .tl-card {
      background: var(--tl-surface);
      border: 1px solid var(--tl-border);
      border-radius: 8px;
      padding: 13px 15px 12px;
      transition: background 0.15s;
    }

    .tl-card:hover { background: var(--tl-surface-hover); }

    .tl-card-top {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 5px;
      flex-wrap: wrap;
    }

    .tl-latest {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: #ef4444;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .tl-tag {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 3px;
    }

    .tl-entry[data-type="attack"]     .tl-tag { background: rgba(239,68,68,.15);  color: #fca5a5; }
    .tl-entry[data-type="diplomatic"] .tl-tag { background: rgba(59,130,246,.15); color: #93c5fd; }
    .tl-entry[data-type="casualties"] .tl-tag { background: rgba(249,115,22,.15); color: #fdba74; }
    .tl-entry[data-type="economic"]   .tl-tag { background: rgba(34,197,94,.15);  color: #86efac; }
    .tl-entry[data-type="statement"]  .tl-tag { background: rgba(168,85,247,.15); color: #d8b4fe; }

    .tl-headline {
      font-size: clamp(13px, 2.2vw, 15px);
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.45;
      margin-bottom: 5px;
    }

    .tl-summary {
      font-size: 13px;
      color: var(--tl-secondary);
      line-height: 1.75;
    }

    .tl-source {
      margin-top: 7px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--tl-muted);
    }

    /* ── Expand button + full text ────────────────── */
    .tl-expand {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 9px;
      padding: 3px 10px;
      background: none;
      border: 1px solid var(--tl-border);
      border-radius: 4px;
      color: var(--tl-muted);
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tl-expand:hover {
      background: var(--tl-surface-hover);
      color: var(--tl-text);
      border-color: rgba(255,255,255,0.2);
    }

    .tl-full {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--tl-border);
      font-size: 13px;
      color: var(--tl-secondary);
      line-height: 1.8;
    }

    .tl-full.open { display: block; }

    .tl-full p + p { margin-top: 10px; }

    /* ── Footer ───────────────────────────────────── */
    .tl-footer {
      margin-top: 36px;
      padding-top: 16px;
      border-top: 1px solid var(--tl-border);
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--tl-muted);
      text-align: center;
      line-height: 1.8;
    }

    /* ── Mobile ───────────────────────────────────── */
    @media (max-width: 520px) {
      .tl-feed {
        padding-left: 0;
      }
      .tl-feed::before { display: none; }
      .tl-time {
        position: static;
        width: auto;
        text-align: left;
        padding-right: 0;
        display: block;
        margin-bottom: 5px;
      }
      .tl-dot { display: none; }
      .tl-entry { margin-bottom: 14px; }
    }
  </style>
</head>
<body>
<div class="tl-root" id="tl-root"></div>

<script>
// ════════════════════════════════════════════════════════════════════
//  ▼▼▼  編輯區：新增或修改事件請編輯此處，最新事件放在最上方  ▼▼▼
// ════════════════════════════════════════════════════════════════════
const TL_CONFIG = {

      source: "美國空軍、衛星圖像"

    {

      source: "《紐約時報》"

    {

      type: "economic",

      summary: "葉門「青年運動」叛軍攻擊沙烏地油輪後，國際油價自今年5月以來首度飆破每桶100美元。川普表示尚未準備與伊朗談停火，並稱船隻損害將由美方掌控的伊朗資產支付。聯合國秘書長古特瑞斯警告中東正被推向「難以想像的邊緣」。",

      source: "美聯社、路透社"
    }
  ]
};
// ════════════════════════════════════════════════════════════════════
//  ▲▲▲  編輯區結束  ▲▲▲
// ════════════════════════════════════════════════════════════════════


// ── Renderer（不需修改） ────────────────────────────────────────────
function h(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function paragraphs(text) {
  return '<p>' + h(text).replace(/\n\n/g, '</p><p>') + '</p>';
}

function typeColor(type) {
  const map = {
    attack: 'var(--c-attack)', diplomatic: 'var(--c-diplomatic)',
    casualties: 'var(--c-casualties)', economic: 'var(--c-economic)',
    statement: 'var(--c-statement)'
  };
  return map[type] || 'var(--tl-muted)';
}

function render() {
  const cfg = TL_CONFIG;

  const header = `
    <header class="tl-header">
      <div class="tl-category">■ ${h(cfg.category)}</div>
      <h1 class="tl-h1">${h(cfg.title)}</h1>
      <div class="tl-meta">
        <span class="tl-live"><span class="tl-live-dot"></span>${cfg.isLive ? '持續更新中' : '更新已結束'}</span>
        <span>${h(cfg.date)}</span>
        ${cfg.context ? `<span class="tl-context">${h(cfg.context)}</span>` : ''}
        <span class="tl-count"><strong>${cfg.events.length}</strong> 則更新</span>
      </div>
    </header>`;

  const entries = cfg.events.map((ev, i) => {
    const label = cfg.typeLabels[ev.type] || ev.type;
    const isFirst = i === 0;
    const accentColor = typeColor(ev.type);
    const borderStyle = isFirst ? `style="border-left:3px solid ${accentColor}"` : '';

    const expandHtml = ev.full ? `
      <button class="tl-expand" onclick="tlToggle(this)"><span>展開全文</span> ▾</button>
      <div class="tl-full">${paragraphs(ev.full)}</div>` : '';

    return `
      <div class="tl-entry" data-type="${h(ev.type)}">
        <div class="tl-time">${h(ev.time)}</div>
        <div class="tl-dot"></div>
        <div class="tl-card" ${borderStyle}>
          <div class="tl-card-top">
            ${isFirst ? '<span class="tl-latest">● 最新</span>' : ''}
            <span class="tl-tag">${h(label)}</span>
          </div>
          <div class="tl-headline">${h(ev.headline)}</div>
          <div class="tl-summary">${h(ev.summary)}</div>
          ${ev.source ? `<div class="tl-source">來源：${h(ev.source)}</div>` : ''}
          ${expandHtml}
        </div>
      </div>`;
  }).join('');

  const footer = `
    <footer class="tl-footer">
      此頁面為${h(cfg.date)}事件彙整，資料來自公開媒體報導<br>
      戰爭即工業力｜交錯地帶 © 2026
    </footer>`;

  document.getElementById('tl-root').innerHTML =
    header + `<div class="tl-feed">${entries}</div>` + footer;
}

function tlToggle(btn) {
  const full = btn.nextElementSibling;
  const open = full.classList.toggle('open');
  btn.innerHTML = open ? '<span>收起全文</span> ▴' : '<span>展開全文</span> ▾';
}

render();
</script>
</body>
</html>
