<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>選情指揮室｜2026 美國期中選舉後台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#1b2742;--ink2:#5b6785;--bg:#e9eefb;--line:#cfd8f0;
  --dem:#2f6bff;--dem-d:#1c47b8;--dem-l:#dde8ff;
  --rep:#f0443f;--rep-d:#b02420;--rep-l:#ffdedd;
  --ind:#8b5cf6;--ind-d:#5b34b8;--ind-l:#ece3ff;
  --gold:#ffc931;--green:#2ecc71;--green-d:#1b8f4c;
  --ff:'Noto Sans TC',system-ui,sans-serif;--mono:'Space Mono',ui-monospace,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html{scroll-behavior:smooth}
body{
  font-family:var(--ff);color:var(--ink);font-size:16px;font-weight:500;
  background:var(--bg) radial-gradient(#cdd7f3 1.5px,transparent 1.5px) 0 0/22px 22px;
  min-height:100vh;-webkit-text-size-adjust:100%;
}
body.lock{overflow:hidden}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
input,select{font-family:inherit}
[hidden]{display:none!important}

/* ── HUD ── */
.hud{
  position:fixed;top:0;left:0;right:0;z-index:40;height:60px;
  background:#fff;border-bottom:3px solid var(--ink);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:0 12px;padding-top:env(safe-area-inset-top,0px);
  box-sizing:content-box;
}
.hud-l{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:40px;height:40px;flex:none;border:3px solid var(--ink);border-radius:12px;
  background:var(--gold);display:grid;place-items:center;font-size:22px;box-shadow:0 3px 0 var(--ink);
}
.hud-t b{display:block;font-size:17px;font-weight:900;line-height:1.1;white-space:nowrap}
.hud-t small{display:block;font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
.hud-t small.warn{color:#d9730d}
.hud-t small.ok{color:var(--green-d)}
.hud-r{display:flex;align-items:center;gap:8px;flex:none}

/* ── Chunky buttons ── */
.gbtn{
  position:relative;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);
  font-size:16px;font-weight:900;min-height:48px;padding:0 16px;
  box-shadow:0 4px 0 var(--ink);transition:transform .06s,box-shadow .06s,background .15s;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.gbtn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.gbtn.green{background:var(--green)}
.gbtn.red{background:#ffd9d8;color:var(--rep-d)}
.gbtn.gold{background:var(--gold)}
.gbtn.sq{width:56px;height:56px;padding:0;font-size:30px;line-height:1;flex:none}
.gbtn.sm{min-height:40px;font-size:14px;padding:0 12px}
.gbtn.sm.sq{width:40px;height:40px;font-size:18px}
.gbtn.block{width:100%}
#push.dirty::after{
  content:'';position:absolute;top:-7px;right:-7px;width:16px;height:16px;border-radius:50%;
  background:#ff5a1f;border:3px solid var(--ink);animation:ping 1.2s infinite;
}
@keyframes ping{50%{transform:scale(1.3)}}
#push.done{background:var(--gold)}

/* ── Layout ── */
.main{padding:calc(76px + env(safe-area-inset-top,0px)) 14px calc(96px + var(--safe-b))}
.view{display:none;max-width:820px;margin:0 auto}
.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.vhead{margin:4px 2px 14px}
.vhead h2{font-size:26px;font-weight:900}
.vhead p{font-size:14px;font-weight:700;color:var(--ink2)}
.panel{
  background:#fff;border:3px solid var(--ink);border-radius:18px;
  box-shadow:0 5px 0 var(--ink);padding:16px;margin-bottom:18px;
}
.panel h3{font-size:17px;font-weight:900;margin-bottom:12px}
.lab{font-size:14px;font-weight:900;color:var(--ink2);margin:14px 0 8px}
.lab:first-child{margin-top:0}
.hint{font-size:13px;font-weight:700;color:var(--ink2);margin-top:8px;line-height:1.5}

/* ── Bottom nav (mobile) / sidebar (desktop) ── */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:#fff;border-top:3px solid var(--ink);padding-bottom:var(--safe-b);
}
.nv{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  min-height:62px;border:0;background:none;font-size:12px;font-weight:900;color:var(--ink2);
}
.nv .ic{font-size:24px;transition:transform .2s}
.nv.on{color:var(--ink);background:linear-gradient(#fff4c8,#ffe27a)}
.nv.on .ic{transform:translateY(-2px) scale(1.15)}

/* ── Seat bar (HP-bar style) ── */
.sbar{
  position:relative;height:36px;border:3px solid var(--ink);border-radius:999px;
  background:#e3e8f5;display:flex;overflow:hidden;
}
.sbar i{display:block;height:100%;transition:width .35s cubic-bezier(.3,1.3,.5,1);position:relative}
.sbar i.sD{background:var(--dem)}
.sbar i.sI{background:var(--ind)}
.sbar i.sU{background:repeating-linear-gradient(135deg,#d8deee 0 6px,#e9edf8 6px 12px)}
.sbar i.sR{background:var(--rep)}
.sbar::after{content:'';position:absolute;left:0;right:0;top:0;height:42%;background:rgba(255,255,255,.28);pointer-events:none}
.sbar .thr{position:absolute;top:-3px;bottom:-3px;width:0;border-left:3px dashed var(--ink);z-index:2}
.board-nums{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;margin-bottom:14px;text-align:center}
.bn b{display:block;font-family:var(--mono);font-size:clamp(40px,12vw,56px);line-height:1;font-weight:700}
.bn span{font-size:14px;font-weight:900}
.bn.D b,.bn.D span{color:var(--dem)}
.bn.R b,.bn.R span{color:var(--rep)}
.bn.mid{padding-bottom:4px}
.bn.mid small{display:block;font-size:12px;font-weight:900;color:var(--ink2)}
.bn.mid b{font-size:26px;color:var(--ink)}
.bn.mid span{display:block;font-size:12px;color:var(--ink2);font-weight:700;margin-top:2px}
.ctrl{margin-top:14px;text-align:center;font-size:15px;font-weight:900}
.chip{display:inline-block;padding:4px 12px;border:3px solid var(--ink);border-radius:999px;font-size:13px;font-weight:900;background:#fff}
.chip.D{background:var(--dem);color:#fff}
.chip.R{background:var(--rep);color:#fff}
.chip.N{background:#e3e8f5;color:var(--ink2)}
.warnbox{margin-top:12px;padding:10px 12px;border:3px solid var(--ink);border-radius:12px;background:#ffe7a6;font-size:14px;font-weight:900}

/* ── Party cards ── */
.pcards{display:grid;gap:18px}
.pcard{margin-bottom:0;--c:var(--dem);--cl:var(--dem-l)}
.pcard.R{--c:var(--rep);--cl:var(--rep-l)}
.pcard.I{--c:var(--ind);--cl:var(--ind-l)}
.pcard{background:var(--cl)}
.phead{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:900;margin-bottom:12px;color:var(--c)}
.phead i{width:22px;height:22px;border-radius:50%;background:var(--c);border:3px solid var(--ink)}

/* ── Stepper ── */
.stp{display:flex;align-items:center;gap:10px}
.stp input{
  flex:1;min-width:0;width:100%;height:56px;text-align:center;
  font:700 30px var(--mono);color:var(--ink);background:#fff;
  border:3px solid var(--ink);border-radius:14px;
}
.stp input:focus{outline:none;box-shadow:0 0 0 4px rgba(47,107,255,.35)}
.stp input:disabled{background:#eef1f8;color:#a3adc6}
.stp.sm .gbtn.sq{width:44px;height:44px;font-size:24px}
.stp.sm input{height:44px;font-size:20px}
.stp .gbtn:disabled{opacity:.4;box-shadow:0 4px 0 var(--ink);transform:none}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pop{animation:pop .25s}
@keyframes pop{40%{transform:scale(1.18)}}

/* ── Text inputs ── */
.tin{
  width:100%;height:50px;padding:0 14px;font-size:16px;font-weight:700;color:var(--ink);
  background:#fff;border:3px solid var(--ink);border-radius:14px;
}
.tin:focus{outline:none;box-shadow:0 0 0 4px rgba(47,107,255,.35)}
.fld{margin-bottom:14px}
.fld:last-child{margin-bottom:0}

/* ── XP-style slider ── */
input[type=range].xp{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;--p:0%}
input[type=range].xp::-webkit-slider-runnable-track{
  height:22px;border:3px solid var(--ink);border-radius:999px;
  background:linear-gradient(to right,var(--gold) var(--p),#e3e8f5 var(--p));
}
input[type=range].xp::-moz-range-track{
  height:16px;border:3px solid var(--ink);border-radius:999px;
  background:linear-gradient(to right,var(--gold) var(--p),#e3e8f5 var(--p));
}
input[type=range].xp::-webkit-slider-thumb{
  -webkit-appearance:none;width:34px;height:34px;margin-top:-10px;border-radius:50%;
  background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);
}
input[type=range].xp::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.xp-row{display:flex;align-items:center;gap:12px}
.xp-val{font:700 22px var(--mono);min-width:64px;text-align:right}

/* ── Choice buttons ── */
.choice{display:grid;gap:10px}
.choice.c2{grid-template-columns:repeat(2,1fr)}
.choice.c3{grid-template-columns:repeat(3,1fr)}
.choice.c4{grid-template-columns:repeat(2,1fr)}
.choice.dis{opacity:.4;pointer-events:none}
.opt{
  white-space:nowrap;--c:var(--ink2);min-height:56px;border:3px solid var(--ink);border-radius:14px;
  background:#fff;color:var(--c);font-size:17px;font-weight:900;box-shadow:0 4px 0 var(--ink);
  transition:transform .06s,box-shadow .06s;-webkit-user-select:none;user-select:none;
}
.opt.D{--c:var(--dem)}.opt.R{--c:var(--rep)}.opt.I{--c:var(--ind)}.opt.Y{--c:var(--green-d)}.opt.W{--c:#c47d00}
.opt.sel{background:var(--c);color:#fff;transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt.N.sel{background:var(--ink2)}
.opt:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.seg{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.seg .opt{flex:1;min-height:46px;font-size:15px;min-width:76px}

/* ── Tile map ── */
.tiles{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;max-width:720px;margin:0 auto}
.tile{
  --c:#e1e6f2;--c2:#e1e6f2;
  aspect-ratio:1;min-width:0;padding:0;position:relative;
  border:2.5px solid var(--ink);border-radius:9px;color:#fff;
  font:700 clamp(11px,3.3vw,17px) var(--mono);text-shadow:0 1px 0 rgba(0,0,0,.35);
  background:repeating-linear-gradient(135deg,var(--c) 0 6px,var(--c2) 6px 12px);
  box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;
}
.tile:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.tile.t-D{--c:var(--dem);--c2:#7ea2ff}
.tile.t-R{--c:var(--rep);--c2:#f98e8a}
.tile.t-I{--c:var(--ind);--c2:#b99bfb}
.tile.called{background:var(--c)}
.tile.t-N{border-style:dashed;color:#7b87a6;text-shadow:none;background:#eef1f8}
.tile.has{outline:3px solid var(--gold);outline-offset:1px}
.tile.flash{animation:pop .3s}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;margin-top:16px;font-size:13px;font-weight:900;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend u{width:20px;height:20px;border:2.5px solid var(--ink);border-radius:6px;display:block}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;text-align:center}
.sum div{border:3px solid var(--ink);border-radius:14px;padding:8px 2px;background:#fff;box-shadow:0 3px 0 var(--ink)}
.sum b{display:block;font:700 24px var(--mono);line-height:1.1}
.sum small{font-size:12px;font-weight:900}
.sum .D b,.sum .D small{color:var(--dem)}
.sum .R b,.sum .R small{color:var(--rep)}
.sum .I b,.sum .I small{color:var(--ind)}
.sum .N b,.sum .N small{color:var(--ink2)}

/* ── Races ── */
.race{border:3px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 5px 0 var(--ink);margin-bottom:18px;overflow:hidden}
.race-h{
  width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;border:0;background:none;text-align:left;color:var(--ink);
}
.badge{
  flex:none;min-width:46px;text-align:center;padding:6px 6px;border:3px solid var(--ink);border-radius:10px;
  background:var(--gold);font:700 16px var(--mono);
}
.rn{flex:1;min-width:0}
.rn b{display:block;font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rn i{font-style:normal;font-size:12px;font-weight:700;color:var(--ink2)}
.rs{flex:none}
.chev{flex:none;font-size:18px;transition:transform .2s}
.race.open .chev{transform:rotate(180deg)}
.tug{display:flex;height:34px;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.race:not(.open) .tug{border-bottom:0}
.tug i{display:flex;align-items:center;transition:width .3s;overflow:hidden;font-style:normal}
.tug .tD{background:var(--dem);color:#fff;justify-content:flex-start;padding-left:10px}
.tug .tR{background:var(--rep);color:#fff;justify-content:flex-end;padding-right:10px}
.tug b{font:700 15px var(--mono);white-space:nowrap}
.race-b{padding:16px 14px 18px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vs>div{border:3px solid var(--ink);border-radius:14px;padding:10px}
.vs .sd{background:var(--dem-l)}
.vs .sr{background:var(--rep-l)}
.vs .t{font-size:14px;font-weight:900;margin-bottom:8px;text-align:center}
.vs .sd .t{color:var(--dem)}
.vs .sr .t{color:var(--rep)}
.vs .stp{flex-wrap:wrap;gap:8px}
.vs .stp input{order:-1;flex:1 0 100%;font-size:24px;height:50px}
.vs .stp .gbtn.sq{flex:1;width:auto;height:44px;font-size:24px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;font-size:15px;font-weight:900}
.sw{
  width:64px;height:36px;border:3px solid var(--ink);border-radius:999px;background:#d8deee;position:relative;
  transition:background .2s;flex:none;box-shadow:0 3px 0 var(--ink);
}
.sw::after{
  content:'';position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;
  background:#fff;border:3px solid var(--ink);transition:transform .2s;
}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(28px)}
.empty{text-align:center;padding:36px 12px;color:var(--ink2);font-weight:900;line-height:1.7}
.empty b{display:block;font-size:42px;margin-bottom:6px}

/* ── Home board cards ── */
.hboard{display:block;width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.hboard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.hb-t{display:flex;align-items:center;justify-content:space-between;font-size:18px;font-weight:900;margin-bottom:10px}
.hb-n{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.hb-n b{font:700 34px var(--mono);line-height:1}
.hb-n .D{color:var(--dem)}.hb-n .R{color:var(--rep)}
.hb-n span{font-size:13px;font-weight:900;color:var(--ink2)}
.timebox{display:flex;align-items:center;gap:12px}
.timebox .big{font:700 22px var(--mono)}
.linkrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details.panel summary{font-size:16px;font-weight:900;cursor:pointer;list-style:none}
details.panel summary::-webkit-details-marker{display:none}
details.panel pre{
  margin-top:12px;max-height:320px;overflow:auto;background:#f4f6fc;border:3px solid var(--ink);
  border-radius:12px;padding:12px;font:700 12px/1.55 var(--mono);color:#1e40af;
}

/* ── Overlay / sheet ── */
.ov{
  position:fixed;inset:0;z-index:60;background:rgba(27,39,66,.55);
  display:none;align-items:flex-end;justify-content:center;
}
.ov.show{display:flex}
.sheet{
  width:100%;max-width:540px;max-height:90vh;overflow-y:auto;background:#fff;
  border:3px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;
  padding:18px 16px calc(18px + var(--safe-b));animation:up .22s cubic-bezier(.2,1.1,.4,1);
}
@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.sh-t{display:flex;align-items:center;gap:12px;min-width:0}
.sh-t b{display:block;font-size:22px;font-weight:900}
.sh-t small{font-size:13px;font-weight:700;color:var(--ink2)}
.sh-t .tile{width:52px;flex:none;cursor:default}
.sh-nav{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px;margin-top:20px}
.menu{display:grid;gap:12px;margin-top:12px}
.menu .gbtn{justify-content:flex-start;min-height:54px}
.ov.center{align-items:center;padding:16px}
.ov.center .sheet{border:3px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink)}
.codebox{background:#f4f6fc;border:3px solid var(--ink);border-radius:12px;padding:12px;font-size:14px;font-weight:700;line-height:2;margin:10px 0 14px}
.codebox code{background:#ffe7a6;border-radius:6px;padding:1px 6px;font-family:var(--mono);font-size:13px}
.codebox a{color:var(--dem);font-weight:900}
#auth-result{margin-top:12px;font-size:14px;font-weight:700;line-height:1.7}

/* ── Toast ── */
#toasts{position:fixed;left:0;right:0;top:calc(70px + env(safe-area-inset-top,0px));z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{
  background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);
  padding:10px 16px;font-size:15px;font-weight:900;max-width:440px;animation:drop .25s cubic-bezier(.2,1.3,.4,1);
}
.toast.ok{background:#c9f7dc}.toast.err{background:#ffd9d8}.toast.info{background:#fff4c8}
@keyframes drop{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}
.spin{display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Desktop ── */
@media(min-width:900px){
  .hud{padding-left:20px;padding-right:20px}
  .nav{top:calc(63px + env(safe-area-inset-top,0px));bottom:0;right:auto;width:210px;flex-direction:column;border-top:0;border-right:3px solid var(--ink);padding:16px 12px;gap:10px;align-content:flex-start}
  .nv{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;min-height:0;padding:12px 14px;border-radius:14px;font-size:17px;border:3px solid transparent}
  .nv.on{border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
  .main{margin-left:210px;padding:calc(88px + env(safe-area-inset-top,0px)) 32px 48px}
  .pcards{grid-template-columns:repeat(3,1fr)}
  .ov{align-items:center}
  .sheet{border-bottom:3px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink)}
}
@media(max-width:380px){
  .hud-t small{display:none}
  .gbtn{padding:0 12px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="hud">
  <div class="hud-l">
    <div class="logo">🗳</div>
    <div class="hud-t"><b>選情指揮室</b><small id="hud-sub">載入中…</small></div>
  </div>
  <div class="hud-r">
    <button class="gbtn sm sq" onclick="openMenu()" aria-label="工具箱">⚙</button>

<script>
/* ═══════════ CONFIG ═══════════ */
const REPO='kayhase015497/war-industry-news';

function toast(msg,type='info'){
  const el=document.createElement('div');

/* ═══════════ AUTH ═══════════ */
const getToken=()=>{try{return sessionStorage.getItem('gh_token')||''}catch(e){return ''}};
function showAuth(){$('auth-result').hidden=true;$('auth-ov').classList.add('show')}
function saveToken(){
  const v=$('token-input').value.trim();
  if(!v){toast('請先貼上 Token','err');return}
  try{sessionStorage.setItem('gh_token',v)}catch(e){}
  $('auth-ov').classList.remove('show');
  renderHUD();toast('已登入，正在載入資料…','info');
  loadFromGitHub(true);
}
function skipAuth(){$('auth-ov').classList.remove('show');renderHUD();loadFromGitHub(true)}

async function testConnection(){
  const token=$('token-input').value.trim()||getToken();
  const out=$('auth-result');out.hidden=false;out.textContent='⟳ 測試中…';
  const H={Authorization:`token ${token}`,Accept:'application/vnd.github.v3+json'};
  const steps=[];
  const run=async(label,url,okFn,hint)=>{
    try{
      const r=await fetch(url,{headers:H});const j=await r.json().catch(()=>({}));
      if(r.ok){steps.push('✅ '+okFn(j));if(url===API_URL)githubSHA=j.sha}
      else steps.push(`❌ ${label}失敗（${r.status}）${j.message||''}${hint||''}`);
    }catch(e){steps.push('❌ 網路錯誤：'+e.message)}
  };
  await run('讀取 Repo',`https://api.github.com/repos/${REPO}`,j=>`Repo 正常（${j.full_name}）`,' → Token 可能沒勾選 repo');
  await run('讀取資料檔',API_URL,j=>`資料檔可讀（${j.sha.slice(0,7)}）`);
  await run('取得使用者','https://api.github.com/user',j=>`登入身分：${j.login}`);
  const ok=steps.every(s=>s.startsWith('✅'));
  out.innerHTML=steps.map(s=>`<div>${esc(s)}</div>`).join('')+
    `<div style="margin-top:8px;font-weight:900;color:${ok?'var(--green-d)':'var(--rep-d)'}">${ok?'✅ 連線正常，可以存檔！':'⚠️ 有錯誤，請檢查 Token 設定'}</div>`;
}
function runDiagnostic(){
  if(!getToken()){showAuth();return}
  $('token-input').value=getToken();
  showAuth();testConnection();
}

/* ═══════════ LOAD / SAVE ═══════════ */
function toBase64(str){
  const bytes=new TextEncoder().encode(str);let bin='';
  bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin);
}
async function fetchFileSHA(token){
  const headers={Accept:'application/vnd.github.v3+json'};
  if(token)headers.Authorization=`token ${token}`;
  const res=await fetch(API_URL,{headers});
  if(!res.ok){
    const b=await res.json().catch(()=>({}));
    throw new Error(`取得檔案資訊失敗 HTTP ${res.status} ${b.message||''}`);
  }
  return (await res.json()).sha;
}

function normalize(){
  data.meta=data.meta||{};
  Object.keys(CH).forEach(ch=>{
    const d=data[ch]=data[ch]||{};
    d.total=d.total||CH[ch].total;d.threshold=d.threshold||CH[ch].thr;
    PARTIES.forEach(([k,l])=>{
      d[k]=d[k]||{label:l};
      d[k].seats=parseInt(d[k].seats)||0;d[k].net=parseInt(d[k].net)||0;
    });
  });
  data.states=data.states||{};
  STATE_ABBRS.forEach(a=>{
    if(!data.states[a])data.states[a]={winner:null,called:false,margin:null,office:'Senate'};
  });
  data.keyRaces=data.keyRaces||[];
  data.keyRaces.forEach(r=>{
    r.dem=r.dem||{name:'',pct:0,votes:0};r.rep=r.rep||{name:'',pct:0,votes:0};
    r.winner=r.winner||null;
  });
}

async function loadFromGitHub(force){
  if(dirty&&!force&&!confirm('目前有尚未存檔的修改，重新載入會全部放棄。確定嗎？'))return;
  $('hud-sub').textContent='載入中…';
  try{
    const token=getToken();
    const headers={Accept:'application/vnd.github.v3+json'};
    if(token)headers.Authorization=`token ${token}`;
    const res=await fetch(API_URL,{headers});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const meta=await res.json();
    githubSHA=meta.sha;
    const bytes=Uint8Array.from(atob(meta.content.replace(/\n/g,'')),c=>c.charCodeAt(0));
    data=JSON.parse(new TextDecoder().decode(bytes));
    toast('已載入最新資料','ok');
  }catch(e){
    try{
      const res=await fetch(RAW_URL+'?_='+Date.now());
      if(!res.ok)throw new Error('HTTP '+res.status);
      data=await res.json();githubSHA=null;
      toast('已載入資料（目前是唯讀）','info');
    }catch(e2){
      $('hud-sub').textContent='載入失敗';
      $('v-home').innerHTML=`<div class="empty"><b>😵</b>資料載入失敗（${esc(e2.message)}）<br>請按右上角 ⚙ 重新載入</div>`;
      return;
    }
  }
  normalize();dirty=false;openRace=-1;
  renderAll();renderHUD();
}

function etISO(d=new Date()){
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{
    timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false
  }).formatToParts(d).map(x=>[x.type,x.value]));
  const hh=p.hour==='24'?'00':p.hour;
  const asUTC=Date.UTC(+p.year,+p.month-1,+p.day,+hh,+p.minute,+p.second);
  const off=Math.round((asUTC-Math.floor(d.getTime()/1000)*1000)/60000);
  const a=Math.abs(off);
  return `${p.year}-${p.month}-${p.day}T${hh}:${p.minute}:${p.second}${off<0?'-':'+'}${String(Math.floor(a/60)).padStart(2,'0')}:${String(a%60).padStart(2,'0')}`;
}

function seatSum(d){return PARTIES.reduce((s,[k])=>s+(d[k].seats||0),0)}
function ctrlOf(ch){
  const d=data[ch];
  return d.dem.seats>=d.threshold?'D':d.rep.seats>=d.threshold?'R':'?';
}
function buildJSON(forPush){
  const out=JSON.parse(JSON.stringify(data));
  Object.keys(CH).forEach(ch=>{
    const d=out[ch];
    d.uncalled=Math.max(0,d.total-seatSum(d));
    d.currentControl=ctrlOf(ch);
  });
  if(forPush)out.meta.lastUpdated=etISO();
  return out;
}
function validate(){
  for(const ch of Object.keys(CH)){
    const d=data[ch];
    if(seatSum(d)>d.total){
      goTab(ch);toast(`${CH[ch].label}三黨席次加總超過 ${d.total}，請先修正`,'err');return false;
    }
  }
  return true;
}

async function pushToGitHub(){
  const token=getToken();
  if(!data){toast('資料還沒載入完成','err');return}
  if(!token){toast('請先登入 GitHub 才能存檔','err');showAuth();return}
  if(!validate())return;
  const btn=$('push');btn.disabled=true;btn.innerHTML='<span class="spin">⟳</span> 上傳中…';
  try{
    if(!githubSHA)githubSHA=await fetchFileSHA(token);
    const payload=buildJSON(true);
    const now=new Date().toLocaleString('zh-TW',{timeZone:'America/New_York',hour12:false}).replace(',','');
    const res=await fetch(API_URL,{
      method:'PUT',
      headers:{Authorization:`token ${token}`,'Content-Type':'application/json',Accept:'application/vnd.github.v3+json'},
      body:JSON.stringify({
        message:`chore: 更新選舉開票結果 ${now} ET`,
        content:toBase64(JSON.stringify(payload,null,2)),
        sha:githubSHA,branch:'main'
      })
    });
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.message||'HTTP '+res.status)}
    githubSHA=(await res.json()).content.sha;
    data.meta.lastUpdated=payload.meta.lastUpdated;
    dirty=false;renderHUD();renderHome();
    toast('✓ 已上線！前台約 2 分鐘後更新','ok');
    btn.classList.add('done');btn.innerHTML='🎉 已上線！';vib();
    setTimeout(()=>{btn.classList.remove('done');btn.innerHTML='⬆ 存檔上線'},2200);
    btn.disabled=false;return;
  }catch(e){
    githubSHA=null;
    const m=e.message||'';
    if(/does not match|conflict/i.test(m))toast('版本衝突（可能有人同時更新），請再按一次存檔','err');
    else if(/404|Not Found/.test(m))toast('存檔失敗：Token 缺少 repo 權限，請到 ⚙ 做連線診斷','err');
    else if(/401|Bad credentials/.test(m))toast('存檔失敗：Token 無效或過期，請重新登入','err');
    else toast('存檔失敗：'+m,'err');
    console.error('[push]',e);
  }
  btn.disabled=false;btn.innerHTML='⬆ 存檔上線';
}

/* ═══════════ HUD / NAV ═══════════ */
function markDirty(){if(!dirty){dirty=true;renderHUD()}}
function renderHUD(){
  const sub=$('hud-sub');

  else if(getToken()){sub.textContent='✓ 已同步';sub.className='ok'}

}

/* ═══════════ HOLD-TO-REPEAT STEPPER ═══════════ */
let holdT=null,holdI=null;
function holdStart(fn,dir){
  holdEnd();fn(dir);
  holdT=setTimeout(()=>{let n=0;holdI=setInterval(()=>{n++;fn(dir*(n>20?5:1))},90)},420);
}
function holdEnd(){clearTimeout(holdT);clearInterval(holdI);holdT=holdI=null}
window.addEventListener('pointerup',holdEnd);
window.addEventListener('blur',holdEnd);
function holdAttrs(fn,dir){
  return `onpointerdown="holdStart(${fn},${dir})" onpointerup="holdEnd()" onpointerleave="holdEnd()" onpointercancel="holdEnd()" onclick="if(event.detail===0)(${fn})(${dir})" oncontextmenu="return false"`;
}
function stepper(o){
  return `<div class="stp${o.small?' sm':''}">
    <button type="button" class="gbtn sq" aria-label="減少" ${o.off?'disabled':''} ${holdAttrs(o.fn,-1)}>−</button>
    <input id="${o.id}" type="number" inputmode="${o.dec?'decimal':'numeric'}" step="${o.step||1}" value="${o.value}" ${o.off?'disabled':''} oninput="${o.oninput}" onfocus="this.select()">
    <button type="button" class="gbtn sq" aria-label="增加" ${o.off?'disabled':''} ${holdAttrs(o.fn,1)}>＋</button>
  </div>`;
}
function setIn(id,v){const el=$(id);if(el&&document.activeElement!==el)el.value=v}
function bump(id){const el=$(id);if(!el)return;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}

function barHTML(id,ch){
  const thr=CH[ch].thr/CH[ch].total*100;
  return `<div class="sbar" id="${id}"><i class="sD"></i><i class="sI"></i><i class="sU"></i><i class="sR"></i><u class="thr" style="left:${thr}%"></u></div>`;
}
function paintBar(id,ch){
  const el=$(id);if(!el)return;
  const d=data[ch],t=d.total;
  const w=s=>(s/t*100)+'%';
  const dS=d.dem.seats,iS=d.ind.seats,rS=d.rep.seats,u=Math.max(0,t-dS-iS-rS);
  el.querySelector('.sD').style.width=w(dS);
  el.querySelector('.sI').style.width=w(iS);
  el.querySelector('.sU').style.width=w(u);
  el.querySelector('.sR').style.width=w(rS);
}
function ctrlChip(ch){
  const c=ctrlOf(ch);
  return c==='D'?'<span class="chip D">民主黨過半</span>':c==='R'?'<span class="chip R">共和黨過半</span>':'<span class="chip N">尚無過半</span>';

function twTime(iso){
  const d=new Date(iso);if(isNaN(d))return '—';
  return d.toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
}
function renderHome(){
  const m=data.meta;
  const pctM=(m.reporting||'').match(/(\d{1,3})\s*%/);
  const pct=pctM?clamp(+pctM[1],0,100):0;
  $('v-home').innerHTML=`

  <button class="panel hboard" onclick="goTab('${ch}')">
    <div class="hb-t"><span>${CH[ch].ico} ${CH[ch].label}</span><span id="hc-${ch}"></span></div>
    <div class="hb-n"><b class="D" id="hd-${ch}">0</b><span id="hu-${ch}"></span><b class="R" id="hr-${ch}">0</b></div>
    ${barHTML('hsb-'+ch,ch)}
  </button>`).join('')}

  <div class="panel">
    <h3>📡 開票進度</h3>
    <div class="xp-row">
      <input type="range" class="xp" id="rep-slider" min="0" max="100" value="${pct}" style="--p:${pct}%"
        oninput="setReportingPct(this.value)">
      <div class="xp-val" id="rep-val">${pct}%</div>
    </div>
    <div class="fld" style="margin-top:12px"><input class="tin" id="f-reporting" value="${esc(m.reporting||'')}" placeholder="前台顯示的文字，例如：已開出 52% 選區" oninput="setMeta('reporting',this.value)"></div>
    <p class="hint">拉動滑桿會自動改寫上方文字，也可以直接手動輸入。</p>
  </div>

  <div class="panel">
    <h3>📝 頁面文字</h3>
    <div class="fld"><div class="lab">資料來源</div><input class="tin" value="${esc(m.source||'')}" placeholder="美聯社、各州選務委員會" oninput="setMeta('source',this.value)"></div>
    <div class="fld"><div class="lab">頁面底部備註</div><input class="tin" value="${esc(m.note||'')}" placeholder="* 標記席位仍在計票中" oninput="setMeta('note',this.value)"></div>
  </div>

  <div class="panel">
    <h3>🕒 最後更新</h3>
    <div class="timebox"><span class="big" id="last-time">${twTime(m.lastUpdated)}</span><span class="hint" style="margin:0">台灣時間</span></div>
    <p class="hint">按「存檔上線」時會自動更新為現在時間，不用手動改。</p>
  </div>

  <details class="panel" ontoggle="if(this.open)$('json-pre').textContent=JSON.stringify(buildJSON(),null,2)">
    <summary>🔧 進階：JSON 預覽</summary>
    <pre id="json-pre"></pre>
  </details>`;
  Object.keys(CH).forEach(paintChamber);
}
function setMeta(k,v){data.meta[k]=v;markDirty()}
function setReportingPct(v){
  v=clamp(parseInt(v)||0,0,100);
  $('rep-slider').style.setProperty('--p',v+'%');$('rep-val').textContent=v+'%';
  const t=`已開出 ${v}% 選區`;data.meta.reporting=t;$('f-reporting').value=t;markDirty();
}

/* ═══════════ CHAMBER ═══════════ */
function renderChamber(ch){
  const c=CH[ch],d=data[ch];
  $('v-'+ch).innerHTML=`
  <div class="vhead"><h2>${c.ico} ${c.label}</h2><p>共 ${d.total} 席・過半 ${d.threshold} 席</p></div>
  <div class="panel">
    <div class="board-nums">
      <div class="bn D"><b id="bn-${ch}-dem">0</b><span>民主黨</span></div>
      <div class="bn mid"><small>過半</small><b>${d.threshold}</b><span id="bu-${ch}"></span></div>
      <div class="bn R"><b id="bn-${ch}-rep">0</b><span>共和黨</span></div>
    </div>
    ${barHTML('sb-'+ch,ch)}
    <div class="ctrl" id="ctrl-${ch}"></div>
    <div class="warnbox" id="warn-${ch}" hidden></div>
  </div>
  <div class="pcards">
  ${PARTIES.map(([k,label,cls])=>`
    <div class="panel pcard ${cls}">
      <div class="phead"><i></i>${label}</div>
      <div class="lab">確認席次</div>
      ${stepper({id:`seat-${ch}-${k}`,value:data[ch][k].seats,fn:`d=>stepSeat('${ch}','${k}','seats',d)`,oninput:`setSeat('${ch}','${k}','seats',this.value)`})}    </div>`).join('')}
  </div>
  <p class="hint" style="text-align:center;margin-top:14px">未確定席次與「誰過半」由系統自動計算，不用填。</p>`;
  paintChamber(ch);
}
function setSeat(ch,k,f,v){
  const d=data[ch],t=d.total;
  let n=parseInt(v);if(isNaN(n))n=0;
  n=f==='seats'?clamp(n,0,t):clamp(n,-t,t);
  d[k][f]=n;markDirty();paintChamber(ch);
  if(f==='seats'||document.activeElement!==$(`${f==='seats'?'seat':'net'}-${ch}-${k}`))bump(`${f==='seats'?'seat':'net'}-${ch}-${k}`);
}
function stepSeat(ch,k,f,delta){
  const d=data[ch],t=d.total;
  d[k][f]=f==='seats'?clamp(d[k][f]+delta,0,t):clamp(d[k][f]+delta,-t,t);
  setIn(`${f==='seats'?'seat':'net'}-${ch}-${k}`,d[k][f]);
  markDirty();paintChamber(ch);vib();
}
function paintChamber(ch){
  const d=data[ch];if(!d)return;
  const sum=seatSum(d),unc=Math.max(0,d.total-sum);
  const set=(id,t)=>{const e=$(id);if(e)e.textContent=t};
  set(`bn-${ch}-dem`,d.dem.seats);set(`bn-${ch}-rep`,d.rep.seats);
  set(`bu-${ch}`,unc?`未確定 ${unc}`:'全數確定');
  set(`hd-${ch}`,d.dem.seats);set(`hr-${ch}`,d.rep.seats);set(`hu-${ch}`,unc?`未確定 ${unc}`:'全數確定');
  paintBar('sb-'+ch,ch);paintBar('hsb-'+ch,ch);
  const chip=ctrlChip(ch);
  const c1=$(`ctrl-${ch}`),c2=$(`hc-${ch}`);
  if(c1)c1.innerHTML=chip;if(c2)c2.innerHTML=chip;
  const w=$(`warn-${ch}`);
  if(w){
    w.hidden=sum<=d.total;
    w.textContent=`⚠️ 三黨席次加總 ${sum}，超過 ${d.total} 席，請檢查`;
  }
}

/* ═══════════ STATES (tile map) ═══════════ */
function tileHTML(a,click,extra='',withId=false){
  const s=data.states[a],w=s.winner||'N',g=GRID.find(x=>x[0]===a);
  return `<button class="tile t-${w}${s.called?' called':''} ${extra}"${withId?` id="tile-${a}"`:''} style="grid-column:${g[1]+1};grid-row:${g[2]+1}" onclick="${click}">${a}</button>`;
}
function renderStates(){
  $('v-states').innerHTML=`
  <div class="vhead"><h2>🗺 各州地圖</h2><p>點任一州，設定誰贏、是否確定</p></div>
  <div class="sum" id="st-sum"></div>
  <div class="panel"><div class="tiles">${GRID.map(g=>tileHTML(g[0],`openState('${g[0]}')`,'',true)).join('')}</div>
    <div class="legend">
      <span><u style="background:var(--dem)"></u>已確定</span>
      <span><u style="background:repeating-linear-gradient(135deg,#2f6bff 0 4px,#7ea2ff 4px 8px)"></u>計票中領先</span>
      <span><u style="background:#eef1f8;border-style:dashed"></u>未定</span>
    </div>
  </div>`;
  paintSummary();
}
function paintSummary(){
  const c={D:0,R:0,I:0,N:0};
  STATE_ABBRS.forEach(a=>{c[data.states[a].winner||'N']++});
  const el=$('st-sum');if(!el)return;
  el.innerHTML=`<div class="D"><b>${c.D}</b><small>民主黨</small></div><div class="R"><b>${c.R}</b><small>共和黨</small></div><div class="I"><b>${c.I}</b><small>獨立</small></div><div class="N"><b>${c.N}</b><small>未定</small></div>`;
}
function paintTile(a){
  const el=$('tile-'+a);if(!el)return;
  const s=data.states[a],w=s.winner||'N';
  el.className=`tile t-${w}${s.called?' called':''} flash`;
  el.textContent=a;
  paintSummary();
}
function openState(a){curState=a;renderStateSheet()}
function renderStateSheet(){
  const a=curState,s=data.states[a],w=s.winner||'N',i=STATE_ABBRS.indexOf(a);
  const prev=STATE_ABBRS[(i+STATE_ABBRS.length-1)%STATE_ABBRS.length],next=STATE_ABBRS[(i+1)%STATE_ABBRS.length];
  const status=w==='N'?'尚無結果':s.called?'結果已確定':'計票中・目前領先';
  const o=(v,label,cls,cur,fn)=>`<button type="button" class="opt ${cls}${cur===v?' sel':''}" onclick="${fn}">${cur===v?'✓ ':''}${label}</button>`;
  openSheet(`
  <div class="sh-h">
    <div class="sh-t"><span class="tile t-${w}${s.called?' called':''}" style="display:grid;place-items:center">${a}</span><div><b>${STATE_NAMES[a]}</b><small>${status}</small></div></div>
    <button class="gbtn sm sq" onclick="closeSheet()">✕</button>
  </div>
  <div class="lab">誰贏（或目前領先）？</div>
  <div class="choice c4">
    ${o('D','民主黨','D',w,`setStateWinner('${a}','D')`)}
    ${o('R','共和黨','R',w,`setStateWinner('${a}','R')`)}
    ${o('I','獨立','I',w,`setStateWinner('${a}','I')`)}
    ${o('N','未定','N',w,`setStateWinner('${a}','N')`)}
  </div>
  <div class="lab">結果確定了嗎？${w==='N'?'（先選上面的勝方）':''}</div>
  <div class="choice c2${w==='N'?' dis':''}">
    ${o('0','🕐 計票中','W',s.called?'1':'0',`setStateCalled('${a}',false)`)}
    ${o('1','✅ 已確定','Y',s.called?'1':'0',`setStateCalled('${a}',true)`)}
  </div>
  <div class="lab">領先差距 %（選填）</div>
  ${stepper({id:'margin-in',dec:1,step:0.5,value:s.margin??'',off:w==='N',fn:`d=>stepMargin('${a}',d)`,oninput:`setMargin('${a}',this.value)`})}
  <div class="sh-nav">
    <button class="gbtn" onclick="openState('${prev}')">◀ ${prev}</button>
    <button class="gbtn green" onclick="closeSheet()">完成</button>
    <button class="gbtn" onclick="openState('${next}')">${next} ▶</button>
  </div>`);
}
function setStateWinner(a,w){
  const s=data.states[a];
  s.winner=w==='N'?null:w;
  if(w==='N'){s.called=false;s.margin=null}
  markDirty();vib();paintTile(a);renderStateSheet();
}
function setStateCalled(a,b){
  const s=data.states[a];if(!s.winner)return;
  s.called=b;markDirty();vib();paintTile(a);renderStateSheet();
}
function setMargin(a,v){
  const n=parseFloat(v);
  data.states[a].margin=isNaN(n)?null:clamp(r1(n),0,100);markDirty();
}
function stepMargin(a,d){
  const s=data.states[a];
  s.margin=clamp(r1((s.margin||0)+d*0.5),0,100);
  setIn('margin-in',s.margin);markDirty();vib();
}

/* ═══════════ RACES ═══════════ */
function raceChip(r){
  return r.winner==='D'?'<span class="chip D rs">民主勝</span>':r.winner==='R'?'<span class="chip R rs">共和勝</span>':'<span class="chip N rs">計票中</span>';
}
function tugHTML(r,i){
  const d=+r.dem.pct||0,p=+r.rep.pct||0,t=d+p,dw=t?d/t*100:50;
  return `<div class="tug" id="tug-${i}"><i class="tD" style="width:${dw}%"><b>${d?d.toFixed(1)+'%':'—'}</b></i><i class="tR" style="width:${100-dw}%"><b>${p?p.toFixed(1)+'%':'—'}</b></i></div>`;
}
function raceHTML(r,i){
  const open=i===openRace;
  const rep=clamp(+r.reporting||0,0,100);
  const o=(v,label,cls)=>{
    const cur=r.winner||'N';
    return `<button type="button" class="opt ${cls}${cur===v?' sel':''}" onclick="setRaceResult(${i},'${v}')">${cur===v?'✓ ':''}${label}</button>`;
  };
  const side=(k,cls,label)=>`
    <div class="${cls}"><div class="t">${label}得票率 %</div>
      ${stepper({dec:1,step:0.5,id:`rp-${i}-${k}`,value:r[k].pct||'',fn:`d=>stepRacePct(${i},'${k}',d)`,oninput:`setRacePct(${i},'${k}',this.value)`})}
    </div>`;
  return `
  <div class="race${open?' open':''}" id="race-${i}">
    <button class="race-h" onclick="toggleRace(${i})">
      <span class="badge">${esc(r.state)}</span>
      <span class="rn"><b>${esc(r.stateName)}</b><i>${OFFICE_LABEL[r.office]||esc(r.office)}</i></span>
      <span id="rc-${i}">${raceChip(r)}</span>
      <span class="chev">▾</span>
    </button>
    ${tugHTML(r,i)}
    ${open?`
    <div class="race-b">
      <div class="vs">${side('dem','sd','民主黨')}${side('rep','sr','共和黨')}</div>
      <div class="lab">開票進度</div>
      <div class="xp-row">
        <input type="range" class="xp" min="0" max="100" value="${rep}" style="--p:${rep}%" oninput="setRaceReporting(${i},this.value)">
        <div class="xp-val" id="rr-${i}">${rep}%</div>
      </div>
      <div class="lab">結果</div>
      <div class="choice c3">${o('N','計票中','N')}${o('D','民主勝','D')}${o('R','共和勝','R')}</div>
      <div class="switch"><span>🔥 標示為激烈戰區</span><button type="button" class="sw${r.competitive?' on':''}" onclick="toggleCompetitive(${i})" aria-label="切換"></button></div>
      <button class="gbtn red block" style="margin-top:20px" onclick="removeRace(${i})">🗑 刪除這個戰區</button>
    </div>`:''}
  </div>`;
}
function renderRaces(){
  const list=data.keyRaces.map((r,i)=>({r,i})).filter(x=>raceFilter==='all'||x.r.office===raceFilter);
  const seg=(v,l)=>`<button type="button" class="opt${raceFilter===v?' sel':''}" onclick="setRaceFilter('${v}')">${l}</button>`;
  $('v-races').innerHTML=`
  <div class="vhead"><h2>⚔️ 關鍵戰區</h2><p>點卡片展開編輯得票率與結果</p></div>
  <div class="seg">${seg('all','全部')}${seg('Senate','參議院')}${seg('House','眾議院')}</div>
  <button class="gbtn gold block" style="margin-bottom:18px" onclick="openAddRace()">＋ 新增戰區</button>
  ${list.length?list.map(x=>raceHTML(x.r,x.i)).join(''):'<div class="empty"><b>🏳️</b>這裡還沒有戰區<br>按上方「＋ 新增戰區」</div>'}`;
}
function setRaceFilter(v){raceFilter=v;renderRaces()}
function toggleRace(i){openRace=openRace===i?-1:i;renderRaces();if(openRace===i)$('race-'+i).scrollIntoView({block:'nearest'})}
function refreshRace(i){
  const r=data.keyRaces[i];
  const t=$('tug-'+i);if(t)t.outerHTML=tugHTML(r,i);
  const c=$('rc-'+i);if(c)c.innerHTML=raceChip(r);
}
function setRacePct(i,k,v){
  const n=parseFloat(v);
  data.keyRaces[i][k].pct=isNaN(n)?0:clamp(r1(n),0,100);
  markDirty();refreshRace(i);
}
function stepRacePct(i,k,d){
  const r=data.keyRaces[i];
  r[k].pct=clamp(r1((r[k].pct||0)+d*0.5),0,100);
  setIn(`rp-${i}-${k}`,r[k].pct);markDirty();refreshRace(i);vib();
}
function setRaceReporting(i,v){
  v=clamp(parseInt(v)||0,0,100);
  data.keyRaces[i].reporting=v;
  const el=$('rr-'+i);if(el){el.textContent=v+'%';el.previousElementSibling.style.setProperty('--p',v+'%')}
  markDirty();
}
function setRaceResult(i,w){
  const r=data.keyRaces[i];
  if(w==='N'){r.winner=null;r.called=false}else{r.winner=w;r.called=true}
  markDirty();vib();renderRaces();
}
function toggleCompetitive(i){
  const r=data.keyRaces[i];r.competitive=!r.competitive;markDirty();vib();renderRaces();
}
function removeRace(i){
  const r=data.keyRaces[i];
  if(!confirm(`確定刪除「${r.stateName}・${OFFICE_LABEL[r.office]||r.office}」？`))return;
  data.keyRaces.splice(i,1);openRace=-1;markDirty();renderRaces();
}
function openAddRace(){renderAddSheet()}
function renderAddSheet(){
  const seg=(v,l)=>`<button type="button" class="opt${addOffice===v?' sel':''}" onclick="addOffice='${v}';renderAddSheet()">${l}</button>`;
  const has=a=>data.keyRaces.some(r=>r.state===a&&r.office===addOffice);
  openSheet(`
  <div class="sh-h"><div class="sh-t"><b>＋ 新增戰區</b></div><button class="gbtn sm sq" onclick="closeSheet()">✕</button></div>
  <div class="lab">1. 選院別</div>
  <div class="seg">${seg('Senate','參議院')}${seg('House','眾議院')}</div>
  <div class="lab">2. 點選州（金框＝已有）</div>
  <div class="tiles">${GRID.map(g=>tileHTML(g[0],`addRace('${g[0]}')`,has(g[0])?'has':'')).join('')}</div>`);
}
function addRace(a){
  if(addOffice==='Senate'&&data.keyRaces.some(r=>r.state===a&&r.office==='Senate')){toast(`${STATE_NAMES[a]}已經有參議院戰區了`,'info');return}
  const base=`${a}-${addOffice==='Senate'?'S':'H'}`;
  let id=base,n=2;while(data.keyRaces.some(r=>r.id===id))id=`${base}-${n++}`;
  data.keyRaces.push({
    id,state:a,stateName:STATE_NAMES[a]+'州',office:addOffice,
    dem:{name:'',pct:0,votes:0},rep:{name:'',pct:0,votes:0},
    reporting:0,called:false,winner:null,competitive:true
  });
  openRace=data.keyRaces.length-1;raceFilter='all';
  markDirty();closeSheet();goTab('races');renderRaces();
  setTimeout(()=>{const e=$('race-'+openRace);e&&e.scrollIntoView({behavior:'smooth',block:'center'})},60);
  toast('已新增，請填入得票率','ok');
}

/* ═══════════ RENDER ALL / INIT ═══════════ */
function renderAll(){
  renderHome();renderChamber('senate');renderChamber('house');renderStates();renderRaces();
}
renderNav();
document.addEventListener('DOMContentLoaded',()=>{
  if(getToken()){$('auth-ov').classList.remove('show');loadFromGitHub(true)}
});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();pushToGitHub()}
  if(e.key==='Escape')closeSheet();
});
</script>
</body>
</html>
